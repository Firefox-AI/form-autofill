<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="product_id" type="hidden"/> <input name="product_slug" type="hidden"/> <input name="bot-field" style="display:none" type="text"/><div class="grid grid-cols-1 md:grid-cols-2 gap-6" style="display:grid;grid-template-columns:1fr;gap:16px"><div class="space-y-2"><label class="text-sm font-medium" for="review-author">お名前 *</label> <input class="hx:w-full" data-moz-autofill-type="name" id="review-author" name="author" required="" style="width:100%;height:40px;padding:6px 10px;border:1px solid #ddd;border-radius:6px"/></div><div class="space-y-2"><label class="text-sm font-medium" for="review-rating">評価 *</label><div style="display:flex;align-items:center;gap:8px;padding-top:6px"><input id="review-rating" max="5" min="1" name="rating" required="" style="width:80px;height:40px;padding:6px 10px;border:1px solid #ddd;border-radius:6px" type="number" value="5"/><div aria-hidden="true" id="review-stars" style="display:flex;gap:6px;cursor:pointer"><span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span></div></div></div><div class="space-y-2"><label class="text-sm font-medium" for="review-role">使用期間 *</label> <select class="hx:w-full" id="review-role" name="role" required="" style="width:100%;height:40px;padding:6px 10px;border:1px solid #ddd;border-radius:6px"><option value="">選択してください</option><option value="1週間未満">1週間未満</option><option value="1週間〜1ヶ月">1週間〜1ヶ月</option><option value="1〜3ヶ月">1〜3ヶ月</option><option value="3〜6ヶ月">3〜6ヶ月</option><option value="6ヶ月〜1年">6ヶ月〜1年</option><option value="1〜2年">1〜2年</option><option value="2年以上">2年以上</option></select></div><div class="space-y-2"><label class="text-sm font-medium" for="review-company">会社名</label> <input class="hx:w-full" data-moz-autofill-type="organization" id="review-company" name="company" style="width:100%;height:40px;padding:6px 10px;border:1px solid #ddd;border-radius:6px"/></div><div class="space-y-2" style="grid-column:1/-1"><label class="text-sm font-medium" for="review-email">メールアドレス *</label> <input class="hx:w-full" data-moz-autofill-type="email" id="review-email" name="email" required="" style="width:100%;height:40px;padding:6px 10px;border:1px solid #ddd;border-radius:6px" type="email"/><p class="text-sm" style="color:#6b7280;font-size:12px">※レビューには表示されません</p></div></div><div class="space-y-2"><label class="text-sm font-medium" for="review-content">レビュー内容 *</label> <textarea class="hx:w-full" id="review-content" minlength="100" name="content" required="" rows="6" style="width:100%;min-height:120px;padding:8px 10px;border:1px solid #ddd;border-radius:6px"></textarea><div class="text-sm" style="display:flex;justify-content:space-between;color:#dc2626;font-size:12px"><span id="review-content-help">最低100文字必要です</span> <span id="review-content-count">0/100</span></div></div><div class="space-y-2"><label class="text-sm font-medium" for="review-merits">メリット</label> <textarea class="hx:w-full" id="review-merits" name="merits" placeholder="1行につき1つのメリットを記入" rows="4" style="width:100%;min-height:96px;padding:8px 10px;border:1px solid #ddd;border-radius:6px"></textarea><p class="text-sm" style="color:#6b7280;font-size:12px">各行がリスト項目になります</p></div><div class="space-y-2"><label class="text-sm font-medium" for="review-demerits">デメリット</label> <textarea class="hx:w-full" id="review-demerits" name="demerits" placeholder="1行につき1つのデメリットを記入" rows="4" style="width:100%;min-height:96px;padding:8px 10px;border:1px solid #ddd;border-radius:6px"></textarea><p class="text-sm" style="color:#6b7280;font-size:12px">各行がリスト項目になります</p></div><div style="margin-top:8px;margin-bottom:4px"><div class="g-recaptcha" data-sitekey="6LexIg4sAAAAAAf-6W0G-aXn0oTif09vX9SJsWzn"></div></div><div style="display:flex;justify-content:flex-end;gap:12px;padding-top:16px;margin-top:16px;border-top:1px solid #eee"><button id="review-cancel" style="height:40px;padding:0 14px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer" type="button">キャンセル</button> <button id="review-submit" style="height:40px;padding:0 14px;border-radius:6px;border:none;background:#111827;color:#fff;cursor:pointer;min-width:80px" type="submit"><span class="review-submit-text">送信</span></button></div>
</form>

</fieldset></body></html>
