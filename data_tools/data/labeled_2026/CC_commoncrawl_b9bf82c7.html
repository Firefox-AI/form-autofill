<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="aicw-field"> <input autocomplete="name" data-moz-autofill-type="name" id="aicw-cf-name" maxlength="100" placeholder="Your name *" required="" type="text"/> </div> <div class="aicw-field"> <input autocomplete="email" data-moz-autofill-type="email" id="aicw-cf-email" maxlength="200" placeholder="Email address *" required="" type="email"/> </div> <div class="aicw-field"> <input autocomplete="tel" data-moz-autofill-type="tel" id="aicw-cf-phone" maxlength="30" placeholder="Phone number *" required="" type="tel"/> </div> <div class="aicw-field"> <textarea id="aicw-cf-message" maxlength="1000" placeholder="Your message *" required="" rows="3"></textarea> </div> <div id="aicw-cf-status" role="alert"></div> <div class="aicw-contact-actions"> <button id="aicw-back-to-chat" type="button">← Back to chat</button> <button id="aicw-cf-submit" type="submit">Send Message</button> </div>
</form>

</fieldset></body></html>
