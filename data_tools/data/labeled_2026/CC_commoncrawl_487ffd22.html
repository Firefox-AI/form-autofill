<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <label class="col-form-label" for="UserReview"> Escribe tu reseña </label> <textarea class="form-control" cols="20" id="UserReview" maxlength="1000" name="UserReview" rows="6"> </textarea> </div> <div class="form-group row"> <div class="col-12 col-md-6"> <label class="col-form-label" for="UserFirstName"> Nombre </label> <input class="form-control" data-moz-autofill-type="given-name" id="UserFirstName" name="UserFirstName" type="text" value=""/> </div> <div class="col-12 col-md-6"> <label class="col-form-label" for="UserLastName"> Apellido </label> <input class="form-control" data-moz-autofill-type="family-name" id="UserLastName" name="UserLastName" type="text" value=""/> </div> </div> <div class="form-group row"> <div class="col-12 col-lg-6"> <label class="col-form-label" for="UserEmail"> Correo electrónico </label> <input class="form-control" data-moz-autofill-type="email" id="UserEmail" name="UserEmail" type="text" value=""/> </div> <div class="col-12 col-lg-6"> <div class="col-form-label"> Clasificación </div> <div class="clearfix"> <div class="rating"> <input data-val="true" data-val-required="The Star5 field is required." id="Star5" name="Star5" type="checkbox" value="true"/><input name="Star5" type="hidden" value="false"/> <label class="full" for="Star5" title=""></label> <input data-val="true" data-val-required="The Star4 field is required." id="Star4" name="Star4" type="checkbox" value="true"/><input name="Star4" type="hidden" value="false"/> <label class="full" for="Star4" title=""></label> <input data-val="true" data-val-required="The Star3 field is required." id="Star3" name="Star3" type="checkbox" value="true"/><input name="Star3" type="hidden" value="false"/> <label class="full" for="Star3" title=""></label> <input data-val="true" data-val-required="The Star2 field is required." id="Star2" name="Star2" type="checkbox" value="true"/><input name="Star2" type="hidden" value="false"/> <label class="full" for="Star2" title=""></label> <input data-val="true" data-val-required="The Star1 field is required." id="Star1" name="Star1" type="checkbox" value="true"/><input name="Star1" type="hidden" value="false"/> <label class="full" for="Star1" title=""></label> </div> </div> </div> </div> <div class="form-group text-right py-4"> <div class="row"> <div class="col-12"> <button class="btn btn-primary px-5" onclick="SubmitReview(1314)" type="button">Enviar Reseña</button> </div> </div> </div>
</form>
