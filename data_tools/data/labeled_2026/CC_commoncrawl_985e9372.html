<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 form-fields-group"> <div class="form-row"> <label for="engrenagem-nome">Nome e sobrenome*</label> <input data-moz-autofill-type="name" id="engrenagem-nome" name="nome-sobrenome" placeholder="Digite seu nome completo" required="" type="text"/> </div> <div class="form-row"> <label for="engrenagem-email">E-mail*</label> <input data-moz-autofill-type="email" id="engrenagem-email" name="email" placeholder="Digite seu e-mail" required="" type="email"/> </div> </div> <div class="grid grid-cols-1 md:grid-cols-2 gap-4 form-fields-group"> <div class="form-row"> <label for="engrenagem-estado">Estado</label> <select data-moz-autofill-type="address-level1" id="engrenagem-estado" name="estado"> <option value="">— Selecione</option> <option value="Acre">Acre</option> <option value="Alagoas">Alagoas</option> <option value="Amapá">Amapá</option> <option value="Amazonas">Amazonas</option> <option value="Bahia">Bahia</option> <option value="Ceará">Ceará</option> <option value="Distrito Federal">Distrito Federal</option> <option value="Espírito Santo">Espírito Santo</option> <option value="Goiás">Goiás</option> <option value="Maranhão">Maranhão</option> <option value="Mato Grosso">Mato Grosso</option> <option value="Mato Grosso do Sul">Mato Grosso do Sul</option> <option value="Minas Gerais">Minas Gerais</option> <option value="Pará">Pará</option> <option value="Paraíba">Paraíba</option> <option value="Paraná">Paraná</option> <option value="Pernambuco">Pernambuco</option> <option value="Piauí">Piauí</option> <option value="Rio de Janeiro">Rio de Janeiro</option> <option value="Rio Grande do Norte">Rio Grande do Norte</option> <option value="Rio Grande do Sul">Rio Grande do Sul</option> <option value="Rondônia">Rondônia</option> <option value="Roraima">Roraima</option> <option value="Santa Catarina">Santa Catarina</option> <option value="São Paulo">São Paulo</option> <option value="Sergipe">Sergipe</option> <option value="Tocantins">Tocantins</option> </select> </div> <div class="form-row"> <label for="engrenagem-area-atuacao">Área de atuação*</label> <select id="engrenagem-area-atuacao" name="area-atuacao" required=""> <option value="">— Selecione</option> <option value="Marketing e comunicação">Marketing e comunicação</option> <option value="Comercial, vendas ou patrocínio">Comercial, vendas ou patrocínio</option> <option value="Gestão, estratégia ou inovação">Gestão, estratégia ou inovação</option> <option value="Conteúdo, mídia ou eventos">Conteúdo, mídia ou eventos</option> <option value="Dados, tecnologia ou produto">Dados, tecnologia ou produto</option> <option value="Jurídico, financeiro ou administrativo">Jurídico, financeiro ou administrativo</option> <option value="Carreira, RH ou educação">Carreira, RH ou educação</option> <option value="Outro">Outro</option> </select> </div> <div class="form-row"> <label for="engrenagem-setor">Setor que atua*</label> <select id="engrenagem-setor" name="setor" required=""> <option value="">— Selecione</option> <option value="Clubes/ federações ou ligas">Clubes/ federações ou ligas</option> <option value="Agências ou consultorias">Agências ou consultorias</option> <option value="Marca esportiva">Marca esportiva</option> <option value="Marca não esportiva">Marca não esportiva</option> <option value="Plataformas, startups ou tecnologia">Plataformas, startups ou tecnologia</option> <option value="Mídia, conteúdo ou jornalismo">Mídia, conteúdo ou jornalismo</option> <option value="Educação ou pesquisa">Educação ou pesquisa</option> <option value="Estudante">Estudante</option> <option value="Outro">Outro</option> </select> </div> <div class="form-row"> <label for="engrenagem-cargo">Cargo</label> <select id="engrenagem-cargo" name="cargo"> <option value="">— Selecione</option> <option value="Sócio/ C-Level (CEO, CFO, CMO, etc.)">Sócio/ C-Level (CEO, CFO, CMO, etc.)</option> <option value="Diretor / Head">Diretor / Head</option> <option value="Gerente / Coordenador">Gerente / Coordenador</option> <option value="Analista / Assistente">Analista / Assistente</option> <option value="Estagiário / Trainee">Estagiário / Trainee</option> <option value="Outro / Autônomo / Consultor">Outro / Autônomo / Consultor</option> </select> </div> </div> <div class="form-row form-fields-group"> <label for="engrenagem-empresa">Empresa</label> <input data-moz-autofill-type="organization" id="engrenagem-empresa" name="empresa" placeholder="Digite o nome da sua empresa" type="text"/> </div> <div class="form-row checkbox-row form-fields-group"> <div class="checkbox-item"> <input id="engrenagem-lgpd" name="lgpd" required="" type="checkbox" value="Aceito"/> <label class="checkbox-label" for="engrenagem-lgpd">Aceito receber comunicações da empresa e parceiros, conforme a Política de Privacidade.</label> </div> </div> <div class="form-row submit-row form-fields-group"> <input type="submit" value="Assinar"/> </div> <p class="success-message mt-4" id="success-message-form-engrenagem-maquina" style="display: none;"> ✅ Assinatura confirmada! Obrigado. </p>
</form>

</fieldset></body></html>
