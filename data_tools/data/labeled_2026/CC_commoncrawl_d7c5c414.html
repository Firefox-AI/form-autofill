<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="basic-info-form"> <div class="row"> <div class="col-md-12 mb-1"> <h4>Contact Information </h4> <p class="user-info-message">Your account has been created successfully! Now, let’s add some information to match you with the best colleges, jobs &amp; internships as well as scholarships.</p> </div> <div class="col-md-6"> <label for="newst_about_phn_country_code"> Phone Number <span class="text-danger">*</span></label> <div class="form-group row ml-1"> <select class="form-control newst-about-phn-country-code col-2" id="newst_about_phn_country_code" onchange="onNewStudentAboutChangeCountryCode();"></select> <input class="aboutme1-contact form-control control-new col-10 pl-0" id="newstudent_about_contact" placeholder="Enter Your Phone Number" type="text"/> </div> </div> <div class="col-md-6 error-msg-space auto-search-address"> <div class="form-group"> <label for="newstudent_about_address"> Current Home Address <span class="text-danger">*</span></label> <input class="aboutme1-street-address form-control control-new" data-moz-autofill-type="street-address" id="newstudent_about_address" placeholder="Enter Your Current Home Address" required="required" type="text"/> <div class="result-auto-search result" id="welcome-result"></div> </div> </div> <div class="col-md-12"> <div class="form-group"> <input class="form-control control-new" id="newstudent_address_number_optional" placeholder="Unit or Apartment Number (Optional)" type="text"/> </div> </div> <div class="col-md-12 mb-2"> <div class="checkbox"> <label><input class="newst-about-country-checkbox-international" onclick="onNewStudentAboutInternationChange();" type="checkbox"/> My home address is outside the United States</label> </div> </div> <div class="col-md-6 welcome-state-container d-none"> <div class="form-group select2-input-main"> <div class="row" id="aboutme1_state"> <div class="state-modal col-md-12"> <div class="input-search-dropdown newstudent_about_state-list"> <label for="newstudent_about_state"> State <span class="text-danger">*</span></label> <div class="column-reverse"> <select autofocus="autofocus" class="input-search-list states form-control control-new" data-moz-autofill-type="address-level1" disabled="" id="newstudent_about_state" required="required"> <option>Select State</option> </select> </div> </div> <div class="input-search-dropdown newst_about_country_international_list d-none"> <label for="newst_about_country_international"> Country <span class="text-danger">*</span></label> <div class="column-reverse"> <select autofocus="autofocus" class="input-search-list form-control newst-about-international-country d-none" data-moz-autofill-type="country" disabled="" id="newst_about_country_international" onchange="getNewCountryCodeOnChangeCountryName();" required="required"> <option>Select Country *</option> </select> </div> </div> </div> </div> </div> </div> <div class="col-md-6 welcome-city-container d-none"> <div class="form-group select2-input-main"> <div class="row" id="aboutme1_city"> <div class="city-modal col-md-12"> <div class="newst-about-international-city-text d-none"> <label for="newst_about_city_international"> City <span class="text-danger">*</span></label> <input autofocus="autofocus" class="form-control" data-moz-autofill-type="address-level2" disabled="" id="newst_about_city_international" placeholder="Enter home city" required="required" type="text"/> </div> <div class="input-search-dropdown newstudent_about_city_list"> <label for="newstudent_about_city"> City <span class="text-danger">*</span></label> <div class="column-reverse"> <select autofocus="autofocus" class="input-search-list city form-control control-new" data-moz-autofill-type="address-level2" disabled="" id="newstudent_about_city" required="required"> <option selected="">Enter Your Home City </option> </select> </div> </div> </div> </div> </div> </div> <div class="col-md-12 welcome-zipcode-container d-none"> <div class="form-group row"> <div class="col-md-12"> <label for="newst_about_city_international"> Zip code <span class="text-danger">*</span></label> <input class="newst-about-international-zip-text form-control d-none" disabled="" id="newst_about_zip_internatioanl" placeholder="Enter home zip code *" type="text"/> <select class="aboutme1-zip-code form-control control-new" disabled="" id="newstudent_about_zipcode" required="required"> <option disable="" selected="">Enter Your Home Zip Code </option> </select> </div> </div> </div> </div> </div>
</form>

</fieldset></body></html>
