on><option value="April"> April </option><option value="May"> May </option><option value="June"> June </option><option value="July"> July </option><option value="August"> August </option><option value="September"> September </option><option value="October"> October </option><option value="November"> November </option><option value="December"> December </option></select></label> <label class="block" for="people"><span class="text-sm font-semibold text-grey-600">How many people in your group? *</span> <select class="form-control focus:outline-none focus:ring-transparent" id="people-header" name="people-header"><option value=""></option> <option value="2-5"> 2-5 </option><option value="6-10"> 6-10 </option><option value="10-14"> 10-14 </option></select></label> <label class="block" for="accommodation"><span class="text-sm font-semibold text-grey-600">Style of accommodation would suite you</span> <select class="form-control focus:outline-none focus:ring-transparent" id="accommodation-header" name="accommodation-header"><option value=""> Please seclect a style of accommodation </option> <option value="Luxury"> Luxury </option><option value="Resort"> Resort </option><option value="Boutique"> Boutique </option><option value="Authentic"> Authentic </option><option value="Eco/homestay"> Eco/homestay </option></select></label> <div class="block text-center md:col-span-2"><span class="text-sm font-semibold text-grey-600">Extra City Break</span> <div class="flex items-center justify-center mt-1"><div class="relative items-center mx-4 cursor-pointer"><input class="radio-control" id="city-header-yes" name="extra-city-header" type="radio" value="Yes"/> <label class="text-sm cursor-pointer pl-7 text-grey-500" for="city-header-yes">Yes</label></div> <div class="relative items-center mx-4 cursor-pointer"><input class="radio-control" id="city-header-no" name="extra-city-header" type="radio" value="No"/> <label class="text-sm cursor-pointer pl-7 text-grey-500" for="city-header-no">No</
