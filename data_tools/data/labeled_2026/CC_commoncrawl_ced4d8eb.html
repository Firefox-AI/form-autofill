ue="Zimmer 13">Zimmer 13</option> <option value="Zimmer 14">Zimmer 14</option> <option value="Zimmer 15">Zimmer 15</option> <option value="Zimmer 16">Zimmer 16</option> <option value="Zimmer 17">Zimmer 17</option> <option value="Zimmer 18">Zimmer 18</option> <option value="Zimmer 19">Zimmer 19</option> <option value="Zimmer 20">Zimmer 20</option> <option value="Zimmer 21">Zimmer 21</option> <option value="Zimmer 22">Zimmer 22</option> </select> </div> <div class="field-wrap"> <label class="label_for_select" for="Appartement"> Appartement-Wunsch </label> <select id="Appartement" name="Appartement"> <option value="-">-</option> <option value='Appartement 10 "Alpen"'>Appartement 10 "Alpen"</option> <option value='Appartement 11 "Schönblick"'>Appartement 11 "Schönblick"</option> <option value='Appartement 12 "Morgenrot"'>Appartement 12 "Morgenrot"</option> <option value='Appartement 13 "Kapelle"'>Appartement 13 "Kapelle"</option> <option value='Appartement 14 "Stingl"'>Appartement 14 "Stingl"</option> <option value='Appartement 15 "Wilder Kaiser"'>Appartement 15 "Wilder Kaiser"</option> <option value='Appartement 16 "Bergdoktor"'>Appartement 16 "Bergdoktor"</option> <option value='Appartement 17 "Zentrum"'>Appartement 17 "Zentrum"</option> <option value='Appartement 18 "Rübezahl"'>Appartement 18 "Rübezahl"</option> <option value='Appartement 19 "Ellmau"'>Appartement 19 "Ellmau"</option> <option value='Appartement 20 "Hartkaiser"'>Appartement 20 "Hartkaiser"</option> <option value='Appartement 21 "Familie"'>Appartement 21 "Familie"</option> <option value='Appartement 22 "Steinbacher"'>Appartement 22 "Steinbacher"</option> <option value='Appartement 23 "Astberg"'>Appartement 23 "Astberg"</option> <option value='Appartement 24 "Tirol"'>Appartement 24 "Tirol"</option> </select> </div> <div class="field-wrap"> <label class="label_for_text" for="Anzahl_Erwachsene"> Anzahl Erwachsene </label> <input id="Anzahl_Erwachsene" name="Anzahl_Erwachsene" placeholder="" type="text"/> <
