<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="quote-form-guest" style="display: none;"> <div class="field required"> <label class="label"><span>Nombre</span></label> <div class="control"> <input class="input-text required-entry" data-moz-autofill-type="given-name" name="nombre"/> </div> </div> <div class="field required"> <label class="label"><span>Apellido</span></label> <div class="control"> <input class="input-text required-entry" data-moz-autofill-type="family-name" name="lastname"/> </div> </div> <div class="field required"> <label class="label"><span>Email</span></label> <div class="control"> <input class="input-text required-entry validate-email" data-moz-autofill-type="email" id="quote-email" name="email" type="email"/> </div> </div> <div class="field required"> <label class="label"><span>N° de Celular</span></label> <div class="control"> <input class="input-text required-entry validate-length" data-moz-autofill-type="tel" data-validate='{"required":true, "minlength":9, "maxlength":9, "validate-number":true}' name="telephone"/> </div> </div> </div> <div class="quote-form-rut" style="display: block;"> <div class="field required"> <label class="label"><span>N° de RUC:</span></label> <div class="control"> <input class="input-text required-entry" name="ruc" type="text"/> <button class="action primary ruc-validate" type="button">Validar</button> </div> </div> <div class="ruc-error" style="color: red; margin-top: 5px; display: none;"></div> </div> <div class="refill-data" style="display:block"> <div class="field required"> <label class="label"><span>Razón Social</span></label> <div class="control"> <input class="input-text required-entry" data-moz-autofill-type="organization" name="business_name" readonly="" type="text"/> </div> </div> <div class="country" style="display:none"> <label class="label" for="country"><span>País</span></label> <div class="control"> <select class="admin__control-select" data-moz-autofill-type="country" id="country" name="country_id"> <option selected="selected" value="PE">Perú</option> </select> </div> </div> <div class="region required" style="visibility: hidden; height: 0; overflow: hidden; margin: 0;"> <label class="label" for="region_id"><span>Provincia</span></label> <div class="control"> <select class="admin__control-select validate-select required-entry" data-moz-autofill-type="address-level1" id="region_id" name="region_id"> <option value="">Seleccione Provincia</option> </select> <input class="input-text" id="region" name="region" style="display:none;" type="text"/> </div> </div> <div class="field city required" style="visibility: hidden; height: 0; overflow: hidden; margin: 0;"> <label class="label" for="city_id"><span>Ciudad</span></label> <div class="control"> <select class="admin__control-select validate-select required-entry" data-moz-autofill-type="address-level2" id="city_id" name="city_id"> <option value="">Seleccione Ciudad</option> </select> <input class="input-text" id="city" name="city" style="display:none;" type="text"/> </div> </div> <div class="field district required" style="visibility: hidden; height: 0; overflow: hidden; margin: 0;"> <label class="label" for="district_id"><span>Distrito</span></label> <div class="control"> <select class="admin__control-select validate-select required-entry" data-moz-autofill-type="address-level3" id="district_id" name="district_id"> <option value="">Seleccione Distrito</option> </select> <input class="input-text" id="district" name="district" style="display:none;" type="text"/> </div> </div> <div class="field required" style="visibility: hidden; height: 0; overflow: hidden; margin: 0;"> <label class="label"><span>Dirección</span></label> <div class="control"> <input class="input-text required-entry" data-moz-autofill-type="street-address" name="street" type="text"/> </div> </div> <input name="street_number" type="hidden" value="-"/> <input id="zip" name="postcode" type="hidden" value="-"/> <input id="region_name" name="region_name" type="hidden" value=""/> <input id="city_name" name="city_name" type="hidden" value=""/> <input id="district_name" name="district_name" type="hidden" value=""/> </div> <div class="quote-form-observation"> <label class="label"><span>Observación</span></label> <div class="control"> <textarea class="admin__control-textarea" name="observation" rows="4" style="width: 100%; border-radius: 6px; border: 1px solid #ccc; margin-top: 6px; padding: 10px;"></textarea> </div> </div> <div class="submit" style="margin-top:15px"> <button class="action primary" type="submit">Enviar Cotización</button> </div>
</form>

</fieldset></body></html>
