<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>images.tcdn.com.br</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<label> Nome: <input class="text" data-input-customer="name" data-message="Campo nome obrigatório. Digite o seu nome completo por favor." data-moz-autofill-type="name" disabled="" id="nome_coment" name="nome_coment" required="" size="30" type="text" value=""/></label><br/><br/><label> E-mail <input class="text" data-input-customer="email" data-message="Campo email obrigatório. Digite o seu email por favor." data-moz-autofill-type="email" disabled="" id="email_coment" name="email_coment" required="" size="40" type="text" value=""/></label><br/><label><input class="checkbox" id="exibe_email" name="ProductComment[show_email]" type="checkbox" value="1"/> Mostrar meu e-mail </label><br/><br/><label><h3>Mensagem</h3><br/><textarea class="textarea" cols="1" data-message="Campo mensagem obrigatório, digite a mensagem por favor" id="mensagem_coment" name="ProductComment[comment]" required="" rows="5" style="width: 99%"></textarea></label><h5>- Máximo de <span id="restante">512</span> caracteres. Emojis não são suportados.</h5><br/><h3>Clique para Avaliar</h3><br/><div class="rateBlock"><ul class="stars"><li class="starn" data-id="1" data-message="Ruim"></li><li class="starn" data-id="2" data-message="Regular"></li><li class="starn" data-id="3" data-message="Bom"></li><li class="starn" data-id="4" data-message="Ótimo"></li><li class="starn" data-id="5" data-message="Excelente"></li><li class="nota ajuste-nota">Avaliação: <strong id="rate"></strong></li></ul></div><input data-message="Avaliação do produto obrigatória, dê sua avaliação por favor." id="nota_comentario" name="ProductComment[rating]" required="" style="display: none;" type="text" value=""/><input name="ProductComment[product_id]" type="hidden" value="133"/><input data-input-customer="id" name="ProductComment[customer_id]" type="hidden" value=""/><img alt="Enviar" class="image pointer" id="bt-submit-comments" src="https://images.tcdn.com.br/commerce/assets/store/img/enviar.gif" title="Enviar"/>
</form>

</fieldset></body></html>
