<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <div class="col-xs-12"> <textarea class="form-control" placeholder="Bitte geben Sie hier Ihre Nachricht ein..." v-model="form.message"></textarea> <div class="help-block help-block-error error-message" v-for="error in errors['message']"> {{error}} </div> </div> </div> <div class="form-group"> <label class="control-label col-sm-4 text-left">E-Mail-Adresse</label> <div class="col-sm-8"> <input @change="emailUpdated()" class="form-control" data-moz-autofill-type="email" placeholder="E-Mail-Adresse" type="email" v-model="form.emailAddress"/> <div class="help-block help-block-error error-message" v-for="error in errors['emailAddress']"> {{error}} </div> </div> </div> <div v-show="isAlreadyRegistered === true"> <div class="form-group"> <label class="control-label col-sm-4 text-left">Passwort</label> <div class="col-sm-8"> <input class="form-control" placeholder="Passwort" type="password" v-model="form.password"/> <div class="help-block help-block-error error-message" v-for="error in errors['password']"> {{error}} </div> </div> </div> </div> <div v-show="isAlreadyRegistered === false"> <div class="form-group"> <label class="control-label col-sm-4 text-left">Vorname</label> <div class="col-sm-8"> <input class="form-control" data-moz-autofill-type="given-name" placeholder="Vorname" type="text" v-model="form.firstName"/> <div class="help-block help-block-error error-message" v-for="error in errors['firstName']"> {{error}} </div> </div> </div> <div class="form-group"> <label class="control-label col-sm-4 text-left">Nachname</label> <div class="col-sm-8"> <input class="form-control" data-moz-autofill-type="family-name" placeholder="Nachname" type="text" v-model="form.lastName"/> <div class="help-block help-block-error error-message" v-for="error in errors['lastName']"> {{error}} </div> </div> </div> <div class="form-group"> <label class="control-label col-sm-4 text-left">Telefonnummer</label> <div class="col-sm-8"> <input class="form-control" data-moz-autofill-type="tel" placeholder="Telefonnummer" type="tel" v-model="form.phoneNumber"/> <div class="help-block help-block-error error-message" v-for="error in errors['phoneNumber']"> {{error}} </div> </div> </div> </div> <input id="form-token" name="_csrf" ref="csrf" type="hidden" value="V7O1_XGtTfTwCJkFMxS08VneItBF1hSoPs7AjycwoeVkns20P-gIo4Q67U5GW9GiPJNYvD2TQ-kGiu2idgX03A=="/> <input name="advisorAlias" type="hidden" v-bind:value="form.advisorAlias"/> <input name="formUpdate" type="hidden" v-bind:value="form.formUpdate"/> <div class="form-group"> <div class="checkbox col-xs-12"> <div v-show="isAlreadyRegistered === false"> <input id="popup-isAlreadyCustomer" type="checkbox" v-model="form.isAlreadyCustomer"/> <label for="popup-isAlreadyCustomer">Ich bin bereits Kunde.</label> <div class="help-block help-block-error error-message" v-for="error in errors['isAlreadyCustomer']"> {{error}} </div> </div> <hr/> <input id="popup-termsOfUse" ref="termsOfUseHidden" type="hidden" v-model="form.termsOfUse"/> <input id="popup-privacyPolicy" type="checkbox" v-model="form.privacyPolicy"/> <label for="popup-privacyPolicy"> Ich stimme den <a href="/site/privacy-policy" target="_blank">Datenschutzbestimmungen</a> zu.</label> <div class="help-block help-block-error error-message" v-for="error in errors['privacyPolicy']"> {{error}} </div> </div> </div> <div> <input id="messenger-recaptcha" type="hidden"/> <div class="g-recaptcha" data-sitekey="6LcBzPwZAAAAADG-WgHJe6ZZ-tulxCN-EOqYczWM" form-id="" id="messenger-recaptcha-recaptcha" input-id="messenger-recaptcha"></div> <div class="help-block help-block-error error-message" v-for="error in errors['reCaptcha']"> {{error}} </div> </div> <button @click="submit()" class="btn btn-submit" type="button">Nachricht senden</button>
</form>

</fieldset></body></html>
