<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="form-control" data-dlron-type="vin" id="smslead_vin" name="Vin" type="hidden" value=""/> <input class="form-control" id="smslead_altid" name="AltDealerId" type="hidden" value=""/> <input class="form-control" data-dlron-type="vehicleid" id="smslead_vehicleid" name="Id" type="hidden" value=""/> <input class="form-control" id="smslead_vehicleName" type="hidden" value=""/> <div class="share-form__group share-form__group--phone form-group"> <div class="form-group"> <label class="col-lg-4 control-label" for="smslead_phone">Phone</label> <div class="col-lg-8"> <input class="form-control stat-input-field" data-dlron-type="phoneShort" data-loc="send to mobile" data-moz-autofill-type="tel" id="smslead_phone" name="Phone" required="" type="tel"/> </div> </div> </div> <div class="share-form__group share-form__group--checkbox form-group"> <input class="share-form__checkbox-input stat-checkbox" data-loc="share vehicle" id="shareVehicleLeadPortion" name="LeadPortion" type="checkbox" value="true"/> <label class="share-form__checkbox-label checkbox" for="shareVehicleLeadPortion"> <span class="share-form__checkbox-label-text">I also wish to be contacted by the dealer about this vehicle.</span> </label> </div> <div class="share-form__expand-panel" id="shareVehicleLeadExpanded"> <div class="share-form__group share-form__group--text form-group"> <label class="share-form__label control-label" for="shareVehicleLeadFirstName">First Name</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="firstname" data-loc="share vehicle" data-moz-autofill-type="given-name" id="shareVehicleLeadFirstName" name="FirstName" required="" type="text"/> </div> <div class="share-form__group share-form__group--text form-group"> <label class="share-form__label control-label" for="shareVehicleLeadLastName">Last Name</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="lastname" data-loc="share vehicle" data-moz-autofill-type="family-name" id="shareVehicleLeadLastName" name="LastName" required="" type="text"/> </div> <div class="share-form__group share-form__group--email form-group"> <label class="share-form__label control-label" for="shareVehicleLeadEmail">Email</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="email" data-loc="share vehicle" data-moz-autofill-type="email" id="shareVehicleLeadEmail" name="Email" required="" type="email"/> </div> </div> <div class="form-group form-group-disclaimers"> <div class="share-form__group share-form__group--checkbox form-group"> <input class="share-form__checkbox-input stat-checkbox" data-dlron-ext="true" data-dlron-type="textconsent" data-loc="share vehicle" id="tcpaDisclaimerShare" name="TCPA_Consent" type="checkbox" value="true"/> <label class="share-form__checkbox-label checkbox" for="tcpaDisclaimer"> <p class="share-form__checkbox-label-text" name="TCPA_Disclaimer"> By clicking this box, I agree to receive in-person or automated telemarketing calls and texts from Ed Martin Toyota at the number I entered. I understand that my consent is not required for purchase. </p> </label> </div> </div> <div class="share-form__footer"> <button class="share-form__submit btn btn-cta stat-button-link" data-dotagging-element-order="0" data-dotagging-element-subtype="cta_button" data-dotagging-element-type="popup" data-dotagging-event="cta_interaction" data-dotagging-event-action="click" data-dotagging-event-action-result="calc" data-dotagging-product-name="Website|Share Vehicle" data-loc="share vehicle" id="shareVehicleLeadSubmit" type="submit"> Send Text Message </button> <div class="share-form__disclaimer"> Terms: The recipient of this text message may incur charges depending on their wireless carrier. </div> </div>
</form>

</fieldset></body></html>
