<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_type" type="hidden" value="create_customer"/><input name="utf8" type="hidden" value="✓"/><div class="field"> <input autocomplete="given-name" data-moz-autofill-type="given-name" id="RegisterForm-FirstName" name="customer[first_name]" placeholder="First name" type="text"/> <label for="RegisterForm-FirstName"> First name </label> </div> <div class="field"> <input aria-required="true" autocapitalize="off" autocomplete="email" data-moz-autofill-type="email" id="RegisterForm-email" name="customer[email]" placeholder="Email" spellcheck="false" type="email"/> <label for="RegisterForm-email"> Email </label> </div><div class="field"> <input aria-required="true" id="RegisterForm-password" name="customer[password]" placeholder="Password" type="password"/> <label for="RegisterForm-password"> Password </label> </div><button class="new_button" disabled="" id="registerButton"> Create </button>
</form>

</fieldset></body></html>
