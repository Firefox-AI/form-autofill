<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="lead_type" type="hidden" value="seller"/><input name="tags" type="hidden" value="Marketing_Plan_Requested"/><div class="row"> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="given-name" id="contact6_fname" name="contact6_fname" placeholder="First Name" required="" type="text"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="family-name" id="contact6_lname" name="contact6_lname" placeholder="Last Name" required="" type="text"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="email" id="contact6_email" name="contact6_email" placeholder="Email Address" required="" type="email"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="tel" id="contact6_phone" name="contact6_phone" placeholder="Phone Number" required="" type="tel"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="street-address" id="contact6_address" name="contact6_address" placeholder="Address" required="" type="text"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="address-level2" id="contact6_city" name="contact6_city" placeholder="City" required="" type="text"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="address-level1" id="contact6_state" name="contact6_state" placeholder="State" required="" type="text"/></div> </div> <div class="col-sm-6"> <div class="form-group"> <input class="form-control" data-moz-autofill-type="postal-code" id="contact6_zip" name="contact6_zip" placeholder="ZIP" required="" type="text"/></div> </div> <div class="col-sm-12"> <div class="form-group"> <select class="form-control" id="contact6_whenareyouselling" name="contact6_whenareyouselling" placeholder="When are you planning to sell?"><option disabled="" selected="" value="">When are you planning to sell?</option><option value="1">Now</option><option value="2">0-6 months</option><option value="3">6+ months</option></select></div> </div> </div> <button class="btn btn-primary" data-selector="a.btn, button.btn, button" id="cf-submit" name="submit" style="outline: none; cursor: inherit;" type="submit">Send</button>
</form>

</fieldset></body></html>
