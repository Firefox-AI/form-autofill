<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input id="csrf-token-field" name="csrfmiddlewaretoken" type="hidden"/><input name="building" type="hidden" value="14830"/><section><fieldset class="mb-3"><label for="id_last_name">Name / Company</label><input class="form-control" data-moz-autofill-type="name" id="id_last_name" maxlength="30" name="last_name" placeholder="Name"/></fieldset><fieldset class="mb-3"><label for="id_email">E-mail address</label><input class="form-control" data-moz-autofill-type="email" id="id_email" name="email" placeholder="E-mail address" type="email"/></fieldset><fieldset class="mb-3"><label for="id_phone">Telefon (optional)</label><input class="form-control" id="id_phone" name="phone" placeholder="Telefon"/></fieldset></section><section><div class="row"><div class="col-6"><fieldset class="mb-3"><label for="id_startdate">Check In</label><input class="form-control flatpickr-background" id="id_startdate" name="startdate" placeholder="Check In" style="height:38px"/></fieldset></div><div class="col-6"><fieldset class="mb-3"><label for="id_enddate">Check Out</label><input class="form-control flatpickr-background" id="id_enddate" name="enddate" placeholder="Check Out"/></fieldset></div></div><fieldset class="mb-3"><label for="guestselect">Guests</label><select class="form-select" id="guestselect" name="guests"><option value="1">1 Guest<option value="2">2 Guests<option value="3">3 Guests<option value="4">4 Guests<option value="5">5 Guests<option value="6">6 Guests<option value="7">7 Guests<option value="8">8 Guests<option value="9">9 Guests<option value="10">10 Guests<option value="15">15 Guests<option value="20">20 Guests<option value="30">30 Guests</option></option></option></option></option></option></option></option></option></option></option></option></option></select></fieldset><fieldset class="mb-3"><label for="id_message">Additional information</label><textarea class="form-control" id="id_message" name="message" placeholder="You can leave a short message to the landlord here." rows="5"></textarea></fieldset></section><div class="btn-container"><button class="btn btn-primary w-100 submit-booking-request" id="submit-booking-request">Send</button></div>
</form>

</fieldset></body></html>
