<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-floating mb-3"> <input class="form-control" data-moz-autofill-type="name" id="full_name" maxlength="40" name="full_name" placeholder="Nome e sobrenome" required="" type="text"/> <label for="full_name">Nome e sobrenome</label> </div> <div class="form-floating mb-3"> <input class="form-control" data-moz-autofill-type="email" id="email" name="email" pattern="[^@]+@[^@]+\.[a-zA-Z]{2,10}" placeholder="E-mail" required="" type="email"/> <label for="email">E-mail</label> </div> <div class="form-floating mb-3"> <input class="form-control" id="user_name_reg" maxlength="30" minlength="3" name="username" pattern="[a-zA-Z0-9]+" placeholder="Usuário" required="" type="text"/> <label for="user_name_reg">Usuário</label> </div> <div class="form-floating mb-3"> <input autocomplete="new-password" class="form-control" id="password_reg" minlength="8" name="password" placeholder="Senha" required="" type="password"/> <label for="password_reg">Senha</label> </div> <span class="captcha-code-modal"></span> <div class="mb-3 text-center"> <button class="submit btn btn-primary" type="submit">Cadastre-se</button> <button class="loading btn btn-primary d-none" disabled="" type="button"> <span aria-hidden="true" class="spinner-border spinner-border-sm" role="status"></span> <span class="visually-hidden">Carregando...</span> </button> <span class="d-block mt-3" id="res-message"></span> </div> <div class="mb-4 text-center"> <small>Ao se cadastrar, você concorda com nossos <a data-bs-dismiss="modal" href="/service-terms">Termos</a> e <a data-bs-dismiss="modal" href="/privacy-policy">Política de Privacidade</a></small> </div> <div class="text-center mb-3"> <span>Tem uma conta?</span> <a data-bs-target="#modalLogin" data-bs-toggle="modal" href="#">Conecte-se</a> </div>
</form>

</fieldset></body></html>
