<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row"> <div class="col-md-12 mb-20"> <label class="mb-2">Full Name:</label> <input class="form-control bg-gray" data-moz-autofill-type="name" name="name" placeholder="eg.John Doe" required="" type="text"/> </div> <div class="col-md-12 mb-20"> <label class="mb-2">Mobile No:</label> <input class="form-control bg-gray" data-moz-autofill-type="tel" name="number" placeholder="10 Digit Phone Number" required="" type="number"/> </div> <div class="col-md-12 mb-20"> <label class="mb-2">Reference From:</label> <input class="form-control bg-gray" name="email" placeholder="eg.google,facebook,youtube,tv" required="" type="text"/> </div> <div class="col-md-12"> <button class="btn btn-primary" name="submit" type="submit">Send Message</button> </div> </div>
</form>

</fieldset></body></html>
