<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p></p> <div class="form-group"> <label for="event">First and Last name:</label> <input class="form-control" data-moz-autofill-type="name" id="name" name="name-req" placeholder="John Doe" required="required" type="text"/> </div> <div class="form-group"> <label for="event">Phone:</label> <input class="form-control" data-moz-autofill-type="tel" id="phone" name="phone-req" placeholder="Enter your Phone" required="required" type="text"/> </div> <div class="form-group"> <label for="email">E-mail:</label> <input class="form-control" data-moz-autofill-type="email" id="email" name="email-req" placeholder="Enter E-mail" required="required" type="email"/> </div> <div class="form-group"> <label for="event">Comment:</label> <textarea class="form-control" id="comment" name="comment" placeholder="Input comment" required="required" rows="3"></textarea> </div> <div class="form-group"> <input class="form-control" id="send" type="submit" value="submit"/> </div>
</form>

</fieldset></body></html>
