<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Full name*</label><input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 placeholder-gray-400" data-moz-autofill-type="name" name="fullName" placeholder="Your name" required="" type="text" value=""/></div><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Company name*</label><input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 placeholder-gray-400" data-moz-autofill-type="organization" name="companyName" placeholder="Company name" required="" type="text" value=""/></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Business email*</label><input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 placeholder-gray-400" data-moz-autofill-type="email" name="email" placeholder="name@company.com" required="" type="email" value=""/></div><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Phone / WhatsApp</label><input class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 placeholder-gray-400" data-moz-autofill-type="tel" name="phone" placeholder="+971" type="tel" value=""/></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Category*</label><div class="relative"><select class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 appearance-none bg-white" required=""><option disabled="" value="">Select category</option><option value="marine">Marine</option><option value="industrial">Industry</option></select><div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500"></div></div></div><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Sub category*</label><div class="relative"><select class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 appearance-none bg-white disabled:bg-gray-50 disabled:text-gray-400" disabled="" required=""><option disabled="" value="">Select brand</option><option value="other">Other</option></select><div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500"></div></div></div></div><div class="flex flex-col gap-2"><label class="text-sm font-medium text-gray-700">Product details / requirement*</label><textarea class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 placeholder-gray-400 resize-none" name="details" placeholder="Include product, quantity and specifications" required="" rows="4"></textarea></div><div class="w-full border-[1.5px] border-dashed border-[#B3D4FF] bg-[#F5F9FF] rounded-[12px] p-4 flex items-center justify-center cursor-pointer hover:bg-[#ebf3ff] transition-colors mt-2"><div class="flex items-center gap-2 text-[#3b82f6]"><span class="text-[14px] font-medium">Attach RFQ, datasheet or photo</span></div></div><div class="flex justify-center mt-2"><div></div></div><button class="w-fit mx-auto px-6 bg-[#3b82f6] hover:bg-blue-600 disabled:bg-blue-400 disabled:cursor-not-allowed text-white font-medium text-[16px] py-[14px] rounded-[12px] transition-colors mt-4 flex items-center justify-center" type="submit">Request a Quote</button><div class="flex items-center justify-center gap-[6px] mt-[10px] text-gray-400"><span class="text-[12px]">Your information is only used to respond to your enquiry.</span></div>
</form>

</fieldset></body></html>
