<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input aria-hidden="true" autocomplete="off" name="website" style="position:absolute;left:-9999px;opacity:0;height:0;width:0" tabindex="-1" type="text"/> <div> <label class="mb-1 block text-sm font-medium text-text-dark" for="cta-name"> Full Name * </label> <input class="w-full rounded-lg border border-border/30 px-4 py-3 text-sm text-text-dark placeholder:text-text/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" data-moz-autofill-type="name" id="cta-name" name="name" placeholder="Your full name" required="" type="text"/> </div> <div> <label class="mb-1 block text-sm font-medium text-text-dark" for="cta-phone"> Phone Number * </label> <input class="w-full rounded-lg border border-border/30 px-4 py-3 text-sm text-text-dark placeholder:text-text/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" data-moz-autofill-type="tel" id="cta-phone" name="phone" placeholder="(xxx) xxx-xxxx" required="" type="tel"/> </div> <div> <label class="mb-1 block text-sm font-medium text-text-dark" for="cta-email"> Email Address <span class="text-text/40">(optional)</span> </label> <input class="w-full rounded-lg border border-border/30 px-4 py-3 text-sm text-text-dark placeholder:text-text/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" data-moz-autofill-type="email" id="cta-email" name="email" placeholder="your@email.com" type="email"/> </div> <div> <label class="mb-1 block text-sm font-medium text-text-dark" for="cta-service"> Service Needed </label> <select class="w-full rounded-lg border border-border/30 px-4 py-3 text-sm text-text-dark focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" id="cta-service" name="service"> <option value="">Select a service...</option> <option value="virus-malware-removal">Virus &amp; Malware Removal</option><option value="laptop-repair">Laptop Repair</option><option value="data-recovery">Data Recovery</option><option value="password-reset">Password Reset Service</option><option value="other">Other</option> </select> </div> <div> <label class="mb-1 block text-sm font-medium text-text-dark" for="cta-message"> Describe Your Issue <span class="text-text/40">(optional)</span> </label> <textarea class="w-full rounded-lg border border-border/30 px-4 py-3 text-sm text-text-dark placeholder:text-text/50 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" id="cta-message" name="message" placeholder="Briefly describe what's going on..." rows="3"></textarea> </div> <button class="btn btn-primary w-full py-3 text-sm font-bold" type="submit"> Get Free Quote </button>
</form>

</fieldset></body></html>
