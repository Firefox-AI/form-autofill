<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input id="pid" name="pid" type="hidden" value="0"/> <input name="fromurl" type="hidden" value=""/> <div class="item item-half" style="margin-bottom: 12px;"> <div class="inner-message-half" style="background:#fff;"> <input class="input-lg form-full" data-moz-autofill-type="name" id="name" name="name" placeholder="あなたの名前は何ですか？" type="text" value=""/> </div> </div> <div class="item item-half" style="margin-bottom: 12px;"> <label for="phone"></label> <div class="inner-message-box" style="background:#fff;"> <input class="input-lg form-full" data-moz-autofill-type="tel" id="phone" name="phone" placeholder="最高の連絡先番号：" type="text" value=""/> </div> </div> <div class="item" style="margin-bottom: 12px;"> <label for="email"></label> <div class="inner-message-box" style="background:#fff;"> <input class="input-lg form-full" data-moz-autofill-type="email" id="email" name="email" placeholder="*あなたの最高の連絡先メール：" required="true" type="text" value=""/> </div> </div> <div class="item" style="margin-bottom: 12px;"> <div class="inner-message-box" style="background:#fff;"> <input class="input-lg form-full" data-moz-autofill-type="organization" id="company" name="company" placeholder="あなたの会社名：" type="text" value=""/> </div> </div> <div class="item" style="margin-bottom: 12px;"> <div class="inner-message-box" style="background:#fff;"> <label for="message"></label> <textarea class="form-full" id="message" name="message" placeholder="*何について問い合わせたいですか？" required="true"></textarea> </div> </div> <div class="item" style="margin-bottom: 12px;"> <button class="btn-text t_submit" id="submit" style="display: inline-block">提出する</button> <div style="display: inline-block; margin-left: 40px;"> <input name="category" style="width: auto; height: auto;" type="checkbox" value="1"/><a href="/privacypolicy" target="_blank"><p style="text-decoration: underline;color: #999; display: inline-block;">個人情報保護方針</p></a> </div> </div>
