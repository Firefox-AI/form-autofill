<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row"><div class="col-lg-6 col-md-6 col-sm-6 col-xs-12"><div class="form-group" id="grpFirstName"> <label for="FirstName">First Name</label> <input autocomplete="off" class="form-control input-lg" data-moz-autofill-type="given-name" id="FirstName" name="FirstName" placeholder="Enter First Name" value=""/></div></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-12"><div class="form-group" id="grpLastName"> <label for="LastName">Last Name</label> <input autocomplete="off" class="form-control input-lg" data-moz-autofill-type="family-name" id="LastName" name="LastName" placeholder="Enter Last Name" value=""/> <input class="form-control input-lg casper" data-moz-autofill-type="family-name" id="LastNameUsr" name="LastNameUsr" placeholder="Enter Last Name User" value=""/> <input class="form-control casper" id="statusformreq" name="statusformreq" type="checkbox" value="Yes"/></div></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-12"><div class="form-group" id="grpEmail"> <label for="LastName">Email</label> <input autocomplete="username" class="form-control input-lg" data-moz-autofill-type="email" id="Email" name="Email" onblur="return check_username_exist(this);" placeholder="Enter Email" value=""/><div class="invalid-tooltip" id="emailvalidationloginpop"> A person with this email already exists</div></div></div><div class="col-lg-6 col-md-6 col-sm-6 col-xs-12"><div class="form-group" id="grpPassword"> <label for="Password">Password</label> <input autocomplete="new-password" class="form-control input-lg" id="Password" name="Password" placeholder="Enter Password" type="password"/></div></div></div> <input id="gtokspot" name="gtokspot" type="hidden" value=""/> <input id="uid" name="uid" type="hidden" value=""/> <a class="btn btn-lg btn-primary btn-block" href="javascript:void(0);" id="btnlgnCreateAccount" style="width:100%; margin-top:15px;" type="button">Create Account</a><div class="login-divider margin-bottom-0"><div class="login-or">or</div></div><button class="btn btn-block btn-lg login-social facebook" onclick="fb_login();" type="button"> <ion-icon aria-label="logo facebook" class="hydrated" name="logo-facebook" role="img"></ion-icon> <span>Login with Facebook account </span></button><button class="btn btn-block btn-lg login-social twitter" onclick="tw_login();" type="button"><i aria-hidden="true" class="ion-social-twitter"></i>Login with Twitter account </button>
</form>
