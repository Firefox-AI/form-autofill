<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="addToClients" type="hidden" value="1"/> <input name="emailAdmin" type="hidden" value="1"/> <div class="row"> <div class="col-md-6" id="firstnamediv" style="display:none;"> <div class="form-floating mb-3"> <input aria-required="true" class="form-control" data-moz-autofill-type="given-name" id="newsletter-firstname" name="firstname" onclick="ShowRecaptcha();" placeholder="First Name" type="text"/> <label for="newsletter-firstname">First name</label> </div> </div> <div class="col-md-6" id="lastnamediv" style="display:none;"> <div class="form-floating mb-3"> <input aria-required="true" class="form-control" data-moz-autofill-type="family-name" id="newsletter-lastname" name="lastname" onclick="ShowRecaptcha();" placeholder="Last Name" type="text"/> <label for="newsletter-lastname">Last name</label> </div> </div> </div> <div class="form-floating mb-3" id="companydiv" style="display:none;"> <input aria-required="true" class="form-control" data-moz-autofill-type="organization" id="newsletter-company" name="company" onclick="ShowRecaptcha();" placeholder="Company" type="text"/> <label for="newsletter-company">Company</label> </div> <div class="form-floating mb-3" id="phonediv" style="display:none;"> <input aria-required="true" class="form-control" id="newsletter-lastname" name="phone" onclick="ShowRecaptcha();" placeholder="Phone" type="text"/> <label for="newsletter-company">Phone</label> </div> <div class="form-floating mb-3"> <input aria-required="true" class="form-control" id="newsletter-lastname" name="emailaddr" onclick="ShowRecaptcha();" placeholder="your@email.com" type="text"/> <label for="newsletter-company">your@email.com</label> </div> <div class="form-group mb-3" id="newsletter-captcha" style="display:none;"></div> <button class="btn btn-default" type="submit">Subscribe</button>
</form>

</fieldset></body></html>
