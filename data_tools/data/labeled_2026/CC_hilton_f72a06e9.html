/a></label> </div> <div class="uk-grid contact-us__form__actions"> <input name="g-recaptcha-response" type="hidden"/> <div class="uk-width-expand"> <input id="urlredirect" name="urlredirect" type="hidden" value="https://www.hallartshotel.com/contact-thanks"/> <input id="dformId" name="dformId" type="hidden" value="56553"/> <input id="dformname" name="dformname" type="hidden" value="contactus"/> <input id="formtype" name="formtype" type="hidden" value="rfp"/> <button class="uk-button uk-button-primary contact-us__submit" data-autodatalayer="" type="submit">SUBMIT <span class="template-icon-cta-arrow"></span></button> </div> </div>
