<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p class="wysija-instruct">To subscribe to our dandy newsletter simply add your email below. A confirmation email will be sent to you!</p><p class="wysija-p-firstname"><input class="defaultlabels wysija-firstname validate[required]" data-moz-autofill-type="given-name" id="form-wysija-nl-php-1-firstname" name="wysija[user][firstname]" title="First Name" type="text" value=""/></p><p class="wysija-p-lastname"><input class="defaultlabels wysija-lastname validate[required]" data-moz-autofill-type="family-name" id="form-wysija-nl-php-1-lastname" name="wysija[user][lastname]" title="Last Name" type="text" value=""/></p><p class="wysija-p-email"><input class="defaultlabels wysija-email validate[required,custom[email]]" data-moz-autofill-type="email" id="form-wysija-nl-php-1-wysija-to" name="wysija[user][email]" title="Email" type="text" value=""/></p><span class="wysija-p-firstname abs-req"><input class="defaultlabels validated[abs][req]" data-moz-autofill-type="given-name" id="form-wysija-nl-php-1-abs-firstname" name="wysija[user][abs][firstname]" type="text" value=""/></span><span class="wysija-p-lastname abs-req"><input class="defaultlabels validated[abs][req]" data-moz-autofill-type="family-name" id="form-wysija-nl-php-1-abs-lastname" name="wysija[user][abs][lastname]" type="text" value=""/></span><span class="wysija-p-email abs-req"><input class="defaultlabels validated[abs][email]" data-moz-autofill-type="email" id="form-wysija-nl-php-1-abs-email" name="wysija[user][abs][email]" type="text" value=""/></span><input class="wysija-submit wysija-submit-field" name="submit" type="submit" value="Subscribe!"/><input name="formid" type="hidden" value="form-wysija-nl-php-1"/> <input name="action" type="hidden" value="save"/> <input name="wysija[user_list][list_ids]" type="hidden" value="1"/> <input name="message_success" type="hidden" value=""/> <input name="controller" type="hidden" value="subscribers"/><input name="wysija-page" type="hidden" value="1"/>
</form>

</fieldset></body></html>
