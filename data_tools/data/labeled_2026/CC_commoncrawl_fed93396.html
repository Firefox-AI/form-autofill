<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="plan" type="hidden" value="Sanitas Puerto Banús — Quote Request"/><h3>Request a Sanitas Health Insurance Quote</h3><div class="q-header">Your Details</div><div class="fgr"><div class="fg"><label>First Name</label><input data-moz-autofill-type="given-name" name="first_name" placeholder="First name" required="" type="text"/></div><div class="fg"><label>Last Name</label><input data-moz-autofill-type="family-name" name="last_name" placeholder="Last name" required="" type="text"/></div></div><div class="fg"><label>Email Address</label><input data-moz-autofill-type="email" name="email" placeholder="you@email.com" required="" type="email"/></div><div class="fg"><label>Phone / WhatsApp</label><input data-moz-autofill-type="tel" name="phone" placeholder="+34 600 000 000" required="" type="tel"/></div><div class="fgr"><div class="fg"><label>Province / Area</label><input data-moz-autofill-type="address-level1" name="province" type="text" value="Málaga / Costa del Sol"/></div><div class="fg"><label>Town / Postcode</label><input name="town" placeholder="Puerto Banús / 29660" type="text"/></div></div><div class="q-header">People to Cover</div><div class="fg"><label>Number of People to Cover</label><select id="q-num-apps" name="num_applicants"><option selected="" value="1">1 person</option><option value="2">2 people</option><option value="3">3 people</option><option value="4">4 people</option><option value="5">5 people</option><option value="6">6 people</option></select></div><div class="app-block" id="app-1"><div class="app-header">Applicant 1 (You)</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_1" required="" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_1"><option>Primary</option></select></div></div></div><div class="app-block" id="app-2" style="display:none"><div class="app-header">Applicant 2</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_2" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_2"><option selected="">Partner/Spouse</option><option>Child</option><option>Parent</option><option>Other</option></select></div></div></div><div class="app-block" id="app-3" style="display:none"><div class="app-header">Applicant 3</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_3" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_3"><option>Partner/Spouse</option><option selected="">Child</option><option>Parent</option><option>Other</option></select></div></div></div><div class="app-block" id="app-4" style="display:none"><div class="app-header">Applicant 4</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_4" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_4"><option>Partner/Spouse</option><option selected="">Child</option><option>Parent</option><option>Other</option></select></div></div></div><div class="app-block" id="app-5" style="display:none"><div class="app-header">Applicant 5</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_5" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_5"><option>Partner/Spouse</option><option selected="">Child</option><option>Parent</option><option>Other</option></select></div></div></div><div class="app-block" id="app-6" style="display:none"><div class="app-header">Applicant 6</div><div class="fgr"><div class="fg"><label>Date of Birth</label><input data-moz-autofill-type="bday" name="dob_6" type="date"/></div><div class="fg"><label>Relationship</label><select name="rel_6"><option>Partner/Spouse</option><option selected="">Child</option><option>Parent</option><option>Other</option></select></div></div></div><div class="q-header">Your Situation</div><div class="fg"><label>Reason for Health Insurance</label><select name="reason" required=""><option value="">— Select —</option><optgroup label="Visa — first application"><option>Non-Lucrative Visa (NLV)</option><option>Digital Nomad Visa (DNV)</option><option>Student Visa</option><option>Work / Highly Qualified Professional</option></optgroup><optgroup label="Visa — renewal"><option>Non-Lucrative Visa (NLV) renewal</option><option>Digital Nomad Visa (DNV) renewal</option><option>Student Visa renewal / extension</option></optgroup><optgroup label="Residency"><option>Residency card (TIE) — application or renewal</option><option>EU Registration / Green Certificate</option><option>Family Reunification</option></optgroup><optgroup label="Not for a visa"><option>Already in Spain — general private cover</option><option>Autónomo / self-employed</option><option>I have Spanish public healthcare — want additional private cover</option><option>Family Cover (Private)</option><option>Retiree</option></optgroup><option>Not sure yet — please advise</option></select></div><div class="fg"><label>Planned Start Date</label><input name="start_date" type="date"/></div><div class="fg"><label>Anything else we should know? (optional)</label><input name="notes" placeholder="e.g. NIE pending, preferred clinic..." type="text"/></div><div class="fg-check"><label class="check-label"><input required="" type="checkbox"/><span>I agree to the <a href="/privacy-policy/" target="_blank">Privacy Policy</a> and consent to being contacted about this enquiry.</span></label></div><div class="fg-check"><label class="check-label"><input required="" type="checkbox"/><span>I understand acceptance and exact terms depend on the insurer's rules.</span></label></div> <button class="qsub" type="submit">Get My Quote →</button><p class="qnote">No obligation. We'll reply by email or WhatsApp.</p>
</form>

</fieldset></body></html>
