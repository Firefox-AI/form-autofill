<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="login_filter_action" type="hidden" value="register"/><input class="form-control" data-moz-autofill-type="email" id="_register_email" name="email" placeholder="Email" type="text"/><input class="form-control" data-moz-autofill-type="given-name" id="_register_firstname" name="firstName" placeholder="First Name" type="text"/><input class="form-control" data-moz-autofill-type="family-name" id="_register_lastname" name="lastName" placeholder="Last Name" type="text"/><input class="form-control" data-moz-autofill-type="tel" id="_register_phone" name="phone" placeholder="Phone" type="text"/><input class="form-control" id="_register_password" name="password" placeholder="Password" type="password"/><input class="form-control" id="_register_password_confirmation" name="password_confirmation" placeholder="Repeat Password" type="password"/><input class="btn btn-default btn-register" type="submit" value="Create account"/>
</form>

</fieldset></body></html>
