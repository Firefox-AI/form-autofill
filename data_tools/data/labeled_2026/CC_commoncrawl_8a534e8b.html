<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="form-control" data-moz-autofill-type="name" name="fullName" placeholder="Nome Completo*" required="" type="text"/> <input class="form-control" data-moz-autofill-type="tel" maxlength="15" minlength="14" name="phoneNumber" pattern="\(\d{2}\) \d{4,5}-\d{4}" placeholder="Celular*" required="" type="text"/> <input class="form-control" data-moz-autofill-type="email" name="email" placeholder="Email" type="email"/> <button class="btn btn-submit" type="submit">Iniciar Chat</button>
</form>

</fieldset></body></html>
