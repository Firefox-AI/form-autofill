<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="standard-form__row"> <label class="standard-form__label" for="booking-number">Buchungsreferenz:*</label> <input class="standard-form__input" data-msg-pattern="Leider ist uns Ihre Buchungsreferenz nicht bekannt. Bitte versuchen Sie es erneut und verwenden Sie folgendes Format: 1234-5678-AA-9." data-rule-pattern="([0-9]{4}-[0-9]{4}-[A-Za-z]{2}-[0-9]{1})|([0-9]{4}[0-9]{4}[A-Za-z]{2}[0-9]{1})" id="InputBookingNumber" maxlength="14" name="InputBookingNumber" onblur="ValidateInputNumber();" required="" type="text"/> <i class="icon icon--tick-circled" id="input-booking-tick"></i> <label class="error_bookings" for="InputBookingNumber" id="InputBookingNumber-error"></label> </div> <div class="standard-form__row"> <label class="standard-form__label" for="booking-surname">Ihr Nachname:*</label> <input class="standard-form__input" data-moz-autofill-type="family-name" id="InputSurname" maxlength="65" name="InputSurname" onblur="ValidateSurname();" required="" type="text"/> <i class="icon icon--tick-circled" id="input-surname-tick"></i> <label class="error_bookings" for="InputSurname" id="InputSurname-error"></label> </div> <div class="standard-form__row"> <label class="standard-form__label" for="booking-email">E-Mail-Adresse *</label> <input class="standard-form__input" data-moz-autofill-type="email" data-msg="Bitte geben Sie Ihre E-Mail-Adresse ein." data-msg-email="Leider ist uns Ihre E-Mail Adresse nicht bekannt. Bitte versuchen Sie es erneut und verwenden Sie folgendes Format: hello@example.com" id="InputEmailAddress" maxlength="65" name="InputEmailAddress" onblur="ValidateBookingEmail();" required="" type="email"/> <i class="icon icon--tick-circled" id="input-emailAddress-tick"></i> <label class="error_bookings" for="InputEmailAddress" id="InputEmailAddress-error"></label> </div> <div class="standard-form__actions"> <button class="standard-form__submit" id="findbook_btn" type="submit">Buchung aufrufen</button> <a class="standard-form__submit standard-form__submit--tertiary" href="/mein-avis/buchung-bearbeiten/rechnungskopie-herunterladen">Rechnung für die Anmietung anfordern</a> </div>
</form>

</fieldset></body></html>
