<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="comment-textarea"><label class="screen-reader-text" for="comment">Kommentieren</label><textarea class="textarea-comment" cols="39" id="comment" name="comment" placeholder="Dein Kommentar ..." rows="4" tabindex="0"></textarea></div><div class="comment-form-author"><label class="screen-reader-text" for="author">Gib deinen Namen oder Benutzernamen zum Kommentieren ein</label><input aria-required="true" class="input-name" data-moz-autofill-type="name" id="author" name="author" placeholder="Name (erforderlich)" size="22" tabindex="0" type="text" value=""/></div> <div class="comment-form-email"><label class="screen-reader-text" for="email">Gib deine E-Mail-Adresse zum Kommentieren ein</label><input aria-required="true" class="input-email" data-moz-autofill-type="email" id="email" name="email" placeholder="E-Mail (erforderlich)" size="22" tabindex="0" type="text" value=""/></div> <div class="comment-form-url"><label class="screen-reader-text" for="url">Gib deine Website-URL ein (optional)</label><input class="input-website" id="url" name="url" placeholder="Webseite" size="22" tabindex="0" type="text" value=""/></div> <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/> <label for="wp-comment-cookies-consent">Name, E-Mail-Adresse und Website in diesem Browser für meinen nächsten Kommentar speichern.</label></p> <p class="form-submit"><input class="submit" id="comment-submit" name="submit" type="submit" value="Kommentar abschicken"/> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="1447"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </p>
</form>

</fieldset></body></html>
