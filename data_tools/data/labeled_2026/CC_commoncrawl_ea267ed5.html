x] font-mono text-text-light-muted tracking-[0.1em] uppercase mb-3" for="project_type">Project Type</label> <select class="w-full px-0 py-3 font-sans text-[15px] text-text-light bg-transparent border-0 border-b-2 border-border-dark outline-none transition-all duration-400 focus:border-accent appearance-none cursor-pointer" id="project_type" name="project_type" style="background-image: url(&quot;data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E&quot;); background-repeat: no-repeat; background-position: right 0px center;"> <option class="bg-dark" value="">Select a service</option> <option class="bg-dark" value="RevOps &amp; HubSpot AI">RevOps &amp; HubSpot AI</option> <option class="bg-dark" value="Data Management">Data Management</option> <option class="bg-dark" value="Process Design &amp; Optimization">Process Design &amp; Optimization</option> <option class="bg-dark" value="Marketing Automation &amp; CRM">Marketing Automation &amp; CRM</option> <option class="bg-dark" value="Product Development">Product Development</option> <option class="bg-dark" value="Inbound Marketing">Inbound Marketing</option> <option class="bg-dark" value="Other">Other</option> </select> </div> <div> <label class="block text-[11px] font-mono text-text-light-muted tracking-[0.1em] uppercase mb-3" for="message">Message</label> <textarea class="w-full px-0 py-3 font-sans text-[15px] text-text-light bg-transparent border-0 border-b-2 border-border-dark outline-none transition-all duration-400 focus:border-accent placeholder:text-text-light-muted/30 resize-none min-h-[80px]" id="message" name="message" placeholder="Brief description of your project..." rows="3"></textarea> </div> <div aria-hidden="true" class="absolute -left-[9999px]"> <input autocomplete="off" name="bot_field" tabindex="-1" type="text"/> </div> <div class="flex items-start gap-3"> <input class="mt-1 w-4 h-4 accent-accent cursor-pointer shrink-0" id="consent" name="consent" required="" type="checkbox"/> <label class="text-[13px] text-text-light-muted leading-relaxed cursor-pointer" for="consent"> I agree to be contacted regarding my request. My data will be processed in accordance with the <a class="text-accent hover:text-accent-hover transition-colors duration-300 underline" href="/privacy">privacy policy</a>. </label> </div> <button class="magnetic inline-flex items-center gap-3 font-bold text-[14px] text-dark bg-white px-8 py-4 rounded-full hover:bg-accent hover:text-white transition-all duration-300 border-none cursor-pointer font-sans active:scale-[0.98]" id="submitBtn" type="submit"> <span id="btnText">Send Message</span> <span class="hidden w-4 h-4 border-2 border-dark/30 border-t-dark rounded-full animate-spin" id="btnSpinner"></span> </button> <p class="hidden text-[13px] text-red-400 font-mono" id="formError"></p>
