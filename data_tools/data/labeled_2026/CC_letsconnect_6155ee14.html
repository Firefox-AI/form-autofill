<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>letsconnect.be</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="CRAFT_CSRF_TOKEN" type="hidden" value="aRcbcmFtz9OAjaoBA7SvMy2uAHMpsY38WbqYeI4_o8b-GTC2B87FikRBUV8UBZ2HzO_5ZErw5AVH5FEDXcb1tx33-jDtXtGMl3gF806_iP8="/> <input name="action" type="hidden" value="/letsconnect/register/save-user"/> <input name="redirect" type="hidden" value="6f064c94ef616ab837d58fa7d93968f811f0a8b0453bf8514bb6b7e4efab5c62/choose-payment-plan"/> <input name="successMessage" type="hidden" value="5b2032569445dc55e2c87f4d3dd929399524c92dd7d8154d41d82b8aa1c24ea3Account was created successfully. Please choose a plan to complete the registration"/> <input name="fields[referer]" type="hidden" value=""/> <input name="fields[referralUser][]" type="hidden"/> <input name="fields[paymentPlan][]" type="hidden" value="106611"/> <input name="fields[termsAndConditionAccepted]" type="hidden" value=""/> <input name="claim_id" type="hidden" value="3529411"/> <div x-show="currentStep === 1"> <div class="divide-y"> <div class="p-6 sm:p-10"> <h2 class="font-bold text-xl mb-4">1. Company data</h2> <p class="text-gray-600 mb-4">Enter your company number below to find and claim your company at Let's Connect. If the company number does not yet exist in our system, you can create a new company.</p> <div class="flex flex-col gap-5"> <div> <label class="form-label" for="vat-number"> VAT number </label> <div :class="{ 'form-input--error': vat.error, 'form-input--success': vat.success &amp;&amp; !vat.error, 'form-input--disabled': lookup.loading, }" class="form-input"> <input :readonly="lookup.loading" class="form-input-reset" id="vat-number" name="fields[vatNumber]" placeholder="ex. 0123456789" type="text" x-model="vat.value"/> <div> </div> </div> <p> </p> </div> </div> </div> </div> <div class="px-6 pb-6 sm:px-10 sm:pb-10 flex flex-col sm:flex-row justify-between gap-x-6 gap-y-2"> <button :disabled="!firstStepValid || lookup.loading" @click="goToNextStep" class="button w-full" type="button"> Next step: Account details </button> </div> </div> <div x-cloak="" x-show="currentStep === 2"> <div> <div class="p-6 sm:p-10"> <h2 class="font-bold text-xl mb-4">2. Account details</h2> <div class="flex flex-col gap-5"> <div> <label class="form-label form-input-required" for="full-name"> Full Name </label> <input class="form-input" data-moz-autofill-type="name" id="full-name" name="fullName" placeholder="bv. John Doe" type="text"/> <p class="form-input-error"> </p> </div> <div> <label class="form-label form-input-required" for="email"> Email address </label> <input @focusout="validateEmailConfirmField" class="form-input" data-moz-autofill-type="email" id="email" name="email" placeholder="ex. john.doe@example.com" type="text" x-model="email.value"/> <p class="form-input-error"> </p> </div> <div> <label class="form-label form-input-required" for="email-confirm"> Confirm e-mail address </label> <input :class="{ 'form-input--error': emailConfirm.error, }" class="form-input" data-moz-autofill-type="email" id="email-confirm" name="fields[emailAddress]" placeholder="ex. john.doe@example.com" type="text" x-model="emailConfirm.value"/> <p class="form-input-error"> </p> </div> <div> <label class="form-label form-input-required" for="password"> Password </label> <input class="form-input" id="password" name="password" type="password"/> <p class="form-input-error"> </p> </div> <div> <label class="form-label form-input-required" for="phone-number"> Phone number </label> <input class="form-input" data-moz-autofill-type="tel" id="phone-number" name="fields[phoneNumber]" placeholder="ex. +32412312312" type="text"/> <p class="form-input-error"> </p> </div> </div> </div> <div class="p-6 pt-0 sm:p-10 sm:pt-0"> <h2 class="font-bold text-lg mb-4">Other</h2> <div class="flex flex-col gap-5" x-data="{ refererValue: '' }"> <div> <label class="form-label" for="referer"> How did you discover us? </label> <select class="form-select" id="referer" name="fields[referer]" x-model="refererValue"> <option value=""> Select an option </option> <option value="salesperson"> Vertegenwoordiger </option> <option value="socialMedia"> Social media </option> <option value="other"> Andere </option> </select> <p class="form-input-error"> </p> </div> <div x-show="refererValue === 'other'"> <label class="form-label" for="referer-other"> Other, being </label> <input class="form-input" id="referer-other" name="fields[refererOther]" placeholder="bv. Relative" type="text"/> <p class="form-input-error"> </p> </div> <div x-show="refererValue === 'salesperson'"> <label class="form-label" for="refererSalespersonName"> Name representative </label> <input class="form-input" id="refererSalespersonName" name="fields[refererSalespersonName]" type="text"/> <p class="form-input-error"> </p> </div> </div> </div> <div class="p-6 pt-0 sm:p-10 sm:pt-0"> <div class="flex flex-col gap-5"> <div> <label class="form-checkbox-wrapper form-input-required"> <input class="form-checkbox" id="terms-and-conditions-accepted" label="" name="fields[termsAndConditionsAccepted]" type="checkbox" value="1"/> <span class="form-checkbox-label" for="terms-and-conditions-accepted"> I accept the <a class="underline" href="https://letsconnect.be/en-be/terms-conditions-2" target="_blank">terms and conditions</a> </span> </label> <p class="form-input-error"> </p> </div> </div> </div> <div class="p-6 pt-0 sm:p-10 sm:pt-0"> <p class="form-input-error"> </p> </div> </div> <div class="px-6 pb-6 sm:px-10 sm:pb-10 flex flex-col sm:flex-row justify-between gap-x-6 gap-y-2"> <button @click="goToPreviousStep" class="button button--outline" type="button"> Back </button> <button :disabled="emailConfirm.error || !emailConfirm.success" class="button" id="register-submit-button" type="submit"> Create account </button> </div> </div>
</form>

</fieldset></body></html>
