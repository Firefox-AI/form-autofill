<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="action" type="hidden" value="ukptg_send_enquiry"/> <input name="enq_ts" type="hidden" value="1786101258"/> <input name="enq_tok" type="hidden" value="c7fabec9080f664d0060560b727a83c6"/> <input autocomplete="off" name="website_url" style="display:none!important;position:absolute;left:-9999px;" tabindex="-1" type="text" value=""/> <input name="listing_id" type="hidden" value="275745"/> <input name="listing_title" type="hidden" value="Priory Tool Hire"/> <div class="form-row"> <div class="form-group"> <label>Name *</label> <input data-moz-autofill-type="name" name="enquiry_name" required="" type="text"/> </div> <div class="form-group"> <label>Email *</label> <input data-moz-autofill-type="email" name="enquiry_email" required="" type="email"/> </div> </div> <div class="form-group"> <label>Phone</label> <input data-moz-autofill-type="tel" name="enquiry_phone" type="tel"/> </div> <div class="form-group"> <label>Postcode *</label> <input data-moz-autofill-type="postal-code" maxlength="10" name="enquiry_postcode" pattern="^[A-Za-z]{1,2}[0-9][A-Za-z0-9]? ?[0-9][A-Za-z]{2}$" placeholder="e.g. BL1 4AB" required="" style="text-transform: uppercase;" title="Please enter a valid UK postcode" type="text"/> </div> <div class="form-group"> <label>Message *</label> <textarea name="enquiry_message" placeholder="Please share as much detail about your project as possible — what you would like done, the size of the area, any specific materials or styles you have in mind, and ideally when you would like the work carried out. The more information you provide, the more accurate the quote will be." required="" rows="5"></textarea> </div> <div style="margin: 12px 0; padding: 10px 12px; background: #f0f7ff; border-radius: 6px; border-left: 3px solid #06bcc1;"> <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; line-height: 1.5;"> <input class="ukptg-post-to-board" name="post_to_board" style="margin-top: 3px; flex-shrink: 0;" type="checkbox" value="1"/> <span><strong>Also post my project to TradeConnect</strong> (optional). Free for everyone. Other contractors in your area will be able to see your project and offer to quote on it.</span> </label> <div class="ukptg-photo-upload" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #b8e4ec;"> <label style="font-size: 13px; display: block; margin-bottom: 6px;"><strong>Add photos</strong> (optional, up to 5)<br/><span style="font-weight: normal; color: #666;">Photos help contractors quote more accurately. Don't include people, vehicle registrations, or house numbers.</span></label> <input accept="image/jpeg,image/png,image/webp" max="5" multiple="" name="quote_request_photos[]" style="display: block; padding: 6px 0;" type="file"/> </div> </div> <div style="margin: 12px 0; padding: 10px 12px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid #2271b1;"><label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; line-height: 1.5;"><input name="consent_share_others" style="margin-top: 3px; flex-shrink: 0;" type="checkbox" value="1"/><span>I would also be happy for my enquiry to be offered to other suitable contractors in my area. <em style="color: #666;">(Optional — leave unticked if you only want to hear from the business above.)</em></span></label></div> <button class="btn-submit" type="submit">Send Enquiry</button> <div class="form-response"></div>
</form>

</fieldset></body></html>
