<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input autocomplete="one-time-code" name="set_crowdfiber_address" type="hidden" value="1"/> <input autocomplete="one-time-code" name="redirect_url" type="hidden" value="https://myriverstreet.net/bringmefiber/"/> <div class="field-container field-address"> <label class="screen-reader-text" for="locate_address-1">Street Address</label> <input autocomplete="one-time-code" class="" data-moz-autofill-type="address-line1" id="locate_address-1" name="locate[add-ress]" placeholder="Street Address" size="20" type="text" value=""/> </div> <div class="field-container field-apartment_number"> <label class="screen-reader-text" for="locate_apartment_number-1">Unit #</label> <input autocomplete="one-time-code" class="input is-large apartment_number" data-moz-autofill-type="apartment" id="locate_apartment_number-1" name="locate[apartment_number]" placeholder="Unit #" size="10" type="text"/> </div> <div class="field-container field-zip"> <label class="screen-reader-text" for="locate_zip-1">ZIP Code</label> <input aria-required="true" autocomplete="one-time-code" data-moz-autofill-type="postal-code" id="locate_zip-1" name="locate[zi-p]" placeholder="Zip Code" type="text" value=""/> </div> <div class="confirmed-address"> <span class="text">Address matched, one moment...</span> </div> <div class="notconfirmed-address"> <span class="text">Address not matched, one moment...</span> </div> <div class="field-container field-submit"> <input autocomplete="one-time-code" id="locate_address_id-1" name="locate[add-ress_id]" type="hidden" value=""/> <button class="btn" type="submit"> Pre-register </button> </div>
</form>

</fieldset></body></html>
