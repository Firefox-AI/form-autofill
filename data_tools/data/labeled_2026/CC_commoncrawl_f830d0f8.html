ceholder="Enter Last Name" type="text"/> <i class="fas fa-user placholder-icon"></i> </div> <div class="form-group position-relative"> <label class="sr-only" for="otp-register-email">Email address</label> <input class="form-control form-control-icon" data-moz-autofill-type="email" id="otp-register-email" maxlength="64" placeholder="Enter Email address" type="email"/> <i class="fas fa-envelope-open placholder-icon"></i> </div> <div class="text-center text-muted py-2"> By pressing “submit” you agree to our<br/> <a href="./">terms &amp; conditions</a> </div> <div id="otp-login-register-alert"></div> <button class="btn btn-primary btn-block my-3" id="otp-register-btn" onclick="registerUser()" type="submit">Submit</button> </div>
