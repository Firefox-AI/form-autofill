<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group required"> <label class="control-label" for="name">Name:</label> <input class="form-control" data-moz-autofill-type="name" id="name" name="name" placeholder="" required="required" type="text"/> </div> <div class="form-group required"> <label class="control-label" for="email_address">Email Address:</label> <input class="form-control" data-moz-autofill-type="email" id="email_address" name="email_address" placeholder="" required="required" type="email"/> </div> <div class="form-group required"> <label class="control-label" for="phone">Phone Number:</label> <input class="form-control" data-moz-autofill-type="tel" id="phone" name="phone" placeholder="" required="required" type="tel"/> </div> <div class="form-group required"> <label class="control-label mb-0">Location:</label> <div class="radio"> <label class="my-0"> <input id="location1" name="location" type="radio" value="1"/> Burleson County Detail </label> </div> </div> <div class="form-group required"> <label class="control-label" for="message">Message:</label> <textarea class="form-control" id="message" name="message" placeholder="" required="required"></textarea> </div> <div class="form-group required"> <label class="control-label" for="input-captcha">Enter the code as seen in the image.</label> <div class="captcha-wrapper"> <div class="captcha-input"> <input class="form-control" id="input-captcha" name="captcha" type="text" value=""/> </div> <div class="captcha-image"> <img alt="Captcha code" src="/index.php?route=tool/captcha"/> <button aria-label="Get a new code" class="captcha-refresh" title="Get a new code" type="button"> <i class="fa fa-sync-alt"></i> </button> </div> </div> </div>
</form>

</fieldset></body></html>
