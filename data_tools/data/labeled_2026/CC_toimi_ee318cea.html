s="text"> <div class="read-check"> </div> <div class="options-container"> <label for="&lt; $10,000"> <input id="&lt; $10,000" name="option2" type="checkbox"/> &lt; $10,000 </label> <label for="$10,000 - $20,000"> <input id="$10,000 - $20,000" name="option2" type="checkbox"/> $10,000 - $20,000 </label> <label for="&gt; $20,000"> <input id="&gt; $20,000" name="option2" type="checkbox"/> &gt; $20,000 </label> <label for="Custom plan"> <input id="Custom plan" name="option2" type="checkbox"/> Custom plan </label> </div> </div> </div> <div class="footer__form-inputs"> <label for="footerName"> <input class="footer__form-input" data-moz-autofill-type="name" id="footerName" name="name" type="text"/> <span>Your name <span class="point"></span></span> </label> <label for="footerEmail"> <input class="footer__form-input" data-moz-autofill-type="email" id="footerEmail" name="email" type="email"/> <span>Your email <span class="point"></span></span> </label> <label for="footerTel" style="grid-column: 1 / 3;"> <input class="footer__form-input" data-moz-autofill-type="tel" id="footerTel" name="tel" type="text"/> <span>Phone</span> </label> <textarea id="footerMessage" name="message" oninput="autoResize(this)" placeholder="About your project" rows="1"></textarea> </div> <button class="footer__form-attach" type="button"> Attach file </button> <div class="footer__form-policy"> <div class="checkbox-wrapper"> <label class="checkbox-container"> <span class="checkbox-container__span"> <input id="privacy" name="privacy" type="checkbox"/> <span class="checkbox-container__span-check"></span> </span> <span class="checkmark"></span> <span>I accept the terms of the <a href="/privacy-policy/">Privacy Policy</a></span> </label> </div> </div> <div class="footer__form-btns"> <input accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,.zip" id="footerFile" multiple="" name="files[]" type="file"/> <button class="footer__form-send" type="button">Get a free consultation </button> <input data-nonce="submit_zayavka" id
