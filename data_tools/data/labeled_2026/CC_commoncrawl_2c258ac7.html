<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="col-md-12"> <h4 class="lbl-bold text-theme mb-0">Customer Signup</h4> </div> <div class="col-12 col-md-6"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.FirstName != ''}" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">Name</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="name" id="txtName1" inputtype="char" name="txtName" ng-model="Signup.FirstName" ng-validator="" placeholder="Type Your First Name" style="padding: 5px 0px 5px 35px !important" tabindex="1" type="text"/> <label class=""> <i class="icon--ind" style="left: 5px; top: 20px;"> </i> </label> </div> </div> <div class="col-12 col-md-6"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.CustomerMobile != ''}" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">Mobile Number</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="tel" id="txtMobile2" inputtype="{{ngInputValid}}" maxlength="{{MobileMaxlengthValid}}" name="txtMobile5" ng-model="Signup.CustomerMobile" ng-validator="" placeholder="Type Mobile Number" style="padding: 5px 0 5px 85px !important;" tabindex="2" type="tel"/> <label class=""> <i class="icon--ind text-theme" style="left: 5px; top: 20px;"> </i> <span class="position-absolute" style="left: 25px; top: 27px;"> <img alt="HappyFares" class="" height="20" ng-src="{{'Content/Images/country_flag/'+ SelectedCountryImg}}" style="" width="20"/> </span> <span class="position-absolute" style="left: 50px; top: 27px; font-weight: 600;">+{{MobileCode}}</span> </label> </div> </div> <div class="col-12 col-md-6"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.EmailID != ''}" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">Email Id</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="email" id="txtEmail2" inputtype="mail" name="txtEmail" ng-model="Signup.EmailID" ng-validator="" placeholder="Type Your Email ID" tabindex="2" type="email"/> <label class=""> <i class="icon--ind text-theme" style="left: 5px; top: 20px;"> </i> </label> </div> </div> <div class="col-12 col-md-6"> <div class="input input--ind input--filled input-login border-bottom-0" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">Enter the Captcha</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched OTPMask" id="2txtCompare" ng-model="Signup.Compare" placeholder="Enter the captcha" required="" tabindex="3"/> <label class=""> <i class="icon--ind" style="left: 5px; top: 20px;"> </i> </label> </div> <div class="position-absolute" style="top: 27px; right: 0; z-index: 1;"> <input class="border-0" id="txtCaptcha2" ng-model="Signup.Captcha" readonly="" style="font-weight: bold; font-size: 20px; letter-spacing: 2px; font-family: Modern; background: transparent; padding: 0 10px; width: 85px !important; " type="text"/> <input class="position-absolute border-0" id="btnrefresh2" ng-click="GenerateSingupCaptcha();" style="right: 10px; font-size: 16px; z-index: 10; background: transparent; " type="button" value="⟳"/> </div> </div> <div class="col-12 col-md-12"> <label class="" for="CHKRCSApprovalFlag"> <input class="filled-in" id="CHKRCSApprovalFlag" ng-model="RCSApprovalFlag" style="" tabindex="11" type="checkbox"/> <span style="font-size:12px"> I authorize HappyFares &amp; its representatives to Call, SMS, RCS &amp; Email me with reference to my Travel enquiry </span> </label> </div> <div class="clearfix"></div> <div class="col-10 m-auto text-center"> <button class="btn btn-primary btn-block CL" id="btnsignUp1" style="" tabindex="3"> Sign Up </button> </div> <div class="col-12 mt-3 text-center valign-wrapper justify-content-center"> <span class="font-weight-600 CL">Already have an Account?</span> <a class="btn btn-link px-2 font-weight-600 CL text-theme" id="dvRequestPassword" ng-click="OpenLoginModel('');" tabindex="4">Login</a> </div>
</form>

</fieldset></body></html>
