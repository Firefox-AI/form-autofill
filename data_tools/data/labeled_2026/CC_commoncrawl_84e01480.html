<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="odss-mf-row"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-email">Email Address *</label><input autocomplete="email" class="odss-mf-input" data-moz-autofill-type="email" id="odss-f-email" name="email" placeholder="your@email.com" required="" type="email"/></div> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-phone">Phone Number *</label><input autocomplete="tel" class="odss-mf-input" data-moz-autofill-type="tel" id="odss-f-phone" name="phone" placeholder="(601) 000-0000" required="" type="tel"/></div> </div> <div class="odss-mf-row"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-fname">First Name</label><input autocomplete="given-name" class="odss-mf-input" data-moz-autofill-type="given-name" id="odss-f-fname" name="firstName" placeholder="First Name" type="text"/></div> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-lname">Last Name</label><input autocomplete="family-name" class="odss-mf-input" data-moz-autofill-type="family-name" id="odss-f-lname" name="lastName" placeholder="Last Name" type="text"/></div> </div> <div class="odss-mf-row full"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-address">Address</label><input autocomplete="street-address" class="odss-mf-input" data-moz-autofill-type="street-address" id="odss-f-address" name="address" placeholder="Street, City, State, ZIP" type="text"/></div> </div> <div class="odss-mf-row"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-model">Vehicle Model</label> <select class="odss-mf-select" id="odss-f-model" name="model"> <option value="">Select model…</option> </select> </div> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-engine">Vehicle Engine</label> <select class="odss-mf-select" id="odss-f-engine" name="engine"> <option value="">Select engine…</option> </select> </div> </div> <div class="odss-mf-row"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-date">Preferred Date</label> <select class="odss-mf-select" id="odss-f-date" name="appointmentDate"> <option disabled="" selected="" value="">Select date…</option> </select> </div> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-time">Preferred Time</label> <select class="odss-mf-select" id="odss-f-time" name="appointmentTime"> <option disabled="" selected="" value="">Select time…</option> </select> </div> </div> <div class="odss-mf-row full" id="odss-affinity-row" style="display:none;"> <div class="odss-mf-group"> <label class="odss-mf-label" for="odss-f-affinity">Qualifying Discount</label> <select class="odss-mf-select" id="odss-f-affinity" name="affinityGroup"> <option value="">None / Not Applicable</option> <option value="military">Military</option> <option value="first_responders">First Responders</option> <option value="seniors">Seniors</option> <option value="teachers">Teachers</option> <option value="contractors">Contractors</option> </select> </div> </div><input id="odss-hid-service" name="serviceName" type="hidden"/><input id="odss-hid-price" name="shownPrice" type="hidden"/><input id="odss-hid-retail" name="retailPrice" type="hidden"/><input id="odss-hid-tier" name="tier" type="hidden"/><button class="odss-mf-submit" id="odss-submit-btn" type="submit">Claim Offer</button>
</form>

</fieldset></body></html>
