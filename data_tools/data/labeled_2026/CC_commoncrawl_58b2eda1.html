<div class="basic-info-form"> <div class="row"> <div class="col-md-12 mb-3"> <h4>Family Information</h4> <p class="user-info-message">Please provide information about your parents/guardians.</p> </div> <div class="col-md-12"> <h5 class="text-primary">Primary Guardian: Tell us about your primary guardian</h5> </div> <div class="col-md-6"> <div class="family-section-title mb-3"> <div class="form-group row"> <div class="col-md-12"> <label for="newstudent_primary_guardian_relation">Relation <span class="text-danger">*</span></label> <select class="form-control relation newstudent_parent_relation1 control-new" id="newstudent_primary_guardian_relation"> <option disabled="" selected="">- Please Select Your Guardian #1-</option> <option value="Father or Male Guardian">Father or Male Guardian</option> <option value="Mother or Female Guardian">Mother or Female Guardian</option> </select> </div> </div> </div> </div> <div class="col-md-6"> <div class="form-group row"> <div class="col-md-12"> <label for="newstudent_father_name">Name <span class="text-danger">*</span></label> <input class="father-name form-control control-new" data-moz-autofill-type="name" id="newstudent_father_name" placeholder="Enter Guardian Name" type="text"/> </div> </div> </div> <div class="col-md-6"> <div class="form-group row"> <div class="col-md-12"> <label for="newstudent_father_phone">Phone</label> <input class="father-phone form-control control-new" data-moz-autofill-type="tel" id="newstudent_father_phone" placeholder="Enter Guardian Phone Number" type="tel"/> </div> </div> </div> <div class="col-md-6"> <div class="form-group row"> <div class="col-md-12"> <label for="newstudent_father_email">Email</label> <input class="father-email form-control control-new" data-moz-autofill-type="email" id="newstudent_father_email" placeholder="Enter Guardian Email Address" type="email"/> </div> </div> </div> <div class="col-md-6"> <div class="form-group row"> <div class="col-md-12"> <label for="newstudent_father_edu
