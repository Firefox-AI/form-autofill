<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-row"> <div class="form-group" style="margin:0"> <label class="lbl">First Name *</label> <input data-moz-autofill-type="given-name" id="af-first" placeholder="Jane" required="" type="text"/> </div> <div class="form-group" style="margin:0"> <label class="lbl">Last Name *</label> <input data-moz-autofill-type="family-name" id="af-last" placeholder="Smith" required="" type="text"/> </div> </div> <div class="form-row" style="margin-top:16px"> <div class="form-group" style="margin:0"> <label class="lbl">Email *</label> <input data-moz-autofill-type="email" id="af-email" placeholder="jane@email.com" required="" type="email"/> </div> <div class="form-group" style="margin:0"> <label class="lbl">Phone</label> <input data-moz-autofill-type="tel" id="af-phone" placeholder="(303) 555-0100" type="tel"/> </div> </div> <div class="form-group" style="margin-top:16px"> <label class="lbl">Ticket Type</label> <select id="af-ticket"> <option disabled="" selected="" value="">Select your ticket type</option> <option>General Admission</option> <option>VIP Chalet</option> <option>Not yet purchased</option> </select> </div> <div class="form-group"> <label class="lbl">Accommodation needed *</label> <select id="af-need" required=""> <option disabled="" selected="" value="">Select primary need</option> <option>Wheelchair / Mobility Device Access</option> <option>Companion Admission</option> <option>ADA Seating Placement</option> <option>Sensory / Quiet Zone Information</option> <option>Service Animal Coordination</option> <option>Medical Considerations</option> <option>Stroller / Family Access</option> <option>Other</option> </select> </div> <div class="form-group"> <label class="lbl">Tell us more</label> <textarea id="af-notes" placeholder="Any specific needs, questions, or information that would help us assist you..."></textarea> </div> <button class="btn-submit" id="access-btn" type="submit"> <i class="fa-solid fa-paper-plane"></i> Send Request </button>
</form>

</fieldset></body></html>
