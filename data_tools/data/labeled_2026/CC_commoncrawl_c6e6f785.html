<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-novo-cadastro"> <div class="row"> <div class="col-md-8"> <div class="form-group"> <label class="control-label" for="txtNome">Nome completo *</label> <input class="form-control" data-moz-autofill-type="name" id="register-name" name="name" placeholder="Digite seu nome" required="" type="text"/> <div class="error-tooltip"></div> </div> </div> <div class="col-md-4"> <div class="form-group"> <label class="control-label" for="dataNascimento">Data de Nascimento</label> <input class="form-control" data-moz-autofill-type="bday" id="register-birthday" name="birthday" placeholder="DD/MM/AAAA" type="text"/> <div class="error-tooltip"></div> </div> </div> </div> <div class="hide" id="cadastro-proponente"> <div class="row"> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="register-nome-produtora">Nome Produtora: *</label> <input class="form-control" id="register-nome-produtora" name="register-nome-produtora" placeholder="Nome Produtora" type="text"/> </div> </div> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="register-registro-ancine">Classificação Geral Ancine</label> <select class="form-control" id="register-classificacao-ancine"> <option>SELECIONE</option> <option value="1">1</option> <option value="2">2</option> <option value="3">3</option> <option value="4">4</option> <option value="5">5</option> </select> </div> </div> </div> <div class="row"> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="register-cnpj">CNPJ/CPF: *</label> <input class="form-control" data-moz-autofill-type="id-number" id="register-cnpj" name="register-cnpj" placeholder="CNPJ" type="text"/> </div> </div> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="register-registro-ancine">Registro Ancine:</label> <input class="form-control" id="register-registro-ancine" name="register-registro-ancine" placeholder="Registro Ancine" type="text"/> </div> </div> </div> <div class="row"> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="register-site">Site</label> <input class="form-control" id="register-site" name="register-site" placeholder="Site" type="text"/> </div> </div> <div class="col-md-6"> <div class="form-group"> <label class="control-label" for="dropUfCadastroProponente">UF:</label> <select class="form-control" data-moz-autofill-type="address-level1" id="dropUfCadastroProponente"></select> </div> </div> </div> </div> <div class="row"> <div class="form-group hide"> <label class="control-label" for="txtCPF">CPF: * </label> <input class="form-control cpf" data-moz-autofill-type="id-number" id="register-cpf" name="text" placeholder="Digite seu CPF " type="text"/> </div> </div> <div class="row"> <div class="col-md-8"> <div class="form-group"> <label class="control-label" for="txtEmail">E-mail *</label> <input class="form-control" data-moz-autofill-type="email" id="register-email" name="email" placeholder="Digite seu e-mail" type="email"/> <div class="error-tooltip"></div> </div> </div> <div class="col-md-4"> <div class="form-group"> <label class="control-label" for="txtCel">Telefone</label> <input class="form-control" data-moz-autofill-type="tel" id="register-cel" name="cel" placeholder="ex: (21) 99999-9999" type="text"/> </div> </div> </div> <div class="row"> <div class="col-md-4"> <div class="form-group"> <label class="control-label" for="txtPassword">Senha *</label> <input class="form-control" id="register-pwd" name="Password" placeholder="Digite sua senha..." type="password"/> <div class="float-end" id="btnShowPasswordCad"> <i aria-hidden="true" class="fa fa-eye"></i> </div> <div class="error-tooltip"></div> </div> </div> <div class="col-md-4"> <div class="form-group"> <label class="control-label" for="txtConfirmPassword">Confirmação de Senha *</label> <input class="form-control" id="register-confirm-pwd" name="ConfirmPassword" placeholder="Confirme sua senha" type="password"/> <div class="float-end" id="btnShowPasswordCadC"> <i aria-hidden="true" class="fa fa-eye"></i> </div> <div class="error-tooltip"></div> </div> </div> </div> <div class="row m-t-30"> <div class="col-md-12"> <div class="form-group"> <label class="checkbox-inline" for="newsletter" style="font-weight: 200;"> <input checked="checked" id="newsletter" name="newsletter" type="checkbox"/> Desejo saber novidades sobre filmes, promoções e eventos. </label> <label class="checkbox-inline" for="termo" style="font-weight: 200;"> <input id="termo" name="termo" type="checkbox"/>Aceito os <a class="termos-login" href="/faq/termos-de-uso" target="_blank">Termos de uso.</a>* </label> </div> </div> </div> <div class="row" id="divCadastroCliente"> <div class="col-md-4 col-md-offset-4"> <div class="form-group"> <button class="btn btn-purple btn-login-cadastro" id="btnCadastrar" type="submit"> Cadastrar </button> </div> </div> </div> <div class="row"> <div class="col-md-3"></div> <div class="col-md-6"> <hr/> </div> <div class="col-md-3"></div> </div> <div class="row"> <div class="col-md-4 col-md-offset-4"> <div class="form-group"> <button class="btn btn-purple btn-login-cadastro" onclick="retornarPrimeiraTela()" type="button">Entrar</button> </div> </div> </div> <div class="row hide" id="divCadastroProponente"> <div class="col-md-8 col-md-offset-2"> <div class="form-group"> <button class="btn btn-purple" id="btnCadastrarProponente" type="submit">Cadastrar</button> </div> </div> </div> </div>
</form>

</fieldset></body></html>
