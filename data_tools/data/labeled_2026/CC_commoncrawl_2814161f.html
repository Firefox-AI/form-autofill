<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="grid gap-6 sm:grid-cols-2"><div><label class="text-sm font-semibold" for="first_name">First name</label><input autocomplete="given-name" class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" data-moz-autofill-type="given-name" id="first_name" required="" value=""/><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div><div><label class="text-sm font-semibold" for="last_name">Last name</label><input autocomplete="family-name" class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" data-moz-autofill-type="family-name" id="last_name" required="" value=""/><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div><div><label class="text-sm font-semibold" for="email">Work email</label><input autocomplete="email" class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" data-moz-autofill-type="email" id="email" required="" type="email" value=""/><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div><div><label class="text-sm font-semibold" for="phone">Phone <span class="font-normal text-slate-400">(optional)</span></label><input autocomplete="tel" class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" data-moz-autofill-type="tel" id="phone" type="tel" value=""/><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div><div class="sm:col-span-2"><label class="text-sm font-semibold" for="product_id">Product</label><select class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" id="product_id" required=""><option disabled="" value="">Choose a product</option><option selected="" value="0">ePromise</option><option value="1">Station Pro</option><option value="4">AwardHub</option></select><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div><div class="sm:col-span-2"><label class="text-sm font-semibold" for="description">What would you like to see?</label><textarea class="mt-2 block w-full rounded-xl border-0 bg-slate-50 px-4 py-3 text-sm text-slate-950 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-emerald-600" id="description" placeholder="Share your program, department, current process, or the questions you want the demo to answer." required="" rows="5"></textarea><div class="mt-2" style="display:none;"><p class="text-sm text-red-600"></p></div></div></div><div class="mt-8 flex flex-col gap-4 border-t border-slate-200 pt-7 sm:flex-row sm:items-center sm:justify-between"><p class="text-xs leading-5 text-slate-500">This form is for product evaluation, not vendor solicitations.</p><button class="button-primary disabled:opacity-50" type="submit">Request demo →</button></div>
</form>

</fieldset></body></html>
