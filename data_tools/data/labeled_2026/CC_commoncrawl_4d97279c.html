<section class="Grid gap-20 mb-40 lg:mb-60"> <header class="cart-GroupTitle md:w-4/12 smw:mb-10">persönliche Daten</header> <div class="md:w-8/12 u-inputHorizontal"> <div class="Grid gmb-5 md:gmb-10"> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-address-first_name">Name</label> <input class="Input" data-moz-autofill-type="given-name" data-nette-rules='[{"op":":filled","msg":"Geben Sie Ihren Vornamen ein"}]' id="frm-signUpForm-address-first_name" name="address[first_name]" required="" type="text"/> </div> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-address-last_name">Nachname</label> <input class="Input" data-moz-autofill-type="family-name" data-nette-rules='[{"op":":filled","msg":"Geben Sie Ihren Nachnamen ein"}]' id="frm-signUpForm-address-last_name" name="address[last_name]" required="" type="text"/> </div> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-email">E-Mail</label> <input class="Input Input--large" data-moz-autofill-type="email" data-nette-rules='[{"op":":filled","msg":"Geben Sie Ihre E-Mail ein"},{"op":":email","msg":"Geben Sie die E-Mail im richtigen Format ein"}]' id="frm-signUpForm-email" name="email" required="" type="email" value="@"/> </div> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-address-phone">Telefonnummer</label> <input class="Input" data-moz-autofill-type="tel" data-nette-rules='[{"op":":filled","msg":"Geben Sie Ihre Telefonnummer ein"}]' id="frm-signUpForm-address-phone" name="address[phone]" required="" type="text"/> </div> <div class="FormItem"> <label class="Label" for="frm-signUpForm-address-company">Firma</label> <input class="Input" data-moz-autofill-type="organization" id="frm-signUpForm-address-company" name="address[company]" type="text"/> </div> </div> </div> </section> <section class="Grid gap-20 mb-40"> <header class="cart-GroupTitle md:w-4/12 smw:mb-10">Liefer-/Rechnungsinformationen</header> <div class e="checkbox"/> <div class="Checkbox-trigger"> <span class="Checkbox-placeholder"></span> <span class="Checkbox-label">Ich kaufe als Unternehmer ein</span> </div> </label> </div> <div class="Grid gmb-5 md:gmb-10 mt-10 mb-10" data-show-if="company[company]==true" style="display: none"> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-company-id_number">USt-IdNr.</label> <input class="Input" data-moz-autofill-type="vat-number" data-nette-rules='[{"op":":equal","rules":[{"op":":filled","msg":"Geben Sie die Unternehmens-ID ein"}],"control":"company[company]","arg":true}]' id="frm-signUpForm-company-id_number" name="company[id_number]" type="text"/> </div> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-company-vat_number">USt-IdNr.</label> <input class="Input" data-moz-autofill-type="vat-number" id="frm-signUpForm-company-vat_number" name="company[vat_number]" type="text"/> </div> </div> </div> </section> <section class="Grid gap-20 mb-40 lg:mb-60"> <header class="cart-GroupTitle md:w-4/12 smw:mb-10">Passwort</header> <div class="md:w-8/12 u-inputHorizontal"> <div class="Grid gmb-5 md:gmb-10"> <div class="FormItem is-required"> <label class="Label" for="frm-signUpForm-password-password">Erstellen sie ein Passwort</label> <input class="Input" data-nette-rules='[{"op":":filled","msg":"Geben Sie das Passwort ein"},{"op":":minLength","msg":"Passwort (mind. 6 Zeichen)","arg":6}]' id="frm-signUpForm-password-password" name="password[password]" required="" type="password"/> </div> <div class="FormItem"> <label class="Label" for="frm-signUpForm-password-password_again">Passwort wiederholen</label> <input class="Input" data-nette-rules='[{"op":":filled","msg":"Geben Sie das Passwort erneut ein"},{"op":":equal","msg":"Passwörter stimmen nicht überein","arg":{"control":"password[password]"}}]' id="frm-signUpForm-password-password_again" name="password[password_again]" required="" type="password"/> </div> </div> </div> </section
