<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <div class="form-group-item address-item"> <label for="address">Address</label> <input class="form-control" data-moz-autofill-type="address-line1" id="address" placeholder="Address" type="text"/> </div> <div class="form-group-item unit-item"> <label for="unit">Unit</label> <input class="form-control" data-moz-autofill-type="apartment" id="unit" placeholder="Apt, Suite, etc." type="text"/> </div> </div> <div class="form-group"> <div class="form-group-item-wrapper"> <div class="form-group-item city-item"> <label for="city">City</label> <input class="form-control" data-moz-autofill-type="address-level2" id="city" placeholder="City" type="text"/> </div> <div class="form-group-item province-item"> <label for="selectProvinceButton">Province</label> <select class="form-control" data-moz-autofill-type="address-level1" id="state"> <option selected="selected" value="ON">Ontario</option> <option value="AB">Alberta</option> <option value="BC">British Columbia</option> <option value="MB">Manitoba</option> <option value="NB">New Brunswick</option> <option value="NL">Newfoundland and Labrador</option> <option value="NS">Nova Scotia</option> <option value="NT">Northwest Territories</option> <option value="NU">Nunavut</option> <option value="PE">Prince Edward Island</option> <option value="QC">Quebec</option> <option value="SK">Saskatchewan</option> <option value="YT">Yukon</option> </select> </div> </div> <div class="form-group-item postal-code-item"> <label for="postal-code">Postal Code</label> <input class="form-control" data-moz-autofill-type="postal-code" id="postal-code" placeholder="Postal Code" type="text"/> </div> </div>
</form>

</fieldset></body></html>
