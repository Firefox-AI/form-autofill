<form>
<input id="s-lc-registration-type" name="registration_type" type="hidden"/> <fieldset id="lc-s-event-fs"> <legend class="lc-s-event-leg" id="lc-event-seats-left"></legend><input name="event_id" type="hidden" value="4570880"/> <input name="cal_id" type="hidden" value="6971"/> <div class="alert alert-warning" id="s-lc-booking-queue-warning" style="display: none;"></div> <div class="form-group"> <div class="col-sm-12"> <p id="s-lc-online-notice" style="display:none;"> Please note this is an online event. The online event URL will be sent to you in an email confirming your registration. </p> <span class="s-lc-event-regreqnotice" id="lc-event-reg-notice"></span> <p class="pull-right text-muted">* Required Field</p> </div> </div> <input name="qcount" type="hidden" value="6"/> <input name="fid" type="hidden" value="7084"/> <div class="form-group s-lc-event-q s-lc-name"> <span class="col-sm-3 control-label s-lc-event-flabel">Full Name *</span> <div class="col-sm-4"> <label class="sr-only" for="fname">First Name</label> <input aria-required="true" autocomplete="given-name" class="form-control s-lc-patron-first-name" data-custom-required-msg="You must provide a name!" data-moz-autofill-type="given-name" id="fname" name="fname" placeholder="First Name" required="" title="First Name" type="text" value=""/> </div> <div class="col-sm-4"> <label class="sr-only" for="lname">Last Name</label> <input aria-required="true" autocomplete="family-name" class="form-control s-lc-patron-last-name" data-custom-required-msg="You must provide a name!" data-moz-autofill-type="family-name" id="lname" name="lname" placeholder="Last Name" required="" title="Last Name" type="text" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-email"> <label class="col-sm-3 control-label s-lc-event-flabel" for="email"> Email * </label> <div class="col-sm-8"> <input aria-required="true" autocomplete="email" class="form-control s-lc-patron-email" data-custom-required-msg="You must provide a valid email address!" data-moz-autofill-type="email" id="email" name="email" required="" type="email" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-1"> <label class="col-md-3 control-label s-lc-event-flabel" for="q1">Which course are the learners on? *</label> <div class="col-md-8"> <input aria-required="true" class="form-control notempty" id="q1" name="q1" required="" type="text" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-2"> <label class="col-md-3 control-label s-lc-event-flabel" for="q2">What level are the learners studying at? *</label> <div class="col-md-8"> <input aria-required="true" class="form-control notempty" id="q2" name="q2" required="" type="text" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-3"> <label class="col-md-3 control-label s-lc-event-flabel" for="q3">Which curriculum area are the learners in? *</label> <div class="col-md-8"> <select aria-required="true" class="form-control" id="q3" name="q3" required=""> <option value="">Select...</option> <option value="C01 - Art &amp; Design">C01 - Art &amp; Design</option> <option value="C02 - Performing Arts &amp; Music">C02 - Performing Arts &amp; Music</option> <option value="C03 - Digital Media &amp; Photography">C03 - Digital Media &amp; Photography</option> <option value="C04 - Computing">C04 - Computing</option> <option value="C05 - Hair &amp; Beauty Therapy">C05 - Hair &amp; Beauty Therapy</option> <option value="C06 - Engineering">C06 - Engineering</option> <option value="C07 - Construction">C07 - Construction</option> <option value="C08 - Health">C08 - Health</option> <option value="C09 - Childcare">C09 - Childcare</option> <option value="C10 - Animal Care &amp; Land Based">C10 - Animal Care &amp; Land Based</option> <option value="C11 - Futures/Progression Routes">C11 - Futures/Progression Routes</option> <option value="C12 - Business">C12 - Business</option> <option value="C13 - Teacher Education">C13 - Teacher Education</option> <option value="C14 - Sport &amp; Public Services">C14 - Sport &amp; Public Services</option> <option value="C16 - Travel &amp; Retail">C16 - Travel &amp; Retail</option> <option value="C17 - Hospitality">C17 - Hospitality</option> <option value="C18 - ESOL">C18 - ESOL</option> <option value="C19 - Employability">C19 - Employability</option> <option value="C20 - English &amp; Maths">C20 - English &amp; Maths</option> <option value="C21 - RNN Training">C21 - RNN Training</option> <option value="C22 - Distance Learning">C22 - Distance Learning</option> <option value="C28 - Community">C28 - Community</option> <option value="C30 - Accountancy">C30 - Accountancy</option> </select> </div> </div> <div class="form-group s-lc-event-q s-lc-4"> <label class="col-md-3 control-label s-lc-event-flabel" for="q4">How many learners will be attending? *</label> <div class="col-md-8"> <input aria-required="true" class="form-control notempty" id="q4" name="q4" required="" type="text" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-5"> <label class="col-md-3 control-label s-lc-event-flabel" for="q5">Which tutor will attend the session with the learners? *</label> <div class="col-md-8"> <input aria-required="true" class="form-control notempty" id="q5" name="q5" required="" type="text" value=""/> </div> </div> <div class="form-group s-lc-event-q s-lc-6"> <label class="col-md-3 control-label s-lc-event-flabel" for="q6">Do your learners have any special requirements when attending a physical session?</label> <div class="col-md-8"> <textarea class="form-control" id="q6" name="q6"></textarea> </div> </div> <div class="form-group s-lc-event-q slc-hi" id="s-lcxp-Zip-cntr"> <label class="control-label" for="slcrh-Zip">Zip</label> <input aria-required="true" autocomplete="off" class="form-control" data-moz-autofill-type="postal-code" id="slcrh-Zip" name="Zip" required="required" type="text" value=""/> </div> <div class="alert alert-info" id="s-lc-event-registration-cost" style="display:none;"></div> <div class="form-group"> <div class="col-sm-offset-3 col-sm-9"> <button class="btn btn-primary" id="s-lc-event-sub"> Register </button> </div> </div> </fieldset>
