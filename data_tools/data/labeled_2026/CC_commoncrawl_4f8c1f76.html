<h6 class="text-center font-weight-bold"><span class="align-middle">Sign Up</span> </h6> <div class="col-12 mt-3"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.FirstName != ''}" style=" border-bottom: 0 !important;"> <span autocomplete="off" class="input__label-content--ind font-weight-bold CL">{{Signup.CustomerNameHind}}</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="given-name" id="txtName15" inputtype="char" name="txtName" ng-model="Signup.FirstName" ng-validator="" placeholder="Type Your First Name" tabindex="1" type="text"/> <label class=""> <i class="icon--ind" style="left: 0px; top: 18px;"> </i> </label> </div> </div> <div class="col-12 mt-3"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.CustomerMobile != ''}" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">{{Signup.CustomerMobileHind}}</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="tel" id="txtMobile4" inputtype="{{ngInputValid}}" maxlength="{{MobileMaxlengthValid}}" name="txtMobile3" ng-model="Signup.CustomerMobile" ng-validator="" placeholder="Type Mobile Number" tabindex="2" type="tel"/> <label class=""> <i class="material-icons icon--ind text-theme" style="left: -3px; top: 25px;">smartphone</i> </label> </div> </div> <div class="col-12 mt-3"> <div class="input input--ind input--filled input-login border-bottom-0" ng-class="{'input--filled': Signup.EmailID != ''}" style=" border-bottom: 0 !important;"> <span class="input__label-content--ind font-weight-bold CL">{{Signup.EmailIDHind}}</span> <input class="input__field--ind input__field-login border-0 border-radius-5 ng-pristine ng-valid ng-not-empty ng-valid-maxlength ng-touched" data-moz-autofill-type="email" id="txtEmail7" inputtype="mail" name="txtEmail" ng-model="Signup.EmailID" ng-validator="" placeholder="Type Your Email ID" tabindex="2" type="email"/> <label class=""> <i class="material-icons icon--ind text-theme" style="left: 0px; top: 26px;">email</i> </label> </div> </div> <div class="col-12 mt-4"> <button class="btn btn-lg btn-primary w-100 text-center font-weight-bold lbl-large" id="btnsignUp" tabindex="3"> Sign Up </button> </div> <div class="col-12 mt-3 text-center"> <span class="font-weight-600">Already have an Account?</span> <a class="btn btn-link p-0 font-weight-600" id="dvRequestPassword" ng-click="OpenLoginModel('');" tabindex="4">Login</a> </div>
