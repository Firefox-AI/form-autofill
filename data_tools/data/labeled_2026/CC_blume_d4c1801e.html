<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>blume.net</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group row"> <label class="col-md-3 form-control-label required"> Nombre </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="given-name" name="firstname" required="" type="text" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Apellidos </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="family-name" name="lastname" required="" type="text" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label"> Empresa </label> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="organization" name="company" type="text" value=""/> </div> <div class="col-md-3 form-control-comment"> Opcional </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label"> NIF </label> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="id-number" name="siret" required="" type="text" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Email </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="email" name="email" required="" type="email" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Contraseña </label> <div class="col-md-6"> <div class="input-group js-parent-focus"> <input class="form-control js-child-focus js-visible-password" name="password" pattern=".{5,}" required="" type="password" value=""/> <span class="input-group-btn"> <button class="btn" data-action="show-password" data-text-hide="Ocultar" data-text-show="Mostrar" type="button"> Mostrar </button> </span> </div> </div> <div class="col-md-3 form-control-comment"> Debe contener mínimo 5 caracteres. </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label"> </label> <div class="col-md-9"> <span class="custom-checkbox"> <input name="newsletter" type="checkbox" value="1"/> <span><i class="material-icons rtl-no-flip checkbox-checked"></i></span> <label>Quiero recibir novedades y promociones suscribiéndome a la newsletter<br/><em>Puedes darte de baja en cualquier momento. Para ello, consulta nuestra información de contacto en el aviso legal.</em></label> </span> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> </label> <div class="col-md-9"> <span class="custom-checkbox"> <input name="psgdpr" required="" type="checkbox" value="1"/> <span><i class="material-icons rtl-no-flip checkbox-checked"></i></span> <label><span style="color:red;">* </span><a href="https://blume.net/content/36-politica-de-privacidad" target="_blank">Acepto la política de privacidad</a></label> </span> </div> </div> <div class="form-footer text-xs-center clearfix"> <input name="submitCreate" type="hidden" value="1"/> <button class="btn btn-primary form-control-submit float-xs-right" data-link-action="save-customer" type="submit"> Crear </button> </div>
</form>

</fieldset></body></html>
