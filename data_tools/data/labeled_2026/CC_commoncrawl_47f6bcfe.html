<p class="comment-notes"><span id="email-notes">メールアドレスが公開されることはありません。</span> <span class="required-field-message"><span class="required">※</span> が付いている欄は必須項目です</span></p><p class="comment-form-comment"><label for="comment">コメント <span class="required">※</span></label><textarea cols="45" id="comment" maxlength="65525" name="comment" required="required" rows="8"></textarea></p><div class="ast-comment-formwrap ast-row"><p class="comment-form-author ast-grid-common-col ast-width-lg-33 ast-width-md-4 ast-float"> <label class="screen-reader-text" for="author">名前*</label> <input aria-required="true" autocomplete="name" data-moz-autofill-type="name" id="author" name="author" placeholder="名前*" size="30" type="text" value=""/></p><p class="comment-form-email ast-grid-common-col ast-width-lg-33 ast-width-md-4 ast-float"> <label class="screen-reader-text" for="email">メール*</label> <input aria-required="true" autocomplete="email" data-moz-autofill-type="email" id="email" name="email" placeholder="メール*" size="30" type="text" value=""/></p><p class="comment-form-url ast-grid-common-col ast-width-lg-33 ast-width-md-4 ast-float"> <label class="screen-reader-text" for="url">サイト</label> <input autocomplete="url" id="url" name="url" placeholder="サイト" size="30" type="text" value=""/></p></div><p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/> <label for="wp-comment-cookies-consent">次回のコメントで使用するためブラウザーに自分の名前、メールアドレス、サイトを保存する。</label></p><p class="comment-form-attachment"> <label class="comment-form-attachment__label" for="attachment"> 添付ファイル </label> <input accept=".jpg,.jpeg,.jpe,.gif,.png,.bmp,.tiff,.tif,.webp,.ico,.heic,.asf,.wmv,.avi,.divx,.flv,.mov,.qt,.mpeg,.mpg,.mp4,.m4v,.ogv,.mkv,.3gp,.3gpp,.3g2" class="comment-form-attachment__input" id="attachment" multiple="" name="attachment[]" type="file"/> <span class="comment-form-attachment__file-size-notice"> アップロードファイルの最大サイズ: 32 MB。 </span> <span class="comment-form-attachment__file-types-notice"> <abbr title="jpg, jpeg, jpe, gif, png, bmp, tiff, tif, webp, ico, heic">画像</abbr>, <abbr title="asf, wmv, avi, divx, flv, mov, qt, mpeg, mpg, mp4, m4v, ogv, mkv, 3gp, 3gpp, 3g2">動画</abbr> をアップロードできます。 </span> <span class="comment-form-attachment__autoembed-links-notice"> Youtube、Facebook、Twitter および他サービスへのリンクは自動的にコメント内に埋め込まれます。 </span> <span class="comment-form-attachment__drop-area"> <span class="comment-form-attachment__drop-area-inner"> ここにファイルをドロップ </span> </span></p><p class="form-submit"><input class="submit" id="submit" name="submit" type="submit" value="コメントを送信"/> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="422"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/></p><p style="display: none;"><input id="akismet_comment_nonce" name="akismet_comment_nonce" type="hidden" value="87f35928b5"/></p><p class="akismet-fields-container" data-prefix="ak_" style="display: none !important;"><label>Δ<textarea cols="45" maxlength="100" name="ak_hp_textarea" rows="8"></textarea></label><input id="ak_js_1" name="ak_js" type="hidden" value="131"/></p>
