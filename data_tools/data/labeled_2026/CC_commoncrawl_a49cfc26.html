<input class="rz-none" name="" type="submit" value=""/> <div class="rz-signin-container"> <div class="rz-grid"> <div class="rz-form-group rz-col-12"> <input autocomplete="off" data-moz-autofill-type="loginname" inputmode="text" maxlength="12" minlength="3" name="username" pattern="[A-Za-z][A-Za-z0-9._-]{2,7}" placeholder="Benutzername" title="Benutzername: 3–12 Zeichen, muss mit einem Buchstaben beginnen. Erlaubt sind nur Buchstaben, Zahlen sowie . _ -" type="text" value=""/> <small class="rz-username-help" style="display:block;margin-top:6px;opacity:.8;"> Regeln: 3–12 Zeichen · beginnt mit Buchstabe · erlaubt: a–z, 0–9, Punkt, Unterstrich, Bindestrich </small> <small class="rz-username-error" style="display:none;margin-top:6px;color:#b00020;"> </small> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input data-moz-autofill-type="email" name="email" placeholder="E-Mail" type="text" value=""/> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input data-moz-autofill-type="tel" name="phone" placeholder="Telefonnummer" type="text" value=""/> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input data-moz-autofill-type="given-name" name="first_name" placeholder="Vorname" type="text" value=""/> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input data-moz-autofill-type="family-name" name="last_name" placeholder="Nachname" type="text" value=""/> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input name="password" placeholder="Passwort" type="password" value=""/> </div> <div class="rz-form-group rz-col-6 rz-col-sm-12"> <input name="repeat_password" placeholder="Passwort wiederholen" type="password" value=""/> </div> <div class="rz-form-group rz-col-12"> <label class="rz-checkbox rz-no-select rz-mt-0"> <input name="terms" type="checkbox" value="1"/> <span class="rz-transition"></span> <em>Mit der Registrierung akzeptiere ich die <a href="/agb/" target="_blank">AGB</a> und <a href="/datenschutz/" target="_blank">Datenschutzerklärung</a></em> </label> </div> <div class="rz-form-group rz-inline-group rz-col-12"> <button class="rz-button rz-button-accent rz-block rz-w-100 rz-modal-button" name="" type="submit"> <span>Benutzerkonto erstellen</span> <div class="rz-preloader"> <i class="fas fa-sync"></i> </div> </button> </div> <div class="rz-signin-errors"> </div> <div class="rz-signin-success"> Dein Konto wurde erstellt. Bitte überprüfen Deine E-Mails für weitere Details. </div> </div> </div>
