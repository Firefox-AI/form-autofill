<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div aria-hidden="true" class="consult-honeypot"> <label for="cwebsite">Leave blank</label> <input autocomplete="off" id="cwebsite" name="website" tabindex="-1" type="text"/> </div> <input id="cformtime" name="form_time" type="hidden" value=""/> <div class="consult-field"> <label for="cpurpose">Consultation Type *</label> <select id="cpurpose" name="purpose" required=""> <option value="">Select an option</option> <option value="Book Appointment">Book Doctor Appointment</option> <option value="Free Second Opinion">Free Second Opinion from Team</option> </select> </div> <div class="consult-field"> <label for="cname">Full Name *</label> <input data-moz-autofill-type="name" id="cname" maxlength="100" name="name" required="" type="text"/> </div> <div class="consult-field"> <label for="cphone">Phone Number *</label> <input data-moz-autofill-type="tel" id="cphone" inputmode="numeric" maxlength="10" name="phone" pattern="[0-9]*" required="" type="text"/> </div> <div class="consult-field"> <label for="cemail">Email Address *</label> <input data-moz-autofill-type="email" id="cemail" name="email" required="" type="email"/> </div> <div class="consult-field consult-date-field" id="cdateField"> <label for="cdate">Preferred Date *</label> <input autocomplete="off" id="cdate" name="date" type="date"/> </div> <div class="consult-field"> <label for="cmessage">Tell us briefly what you need *</label> <textarea id="cmessage" maxlength="1000" name="message" required=""></textarea> </div> <button class="consult-submit" id="consultSubmit" type="submit">Book Consultation</button>
</form>

</fieldset></body></html>
