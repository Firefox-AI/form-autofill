<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="input-group gz-search-filters"> <input aria-label="Search by keyword" class="form-control gz-search-keyword" id="searchInput" name="term" placeholder="What are you looking for?" type="text"/> <select aria-label="Search by country" class="custom-select gz-search-country multiSelect gz-option" data-moz-autofill-type="country" data-name="Countries" data-toggle="dropdown" id="country-select" multiple="" style="display: none;" type="text"></select> <select aria-label="Search by state" class="custom-select gz-search-state multiSelect gz-option" data-moz-autofill-type="address-level1" data-name="States" data-toggle="dropdown" id="state-select" multiple="" style="display: none;" type="text"></select> <select aria-label="Search by city" class="custom-select gz-search-city multiSelect gz-option" data-moz-autofill-type="address-level2" data-name="Cities" data-toggle="dropdown" id="city-select" multiple="" style="display: none;" type="text"></select> <input class="form-control gz-radius-input-button" id="radiusInput" type="button" value="Near Me"/> <div class="input-group-append"> <button aria-label="Search Submit" class="btn gz-search-btn" type="submit"><i class="gz-far gz-fa-search"></i>Search</button> </div> </div> <div class="row" id="gz-search-radius" style="display: none;"> <input aria-label="My Zip Code" class="form-control gz-location-input col-sm-2 gz-option" data-moz-autofill-type="postal-code" data-name="UsersLocation" id="gz-my-location-input" placeholder="My Zip Code" type="text"/> <select aria-label="Search by Radius" class="custom-select gz-search-radius col-sm-2 gz-option" data-name="Radius" id="gz-radius-select" type="text"> <option selected="" value="0">Radius...</option> <option value="1">1 mi</option> <option value="5">5 mi</option> <option value="10">10 mi</option> <option value="50">50 mi</option> <option value="100">100 mi</option> </select> </div> <div class="gz-adv-search" style="display:none;"></div>
</form>

</fieldset></body></html>
