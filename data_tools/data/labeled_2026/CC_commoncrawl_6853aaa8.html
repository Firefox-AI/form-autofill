<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p class="comments_notes">Your email address will not be published. Required fields are marked *</p><div class="comments_field comments_message"><label for="comment">your message</label><textarea aria-required="true" id="comment" name="comment"></textarea></div><div class="comments_field comments_author"><label for="author">hello! tell us your name</label><input aria-required="true" data-moz-autofill-type="name" id="author" name="author" size="30" type="text" value=""/></div> <div class="comments_field comments_email"><label for="email">your email</label><input aria-required="true" data-moz-autofill-type="email" id="email" name="email" size="30" type="text" value=""/></div> <div class="comments_field comments_site"><label for="url">your Website</label><input aria-required="true" id="url" name="url" size="30" type="text" value=""/></div> <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/> <label for="wp-comment-cookies-consent">Save my name, email, and website in this browser for the next time I comment.</label></p> <div class="comments_field comments_i_agree_privacy_policy"><span class="sc_form_field_wrap"><input id="i_agree_privacy_policy" name="i_agree_privacy_policy" type="checkbox" value="1"/> <label class="optional" for="i_agree_privacy_policy">I agree that my submitted data is being collected and stored For further details on handling user data, see our <a href="" target="_blank">Privacy Policy</a></label></span></div> <p class="form-submit"><input class="submit" id="send_comment" name="submit" type="submit" value="Post Comment"/> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="1022"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </p>
</form>

</fieldset></body></html>
