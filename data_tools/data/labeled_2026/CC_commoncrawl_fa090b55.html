<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row row-20 gutter-20"> <div class="col-sm-6"> <div class="form-wrap"> <input class="form-input" data-constraints="@Required" data-moz-autofill-type="given-name" id="contact-name" name="name" type="text"/> <label class="form-label" for="contact-name">Nombre</label> </div> </div> <div class="col-sm-6"> <div class="form-wrap"> <input class="form-input" data-constraints="@Required" data-moz-autofill-type="family-name" id="contact-surname" name="name" type="text"/> <label class="form-label" for="contact-surname">Apellido</label> </div> </div> <div class="col-sm-6"> <div class="form-wrap"> <input class="form-input" data-constraints="@Numeric" data-moz-autofill-type="tel" id="contact-phone" name="phone" type="text"/> <label class="form-label" for="contact-phone">Teléfono</label> </div> </div> <div class="col-sm-6"> <div class="form-wrap"> <input class="form-input" data-constraints="@Email @Required" data-moz-autofill-type="email" id="contact-email" name="email" type="email"/> <label class="form-label" for="contact-email">E-mail</label> </div> </div> <div class="col-12"> <div class="form-wrap"> <label class="form-label" for="contact-message">Mensaje</label> <textarea class="form-input" data-constraints="@Required" id="contact-message" name="message"></textarea> </div> </div> </div> <div class="group-lg group-custom-1"> <p class="text-5"> Contestamos todos los mensajes en orden de prioridad. Nuestro equipo atendera su mensaje</p> <div> <button class="button button-primary button-md" type="submit">Enviar</button> </div> </div>
</form>

</fieldset></body></html>
