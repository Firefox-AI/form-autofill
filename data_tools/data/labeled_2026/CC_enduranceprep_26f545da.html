<div class="rcp_description"></div> <div class="rcp_login_link"> <p><a href="https://www.enduranceprep.com/login/?redirect=https%3A%2F%2Fwww.enduranceprep.com%2Fregister%2F1-month%2F">Log in</a> to renew or change an existing membership.</p> </div> <fieldset class="rcp_user_fieldset"> <p id="rcp_user_login_wrap"> <label for="rcp_user_login">Username</label> <input class="required" data-moz-autofill-type="loginname" id="rcp_user_login" name="rcp_user_login" type="text"/> </p> <p id="rcp_user_email_wrap"> <label for="rcp_user_email">Email</label> <input class="required" data-moz-autofill-type="email" id="rcp_user_email" name="rcp_user_email" type="text"/> </p> <p class="inline" id="rcp_user_first_wrap"> <label for="rcp_user_first">First Name</label> <input data-moz-autofill-type="given-name" id="rcp_user_first" name="rcp_user_first" type="text"/> </p> <p class="inline-block" id="rcp_user_last_wrap"> <label for="rcp_user_last">Last Name</label> <input data-moz-autofill-type="family-name" id="rcp_user_last" name="rcp_user_last" type="text"/> </p> <p class="inline" id="rcp_password_wrap"> <label for="rcp_password">Password</label> <input class="required" id="rcp_password" name="rcp_user_pass" type="password"/> </p> <p class="inline-block" id="rcp_password_again_wrap"> <label for="rcp_password_again">Password Again</label> <input class="required" id="rcp_password_again" name="rcp_user_pass_confirm" type="password"/> </p> </fieldset> <fieldset class="rcp_discounts_fieldset"> <p id="rcp_discount_code_wrap"> <label for="rcp_discount_code"> Discount Code <span class="rcp_discount_valid" style="display: none;"> - Valid</span> <span class="rcp_discount_invalid" style="display: none;"> - Invalid</span> </label> <span class="rcp_discount_code_field_wrap"> <input class="rcp_discount_code" id="rcp_discount_code" name="rcp_discount" type="text" value=""/> <button class="rcp_button" id="rcp_apply_discount">Apply</button> </span> </p> </fieldset> <div class="rcp_registration_total"></div> <div class="rcp_gateway_fields"> <input data-supports-recurring="yes" data-supports-trial="yes" name="rcp_gateway" type="hidden" value="stripe"/> </div> <fieldset class="rcp_agree_to_terms_fieldset"> <p id="rcp_agree_to_terms_wrap"> <input id="rcp_agree_to_terms" name="rcp_agree_to_terms" type="checkbox" value="1"/> <label for="rcp_agree_to_terms"> <a href="https://www.enduranceprep.com/terms-of-service/" target="_blank">Agree To Terms Of Service</a> </label> </p> </fieldset> <fieldset class="rcp_agree_to_privacy_policy_fieldset"> <p id="rcp_agree_to_privacy_policy_wrap"> <input id="rcp_agree_to_privacy_policy" name="rcp_agree_to_privacy_policy" type="checkbox" value="1"/> <label for="rcp_agree_to_privacy_policy"> <a href="https://www.enduranceprep.com/privacy-policy/" target="_blank">Agree To Privacy Policy</a> </label> </p> </fieldset> <input id="rcp-registration-type" name="registration_type" type="hidden" value=""/> <input id="rcp-membership-id" name="membership_id" type="hidden" value="0"/> <input id="rcp-payment-id" name="rcp_registration_payment_id" type="hidden" value="0"/> <p id="rcp_submit_wrap"> <input class="rcp_level" name="rcp_level" rel="12" type="hidden" value="12"/> <input name="rcp_register_nonce" type="hidden" value="05eb3e814f"/> <input class="rcp-button" id="rcp_submit" name="rcp_submit_registration" type="submit" value="Register"/> </p>
