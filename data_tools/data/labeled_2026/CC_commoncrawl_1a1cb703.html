<form>
<input name="whichform" type="hidden" value="cumain"/><input id="CUSOURCE" name="CUSOURCE" type="hidden" value="51713_Charges for No"/> <div class="full"> <div class="citizen-section"> <span class="us-citizen">I am a US citizen or Green Card holder *</span> <input class="citizen" id="usCitizen-US" name="usCitizen" type="radio" value="US"/> <label class="label-for-citizen" for="usCitizen-US" id="label-for-usCitizen-US">Yes</label> <input class="intl" id="usCitizen-Other" name="usCitizen" type="radio" value="Other"/> <label class="label-for-intl" for="usCitizen-Other" id="label-for-usCitizen-Other">No</label> <span id="cuintl_redirecting_text"></span> <div class="clearFix"></div> </div> <input aria-label="First Name" autocomplete="off" class="clearDefault" data-moz-autofill-type="given-name" name="firstName" placeholder="First Name *" type="text" value=""/> <input aria-label="Last Name" autocomplete="off" class="clearDefault border-left" data-moz-autofill-type="family-name" name="lastName" placeholder="Last Name *" type="text" value=""/> <input aria-label="email" autocomplete="off" class="clearDefault" data-moz-autofill-type="email" name="email" placeholder="Email Address *" type="text" value=""/> <input aria-label="Phone Number" autocomplete="off" class="clearDefault phone-group border-left" data-moz-autofill-type="tel" name="phone2" placeholder="Phone Number *" type="text" value=""/> <div class="clearFix"></div> <input aria-label="Best Phone Number" class="clearDefault phone-group" id="phone3" name="phone3" type="text" value="Best Phone Number *"/> <input autocomplete="off" class="RIFFieldClass" id="phone4" name="phone4" tabindex="-1" type="text" value=""/> <p class="required">*required</p> <div class="green-checkbox"> <input checked="" id="textme" name="textme" type="checkbox" value="textme"/> <label for="textme">Text me</label> </div> <div class="clearFix"></div> <select aria-label="Select degree" id="degree_plan" name="degree_plan" onchange="funcPopulateMajorListFromDegreePlan(this, 'contact-form');"> <option selected="selected" value="">Select degree level *</option> <option value="B">Bachelor's</option> <option value="M">Master's</option> <option value="P">PhD</option> <option value="E">Ed.D.</option> <option value="OCERT">Certificate Program</option> <option value="O-ESL">English as a Second Language</option> </select> <select aria-label="Select Major" class="border-left" id="selectInqueryMajor" name="major" onchange="oc_online_requireChange(this);" style="display:none;"> <option selected="selected" value="">Program</option> </select> <select aria-label="Select college background" name="college_background" style="display:none;"> <option selected="selected" value="">College background</option> <option value="NEVER_ATT">Never attended college</option> <option value="ATT_NOT_GRAD">Attended college but not graduated</option> <option value="BA_OR_HIGHER">Have a bachelor's degree or higher</option> </select> <select aria-label="Select on campus or online" class="border-left" id="campus_or_online" name="campus_or_online"> <option value="">On campus or online?</option> <option value="ON_CAMPUS">On-campus program</option> <option value="ONLINE">Online program</option> <option value="BOTH">Considering both</option> </select> <textarea aria-label="comments" maxlength="1200" name="comments" placeholder="Questions/Comments (optional)"></textarea> <div class="clearFix"></div> <div class="notice sending hidden" id="cu_sending_msg" style="display:none;"> <span>Sending... <img alt="Sending" src="/wp-content/themes/MUM/media/circle_loader.gif"/></span> </div> <a aria-label="Click to Send Request" class="in-page-button cu_submit" id="cu_submit"><span>Send Request &gt;</span></a> </div>
</form>
