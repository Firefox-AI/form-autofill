<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<h3>Unverbindliche Anfrage</h3> <div class="input-wrap farbe2 feldname"><input data-moz-autofill-type="name" id="name" name="name" placeholder="Ihr Name" required="" size="40" type="text"/><br/></div> <div class="input-wrap farbe2 feldtelefon"><input data-moz-autofill-type="tel" id="telefon" name="telefon" placeholder="Ihre Telefonnummer" size="40" type="tel"/><br/></div> <div class="input-wrap farbe2 feldname"><input data-moz-autofill-type="postal-code" id="plz" name="plz" placeholder="Ihre PLZ" size="40" type="text"/><br/></div> <div class="input-wrap farbe1 feldemail"><input data-moz-autofill-type="email" id="email" name="email" placeholder="Ihre Email-Adresse" required="" size="40" type="email"/><br/></div> <div class="input-wrap farbe2 feldnachricht"><textarea cols="50" id="nachricht" name="nachricht" placeholder="Sie möchten uns etwas mitteilen?" rows="5"></textarea></div> <div class="callback"><input class="checkbox" id="infomaterial" name="infomaterial" type="checkbox" value="1"/> <label class="checkboxtext" for="infomaterial">Bitte schicken Sie mir Infomaterial.</label></div> <br/> <input class="sendweiss" id="senden" name="senden" type="submit" value="Anfrage absenden"/><br/> <input name="Artikel" type="hidden" value="ALUBODEN-SITZSYSTEM"/> <input id="checker" name="checker" type="hidden" value=""/>
</form>
