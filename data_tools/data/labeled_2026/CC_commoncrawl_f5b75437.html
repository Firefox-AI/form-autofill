<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="field field_text field_name_postal"> <label class="label" for="f-pc">PC/Zip</label> <input class="input input_text" data-moz-autofill-type="postal-code" id="f-pc" name="pc" type="text"/> </div> <strong class="or">Or</strong> <div class="field field_text field_name_city"> <label class="label" for="f-c">City</label> <input autocomplete="off" class="input input_text" data-moz-autofill-type="address-level2" id="f-c" name="c" type="text"/> <div class="search__list search__list_cities" id="popup_city_search_output" style="display: none"></div> </div> <div class="field field_text field_name_keyword"> <label class="label" for="f-k">What are you looking for?</label> <input autocomplete="off" class="input input_text" id="f-k" name="k" type="text"/> </div> <div class="field-group field-group_name-buttons"> <div class="field field_button"> <button class="input input_button input_button_submit input_name_search" type="submit"> Search Now </button> </div> <div class="field field_button field_name_gps hidden"> <input name="gps_lat" type="hidden"/> <input name="gps_lng" type="hidden"/> <button class="input input_button input_name_gps" id="popup_search_gps"> See Near Me </button> </div> </div>
</form>

</fieldset></body></html>
