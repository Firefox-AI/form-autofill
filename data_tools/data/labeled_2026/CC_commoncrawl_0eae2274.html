ept the terms and conditions')" required="" type="checkbox"/></span> <span class="lp-tcr-message"> I agree to be contacted by Jenny Doyle &amp; Co. via call, email, and text for real estate services. To opt out, you can reply 'stop' at any time or reply 'help' for assistance. You can also click the unsubscribe link in the emails. Message and data rates may apply. Message frequency may vary. <a href="/terms-and-conditions" target="_blank">Privacy Policy</a>. </span> </label> </div> <div class="custom-button"> <input name="source" style="display: none;" type="text" value="CONTACT_INQUIRY"/> <input class="btn btn--primary-light button-style-2" type="submit" value="SUBMIT"/> <p class="success hide"> Success! </p> </div>
