<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="fields"> <div class="field-row col1 hidden-row"> <div class="field hidden"> <input id="contact_subject" name="subject" type="hidden" value="Contact Form"/> </div> </div> <div class="field-row col1 hidden-row"> <div class="field hidden"> <input id="contact_redirect" name="redirect" type="hidden" value="/contact/thank-you/"/> </div> </div> <div class="field-row col2"> <div class="field text"> <label for="contact_first_name">First Name*</label> <small>This field is required.</small> <input aria-required="true" data-moz-autofill-type="given-name" id="contact_first_name" name="first_name" placeholder="First Name*" required="" size="50" type="text" value=""/> </div> <div class="field text"> <label for="contact_last_name">Last Name*</label> <small>This field is required.</small> <input aria-required="true" data-moz-autofill-type="family-name" id="contact_last_name" name="last_name" placeholder="Last Name*" required="" size="50" type="text" value=""/> </div> </div> <div class="field-row col2"> <div class="field tel"> <label for="contact_phone">Phone*</label> <small>This field is required.</small> <input aria-required="true" data-moz-autofill-type="tel" id="contact_phone" name="phone" phone-format="true" phone-pattern="(000) 000-0000" placeholder="Phone*" required="" size="50" type="tel" value=""/> </div> <div class="field email"> <label for="contact_email">Email*</label> <small>This field is required.</small> <input aria-required="true" data-moz-autofill-type="email" id="contact_email" name="email" placeholder="Email*" required="" size="50" type="email" value=""/> </div> </div> <div class="field-row col1"> <div class="field select"> <label for="contact_type_of_case">Type of Case?*</label> <small>This field is required.</small> <select aria-required="true" id="contact_type_of_case" name="type_of_case" required=""> <option disabled="" selected="" value="">Type of Case?*</option> <option value="General Injury">General Injury</option> <option value="Automobile Accident">Automobile Accident</option> <option value="Workers Compensation">Workers Compensation</option> <option value="Social Security">Social Security</option> <option value="Mass Tort">Mass Tort</option> <option value="Nursing Home">Nursing Home</option> <option value="Bed Bugs">Bed Bugs</option> <option value="Hair Relaxer">Hair Relaxer</option> <option value="Employment">Employment</option> </select> </div> </div> <div class="field-row col1"> <div class="field select"> <label for="contact_are_you_a_new_client">Are you a new client?*</label> <small>This field is required.</small> <select aria-required="true" id="contact_are_you_a_new_client" name="are_you_a_new_client" required=""> <option disabled="" selected="" value="">Are you a new client?*</option> <option value="Yes, I am a potential new client.">Yes, I am a potential new client.</option> <option value="No, I'm a current existing client.">No, I'm a current existing client.</option> <option value="I'm neither.">I'm neither.</option> </select> </div> </div> <div class="field-row col1 hidden-row"> <div class="field hidden"> <input id="contact_intake_status" name="intake_status" type="hidden" value="New"/> </div> </div> <div class="field-row col1"> <div class="field select"> <label for="contact_preferred_location">Preferred Location*</label> <select aria-required="true" data-s3-locations="" id="contact_preferred_location" name="preferred_location" required=""> <option disabled="" selected="" value="">Preferred Location*</option> <option value="Other">Other</option> </select> <small>This field is required.</small> </div> </div> <div class="field-row col1"> <div class="field textarea"> <label for="contact_message">Message</label> <textarea cols="48" id="contact_message" name="message" placeholder="Message" rows="6" value=""></textarea> </div> </div> <div class="field-row col1"> <div class="field checkbox follow-up"> <small>This field is required.</small> <div class="field-item checkbox-item"> <input aria-required="true" id="contact_opt-in" name="opt-in" required="" type="checkbox" value="Yes"/> <label for="contact_opt-in">By completing this form, you are giving us permission to follow-up by phone, email or text.</label> </div> </div> </div> </div> <div> <input id="contact_recaptchaV3" name="g-recaptcha-response-v3" type="hidden"/> <div data-recaptcha="" id="contact_recaptchaV2"></div> <div data-recaptcha-error="" id="contact_recaptcha"> <small>This field is required.</small> </div> </div> <input id="form_id" name="form_id" type="hidden" value="contact"/> <input name="human_check" type="hidden"/> <div class="submit-holder"> <div class="btn validate disabled" id="validate_contact" tabindex="0">Submit</div> <button class="submit btn" id="submit_contact" name="submit" tabindex="0" type="submit" value="submitted">Submit</button> </div>
</form>

</fieldset></body></html>
