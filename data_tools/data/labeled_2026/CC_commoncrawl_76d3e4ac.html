<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="cmd" type="hidden" value="_donations"/> <input name="bn" type="hidden" value="TipsandTricks_SP"/> <input name="business" type="hidden" value=""/> <input name="item_name" type="hidden" value=""/> <input name="item_number" type="hidden"/> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="given-name" name="first_name" placeholder="First Name" required="" type="text"/> </div> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="family-name" name="last_name" placeholder="Last Name" type="text"/> </div> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="address-line1" name="address1" placeholder="Address line 1" type="text"/> </div> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="address-line2" name="address2" placeholder="Address line 2" type="text"/> </div> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="email" name="email" placeholder="Email" required="" type="email"/> </div> <div class="form-group col-sm-6"> <input class="form-control" data-moz-autofill-type="address-level2" name="city" placeholder="City" type="text"/> </div> <div class="form-group col-sm-4"> <input class="form-control" data-moz-autofill-type="address-level1" name="state" placeholder="State" type="text"/> </div> <div class="form-group col-sm-4"> <input class="form-control" data-moz-autofill-type="postal-code" name="zip" placeholder="Zip" type="text"/> </div> <div class="form-group col-sm-4"> <input class="form-control" name="amount" placeholder="Amount" required="" type="number" value=""/> </div> <input name="rm" type="hidden" value="0"/> <input name="currency_code" type="hidden" value="USD"/> <div class="col-md-12"> <button class="btn btn-primary btn-lg" name="submit" type="submit">Donate Now</button> </div>
