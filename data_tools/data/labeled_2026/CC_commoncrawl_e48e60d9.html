<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<fieldset class="wpcf7-form__wrapper"> <div class="input-group input-group--md"> <label class="form-label"> Full Name* <span class="wpcf7-form-control-wrap Fullname"> <input aria-required="true" class="wpcf7-form-control wpcf7-text wpcf7-validates-as-required" data-moz-autofill-type="name" name="Fullname" placeholder="Jane Doe" required="" size="40" type="text" value=""/> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--sm"> <label class="form-label"> What are you inquiring About?* <span class="wpcf7-form-control-wrap WhatInquiry"> <select class="wpcf7-form-control wpcf7-select wpcf7-validates-as-required" name="WhatInquiry" required=""> <option value="">---</option> <option value="Sales">Sales</option> <option value="Service">Service</option> <option value="Parts">Parts</option> </select> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--sm"> <label class="form-label"> Email* <span class="wpcf7-form-control-wrap Email"> <input aria-required="true" class="wpcf7-form-control wpcf7-text wpcf7-email wpcf7-validates-as-required wpcf7-validates-as-email email validation" data-moz-autofill-type="email" name="Email" placeholder="jane@gmail.com" required="" size="40" type="email" value=""/> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--md"> <label class="form-label"> Phone Number <span class="wpcf7-form-control-wrap Phone"> <input class="wpcf7-form-control wpcf7-text phone validation" data-moz-autofill-type="tel" name="Phone" placeholder="(123) 456-7890" size="40" type="tel" value=""/> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--sm"> <label class="form-label"> Preferred Contact Method <span class="wpcf7-form-control-wrap PreferredContact"> <select class="wpcf7-form-control wpcf7-select" name="PreferredContact"> <option value="">---</option> <option value="Call">Call</option> <option value="Email">Email</option> <option value="Text">Text</option> </select> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--sm"> <label class="form-label"> Best time to call? <span class="wpcf7-form-control-wrap BestTime"> <select class="wpcf7-form-control wpcf7-select" name="BestTime"> <option value="Anytime">Anytime</option> <option value="Morning">Morning</option> <option value="Afternoon">Afternoon</option> <option value="Evening">Evening</option> </select> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--lg"> <label class="form-label"> Message <span class="wpcf7-form-control-wrap Message"> <textarea class="wpcf7-form-control wpcf7-textarea" cols="40" maxlength="500" name="Message" placeholder="I am interested in..." rows="6"></textarea> </span> <div class="validated"></div> <div class="validated__label"></div> </label> </div> <div class="input-group input-group--lg"> <span class="wpcf7-form-control-wrap Communication"> <span class="wpcf7-form-control wpcf7-acceptance optional"> <span class="wpcf7-list-item"> <label> <input name="Communication" type="checkbox" value="1"/> <span class="wpcf7-list-item-label">Yes, send me exclusive offers and promotions from Leggat Kia and its partners. I can withdraw my consent at any time.</span> </label> </span> </span> </span> <div class="validated"></div> <div class="validated__label"></div> </div> <div class="input-group input-group--lg"> <span class="wpcf7-form-control-wrap consent_checkbox extracted-inline-style-002"> <span class="wpcf7-form-control"> <div class="wpcf7-list-item"> <label> <span class="wpcf7-list-item-label">By clicking "Send" I agree to receive communications and share my personal information with Leggat Kia and its partners. I also agree to the <a href="/terms-conditions" target="_blank">Terms and Conditions</a> and the <a href="/privacy-policy" target="_blank">Privacy Policy</a>.</span> </label> </div> </span> </span> <input class="wpcf7-form-control wpcf7-submit button button--centered" type="submit" value="Send"/> <span class="ajax-loader"></span> <div class="validated"></div> <div class="validated__label"></div> </div> <input name="LeadType" type="hidden" value="general"/> <input name="FormName" type="hidden" value="contact-form"/> <input name="UrlPath" type="hidden" value=""/> </fieldset> <div aria-hidden="true" class="wpcf7-response-output"></div>
</form>

</fieldset></body></html>
