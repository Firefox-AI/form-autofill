<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <label class="font-weight-bold" for="requestQuoteName">Name:</label> <input class="form-control" data-moz-autofill-type="name" id="requestQuoteName" type="text"/> <div class="text-danger d-none" id="requestQuoteModalNameErrMsg"></div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuoteCompany">Company:</label> <input class="form-control" data-moz-autofill-type="organization" id="requestQuoteCompany" type="text"/> <div class="text-danger d-none" id="requestQuoteModalCompanyErrMsg"></div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuoteEmail">Email:</label> <input class="form-control" data-moz-autofill-type="email" id="requestQuoteEmail" type="text"/> <div class="text-danger d-none" id="requestQuoteModalEmailErrMsg"></div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuoteNumber">Contact Number:</label> <div class="col-12 d-flex p-0"> <select class="form-control w-100" data-moz-autofill-type="tel" id="requestQuoteNumber"> </select> <div class="text-danger d-none" id="requestQuoteModalPhoneErrMsg"></div> </div> </div> <div> <div class="form-group"> <label class="font-weight-bold" for="requestQuoteItemMasterId">Product or ItemID:</label> <input class="form-control" id="requestQuoteItemMasterId" type="text" value="DWA-TY26PU"/> <div class="text-danger d-none" id="requestQuoteModalItemErrMsg"></div> </div> </div> <div class="d-flex"> <div class="form-group mr-auto" v-if="!isProductDetail"> <label class="font-weight-bold" for="requestQuoteSize">Size:</label> <input class="form-control" id="requestQuoteSize" type="text"/> <div class="text-danger d-none" id="requestQuoteSizeErrMsg"></div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuoteQty">Qty:</label> <input class="form-control" id="requestQuoteQty" type="text"/> <div class="text-danger d-none" id="requestQuoteModalQtyErrMsg"></div> </div> </div> <div class="d-flex"> <div class="form-group mr-auto"> <label class="font-weight-bold" for="requestQuoteDate">Event Date:</label> <input class="form-control" id="requestQuoteDate" type="date"/> <div class="text-danger d-none" id="requestQuoteDateErrMsg"></div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuotePostal">Shipping Postal Code:</label> <input class="form-control" data-moz-autofill-type="postal-code" id="requestQuotePostal" type="text"/> <div class="text-danger d-none" id="requestQuotePostalErrMsg"></div> </div> </div> <div class="form-group"> <label class="font-weight-bold" for="requestQuotemMsg">Additional Details:</label> <textarea class="form-control vresize" id="requestQuotemMsg"></textarea> <div class="text-danger d-none" id="requestQuoteMsgErrMsg"></div> </div> <button class="btn btn-primary" type="submit">Submit</button>
</form>

</fieldset></body></html>
