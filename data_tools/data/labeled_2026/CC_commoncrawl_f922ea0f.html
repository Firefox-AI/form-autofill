</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="action" type="hidden" value="register"/> <div class="row"> <div class="form-group"> <div class="col-md-12"> <label for="name">Your name</label> <input autocomplete="off" class="form-control input-sm" data-moz-autofill-type="name" id="name" name="username" type="text" value=""/> </div> </div> </div> <div class="row"> <div class="form-group"> <div class="col-md-12"> <label for="email">Your email address</label> <input autocomplete="username" class="form-control input-sm" data-moz-autofill-type="email" id="email" name="email" type="email" value=""/> </div> </div> </div> <div class="row"> <div class="form-group"> <div class="col-md-12"> <label for="password">Your password</label> <input autocomplete="new-password" class="form-control input-sm" id="password" name="password" type="password" value=""/> </div> </div> </div> <div class="row margin-bottom-10 hidden"> <div class="col-md-12 text-center"> <label for="gender"><input class="switch" id="gender" name="gender" type="checkbox" value="1"/> Signup as Group</label> <br/> I am a group, organization, label or band and want to link other Artists on my page </div> </div> <div class="row"> <div class="col-md-12 text-center"> <button class="btn btn-primary btn-sm" data-loading-text="Loading..." id="register-button" onclick="jQuery(this).css({'opacity' : 0.2})">Create Account</button> </div> </div>
</form>

</fieldset></body></html>
