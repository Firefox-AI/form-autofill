<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row"><div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mb-3"><input class="form-control" data-moz-autofill-type="given-name" name="firstName" placeholder="First Name" type="text" value=""/></div><div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mb-3"><input class="form-control" data-moz-autofill-type="family-name" name="lastName" placeholder="Last Name" type="text" value=""/></div><div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mb-3"><input class="form-control" name="email" placeholder="abc@abc.com" type="text" value=""/></div><div class="col-xl-6 col-lg-6 col-md-6 col-sm-12 col-12 mb-3"><input class="form-control" data-moz-autofill-type="tel" name="phone" placeholder="9876543210" type="text" value=""/></div><div class="col-12"><textarea class="form-control" name="review" placeholder="Write here your review" rows="5"></textarea></div><div class="col-12"><button class="btn btnMain px-5 float-end mt-3" type="submit">Post</button></div></div>
</form>

</fieldset></body></html>
