<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_type" type="hidden" value="customer"/><input name="utf8" type="hidden" value="✓"/> <input name="contact[tags]" type="hidden" value="newsletter"/> <div class="input-row first-last"> <input aria-label="Vorname" class="newsletter-half first-name" data-moz-autofill-type="given-name" name="contact[first_name]" placeholder="First Name" type="text"/> <input aria-label="Nachname" class="newsletter-half last-name" data-moz-autofill-type="family-name" name="contact[last_name]" placeholder="Last Name" type="text"/> </div> <div class="input-row"> <input name="challenge" type="hidden" value="false"/> <input aria-label="Geben Sie Ihre E-Mail-Adresse ein..." autocapitalize="off" autocorrect="off" class="contact_email" data-moz-autofill-type="email" name="contact[email]" placeholder="Enter your e-mail address..." required="" type="email"/> <input class="action_button sign_up" name="commit" type="submit" value="Login"/> </div>
</form>

</fieldset></body></html>
