<html><head>

<body>

<fieldset>
<h3>hannemann-immobilien.de</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <div class="col-xs-12"> <label for="company">Ihre Firma</label> </div> <div class="col-xs-12"> <input class="form-control immomakler-contact-company" data-moz-autofill-type="organization" id="company" name="company" type="text" value=""/> </div> </div> <div class="form-group"> <div class="col-xs-12 col-sm-3"> <label for="title">Anrede</label> <select class="form-control immomakler-contact-title" data-moz-autofill-type="honorific-prefix" id="title" name="title"> <option value=""></option> <option value="Herr">Herr</option> <option value="Frau">Frau</option> </select> </div> <div class="col-xs-12 col-sm-4"> <label for="firstname">Vorname</label> <input class="form-control immomakler-contact-firstname" data-moz-autofill-type="given-name" id="firstname" name="firstname" type="text" value=""/> </div> <div class="col-xs-12 col-sm-5"> <label for="name">Nachname *</label> <input class="form-control immomakler-contact-name" data-moz-autofill-type="family-name" id="name" name="name" type="text" value=""/> </div> </div> <div class="form-group"> <div class="col-xs-12"> <label for="email">Ihre E-Mail-Adresse *</label> </div> <div class="col-xs-12"> <input class="form-control immomakler-contact-email" data-moz-autofill-type="email" id="email" name="email" required="" type="email" value=""/> </div> </div> <div class="form-group"> <div class="col-xs-12"> <label for="city">Ihre Adresse *</label> </div> <div class="col-xs-9"> <input aria-label="Straße" class="form-control immomakler-contact-street" data-moz-autofill-type="street-address" name="street" placeholder="Straße" required="" type="text" value=""/> </div> <div class="col-xs-3"> <input aria-label="Hausnummer" class="form-control immomakler-contact-streetnumber" name="streetnumber" placeholder="Nr." required="" type="text" value=""/> </div> <div class="col-xs-4"> <input aria-label="PLZ" class="form-control immomakler-contact-zipcode" name="zipcode" placeholder="PLZ" required="" type="text" value=""/> </div> <div class="col-xs-8"> <input aria-label="Ort" class="form-control immomakler-contact-city" id="city" name="city" placeholder="Ort" required="" type="text" value=""/> </div> </div> <div class="form-group"> <div class="col-xs-12"> <label for="phone">Ihre Telefonnummer *</label> </div> <div class="col-xs-12"> <div class="immomakler-phone-wrapper" data-default-country="deu"> <button class="btn btn-default form-control immomakler-phone-prefix-button" type="button"> <span class="immomakler-phone-prefix-flag"></span> <span class="immomakler-phone-prefix-text">+49</span> <span class="immomakler-phone-prefix-caret">▾</span> </button> <ul class="immomakler-phone-prefix-dropdown" hidden=""></ul> <input class="form-control immomakler-contact-phone" data-moz-autofill-type="tel" id="phone" name="phone" required="" type="tel" value=""/> </div> <input id="phone_country" name="phone_country" type="hidden" value="DE"/> <input id="phone_prefix" name="phone_prefix" type="hidden" value="+49"/> </div> </div> <div class="form-group"> <div class="col-xs-12"> <label for="message">Ihre Nachricht *</label> </div> <div class="col-xs-12"> <textarea class="form-control immomakler-contact-message" id="message" name="message" required="" rows="5">Ich interessiere mich für das Angebot. Bitte nehmen Sie mit mir Kontakt auf.</textarea> </div> </div> <div class="form-group"> <div class="col-xs-12"> <div class="checkbox"> <input id="check_agb" name="check_agb" required="" type="checkbox" value="1"/> <label for="check_agb"> Ich habe die <a href="https://hannemann-immobilien.de/agb/" target="_blank">Allgemeinen Geschäftsbedingungen</a> gelesen und akzeptiert. * </label> </div> </div> </div> <div class="form-group"> <div class="col-xs-12"> <div class="checkbox"> <input id="check_widerruf" name="check_widerruf" required="" type="checkbox" value="1"/> <label for="check_widerruf"> Ich bestätige, die <a href="https://hannemann-immobilien.de/widerrufsrecht/" target="_blank">Widerrufsbelehrung</a> gelesen zu haben und über die Rechtsfolgen des Widerrufs belehrt worden zu sein. Ich bestätige außerdem, dass der Immobilienmakler vor Ablauf der Widerrufsfrist mit der Dienstleistung beginnen darf. * </label> </div> </div> </div> <div class="form-group"> <div class="col-xs-12"> <div class="checkbox"> <input id="check_provision" name="check_provision" required="" type="checkbox" value="1"/> <label for="check_provision"> Der Immobilienmakler erhält von mir bei Abschluss eines durch ihn vermittelten notariell beurkundeten Kaufvertrages zu dieser Immobilie die angegebene Provision. * </label> </div> </div> </div> <div class="form-group"> <div class="col-xs-12"> <div class="checkbox"> <input id="check_privacy" name="check_privacy" required="" type="checkbox" value="1"/> <label for="check_privacy"> Ich willige in die Verarbeitung meiner Daten zum Zweck der Bearbeitung meiner Anfrage ein und habe die <a href="https://hannemann-immobilien.de/datenschutz/" target="_blank">Datenschutzerklärung</a> gelesen. * </label> </div> </div> </div> <div class="col-xs-12"> <span class="mandatory">* Pflichtangaben</span> </div> <div class="form-group immomakler-contactform-send"> <div class="col-xs-12 col-sm-4"> <input aria-label="Bitte nicht ausfüllen, dies ist ein Spamschutz-Feld" autocomplete="off" class="form-control immomakler-contact-sender-email" name="sender-email" tabindex="-1" type="text" value=""/> <input name="request" type="hidden" value="send"/> <input name="recipient" type="hidden" value=""/> <input name="subject" type="hidden" value=""/> <input name="posts" type="hidden" value="61880"/> <button class="submit btn btn-primary" type="submit">Exposé anfragen</button> <div class="send-over-https"><span class="glyphicon glyphicon-lock https-lock"></span> SSL-verschlüsselt</div> </div> <div class="col-xs-12 col-sm-8"> </div> </div>
</form>

</fieldset></body></html>
