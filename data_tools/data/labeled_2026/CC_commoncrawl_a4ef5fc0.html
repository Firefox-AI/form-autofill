<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="subscribe-input firstname" data-moz-autofill-type="given-name" data-validate='{"required":true}' id="newsletter_fname" name="firstname" placeholder="First Name" type="text"/> <input class="subscribe-input" data-moz-autofill-type="email" data-validate="{'required':true, 'email':true}" id="newsletter_email" name="email" placeholder="Email" type="email"/> <input class="subscribe-input" data-moz-autofill-type="bday" id="newsletter_birthday" name="dob" onblur="(this.type='text')" onfocus="(this.type='date')" placeholder="DD/MM/YYYY" type="text"/> <div class="popup_button_wrapper"> <button class="widget-button popup_submit_btn" id="popup-submit" type="submit"><span>SUBSCRIBE</span></button> <button class="widget-button popup_cancel_btn"><span>NO THANKS</span></button> </div>
</form>

</fieldset></body></html>
