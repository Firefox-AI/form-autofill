<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"><div class="row mb-4"><div class="col-12"><label for="name">Name *</label><input class="form-control ng-untouched ng-pristine ng-invalid" classname="form-control" data-moz-autofill-type="name" formcontrolname="name" id="name" type="text" value=""/></div></div><div class="row mb-4"><div class="col-12"><label for="email">Your email address *</label><input class="form-control ng-untouched ng-pristine ng-invalid" classname="form-control" data-moz-autofill-type="email" formcontrolname="email" id="email" value=""/><small class="text-muted ds-hint">This email address is used for sending the file.</small></div></div><div class="row mb-4"><div class="col-12"><div>Files</div><div class="ml-4"><input class="form-check-input ng-untouched ng-pristine ng-valid" classname="form-check-input" formcontrolname="allfiles" id="allfiles-true" type="radio" value="true"/><label class="form-check-label" for="allfiles-true">All files (of this item) in restricted access</label></div><div class="ml-4"><input checked="" class="form-check-input ng-untouched ng-pristine ng-valid" classname="form-check-input" formcontrolname="allfiles" id="allfiles-false" type="radio" value="false"/><label class="form-check-label" for="allfiles-false">Only the requested file</label></div></div></div><div class="row mb-4"><div class="col-12"><label for="message">Message</label><textarea class="form-control ng-untouched ng-pristine ng-valid" classname="form-control" formcontrolname="message" id="message" rows="5" value=""></textarea></div></div></div>
</form>

</fieldset></body></html>
