<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<fieldset class="form-fieldset"> <div class="form-field"> <label class="form-label">Product ID:</label> <input class="form-input" name="customer_name" placeholder="Your Product Id" required="true" type="text" value="373173"/> </div> <div class="form-field"> <label class="form-label">Enter Your Name:</label> <input class="form-input" data-moz-autofill-type="name" name="customer_name" placeholder="Your Name" required="true" type="text" value=""/> </div> <div class="form-field"> <label class="form-label">Enter Your Email:</label> <input class="form-input" data-moz-autofill-type="email" name="customer_email" placeholder="Email Address" required="true" type="text" value=""/> </div> <div class="form-field"> <label class="form-label">Enter Your Phone No.:</label> <input class="form-input" data-moz-autofill-type="tel" name="customer_phone" placeholder="Phone Number" required="true" type="text" value=""/> </div> <div class="form-field"> <label class="form-label">What is the required quantity</label> <input class="form-input" name="customer_quantity" placeholder="Quote/Info for Higher Quantities." required="true" type="text" value=""/> </div> <div class="form-field"> <label class="form-label" for="comment-area">How can we assist you?</label> <textarea class="form-input" cols="30" id="comment-area" name="message" required="true" rows="6"></textarea> </div> <div class="form-field"> <label class="form-label label-last">How would you like our team to contact You?</label> <input checked="" class="form-radio" id="phone-radio" name="type_contact" type="radio" value="Phone"/> <label class="form-label" for="phone-radio">Phone</label> <input class="form-radio" id="email-radio" name="type_contact" type="radio" value="Email"/> <label class="form-label" for="email-radio">Email</label> <input class="form-radio" id="both-radio-2" name="type_contact" type="radio" value="Phone &amp; Email"/> <label class="form-label" for="both-radio-2">Both</label> </div> <div class="form-actions"> <button class="button button--primary button--large" id="ask-an-expert-button" type="button">Send Question</button> </div> </fieldset>
</form>

</fieldset></body></html>
