<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>usa.life</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="modal-body twocheckout_modal" style="background-color:#f9f9f9; !important"> <div id="2checkout_alert"></div> <div class="clear"></div> <div class="row" style="background-color:#f9f9f9 !important"> <div class="sun_input col-xs-12" style="padding-right:35px;padding-left:35px;padding-top:10px;position:relative;"> <input autocomplete="off" class="form-control input-md" data-moz-autofill-type="email" id="card_email" placeholder="E-mail" style="font-size:14px;padding-left:25px" type="text" value=""/> <img role="img" src="https://usa.life/themes/wowonder/icons/envelope.svg" style="width:22px;height:20px;position:absolute;top:20px;padding-left:9px"/> </div> <div class="sun_input col-xs-12" style="padding-right:35px;padding-left:35px;margin-bottom:0px;position:relative;"> <input autocomplete="off" class="form-control input-md" data-moz-autofill-type="cc-number" id="_number_" maxlength="16" placeholder="Card number" style="font-size:14px;padding-left:25px;" type="text"/> <input autocomplete="off" class="form-control input-md" id="card_number" name="card_number" type="hidden"/> <img role="img" src="https://usa.life/themes/wowonder/icons/credit-card.svg" style="width:22px;height:20px;position:absolute;top:9px;padding-left:9px"/> </div> <div class="sun_input col-xs-6" style="padding-left:35px;margin-right: -30px;width: 155px;position:relative;"> <input autocomplete="off" class="form-control input-md" data-moz-autofill-type="cc-exp" id="card_exp" maxlength="5" name="card_exp" oninput="this.value" onkeyup="return formatDate(this, event);" placeholder="MM / YY" style="font-size:14px;padding-left:25px;" type="text"/> <img role="img" src="https://usa.life/themes/wowonder/icons/calendar-page-empty.svg" style="width:20px;height:20px;position:absolute;top:9px;padding-left:9px"/> </div> <div class="sun_input col-xs-6" style="padding-right:35px;width: 150px;padding-bottom:20px;position:relative;"> <input autocomplete="off" class="form-control input-md" data-moz-autofill-type="cc-csc" id="card_cvc" maxlength="4" name="card_cvc" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" placeholder="CVC" style="font-size:14px;padding-left:25px;" type="text"/> <img role="img" src="https://usa.life/themes/wowonder/icons/locked.svg" style="width:20px;height:20px;position:absolute;top:9px;padding-left:9px"/> </div> </div> <div class="clear"></div> <input class="hidden" id="2checkout_type" name="type" type="text"/> <input id="card_val" name="card_val" type="hidden" value=""/> <div style="background:#f9f9f9 !important;text-align:center;padding-bottom:0px;"> <button class="btn btn-main" id="2checkout_btn" onclick="tokenRequest()" style="height:40px;font-size:larger;width:200px;" type="button"> </button> </div> </div>
</form>

</fieldset></body></html>
