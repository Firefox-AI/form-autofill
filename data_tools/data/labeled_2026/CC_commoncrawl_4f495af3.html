<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="cb-header"> <div class="cb-title">Register</div> <div class="cb-close"><span class="cb-close-modal cb-close-m"><i class="fa fa-times"></i></span></div> </div> <div class="cb-form-body"> <div class="cb-username"><i class="fa fa-user"></i><input class="user_login input" data-moz-autofill-type="loginname" name="user_login" placeholder="Username" type="text"/></div> <div class="cb-email"><i class="fa fa-envelope-o"></i><input class="user_email input" data-moz-autofill-type="email" name="user_email" placeholder="E-mail" type="text"/></div> <p> <label for="first_name">First Name<br/> <input class="input" data-moz-autofill-type="given-name" id="first_name" name="first_name" size="25" type="text" value=""/></label> </p> <p> <label for="last_name">Last Name<br/> <input class="input" data-moz-autofill-type="family-name" id="last_name" name="last_name" size="25" type="text" value=""/></label> </p> <p> <label for="disp_name">Display name publicly as<br/> <input class="input" data-moz-autofill-type="nickname" id="disp_name" name="disp_name" size="25" type="text" value=""/></label> </p> <div class="cb-submit"> <input class="wp-submitbutton-primary" name="wp-submit" tabindex="100" type="submit" value="Register"/> <input name="login-with-ajax" type="hidden" value="register"/> </div> <div class="cb-register-tip">A password will be e-mailed to you.</div> <span class="lwa-status"></span> </div>
</form>

</fieldset></body></html>
