<fieldset> <legend id="unsubscribe_form" style="position: relative; text-align: center; font-weight: 700; font-size: 2.2em; line-height: normal; color: #ffffff; border: none; width: 100%; margin-bottom: 30px;">Darse de baja</legend> <div class="inputContainer"> <div class="inputBlock"> <input aria-required="true" data-moz-autofill-type="given-name" id="unsubscribe_firstname" name="first_name" oninput="this.className = ''" required="" type="text"/> <label class="floating-label" for="unsubscribe_firstname">Primer Nombre</label> </div> <div class="inputBlock"> <input aria-required="true" data-moz-autofill-type="family-name" id="unsubscribe_lastname" name="last_name" oninput="this.className = ''" required="" type="text"/> <label class="floating-label" for="unsubscribe_lastname">Apellido</label> </div> <div class="inputBlock"> <input aria-required="true" data-moz-autofill-type="email" id="unsubscribe_cemail" name="cemail" oninput="this.className = ''" required="" type="email"/> <label class="floating-label" for="unsubscribe_cemail">Correo electrónico</label> </div> <div class="inputBlock" style="width:100%;"> <input aria-required="true" data-moz-autofill-type="tel" id="unsubscribe_homephonenumber" name="homephonenumber" oninput="this.className = ''" required="" type="tel"/> <label class="floating-label" for="unsubscribe_homephonenumber">Teléfono</label> </div> <div class="inputBlock"> <div class="main_form_disclaimer"> <input aria-required="true" id="agree_to_unsubscribe_checkbox" name="disclaimer" onclick="this.className = ''" required="" style="margin:0px" type="checkbox" value="please unsubscribe me from all communications"/><label for="agree_to_unsubscribe_checkbox"><span>Sí, por favor cancele mi suscripción a todas las comunicaciones.</span></label> </div> </div> </div> <div style="text-align:center;padding:0px 20px 0 20px;clear:both;"> <input class="website" name="website" type="text" value=""/> <button class="bottom_link" name="submit_unsubscribe_form" onclick="validateRegularForm('unsubscribe')" type="button"><span>Entregar</span></button> </div> </fieldset> <input name="trp-form-language" type="hidden" value="es"/>
</form>
