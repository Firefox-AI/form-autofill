<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-row"> <label for="type">お問い合わせ種別<span class="required">必須</span></label> <div class="radio-group"> <label><input checked="" name="type" type="radio" value="案件のご相談"/> 案件のご相談</label> <label><input name="type" type="radio" value="協力会社募集のご相談"/> 協力会社募集のご相談</label> <label><input name="type" type="radio" value="求人のお問い合わせ"/> 求人のお問い合わせ</label> <label><input name="type" type="radio" value="その他"/> その他</label> </div> </div> <div class="form-row"> <label for="company">会社名・団体名</label> <input data-moz-autofill-type="organization" id="company" name="company" placeholder="株式会社〇〇" type="text"/> </div> <div class="form-row"> <label for="name">お名前<span class="required">必須</span></label> <input data-moz-autofill-type="name" id="name" name="name" placeholder="山田 太郎" required="" type="text"/> </div> <div class="form-row"> <label for="tel">電話番号</label> <input data-moz-autofill-type="tel" id="tel" name="tel" placeholder="00-0000-0000" type="tel"/> </div> <div class="form-row"> <label for="email">メールアドレス<span class="required">必須</span></label> <input data-moz-autofill-type="email" id="email" name="email" placeholder="example@atl2019.com" required="" type="email"/> </div> <div class="form-row"> <label for="message">お問い合わせ内容<span class="required">必須</span></label> <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください" required=""></textarea> </div> <button class="btn btn-dark btn-block" type="submit">送信する</button> <p class="form-status mt-40" role="status"></p>
</form>

</fieldset></body></html>
