<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-horizontal"> <div class="share-form__group share-form__group--text form-group"> <label class="share-form__label control-label" for="emailFriend_friendName">Friend’s Name:</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="firstname" data-loc="send to a friend" data-moz-autofill-type="name" id="emailFriend_friendName" name="FriendsName" placeholder="Friend’s Name" type="text"/> </div> <div class="share-form__group share-form__group--email form-group"> <label class="share-form__label control-label" for="emailFriend_friendEmail">*Friend’s Email:</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="email" data-loc="send to a friend" data-moz-autofill-type="email" id="emailFriend_friendEmail" name="FriendsEmail" placeholder="Friend’s Email" required="" type="text"/> </div> <div class="share-form__group share-form__group--text-area form-group"> <label class="share-form__label control-label" for="emailFriend_Comments">Message: </label> <textarea class="share-form__input form-control stat-input-field" data-dlron-type="comment" data-loc="send to a friend" id="emailFriend_Comments" name="Comments" placeholder="Message" rows="2"></textarea> </div> <div class="share-form__group share-form__group--text form-group"> <label class="share-form__label control-label" for="emailFriend_yourName">*Your Name: </label> <input class="share-form__input form-control stat-input-field" data-dlron-type="firstname" data-loc="send to a friend" data-moz-autofill-type="name" id="emailFriend_yourName" name="FirstName" placeholder="Your Name" required="" type="text"/> </div> <div class="share-form__group share-form__group--email form-group"> <label class="share-form__label control-label" for="emailFriend_yourEmail">*Your Email:</label> <input class="share-form__input form-control stat-input-field" data-dlron-type="email" data-loc="send to a friend" data-moz-autofill-type="email" id="emailFriend_yourEmail" name="Email" placeholder="Your Email" required="" type="text"/> </div> <div class="share-form__group share-form__group--checkbox form-group"> <input checked="" class="share-form__checkbox-input stat-checkbox" data-loc="send to a friend" id="sendCopy" name="SendCopy" type="checkbox"/> <label class="share-form__checkbox-label checkbox" for="sendCopy"> <span class="share-form__checkbox-label-text">Send me a copy</span> </label> </div> <input id="emailFriend_Url" style="display:none;" type="text"/> <div class="share-form__footer"> <button class="share-form__submit btn btn-cta go stat-button-link" data-dotagging-element-order="0" data-dotagging-element-subtype="cta_button" data-dotagging-element-type="popup" data-dotagging-event="cta_interaction" data-dotagging-event-action="click" data-dotagging-event-action-result="calc" data-dotagging-product-name="Website|Share Vehicle" data-loc="send to a friend" id="btnSubmit" type="submit"> Send to Friend </button> </div> <div class="share-form__required"> **Required Fields </div> </div>
</form>

</fieldset></body></html>
