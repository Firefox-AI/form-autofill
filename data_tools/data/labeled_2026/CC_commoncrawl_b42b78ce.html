<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p class="comment-notes"><span id="email-notes">Su dirección de correo electrónico no se publicará. </span> Los campos obligatorios están marcados como <span class="required"> * </span></p><p class="comment-form-comment"><textarea aria-required="true" class="u-full-width" cols="45" id="comment" name="comment" placeholder="Mensaje" rows="8"></textarea></p><div class="form-fields row"><span class="comment-form-author col-md-4"><input data-moz-autofill-type="name" id="author" name="author" placeholder="Su nombre" size="30" type="text" value=""/></span><span class="comment-form-email col-md-4"><input data-moz-autofill-type="email" id="email" name="email" placeholder="Dirección de correo electrónico" size="30" type="text" value=""/></span><span class="comment-form-url col-md-4"><input id="url" name="url" placeholder="URL web" size="30" type="text" value=""/></span></div><p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/><label for="wp-comment-cookies-consent">Acepto que los comentarios no deseados no se publicarán</label></p><p class="form-submit"><input class="submit" id="submit" name="submit" type="submit" value="Publicar una respuesta"/><input id="comment_post_ID" name="comment_post_ID" type="hidden"/></p>
</form>

</fieldset></body></html>
