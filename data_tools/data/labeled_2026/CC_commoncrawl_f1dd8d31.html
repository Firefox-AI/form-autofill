<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="pchwr-field"> <label for="pchwr-name">Vor- und Nachname</label> <input class="form-control" data-moz-autofill-type="name" id="pchwr-name" name="pchwr_name" placeholder="Max Mustermann" required="" type="text" value=""/> </div> <div class="pchwr-field"> <label for="pchwr-order">Auftragsbestätigungs-Nr. (AB-Nr.) / Bestellnummer</label> <input class="form-control" id="pchwr-order" name="pchwr_order" placeholder="z. B. 12345" required="" type="text"/> </div> <div class="pchwr-field"> <label for="pchwr-email">Ihre E-Mail-Adresse</label> <input class="form-control" data-moz-autofill-type="email" id="pchwr-email" name="pchwr_email" placeholder="name@beispiel.de" required="" type="email" value=""/> </div> <div aria-hidden="true" class="pchwr-hp"> <label>Website (bitte leer lassen)</label> <input autocomplete="off" name="website" tabindex="-1" type="text"/> </div> <input id="pchwr-recaptcha-token" name="g-recaptcha-response" type="hidden" value=""/> <button class="btn btn-primary pchwr-submit" type="submit">Widerruf anfordern</button> <div class="pchwr-msg" id="pchwr-msg"></div>
</form>

</fieldset></body></html>
