<fieldset>
<h3>retreat-group.com</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form" type="hidden" value="contact"/> <div class="contact-row"> <label for="contact_property">Property</label> <input class="hint required" id="contact_property" name="contact_property" placeholder="" title="Property" type="text" value=""/> </div> <div class="clearer"></div> <div class="contact-row"> <label for="contact_name">First Name</label> <input class="hint required" data-moz-autofill-type="given-name" id="contact_name" name="contact_name" title="Name" type="text" value=""/> </div> <div class="contact-row"> <label for="contact_last_name">Last Name</label> <input class="hint required" data-moz-autofill-type="family-name" id="contact_last_name" name="contact_last_name" title="Last Name" type="text" value=""/> </div> <div class="contact-row"> <label for="contact_email">Email</label> <input class="hint required email" data-moz-autofill-type="email" id="contact_email" name="contact_email" title="Email" type="text" value=""/> </div> <div class="contact-row"> <label for="contact_number">Telephone</label> <input class="hint required" data-moz-autofill-type="tel" id="contact_number" name="contact_number" title="Contact Number" type="text" value=""/> </div> <div class="contact-row contact-row-message"> <label for="contact_message">Message</label> <textarea class="hint" id="contact_message" name="contact_message" style="height: 100px;" title="Message"></textarea> </div> <div class="contact-row contact-tandc"> <label for="contact_terms">Privacy Policy</label> <label class="checkboxlabel contact-terms" for="contact_terms"><input name="contact_terms" required="" style="width: 15px; height: 15px; margin-right:10px;" type="checkbox" value="1"/>I agree to the terms and conditions as outlined in Retreat Group's <a href="https://www.retreat-group.com/privacy/" rel="noopener noreferrer" target="_blank">privacy policy</a>.</label> </div> <input name="address" type="hidden" value=""/> <div class="contact-row"> <button class="g-recaptcha" id="recaptcha_1">Send Message</button> <input class="g-recaptcha-response" name="g-recaptcha-response" type="hidden" value=""/> </div>
</form>

</fieldset></body></html>
