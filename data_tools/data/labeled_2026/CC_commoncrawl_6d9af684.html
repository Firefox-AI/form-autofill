<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-row show"> <div class="unit-form__item form-group contacts col col-12 col-md-12 col-xl-12"> <label class="unit-form__item-inner follow-font-family_size" text-style="3"> <input autocomplete="off" class="unit-form__control form-control" data-title="name" maxlength="280" minlength="0" name="contacts" placeholder="name" required="" type="text"/> <div class="invalid-feedback">input must not exceed 280 in length!</div> <div class="unit-form__label col-form-label"><span class="unit-form__label-text" title="nombre">nombre</span><span class="placeholder"></span></div> </label> </div> <div class="unit-form__item form-group email col col-12 col-md-12 col-xl-12"> <label class="unit-form__item-inner follow-font-family_size" text-style="3"> <input autocomplete="off" class="unit-form__control form-control" data-moz-autofill-type="email" data-title="email" maxlength="200" name="email" pattern="[A-Za-z0-9_+\-\.]+@[A-Za-z0-9\-]+\.[A-Za-z0-9\-\.]{2,}" placeholder="email" required="" type="email"/> <div class="invalid-feedback">Por favor, introduce una dirección de correo electrónico válida!</div> <div class="unit-form__label col-form-label"><span class="unit-form__label-text" title="Email">Email</span><span class="placeholder"></span></div> </label> </div> <div class="unit-form__item form-group phone col col-12 col-md-12 col-xl-12"> <label class="unit-form__item-inner follow-font-family_size" text-style="3"> <input autocomplete="off" class="unit-form__control form-control phone-input" data-moz-autofill-type="tel" data-title="phone" maxlength="30" name="phone" placeholder="phone" required="" type="tel"/> <div class="invalid-feedback">Please enter a valid phone number!</div> <div class="unit-form__label col-form-label"><span class="unit-form__label-text" title="teléfono">teléfono</span><span class="placeholder"></span></div> </label> </div> <div class="unit-form__item form-group company_name col col-12 col-md-12 col-xl-12"> <label class="unit-form__item-inner follow-font-family_size" text-style="3"> <input "="" autocomplete="off" class="unit-form__control form-control" data-title="Company" maxlength="280" name="company_name" placeholder="Company" type="text"/> <div class="invalid-feedback">input must not exceed 280 in length!</div> <div class="unit-form__label col-form-label"><span class="unit-form__label-text" title="Compañía">Compañía</span><span class="placeholder"></span></div> </label> </div> <div class="unit-form__item form-group content col col-12 col-md-12 col-xl-12"> <label class="unit-form__item-inner follow-font-family_size" text-style="3"> <textarea class="unit-form__control form-control" data-title="content" maxlength="5000" minlength="10" name="content" placeholder="content" required="" rows="5"></textarea> <div class="invalid-feedback">The input length cannot be less than 10!</div> <div class="unit-form__label col-form-label"><span class="unit-form__label-text" title="contenido">contenido</span><span class="placeholder"></span></div> </label> </div> <div class="unit-form__item unit-form__item-submit form-group col follow-font-family" text-style="3"> <div button-style="2" class="unit-form__submit-wrap"> <div class="base-button"> <button class="base-button__inner btn" type="submit"> <div class="d-inline-block">Enviar consulta ahora</div> </button> </div> </div> </div> </div>
</form>
