<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="antiBotDiv" style="display:none"> <label data-for-gen="antiEmail"> Email </label><input class="_antiEmail" data-id-gen="antiEmail" data-moz-autofill-type="email" name="antiEmail" type="text"/> </div> <input class="_ls" name="ls" type="hidden"/><input class="_listingKey" name="listingKey" type="hidden"/><input class="_facebook" name="facebook" type="hidden" value="false"/> <div class="_authorizedHidden"> <div class="row-class"> <div class="span8"> <label class="control-label" for="contact_agent_fullname"> Full Name </label><input autocorrect="on" class="span8 _fullName" data-moz-autofill-type="name" id="contact_agent_fullname" name="fullName" type="text"/> </div> </div> <div class="row-class"> <div class="span-2 contactme_email"> <label for="contact_agent_email"> Email </label><input class="span4 _email" data-moz-autofill-type="email" id="contact_agent_email" name="email" type="text"/> </div> <div class="span-2"> <label for="contact_agent_phone"> Phone Number </label><input class="span4 _homePhone" data-moz-autofill-type="tel" id="contact_agent_phone" name="phone" type="text"/> </div> </div> </div> <div class="row-class"> <div class="span8"> <label for="request_message"> Your Message </label><textarea class="span8 contactMeMessage _requestMoreInfoText _area" id="request_message" name="request_message" rows="6" style="display:none;"></textarea><textarea class="span8 contactMeMessage _scheduleAppointmentText _area" name="schedule_appointment" rows="6" style="display:none;"></textarea> </div> </div> <div class="span4 _detailsCaptcha grecaptcha contactme_captcha css-recaptcha"></div> <div class="row-class"> <div class="span4"> <div> <button class="btn btn-danger contactMeSubmitBtn" type="submit"> Send Message </button> </div> </div> </div>
</form>

</fieldset></body></html>
