<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="d-field d-text-field name"> <label for="nomeModal"><b>Nome</b></label> <input data-moz-autofill-type="name" id="nomeModal" name="nomeModal" placeholder="Digite seu nome completo" required="" type="text"/> </div> <div class="d-field d-cpfcnpj-field fisicaJuridica"> <label for="CpfCnpjModal"> <b> </b> </label> <input class="d-ui-widget-content" id="CpfCnpjModal" maxlength="18" name="fisicaJuridicaModal" placeholder="Documento" type="text"/> <small class="smallModal"></small> <span class="errorsModal" id="documento-error">Documento inválido</span> </div> <div class="d-field d-email-field email"> <label for="emailModal"><b>E-mail</b></label> <input data-moz-autofill-type="email" id="emailModal" name="emailModal" placeholder="e-mail@dominio.com.br" type="text"/> </div> <div class="d-field d-text-field telefone"> <label for="telefoneModal"><b>Telefone</b></label> <input class="d-ui-widget-content" data-moz-autofill-type="tel" id="telefoneModal" name="telefoneModal" placeholder="Telefone" type="tel"/> <span class="d-field-val-msg d-valmsg"></span> <small class="smallModal">Telefone: (xx) xxxx - xxxx</small> <span class="errorsModal" id="telefone-error">Telefone Inválido</span> </div> <div class="d-field d-text-field telefone"> <label for="celularModal"><b>Celular</b></label> <input data-moz-autofill-type="tel" id="celularModal" name="celularModal" placeholder="Celular" type="tel"/> <small class="smallModal">Celular: (xx) xxxxxx - xxxx</small> <span class="errorsModal" id="celular-error">Celular Inválido</span> </div> <br/> <div class="d-field"> <input data-label="Aceito receber e-mails de comunicações, ofertas ou promoções" id="aceitereceberemailModal" name="aceiteReceberEmailModal" type="checkbox" value="False"/> </div> <div> <button class="d-reset d-ui-widget d-state-default" data-inline="false" id="sendModal"> <span class="d-button-text">Enviar</span> </button> </div>
</form>

</fieldset></body></html>
