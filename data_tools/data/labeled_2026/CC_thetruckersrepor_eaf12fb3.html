er of verifiable months you’ve been driving professionally using your <b>Class A</b> CDL within the last 3 years.</label></p> <select name="cdl_class_xp"><option value="">Please Select...</option><option value="-1">None</option><option value="1">1-5 Months</option><option value="6">6-11 Months</option><option value="12">1 Year</option><option value="24">2+ Years</option></select> <p class="cdl-class-xp-explanation"> <label class="font-weight-normal"> Each company we work with has specific experience requirements for their drivers. In order for you to receive the best possible offers, please make sure your answers above are accurate prior to submitting. </label> </p> </fieldset> <div class="form-expanded toggle-content" style="display: none"> <fieldset class="general"> <p> <label>Name</label> <input data-moz-autofill-type="name" name="name" pattern=".*[^ ]+ +[^ ]+.*" placeholder="Name" required="" title="First and Last Name, Please" type="text"/> </p> <p> <label>Email</label> <input data-moz-autofill-type="email" name="email" placeholder="Email" required="" type="email"/> </p> <p> <label>Phone</label> <input data-moz-autofill-type="tel" name="phone" placeholder="Phone" required="" type="tel"/> </p> </fieldset> <fieldset class="terms-of-use"> <label class="pointer"> <input name="terms_of_use" required="" type="checkbox" value="1"/> <span> By checking this box and clicking the "Send me job offers" button below, I represent that I:<br/> 1. am 18+ years of age.<br/> 2. have read and agree to the TruckersReport <a href="https://www.thetruckersreport.com/terms-of-use/">Terms of Use</a> and <a href="https://www.thetruckersreport.com/privacy/">Privacy Policy</a>.<br/> 3. agree to receive email marketing from TruckersReport and its <a href="https://www.truckersreportjobs.com/partners">Truck Driving Job Partners</a>. </span> </label> </fieldset> <fieldset class="sms-optin"> <label class="pointer"> <input name="sms_optin" type="checkbox" value="1"/> <span> By checking this box and clicking the "Send me job offers" button below. I give my express consent authorizing TruckersReport and its <a href="https://www.truckersreportjobs.com/partners">Truck Driving Job Partners</a> to contact me by telephone, which may include artificial or pre-recorded calls and/or text messages, delivered via automated technology to the phone number(s) that I have provided above (for which I am the primary user and subscriber), including wireless number(s), if applicable. I understand that my consent is not required to get job alerts. </span> </label> </fieldset> </div> <div class="hnpt"> <input autocomplete="off" name="country" placeholder="Country" type="text" value=""/> </div> <fieldset class="actions"> <button type="submit" value="submit">Send me job offers</button> </fieldset>
