<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input id="site_title" name="site_title" type="hidden" value="General Waste Collection"/> <div class="form-group h_f"> <label for="name">Full Name <span class="red">*</span></label> <input autocomplete="name" data-moz-autofill-type="name" id="name" name="name" required="" type="text"/> </div> <div class="form-group h_f"> <label for="email">Email Address <span class="red">*</span></label> <input autocomplete="email" data-moz-autofill-type="email" id="email" name="email" required="" type="email"/> </div> <div class="form-group h_f"> <label for="phone">Phone Number <span class="red">*</span></label> <input autocomplete="tel" data-moz-autofill-type="tel" id="phone" inputmode="numeric" name="phone" oninput="this.value=this.value.replace(/[^0-9+\-\s\(\)]/g,'');" pattern="[0-9+\-\s\(\)]*" required="" type="tel"/> </div> <div class="form-group h_f"> <label for="postal_code">Post Code <span class="red">*</span></label> <input autocomplete="postal-code" data-moz-autofill-type="postal-code" id="postal_code" name="postal_code" oninput="this.value=this.value.replace(/[^A-Za-z0-9\s\-]/g,'');" pattern="[A-Za-z0-9\s\-]*" required="" type="text"/> </div> <div class="form-group"> <label for="message">Message <span class="red">*</span></label> <textarea id="message" name="message" placeholder="Please describe your requirements..." required="" rows="3"></textarea> </div> <div class="form-group"> <button class="btn btn-primary" type="submit">Send Message</button> </div>
</form>

</fieldset></body></html>
