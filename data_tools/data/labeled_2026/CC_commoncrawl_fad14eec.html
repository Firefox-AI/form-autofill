<form>

abel class="input-label" for="input-select_tipo-de-licencia-vigente" id="label-input-select_tipo-de-licencia-vigente">Tipo de Licencia vigente<span class="field_required">*</span></label><select aria-required="true" class="modal-input-select input-select_tipo-de-licencia-vigente input-reqired" id="input-select_tipo-de-licencia-vigente" name="select_tipo-de-licencia-vigente__field-select[]"><option value="B">B </option><option value="C">C </option><option value="D">D </option><option value="A4">A4 </option><option value="A5">A5</option></select></div><div aria-labelledby="label-input-file_multi_adjunta-tu-cv" class="jobs-modal-input modal-input-file_multi_adjunta-tu-cv file_field" data-control="" role="group"><label class="input-label" for="label-file_multi_adjunta-tu-cv" id="label-label-file_multi_adjunta-tu-cv">Adjunta tu CV<span class="field_required">*</span></label><div class="modal-input-fileinput multiple" data-files="0" id="file_multi_adjunta-tu-cv" role="group"><input aria-hidden="true" class="jobgroup-file_multi_adjunta-tu-cv-disabled disabled-file-placeholder inputfile modal-input-file input-reqired" disabled="" id="file_multi_adjunta-tu-cv-disabled" name="" type="file"/><label class="choose_file_multi_add btn btn-secondary btn-sm" data-key="file_multi_adjunta-tu-cv" for="label-file_multi_adjunta-tu-cv"><img alt="Add file" class="add lazyload" data-src="https://hrlogistics.cl/wp-content/plugins/job-postings//images/add.svg" decoding="async" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="/>Add file</label></div><p class="validation"></p></div><div aria-labelledby="label-input-key" class="jobs-modal-input modal-input-key paragraph_field required_field_notice" data-control="" role="group"><p class="input-paragraph"><span class="field_required">*</span>Required fields</p></div><div aria-labelledby="label-input-honeypot" class="jobs-modal-input modal-input-honeypot text_field" data-control="" role="group"><label class="input-label" for="input-honeypot" id="label-input-honeypot">Phone</label><input class="modal-input-text input-honeypot" data-jobinput="honeypot" id="input-honeypot" name="input_honeypot" placeholder="Phone" type="text" value=""/></div><div class="jobs-modal-footer"><input name="action" type="hidden" value="jobslisting_apply_now"/><input name="language" type="hidden" value="es"/><input name="post_id" type="hidden" value="635"/><input name="captcha_response" type="hidden" value=""/><img alt="Loading..." class="jobs-sending lazyload" data-src="https://hrlogistics.cl/wp-content/plugins/job-postings//images/loading.svg" decoding="async" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="/><button class="button job-submit" type="submit">Send Application</button><p class="jobs-submit-validation"></p></div>
</form>
