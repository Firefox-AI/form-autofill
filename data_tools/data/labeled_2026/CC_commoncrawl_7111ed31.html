<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_type" type="hidden" value="contact"/><input name="utf8" type="hidden" value="✓"/><div class="contact__fields"> <div class="field"> <input autocomplete="name" class="field__input" data-moz-autofill-type="name" id="ContactForm-name" name="contact[名前]" placeholder="名前" type="text" value=""/> <label class="field__label" for="ContactForm-name">名前</label> </div> <div class="field field--with-error"> <input aria-required="true" autocapitalize="off" autocomplete="email" class="field__input" data-moz-autofill-type="email" id="ContactForm-email" name="contact[email]" placeholder="メール" spellcheck="false" type="email" value=""/> <label class="field__label" for="ContactForm-email">メール <span aria-hidden="true">*</span></label></div> </div> <div class="field"> <input autocomplete="tel" class="field__input" data-moz-autofill-type="tel" id="ContactForm-phone" name="contact[電話番号]" pattern="[0-9\-]*" placeholder="電話番号" type="tel" value=""/> <label class="field__label" for="ContactForm-phone">電話番号</label> </div> <div class="field"> <textarea class="text-area field__input" id="ContactForm-body" name="contact[コメント]" placeholder="コメント" rows="10"></textarea> <label class="form__label field__label" for="ContactForm-body">コメント</label> </div> <div class="contact__button"> <button class="button" type="submit"> 送信する </button> </div>
</form>

</fieldset></body></html>
