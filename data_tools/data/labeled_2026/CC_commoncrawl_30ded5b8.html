<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="action" type="hidden" value="send_mail"/> <div class="form-group col-md-6"> <label for="nom">Apellido*</label> <input class="form-control" data-moz-autofill-type="given-name" name="contact[nom]" placeholder="Su nombre" required="" type="text" value=""/> </div> <div class="form-group col-12 col-md-6"> <label for="prenom">Primer Nombre*</label> <input class="form-control" data-moz-autofill-type="given-name" name="contact[prenom]" placeholder="Vuestro nombre" required="" type="text" value=""/> </div> <div class="form-group col-12 col-md-6"> <label for="email">E-mail*</label> <input class="form-control" data-moz-autofill-type="email" name="contact[email]" placeholder="Tu correo electrónico" required="" type="text" value=""/> </div> <div class="form-group col-12 col-md-6"> <label for="telephone">Teléfono</label> <input class="form-control" data-moz-autofill-type="tel" name="contact[telephone]" placeholder="Su número de teléfono" required="" type="text" value=""/> </div> <div class="form-group col-12"> <label for="message">Mensaje*</label> <textarea class="form-control" name="contact[message]" placeholder="Vuestro mensaje" required="" rows="6" type="text" value=""></textarea> </div> <div class="recaptcha-holder"></div> <br/> <div class="col-12 text-center"> <p class="text-left">*Campos obligatorios</p> <button class="btn btn-outline-primary">Enviar el Mensaje</button> </div>
</form>

</fieldset></body></html>
