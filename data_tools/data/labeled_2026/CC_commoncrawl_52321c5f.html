<form>
<div class="row"> <div class="col-md-6"> <div class="required">*Required Fields</div> <h3>Vehicle You Want To Test Drive</h3> <div class="form-group"> <label class="col-md-4 control-label" for="selYearTestDrive">*Year:</label> <div class="col-md-8"> <select class="form-control stat-dropdown custom-dealer-styling__chevron-down--black" data-loc="schedule test drive" id="selYearTestDrive" inventory-filter="Year" inventory-filter-placeholder="Select Year" name="VehicleYear" required=""></select> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="selMakeTestDrive">*Make:</label> <div class="col-md-8"> <select class="form-control stat-dropdown custom-dealer-styling__chevron-down--black" data-loc="schedule test drive" id="selMakeTestDrive" inventory-filter="Make" inventory-filter-placeholder="Select Make" name="VehicleMake" required=""></select> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="selModelTestDrive">*Model:</label> <div class="col-md-8"> <select class="form-control stat-dropdown custom-dealer-styling__chevron-down--black" data-loc="schedule test drive" id="selModelTestDrive" inventory-filter="Model" inventory-filter-placeholder="Select Model" name="VehicleModel" required=""></select> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="txtstock_numberTestDrive">Stock #:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-loc="schedule test drive" id="txtstock_numberTestDrive" name="StockNumber" placeholder="Stock #" type="text"/> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="txtvinTestDrive">VIN:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-dlron-type="vin" data-loc="schedule test drive" id="txtvinTestDrive" name="Vin" type="text"/> </div> </div> </div> <div class="col-md-6 hidden-xs hidden-sm previewimgWrap"> <img alt="Schedule a test drive at Blaise Alexander GMC of Mansfield in Mansfield, PA." class="col-md-offset-3 img-responsive" default-alt="Schedule a test drive at Blaise Alexander GMC of Mansfield in Mansfield, PA." default-src="/resources/components/testDrive/images/testdrive.jpg" height="187" inventory-info="modelphoto" loading="lazy" src="/resources/components/testDrive/images/testdrive.jpg" width="300"/> </div> </div> <div class="row"> <div class="col-md-6"> <h3>Personal Information:</h3> <div class="form-group"> <label class="col-md-4 control-label" for="txtfirst_nameTestDrive">*First Name:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-dlron-type="firstname" data-loc="schedule test drive" data-moz-autofill-type="given-name" id="txtfirst_nameTestDrive" name="FirstName" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="txtlast_nameTestDrive">*Last Name:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-dlron-type="lastname" data-loc="schedule test drive" data-moz-autofill-type="family-name" id="txtlast_nameTestDrive" name="LastName" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-md-4 control-label" for="txtEmailTestDrive">*E-Mail Address:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-dlron-type="email" data-loc="schedule test drive" data-moz-autofill-type="email" id="txtEmailTestDrive" name="Email" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-md-4 control-label phoneToolTip" for="txtPhoneTestDrive">*Phone Number:</label> <div class="col-md-8"> <input class="form-control stat-input-field" data-dlron-type="phone" data-loc="schedule test drive" data-moz-autofill-type="tel" id="txtPhoneTestDrive" name="Phone" required="" type="tel"/> </div> </div> <div class="form-group"> </div> </div> <div class="col-md-6"> <h3>Test Drive Appointment:</h3> <div class="form-group"> <do-date-picker country="US" data-date-format="Y-m-d H:iK" data-enable-time="true" data-max-date="2026-08-21" dealer-id="31754" enable-dealer-dates="true" enable-dealer-hours="true" input-class="col-md-8 custom-dealer-styling__chevron-down--black" is-required="true" label="Preferred Date and Time:" label-class="col-md-4 control-label" language="en" name="selDateAndTime" placeholder="- Select Date and Time -"></do-date-picker> </div> </div> </div> <div class="row"> <div class="form-group col-md-12 form-group-disclaimers"> <div class="form-group checkbox col-sm-12"> <label for="tcpaDisclaimerTestDrive"> <input class="checkbox stat-checkbox" data-dlron-ext="true" data-dlron-type="textconsent" id="tcpaDisclaimerTestDrive" name="TCPA_Consent" style="z-index: 1;" type="checkbox" value="true"/> <p name="TCPA_Disclaimer"> By clicking this box, I agree to receive in-person or automated telemarketing calls and texts from Blaise Alexander GMC of Mansfield at the number I entered. I understand that my consent is not required for purchase. </p> </label> </div> </div> <div class="form-group"> <div class="col-md-6 col-md-offset-8"> <input class="btn btn-main stat-button-link" data-dtm="schedule test drive" data-loc="schedule test drive" id="submitTestDrive" type="submit" value="Schedule"/> </div> </div> </div> <div> </div> <input id="testdrive_leadSource" name="leadSource" type="hidden" value=""/> <input data-dlron-ext="true" name="ctaName" type="hidden" value=""/> <input name="VehicleType" type="hidden" value=""/> <input id="testdrive_AltDealerId" name="AltDealerId" type="hidden" value=""/>
