<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <label class="control-label" for="reg-firstname">First name</label> <input class="form-control input-lg" data-moz-autofill-type="given-name" id="reg-firstname" placeholder="First name" required="" type="text"/> </div> <div class="form-group"> <label class="control-label" for="reg-surname">Surname</label> <input class="form-control input-lg" data-moz-autofill-type="family-name" id="reg-surname" placeholder="Surname" required="" type="text"/> </div> <div class="form-group"> <label class="control-label" for="reg-email">Your email address</label> <input autocomplete="off" class="form-control input-lg" data-moz-autofill-type="email" id="reg-email" name="email" placeholder="Email address" required="" type="email"/> </div> <div class="form-group"> <label class="control-label" for="reg-password">Password</label> <input class="form-control input-lg pwd" id="reg-password" placeholder="Password" required="" type="password"/> </div> <div class="form-group"> <label class="control-label" for="guest-email">Contact preferences</label> <label class="form-control marketing-prefs"><input id="reg-consent" type="checkbox" value="1"/> <small>I would like to receive marketing and special offer emails from Metalheadz </small></label> </div> <hr/> <input name="store_id" type="hidden" value="1039"/> <p><input class="btn btn-lg btn-primary btn-block" id="reg-submit" type="submit" value="Create Account"/></p> <p class="well well-sm"><small>By continuing, you agree to our <a href="/tandc" target="_blank">Terms and Conditions</a> and <a href="/privacy" target="_blank">Privacy Policy</a></small></p>
</form>

</fieldset></body></html>
