<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="js-info-book-id" name="book-id" type="hidden" value=""/> <div class="two-col"> <div class="r"> <div class="col col-1"> <div class="item"> <div class="label">First name</div> <input class="required" data-moz-autofill-type="given-name" name="tb-firstname" type="text" value=""/> </div> </div> <div class="col col-2"> <div class="item"> <div class="label">Last name</div> <input class="required" data-moz-autofill-type="family-name" name="tb-lastname" type="text" value=""/> </div> </div> </div> <div class="r"> <div class="col col-1"> <div class="item"> <div class="label">Address (line 1)</div> <input class="required" data-moz-autofill-type="address-line1" name="tb-address_line1" type="text" value=""/> </div> </div> <div class="col col-2"> <div class="item"> <div class="label">Address (line 2) (optional)</div> <input data-moz-autofill-type="address-line2" name="tb-address_line2" type="text" value=""/> </div> </div> </div> <div class="r"> <div class="col col-1"> <div class="item"> <div class="label">Postal code</div> <input class="required" data-moz-autofill-type="postal-code" name="tb-address_zip" type="text" value=""/> </div> </div> <div class="col col-2"> <div class="item"> <div class="label">City</div> <input class="required" data-moz-autofill-type="address-level2" name="tb-address_city" type="text" value=""/> </div> </div> </div> <div class="r"> <div class="col col-1"> <div class="item"> <div class="label">Country</div> <input class="required" data-moz-autofill-type="country" name="tb-address_country" type="text" value="Canada"/> </div> </div> <div class="col col-2"> <div class="item"> <div class="label">Province/state</div> <input class="required" data-moz-autofill-type="address-level1" name="tb-address_state" type="text" value="QC"/> </div> </div> </div> <div class="r"> <div class="col col-1"> <div class="item"> <div class="label">Email address</div> <input class="required" data-moz-autofill-type="email" name="tb-email" type="email" value=""/> </div> </div> <div class="col col-2"> <div class="item"> <div class="label">Phone (day) (optional)</div> <input data-moz-autofill-type="tel" name="tb-phone" type="text" value=""/> </div> </div> </div> <div class="r"> <div class="item"> <div class="label">Notes</div> <input name="tb-notes" type="text" value=""/> </div> </div> <div class="r"> <div class="col col-1"> <div class="c-checklinks radio horizontal required" data-name="pickup"> <ul> <li class="checked" data-value="pick-up-in-store"><span>In-store pickup</span></li> <li class="" data-value="pick-up-by-post"><span>Delivery by post</span></li> </ul> </div> </div> </div> </div> <div class="bt-submit"> <input type="submit" value="Place your order"/> </div>
</form>

</fieldset></body></html>
