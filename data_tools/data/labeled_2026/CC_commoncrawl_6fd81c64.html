<html><head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="hidden mb-1 -mt-1 md:col-span-2" data-id="common-contact-us-error" role="alert"><p class="px-1.5 py-2.5 text-sm text-red2font-semibold" data-id="common-contact-us-error-text"></p><span class="hidden" data-id="common-contact-us-error-fallback">contact-us.error.generic</span></div><div class="mb-3 form-control"><label class="pb-2" for="name">Name and surname (*)</label> <input class="mt-1 w-full bg-white px-1.5 py-2.5 border border-gray6 placeholder-gray6 focus:border-primary text-gray2 outline-none text-sm" data-moz-autofill-type="name" id="contact-us.name.id" name="contact-us.name.id" oninput="this.setCustomValidity('');" oninvalid="this.setCustomValidity('Invalid Name and Surname')" placeholder="" required="" type="text"/></div><div class="mb-3 form-control"><label class="pb-2" for="email">E-mail (*)</label> <input class="mt-1 w-full bg-white px-1.5 py-2.5 border border-gray6 placeholder-gray6 focus:border-primary text-gray2 outline-none text-sm" data-moz-autofill-type="email" id="contact-us.email.id" name="contact-us.email.id" oninput="sanitizeEmailInput(this);onInputFormEmail(this);" oninvalid="this.setCustomValidity('Please enter a valid e-mail address')" placeholder="" required="" type="email"/></div><div class="mb-3 md:col-span-2 form-control"><label class="pb-2" for="subject">Subject (*)</label> <input class="mt-1 w-full bg-white px-1.5 py-2.5 border border-gray6 placeholder-gray6 focus:border-primary text-gray2 outline-none text-sm" id="contact-us.subject.id" name="contact-us.subject.id" oninput="this.setCustomValidity('');" oninvalid="this.setCustomValidity('Please specify a subject for our conversation')" placeholder="" required="" type="text"/></div><div class="md:col-span-2 form-control"><label class="pb-2" for="message">Message (*)</label> <textarea class="resize-none mt-1 w-full bg-white px-1.5 py-2.5 border border-gray6 placeholder-gray6 focus:border-primary text-gray2 outline-none scroll-bar text-sm" id="contact-us.message.id" name="contact-us.message.id" oninput="this.setCustomValidity('');" oninvalid="this.setCustomValidity('Please enter a message')" placeholder="" required="" rows="5"></textarea></div><div class="flex justify-end mt-5 mr-auto form-control"><div class="g-recaptcha" data-sitekey="6LeZTlwqAAAAAJ9ftS0huz5WqGPLZcbztAmkNLp7" id="common-contact-us-recaptcha"></div></div><div class="flex items-center justify-end mt-5 ml-auto form-control"><div class="relative inline-flex flex-shrink-0"><button class="flex items-center justify-center flex-shrink-0 h-12 font-bold text-white border-2 w-44 bg-primary border-primary hover:bg-white hover:text-primary disabled:hover:bg-primary disabled:hover:text-white disabled:cursor-wait" data-id="common-contact-us-submit" type="submit">SEND</button><div aria-hidden="true" class="absolute inset-0 flex items-center justify-center hidden border-2 border-primary bg-primary" data-id="common-contact-us-loader"></div></div></div><div class="flex flex-col items-center justify-center hidden w-full mt-10 md:col-span-2 submit-message"><div class="mb-16 -mt-10"><p class="mb-2 text-xl text-center text-gray1">Thanks for contacting us.</p><p class="text-sm text-center text-gray11">We appreciate that you took the time to write to us.</p><p class="text-sm text-center text-gray11">We will get back to you as soon as possible.</p></div><button class="flex items-center justify-center flex-shrink-0 h-12 ml-auto font-bold text-white border-2 w-44 bg-primary border-primary hover:bg-white hover:text-primary" onclick="closeContactForm();" type="button">Close</button></div>
</form>

</fieldset></body></html>
