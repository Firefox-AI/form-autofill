<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<h3>Contact Us</h3> <input id="originating-page" name="page" type="hidden" value=""/> <label for="name-first">First Name * <input class="contact-reset" data-moz-autofill-type="given-name" id="name-first" name="name_first" type="text" value=""/> <div class="contact-warning" id="name-first-warning">Please tell us your first name.</div> </label> <label for="name-last">Last Name * <input class="contact-reset" data-moz-autofill-type="family-name" id="name-last" name="name_last" type="text" value=""/> <div class="contact-warning" id="name-last-warning">Please tell us your last name.</div> </label> <label for="organization-company">Organization/Company <input class="contact-reset" data-moz-autofill-type="organization" id="organization-company" name="organization_company" type="text" value=""/> </label> <label for="email">Email * <input class="contact-reset" data-moz-autofill-type="email" id="email" name="email" type="email" value=""/> <div class="contact-warning" id="email-warning">Please give us an email address where we can reach you.</div> </label> <label for="phone">Phone Number * <input class="contact-reset" data-moz-autofill-type="tel" id="phone" name="phone" type="tel" value=""/> <div class="contact-warning" id="phone-warning">Please give us a phone number where we can reach you.</div> </label> <label for="contact-time">Best Time to Contact <select id="contact-time" name="contact_time"> <option value="Anytime">Anytime</option> <option value="Morning">Morning</option> <option value="Afternoon">Afternoon</option> </select> </label> <label for="event-date">Event Date <input id="event-date" name="event_date" type="date" value=""/> </label> <label for="be-of-service">How Can We Be of Service? * <textarea class="contact-reset" id="be-of-service" name="be_of_service" value=""></textarea> <div class="contact-warning" id="be-of-service-warning">How can we be of service?</div> </label> <div class="google"> <div class="g-recaptcha contact-reset" id="google-recaptcha"></div> <div class="contact-warning" id="captcha-warning">Please verify by checking the box above.</div> </div> <button id="contact-send"><h2>SEND</h2></button> <div id="please-wait"><div class="message"></div><div class="hourglass"></div></div>
</form>

</fieldset></body></html>
