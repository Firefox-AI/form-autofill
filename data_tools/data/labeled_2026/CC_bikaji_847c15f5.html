iv> </div> <div class="password reginput odd field"> <div class="input-box"> <input class="input-text required-entry valid" data-password-min-character-sets="3" data-password-min-length="8" data-validate="{required:true, 'validate-customer-password':true}" id="mobile-reg-password" name="password" placeholder="Password*" title="Password" type="password" value=""/> </div> </div> <div class="confirmpassword reginput even fields"> <div class="input-box"> <input aria-describedby="password-confirmation-error" aria-invalid="true" aria-required="true" autocomplete="off" class="input-text required-entry mage-error" data-validate="{required:true, equalTo:'#mobile-reg-password'}" id="confirmpassword" name="password_confirmation" placeholder="Confirm Password*" title="Password" type="password" value=""/> </div> </div> <div class="mobilenumber reginput field reg-mobile"> <input class="mobnumber input-text required-entry" data-moz-autofill-type="tel" id="mobileget" maxlength="10" placeholder="Mobile Number*" type="text" value=""/> <input class="setdotpurl" type="hidden" value="https://www.bikaji.com/mobilelogin/index/sentotpbyreg/"/> <input id="countryreg" name="countryreg" type="hidden" value=""/> <span id="reg_mob_error_msg"></span> </div> <div class="notice">Mobile No. Without Country Code i.e <span class="mobile-number">9898989898</span></div> <div class="submitbtnajax send-otp-button"> <input class="sendotp mobbtn" type="button" value="Send Otp"/> </div> <div class="progress-indicator" id="progress_indecator"> <span class="please-wait reg-please-wait" id="reg-sms-please-wait"> <img alt="" class="v-middle" src="https://www.bikaji.com/pub/static/frontend/Hiddentechies/bizkick/en_US/Magecomp_Mobilelogin/images/ajax-loader.gif"/> </span> </div> <div class="otp-content reginput field" id="regi_otp_cont"> <div class="input-box"> <input class="input-text required-entry mage-error" id="otp" maxlength="6" placeholder="OTP*" type="password" value=""/> </div> <input class="checkotpurl"
