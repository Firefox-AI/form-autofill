<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>perfecthouseholdstaff.co.uk</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_type" type="hidden" value="application_register"/> <fieldset class="hire-form__section"><legend class="hire-form__legend">Register with Us</legend><p class="hire-form__note">Fill in your details below and attach your CV to get started.</p><div class="hire-form__row"><div class="hire-form__field"><label class="hire-form__label" for="rf_first_name"> First Name <span aria-hidden="true" class="hire-form__required">*</span> </label> <input autocomplete="given-name" class="hire-form__input" data-moz-autofill-type="given-name" id="rf_first_name" name="first_name" placeholder="First Name" required="" type="text"/></div><div class="hire-form__field"><label class="hire-form__label" for="rf_last_name"> Last Name <span aria-hidden="true" class="hire-form__required">*</span> </label> <input autocomplete="family-name" class="hire-form__input" data-moz-autofill-type="family-name" id="rf_last_name" name="last_name" placeholder="Last Name" required="" type="text"/></div><div class="hire-form__field"><label class="hire-form__label" for="rf_email"> Email <span aria-hidden="true" class="hire-form__required">*</span> </label> <input autocomplete="email" class="hire-form__input" data-moz-autofill-type="email" id="rf_email" name="email" placeholder="email@example.com" required="" type="email"/></div></div><div class="hire-form__row"><div class="hire-form__field"><label class="hire-form__label" for="rf_mobile">Mobile</label> <input autocomplete="tel" class="hire-form__input" data-moz-autofill-type="tel" id="rf_mobile" name="mobile" placeholder="07400 123456" type="tel"/></div><div class="hire-form__field"><label class="hire-form__label" for="rf_position_wanted"> Position Wanted <span aria-hidden="true" class="hire-form__required">*</span> </label> <div class="select"><select id="rf_position_wanted" name="position_wanted" required=""><option disabled="disabled" selected="selected" value="">Select a position…</option><option value="Butler">Butler</option><option value="Cabin Crew">Cabin Crew</option><option value="Private Care">Private Care</option><option value="Chauffeur">Chauffeur</option><option value="Chef">Chef</option><option value="Cook">Cook</option><option value="Couple">Couple</option><option value="CPO">CPO</option><option value="Estate Manager">Estate Manager</option><option value="Gardener">Gardener</option><option value="Governess">Governess</option><option value="Handyman">Handyman</option><option value="Head Housekeeper">Head Housekeeper</option><option value="House Manager">House Manager</option><option value="Housekeeper">Housekeeper</option><option value="Lady's Maid">Lady's Maid</option><option value="Laundress">Laundress</option><option value="Maternity Nurses">Maternity Nurses</option><option value="Maternity Nanny">Maternity Nanny</option><option value="Nanny">Nanny</option><option value="Nanny / Housekeeper">Nanny / Housekeeper</option><option value="Private PA">Private PA</option><option value="Security">Security</option><option value="Tutor">Tutor</option><option value="Valet">Valet</option><option value="Waiting Staff">Waiting Staff</option><option value="Yacht Stewardess">Yacht Stewardess</option></select></div></div></div><div class="hire-form__row hire-form__row--full"><div class="hire-form__field"><label class="hire-form__label" for="rf_message">Message</label> <textarea class="hire-form__input hire-form__textarea" id="rf_message" name="cover_letter" placeholder="Tell us a bit about yourself and what you're looking for…"></textarea></div></div><div class="hire-form__row hire-form__row--full"><div class="hire-form__field"><label class="hire-form__label" for="rf_cv"> Upload CV <span aria-hidden="true" class="hire-form__required">*</span> </label> <input accept=".pdf,.doc,.docx,.rtf,.txt" class="hire-form__input" id="rf_cv" name="cv" required="" type="file"/></div></div><div class="hire-form__row hire-form__row--full"><div class="hire-form__field"><label class="hire-form__checkbox-label"> <input name="cv_previously_submitted" type="checkbox" value="Yes"/> <span>Please tick if you’ve previously uploaded a CV</span> </label></div></div><div class="hire-form__row hire-form__row--full"><div class="hire-form__field"><label class="hire-form__checkbox-label"> <input checked="checked" name="cv_service_agreement" required="" type="checkbox" value="Yes"/> <span>By ticking this box and/or registering, you unconditionally accept the <a href="/downloads/Canddiate_Legal_Agreement.pdf" rel="noopener" target="_blank">PHS Terms of Service</a>.</span> </label></div></div><div class="hire-form__row hire-form__row--full"><div class="hire-form__field"><label class="hire-form__checkbox-label"> <input checked="checked" name="privacy_policy" required="" type="checkbox" value="Yes"/> <span>By ticking this box, you unconditionally accept the <a href="https://perfecthouseholdstaff.co.uk/privacy-policy" rel="noopener" target="_blank">PHS Privacy Policy</a>.</span> </label></div></div></fieldset><div class="phs-form-error" hidden="hidden"></div><div class="hire-form__submit"><button class="btn-new btn-primary" type="submit">Register</button></div>
</form>

</fieldset></body></html>
