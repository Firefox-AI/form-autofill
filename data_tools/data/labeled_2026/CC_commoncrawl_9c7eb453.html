<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <label class="col-sm-3 control-label" for="nombres">Nombres:</label> <div class="col-sm-9"> <input class="form-control" data-moz-autofill-type="given-name" id="nombres" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="apellidos">Apellidos:</label> <div class="col-sm-9"> <input class="form-control" data-moz-autofill-type="family-name" id="apellidos" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="telefono">Teléfono:</label> <div class="col-sm-9"> <input class="form-control" data-moz-autofill-type="tel" id="telefono" required="" type="tel"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="email">Email:</label> <div class="col-sm-9"> <input class="form-control" data-moz-autofill-type="email" id="email" required="" type="email"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="dni">DNI:</label> <div class="col-sm-9"> <input class="form-control" data-moz-autofill-type="id-number" id="dni" required="" type="text"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="comprobante">Adjuntar comprobante de pago:</label> <div class="col-sm-9"> <input class="form-control" id="comprobante" type="file"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="fechaReclamo">Fecha de Reclamo o Queja:</label> <div class="col-sm-9"> <input class="form-control" id="fechaReclamo" required="" type="date"/> </div> </div> <div class="form-group"> <label class="col-sm-3 control-label" for="detalles">Detalles:</label> <div class="col-sm-9"> <textarea class="form-control" id="detalles" required=""></textarea> </div> </div> <div class="form-group"> <div class="col-sm-offset-3 col-sm-9"> <button class="btn btn-success" onclick="enviarReclamacion()" type="button">Enviar libro de Reclamaciones</button> </div> </div>
</form>

</fieldset></body></html>
