<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<h2 class="blaize-title">Register now</h2> <p class="blaize-description"> Get limited access to our industry news, analysis and data, plus regular email updates </p> <fieldset class="blaize-identifiers"> <label for="reg_email"> <input data-moz-autofill-type="email" id="reg_email" name="email_address" pattern="^(([^\&lt;\&gt;\(\)\[\]\.,;:\s@\x22]+(\.[^\&lt;\&gt;\(\)\[\]\.,;:\s@\x22]+)*)|(\x22.+\x22))@(([^\&lt;\&gt;\(\)\[\]\.,;:\s@\x22]+\.)+[^\&lt;\&gt;\(\)\[\]\.,;:\s@\x22]{2,50})$" placeholder="Work e-mail" required="" title="Work e-mail" type="text"/> <span class="validation-message"></span> </label> </fieldset> <fieldset class="blaize-user-attributes"> <label class="field-container" for="first_name"> <input data-moz-autofill-type="given-name" id="first_name" name="first_name" pattern="^[a-zA-Z\u0080-\uFFFF\-'`., ]{1,50}$" placeholder="First name" required="" type="text"/> </label> <label class="field-container" for="last_name"> <input data-moz-autofill-type="family-name" id="last_name" name="last_name" pattern="^[a-zA-Z\u0080-\uFFFF\-'`., ]{1,50}$" placeholder="Last name" required="" type="text"/> </label> <label class="field-container" for="organisation"> <input data-moz-autofill-type="organization" id="organisation" name="organisation" pattern="^[a-zA-Z0-9\-\x26\(\)\[\],\. ]{1,50}$" placeholder="Organisation" required="" type="text"/> </label> <label class="field-container" for="country"> <select data-moz-autofill-type="country" id="country" name="country" required=""></select> </label> <label class="field-container" for="USstate" style="display: none"> <select id="USstate" name="usstate"></select> </label> <label class="field-container" for="phoneNumber"> <input data-moz-autofill-type="tel" id="phoneNumber" name="phoneNumber" pattern="^[0-9\(\)\/\+ \-]{9,50}$" placeholder="Phone number" required="" title="01234567890" type="tel"/> </label> <label class="field-container" for="investmentRole"> <select id="investmentRole" name="investmentRole" required=""></select> </label> <label class="field-container" for="jobFunction"> <select id="jobFunction" name="jobFunction" required=""></select> </label> <label class="field-container" for="jobTitle"> <input data-moz-autofill-type="organization-title" id="jobTitle" placeholder="Job Title" required="" type="text"/> <div class="dropdown" id="jobTitle-dropdown"> <div class="options"></div> </div> <input name="jobTitle" type="hidden" value=""/> </label> <p class="terms-description"> To register, please review and accept our <a href="/terms-conditions/" target="_blank">terms and conditions</a> and <a href="/privacy-notice/" target="_blank">privacy notice</a>. </p> <label class="field-container" for="termsAndConditions"> I accept: <input id="termsAndConditions" name="termsAndConditions" required="" type="checkbox"/> </label> <input id="sourceRegistration" name="sourceRegistration" type="hidden" value=""/> </fieldset> <div class="blaize-validators"> <p class="blaize-error"></p> <button class="blaize-submit blaize-register-passwordless" type="submit"> <div class="button-text">Email me a registration link</div> <div class="button-loader" style="display: none"></div> </button> </div> <p class="blaize-success"></p> <div class="blaize-to-login"> Already registered? <a href="#">Click here to login</a> </div>
</form>

</fieldset></body></html>
