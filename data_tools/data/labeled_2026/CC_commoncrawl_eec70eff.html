<p class="comment-notes text-small">Ihre E-Mail-Adresse wird nicht veröffentlicht. Pflichtfelder sind mit <span class="required">*</span> markiert.</p><p class="comment-form-comment"><label class="assistive-text" for="comment">Kommentar</label><textarea aria-required="true" cols="45" id="comment" name="comment" placeholder="Kommentar" rows="8"></textarea></p><div class="form-fields"><span class="comment-form-author"><label class="assistive-text" for="author">Name *</label><input aria-required="true" data-moz-autofill-type="name" id="author" name="author" placeholder="Name *" size="30" type="text" value=""/></span> <span class="comment-form-email"><label class="assistive-text" for="email">E-Mail *</label><input aria-required="true" data-moz-autofill-type="email" id="email" name="email" placeholder="E-Mail*" size="30" type="text" value=""/></span> <span class="comment-form-url"><label class="assistive-text" for="url">Website</label><input id="url" name="url" placeholder="Website" size="30" type="text" value=""/></span></div> <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/><label for="wp-comment-cookies-consent">Meinen Namen, E-Mail und Website in diesem Browser speichern, bis ich wieder kommentiere.</label></p> <p class="form-submit"><input class="submit" id="submit" name="submit" type="submit" value="Kommentar abschicken"/> <a class="dt-btn dt-btn-m" href="javascript:void(0);"><span>Beitragskommentare</span></a><input id="comment_post_ID" name="comment_post_ID" type="hidden" value="13905"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </p>
</form>
