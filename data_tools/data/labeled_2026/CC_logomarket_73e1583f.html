<form>
<div style="display:none;"><input name="_method" type="hidden" value="POST"/></div> <input id="__Token" name="__Token" type="hidden" value="739fa5ad6ef92de0825044e586210bd4"/> <input id="InquiryLogoId" name="data[Inquiry][logo_id]" type="hidden" value="42970"/> <input id="InquiryDIdShow" name="data[Inquiry][d_id_show]" type="hidden" value="26"/> <input id="InquiryProductType" name="data[Inquiry][product_type]" type="hidden" value="1"/> <input id="InquiryDesignerId" name="data[Inquiry][designer_id]" type="hidden" value="26"/> <div class="purchace_box"> <p class="title">ロゴマークのご購入</p> <dl id="dl_email"> <dt id="dt_email">メールアドレス<span class="required"></span> </dt> <dd> <input class="validate[required,email]" data-moz-autofill-type="email" for="#bemail" id="InquiryEmail" maxlength="100" name="data[Inquiry][email]" onblur="formValidate($(this));" placeholder="例）info@xxxx.ne.jp" required="required" size="40" type="email"/> <span class="form-feedback" id="bemail"></span> </dd> </dl> <dl> <dt>ロゴマーク<span class="auto"></span> <div class="id_price">No.42970<br/> 49,800円(税込54,780円)</div> </dt> <dd> <div class="purchace_img"> <img alt="家系と家と家柄のロゴ" src="https://logomarket.jp/data/logo/4/2/9/7/42970/42970-348x348.png"/> <p class="company_name Candal ume_mincho" style="color:#333333;"> </p> </div> </dd> </dl> <dl> <dt>事務所名・法人名 <span class="option"></span></dt> <dd> <input data-moz-autofill-type="organization" id="InquiryCompanyName" maxlength="100" name="data[Inquiry][company_name]" placeholder="例）株式会社シンプルワークス" required="required" size="40" type="text"/> </dd> </dl> <dl> <dt>ご担当者様<span class="required"></span> </dt> <dd> <input class="validate[required]" data-moz-autofill-type="name" for="#bname" id="InquiryName" maxlength="20" name="data[Inquiry][name]" onblur="formValidate($(this));" placeholder="例）鈴木太郎" required="required" size="40" type="text"/> <span class="form-feedback" id="bname"></span> </dd> </dl> <dl> <dt>お電話番号<span class="required"></span> </dt> <dd> <input class="validate[required,phone]" data-moz-autofill-type="tel" for="#bphone" id="InquiryPhone" maxlength="20" name="data[Inquiry][phone]" onblur="formValidate($(this));" placeholder="例）0120-962-165" required="required" size="40" type="tel"/> <span class="form-feedback" id="bphone"></span> </dd> </dl> <dl class="credit"> <dt>お支払い方法の選択<span class="required"></span> </dt> <dd> <div class="buy_card"> <input checked="checked" class="validate[minCheckbox[1][typeSend]]" for="#bcredit" group="typeSend" id="InquiryTypeCard" name="data[Inquiry][type_credit]" onclick="formValidate($(this));" type="radio" value="1"/> <label for="InquiryTypeCard">クレジットカード決済</label><br/> <span class="form-feedback success_check" id="bcredit"></span> <p class="memo"><span>送信ボタンをクリックすると、クレジットカード決済の画面へ移動します。</span></p> </div> <div class="buy_bank"> <input class="validate[minCheckbox[1][typeSend]]" for="#bcreditbank" group="typeSend" id="InquiryTypeTransfer" name="data[Inquiry][type_credit]" onclick="formValidate($(this));" type="radio" value="0"/> <label for="InquiryTypeTransfer">銀行振り込み</label><br/> <span class="form-feedback" id="bcreditbank" style="top: -30px;position: relative;float: right;margin-right: -5px;"></span> </div> </dd> </dl> <dl> <dt>ご質問・コメント <span class="option"></span></dt> <dd> <textarea cols="40" id="InquiryContent" name="data[Inquiry][content]" placeholder="例）ロゴは○○してもらえますか？等 ※全角でご入力ください" required="required" rows="10"></textarea> </dd> </dl> <div class="btnSend"> <p class="memo"><span>購入ボタンをクリックすると、クレジットカード決済の画面へ移動します。</span></p> <button id="btnBuy" type="submit"><img alt="カート" src="/app/webroot/img/common/remake/cart_icon.svg"/>このロゴを購入する</button> </div> <p class="btn_terms"><a href="https://logomarket.jp/terms/" target="_blank">利用規約の確認</a></p> </div>
</form>
