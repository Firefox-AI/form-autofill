er="please_enter_the_verification_code"/> </div> </div> <div class="col-12"> <div class="mt-2 captachDesign" id="signup-verification-recaptcha"></div> </div> <div class="col-12 mt-4 text-center"> <div class="btns-container"> <button aria-label="Verify Otp" class="common_button d-block w-100 py-2" id="verifyOTPSignUP" type="submit"><span>Verify</span></button> </div> </div> <div class="col-12 mt-5 text-center"> <div class="text-container"> <p class="small-text bold-text text-underline form-navigation"><span class="previous enableDisabledBtnOnClick" data-btngrouptodisable="disableSignUp">Edit Number</span></p> <p class="small-text resend_otp_wrapper"> Haven't Receive the Code <a class="color-gold bold-text" href="javascript:;" id="resend_registration_verification_code">Resend Code</a> </p> <p class="hiddenInitial wait_to_resend_email"><span class="secondary-color bold-text"> Resend OTP in<span class="resend_time">30</span></span></p> </div> </div> </div> </div> </div> </div>
