ata-val-regex-pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,10}|[0-9]{1,3})(\]?)$" data-val-required="You must provide an email address" id="EmailAddress" maxlength="100" name="EmailAddress" type="text" value=""/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="EmailAddress" data-valmsg-replace="true"></span> <span class="text-danger d-inline-block mt-2" data-valmsg-for="EmailAddress2"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="JobTitle">Job Title*</label> <input class="form-control" data-val="true" data-val-maxlength="The field Job Title* must be a string or array type with a maximum length of '100'." data-val-maxlength-max="100" data-val-required="A job title is required" id="JobTitle" maxlength="100" name="JobTitle" type="text" value=""/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="JobTitle" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="Telephone">Telephone</label> <input class="form-control" data-moz-autofill-type="tel" data-val="true" data-val-maxlength="The field Telephone must be a string or array type with a maximum length of '50'." data-val-maxlength-max="50" id="Telephone" maxlength="50" name="Telephone" type="text" value=""/> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="Department">Department</label> <input class="form-control" data-val="true" data-val-maxlength="The field Department must be a string or array type with a maximum length of '50'." data-val-maxlength-max="50" id="Department" maxlength="50" name="Department" type="text" value=""/> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="CompanyName">Company Name*</label> <input class="form-control" data-moz-autofill-type="organization" data-val="true" data-val-maxlength="The pe="address-level2" data-val="true" data-val-maxlength="The field Town Or City* must be a string or array type with a maximum length of '50'." data-val-maxlength-max="50" data-val-required="You must provide your postal town or city" id="City" maxlength="50" name="City" type="text" value=""/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="City" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="PostCode">Postal Code*</label> <input class="form-control" data-moz-autofill-type="postal-code" data-val="true" data-val-maxlength="The field Postal Code* must be a string or array type with a maximum length of '30'." data-val-maxlength-max="30" data-val-required="You must provide your postal code" id="PostCode" maxlength="30" name="PostCode" type="text" value=""/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="PostCode" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="CountryId">Country*</label> <select class="form-control" data-moz-autofill-type="country" data-val="true" data-val-required="You must select your country" id="CountryId" name="CountryId"> <option value=""></option> </select> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="CountryId" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="Password1">Password*</label> <input class="form-control password" data-val="true" data-val-required="You must provide your password" id="Password1" name="Password1" type="password"/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="Password1" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <label class="control-label fw-semibold" for="Password2">Confirm Password*</label> <input class="form-control password" data-val="true" data-val-equalto="The passwords do not match each other" data-val-equalto-other="*.Password1" data-val-required="You must confirm your password" id="Password2" name="Password2" type="password"/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="Password2" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <input class="d-inline-block me-3" data-val="true" data-val-required="The Paperless field is required." id="Paperless" name="Paperless" type="checkbox" value="true"/> <label class="control-label fw-semibold d-inline" for="Paperless">Going Paperless? Tick this box if you prefer NOT to receive printed copies of the magazine.</label> </div> <div class="form-group mb-3"> <input class="d-inline-block me-3" data-val="true" data-val-range="You must accept the site terms and conditions" data-val-range-max="True" data-val-range-min="True" data-val-required="The TermsAndConditions field is required." id="TermsAndConditions" name="TermsAndConditions" type="checkbox" value="true"/> <label class="control-label fw-semibold d-inline" for="TermsAndConditions">*Registration on this site is subject to our <a href="/privacy">privacy policy</a> and <a href="/terms">terms and conditions of use</a>. You must tick the box to indicate that you have accepted these before continuing.</label> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="TermsAndConditions" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3"> <input class="required-field" name="websiteURL" type="text"/> <span class="text-danger d-inline-block mt-2 field-validation-valid" data-valmsg-for="RecaptchaResponse" data-valmsg-replace="true"></span> </div> <div class="form-group mb-3 d-none"> <input class="d-inline-block me-3" data-val="true" data-val-required="You must pass ReCAPTCHA" id="registrationRecaptchaResponse" name="RecaptchaResponse" type="text" value=""/> <input class="d-inline-block me-3" id="r
