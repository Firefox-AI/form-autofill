<input name="item_sub_total" type="hidden"/> <input name="total" type="hidden"/> <div class="border rounded-lg p-3 mb-5 bg-white"> <div class="mb-4 text-sm font-medium text-gray-700"> <label class="block text-sm font-semibold text-gray-700 mb-1">Order Type</label> <div class="input radio flex gap-4"><input id="order-type" name="order_type" type="hidden" value=""/><label class="flex items-center cursor-pointer"><input checked="checked" class="h-4 w-4" id="order-type-pickup" name="order_type" type="radio" value="pickup"/><span class="ml-2">Pickup</span></label><label class="flex items-center cursor-pointer"><input class="h-4 w-4" id="order-type-delivery" name="order_type" type="radio" value="delivery"/><span class="ml-2">Delivery</span></label></div> </div> <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"> <div> <label class="block text-sm font-medium text-gray-700" for="slot_date"> Slot Date <span class="text-red-500">*</span> </label> <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-700 focus:border-green-700" id="slot_date" min="2026-08-09" name="slot_date" required="" type="date"/> </div> <div> <label class="block text-sm font-medium text-gray-700" for="slot_time"> Slot Time <span class="text-red-500">*</span> </label> <input class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-700 focus:border-green-700" id="slot_time" name="slot_time" required="" type="time"/> </div> </div> <div class="hidden mt-2 text-sm text-red-600 font-medium" id="slotDateTimeErrors"></div> </div> <div class="text-sm font-medium text-center text-gray-500 border mt-4"> <div class="font-semibold w-full p-2 border-r border-gray-200 cursor-pointer rounded-s-lg text-gray-900 bg-gray-100" id="foodOrderBillingInfoTab"> Customer Details </div> </div> <div class="space-y-4" id="foodOrderBillingInfo"> <div class="grid grid-cols-2 gap-4"> <div> <label class="block tex 300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" data-moz-autofill-type="street-address" id="address" name="address" required="" type="text"/> </div> </div> <div class="flex gap-4 mb-4"> <div class="flex-1"> <label class="block text-sm font-medium text-gray-700 mb-1" for="city">City <span class="text-red-500">*</span></label> <input class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" data-moz-autofill-type="address-level2" id="city" name="city" required="" type="text"/> </div> <div class="w-16 m:w-24"> <label class="block text-sm font-medium text-gray-700 mb-1" for="state">State <span class="text-red-500">*</span></label> <input class="block w-full uppercase border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" data-moz-autofill-type="address-level1" id="state" maxlength="2" name="state" required="" type="text"/> </div> <div class="w-24 m:w-32"> <label class="block text-sm font-medium text-gray-700 mb-1" for="foZipCode">Zip Code <span class="text-red-500">*</span></label> <input class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" data-moz-autofill-type="postal-code" id="foZipCode" name="zipcode" placeholder="12345" required="" type="text"/> </div> </div> <div class="mb-4"> <label class="block text-sm font-medium text-gray-700 mb-1" for="country">Country <span class="text-red-500">*</span></label> <select class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" data-moz-autofill-type="country" id="country" name="country" required=""> <option value="">Select Country</option> <option value="US">United States</option> </select> </div> </div> <div class="text-red-600 text-sm mb-2" id="foodOrderEmailErrors"></div> <div cl
