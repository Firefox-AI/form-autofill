ass="form__input-wrapper"> <label for="signUpTwo-js-sold-security">Please enter the security code displayed: *</label> <input class="js-sold-security" id="signUpTwo-js-sold-security" maxlength="8" required="" type="text"/> </div> </div> <div class="col-xs-1-1 col-md-1-2"> <div class="form__catpcha-img"> <img alt="" class="securityImg" src="/security_images/photo2.jpg"/> </div> </div> </div> </div> <div class="form__footer"> <div class="grid gutters"> <div class="col-xs-1-1"> <div class="form__checkbox-wrapper vows-signup-checkbox"> <input id="signUpTwo-sign-up-terms" name="sign-up-terms" required="" type="checkbox"/> <label class="signUpTwo-sign-up-terms__label" for="signUpTwo-sign-up-terms"> <span> I also agree to the following:<br/><br/>Registering an account creates a Virtual Office Website (VOW) relationship between www.perrybatten.ca and the Registrant. </span> <a class="js-vow-toggle-terms vow-toggle-terms no-validate" href="#">Read more</a> <div class="vow-terms-agreement js-vow-terms-agreement" style="display: none;"> <ol> <li>The Registrant acknowledges that these Terms of Use do not create an agency relationship with the VOW Participant (the owner of this website);</li> <li>That the VOW data obtained from the VOW is only for the Registrant's personal, non-commercial use;</li> <li>That the Registrant has a bona fide interest in the purchase, sale or lease of real estate of the type being offered through the VOW;</li> <li>That the Registrant will not copy, redistribute or retransmit any of the VOW data or information provided; and</li> <li>That the Registrant acknowledges the board/association's ownership of and the validity of the copyright in the MLS® System.</li> </ol> </div> </label> </div> </div> </div> <div class="ask_explicit_consent"> <input id="signUpTwo-consent" name="consent" type="checkbox" value="on"/> <label for="signUpTwo-hidden-check" style="display:none">hidden</label> <input class="floatLeft" id="signUpTwo-hidden-check" name="check" style="
