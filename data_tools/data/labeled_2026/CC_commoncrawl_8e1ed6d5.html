<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group"> <label class="control-label" for="nombre">Nombre y Apellido</label> <input class="form-control" data-moz-autofill-type="name" id="nombre_correccion" placeholder="Ingrese su nombre" type="text"/> </div> <div class="form-group"> <label class="control-label" for="ciudad">Ciudad o localización</label> <input class="form-control" data-moz-autofill-type="address-level2" id="ciudad_correccion" placeholder="Ingrese su ciudad o localización" type="text"/> </div> <div class="form-group"> <label class="control-label" for="email">Correo electrónico</label> <input class="form-control" data-moz-autofill-type="email" id="mail_correccion" placeholder="Ingrese su correo electrónico" type="text"/> </div> <div class="form-group"> <label class="control-label" for="telefono">Teléfono Contacto</label> <input class="form-control" data-moz-autofill-type="tel" id="telefono_correccion" placeholder="Ingrese su teléfono de contacto" type="text"/> </div> <div class="form-group"> <label class="control-label" for="comentarios">Corrección o Comentario</label> <textarea class="form-control" id="comentario_correccion" placeholder="Ingrese su comentario..."></textarea> </div> <div style="display: flex; align-items: baseline;"> <input id="checkbox-correcion" style="margin-right: 8px;" type="checkbox"/> <p class="yo-certifico">Certifico que es información real y autorizo a Bio Bio para publicarla de la forma Que estime conveniente, manteniendo la confidencialidad de mis datos si asi lo deseo</p> </div>
</form>

</fieldset></body></html>
