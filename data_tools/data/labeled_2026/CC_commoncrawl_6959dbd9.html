<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group row"> <label class="col-md-3 form-control-label"> Titolo </label> <div class="col-md-9 form-control-valign"> <label class="radio-inline"> <span class="custom-radio"> <input name="id_gender" type="radio" value="1"/> <span></span> </span> Privato <span class="custom-radio"> <input name="id_gender" type="radio" value="2"/> <span></span> </span> Azienda </label> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label"> Azienda: </label> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="organization" name="company" type="text" value=""/> </div> <div class="col-md-3 form-control-comment"> Opzionale </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Nome: </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="given-name" name="firstname" required="" type="text" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Cognome: </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="family-name" name="lastname" type="text" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label"> Codice Fiscale: </label> <div class="col-md-6"> <input class="form-control" name="siret" type="text" value=""/> </div> <div class="col-md-3 form-control-comment"> Opzionale </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Email </label> <div class="col-md-9"> <input class="form-control" data-moz-autofill-type="email" name="email" required="" type="email" value=""/> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> Password </label> <div class="col-md-9"> <div class="input-group js-parent-focus required"> <input class="form-control js-child-focus js-visible-password" name="password" pattern=".{5,}" required="" type="password" value=""/> <span class="input-group-btn"> <button class="btn btn-primary" data-action="show-password" data-text-hide="Nascondi" data-text-show="Visualizza" type="button"> Visualizza </button> </span> </div> </div> </div> <div class="form-row-separator"></div> <div class="form-group row"> <label class="col-md-3 form-control-label"> </label> <div class="col-md-9"> <span class="custom-checkbox"> <input name="newsletter" type="checkbox" value="1"/> <span><i class="material-icons rtl-no-flip checkbox-checked"></i></span> <label>Registrati alla newsletter<br/><em></em></label> </span> </div> </div> <div class="form-group row"> <label class="col-md-3 form-control-label required"> </label> <div class="col-md-9"> <span class="custom-checkbox"> <input name="psgdpr" required="" type="checkbox" value="1"/> <span><i class="material-icons rtl-no-flip checkbox-checked"></i></span> <label><span style="color:red;">* </span>Accetto i termini e le condizioni di utilizzi e la privacy policy</label> </span> </div> </div> <div class="form-footer text-xs-center clearfix"> <input name="submitCreate" type="hidden" value="1"/> <button class="btn btn-primary form-control-submit float-xs-right" data-link-action="save-customer" type="submit"> Crea </button> </div>
</form>

</fieldset></body></html>
