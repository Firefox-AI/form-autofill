<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="md:flex"><div class="md:w-1/2 lg:px-[10px] px-0 relative"><label class="text-[16px] font-[400] mb-[6px] text-[#00102B] lg:block hidden" for="name">Name*</label><input class="bg-[#F8F6FF] border-[1px] border-[#EBE7FF] placeholder:text-[#0D0C5480] p-[8px_8px] h-[45px] w-[100%] block text-[16px] outline-0 focus:border-[#d8d8e2] focus:ring-0 outline-[transparent_!important] text-[#191A59]" data-moz-autofill-type="name" id="name" name="name" placeholder="Full Name*" type="text"/></div><div class="md:w-1/2 lg:px-[10px] px-0 mt-4 md:mt-0 relative"><label class="text-[16px] font-[400] mb-[6px] text-[#00102B] lg:block hidden" for="email">Work Email*</label><input class="bg-[#F8F6FF] border-[1px] border-[#EBE7FF] placeholder:text-[#0D0C5480] p-[8px_8px] h-[45px] w-[100%] block text-[16px] outline-0 focus:border-[#d8d8e2] focus:ring-0 outline-[transparent_!important] text-[#191A59]" data-moz-autofill-type="email" id="email" name="email" placeholder="Work Email*" type="email"/></div></div><div class="md:flex mt-3 md:mt-10 justify-items-stretch relative"><div class="md:w-1/2 lg:px-[10px] px-0"><label class="text-[16px] font-[400] mb-[6px] text-[#00102B] lg:block hidden" for="phoneNumber">Phone Number*</label><div class="react-tel-input phoneNumberNobor p-[0px_!important] phonenumber react-tel-input bg-[#F8F6FF] border-[1px] border-[#EBE7FF] h-[45px] w-[100%] block text-[16px] outline-0 focus:border-[#d8d8e2] focus:ring-0 outline-[transparent_!important] text-[#191A59]"><div class="special-label">Phone</div><input aria-label="Phone Number*" class="form-control" data-moz-autofill-type="tel" id="phoneNumber" name="phoneNumber" placeholder="1 (702) 123-4567" type="tel" value=""/><div class="flag-dropdown"><div aria-haspopup="listbox" class="selected-flag" role="button" tabindex="0" title=""><div class="flag 0"><div class="arrow"></div></div></div></div></div></div><div class="md:w-1/2 lg:px-[10px] px-0 mt-4 md:mt-0 relative"><label class="text-[16px] font-[400] mb-[6px] text-[#00102B] lg:block hidden" for="organization">Organization Name*</label><input class="bg-[#F8F6FF] border-[1px] border-[#EBE7FF] placeholder:text-[#0D0C5480] p-[8px_8px] h-[45px] w-[100%] block text-[16px] outline-0 focus:border-[#d8d8e2] focus:ring-0 outline-[transparent_!important] text-[#191A59]" data-moz-autofill-type="organization" id="organization" name="organization" placeholder="Organization Name*" type="text"/></div></div><div class="md:mt-10 mt-3 relative lg:px-[10px] px-0"><label class="text-[16px] font-[400] mb-[6px] text-[#00102B] lg:block hidden" for="description">Small brief about Project*</label><textarea class="bg-[#F8F6FF] border-[#EBE7FF] placeholder:text-[#0D0C5480] text-[16px] w-[100%] block focus:ring-0 focus:border-[rgba(146,146,146,0.5)] focus-visible:outline-0 text-[#000]" id="description" name="description" placeholder="Please describe your project requirements*" rows="4"></textarea></div><p class="text-right text-xs text-gray-500 mt-1">0/1000 characters</p><div class="lg:mt-10 mt-3"><div class="mt-2 md:mb-12 mb-[20px] lg:px-[10px] px-0"><span class="mb-2 text-[#000000] 3xl:font-[500] font-[400] 3xl:text-[30px] text-[16px]">0 + 0 =</span><input aria-label="Captcha verification answer" class="p-2 ml-2 w-[80px] focus:outline-0 focus:ring-0 text-center bg-[#F8F6FF] text-[#000000] font-[600] text-[18px] border border-[#EBE7FF] rounded-[40px] false focus:border-[#fff]" type="text" value=""/></div><div class="md:block lg:px-[10px] px-0"><button class="btnleftright relative overflow-hidden bg-[#0050D5] text-[#ffffff] border border-[#fff] group relative rounded text-center lg:px-12 lg:py-3 px-10 py-2 shadow-[10px_20px_40px_0px_#00000033] w-full" id="Submit" type="submit"><span class="relative z-[5] transition duration-300 ease-in-out">Talk to our experts</span></button></div></div>
</form>
