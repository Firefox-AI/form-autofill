<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p class="comment-notes"><span id="email-notes">Your email address will not be published.</span> <span class="required-field-message">Required fields are marked <span class="required">*</span></span></p><div class="comment_info">Do not hesitate to contact us directly by submitting your request via the contact form below. We willll get back to you within 48 hours.</div><p class="comment-form-author form-group"><label>First name</label><sup>*</sup><input aria-required="true" class="form-control" data-moz-autofill-type="given-name" id="author" name="author" placeholder="Enter your first name" required=""/></p> <p class="comment-form-email form-group"><label>Email</label><sup>*</sup><input class="form-control" data-moz-autofill-type="email" id="email" name="email" placeholder="Enter your email" required=""/></p> <p class="comment-form-url form-group"><label>Website</label><input class="form-control" id="url" name="url" placeholder="Enter your website"/></p> <p class="comment-form-comment form-group"><label>Comment</label><sup>*</sup><textarea aria-required="true" class="form-control" id="comment" name="comment" placeholder="Enter your comment" required=""></textarea></p> <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/> <label for="wp-comment-cookies-consent">Save my name, email, and website in this browser for the next time I comment.</label></p> <p class="form-submit"><input class="submit" id="comment-submit" name="submit" type="submit" value="Add a comment"/> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="152"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </p>
</form>

</fieldset></body></html>
