<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="grid grid-cols-2 gap-2.5"><div class="relative"><label class="text-sm font-semibold text-gray-700 mb-1 block" for="name">Full Name <span class="text-red-500">*</span></label><div class="relative rounded-xl border-2 transition-all duration-200 border-gray-200 hover:border-gray-300"><input class="w-full pl-11 pr-4 py-3 rounded-xl bg-transparent outline-none text-gray-900 placeholder:text-gray-400 placeholder:text-xs" data-moz-autofill-type="name" id="name" name="name" placeholder="Enter your name" required="" type="text" value=""/></div></div><div class="relative"><label class="text-sm font-semibold text-gray-700 mb-1 block" for="email">Email <span class="text-red-500">*</span></label><div class="relative rounded-xl border-2 transition-all duration-200 border-gray-200 hover:border-gray-300"><input class="w-full pl-11 pr-4 py-3 rounded-xl bg-transparent outline-none text-gray-900 placeholder:text-gray-400 placeholder:text-xs" data-moz-autofill-type="email" id="email" name="email" placeholder="your@email.com" required="" type="email" value=""/></div></div></div><div class="grid grid-cols-2 gap-2.5"><div class="relative"><label class="text-sm font-semibold text-gray-700 mb-1 block" for="phone">Phone <span class="text-red-500">*</span></label><div class="relative rounded-xl border-2 transition-all duration-200 border-gray-200 hover:border-gray-300"><span class="absolute left-11 top-1/2 -translate-y-1/2 text-gray-500 font-medium border-r pr-2 text-xs">+91</span><input class="w-full pl-[5.5rem] pr-4 py-3 rounded-xl bg-transparent outline-none text-gray-900 placeholder:text-gray-400 placeholder:text-xs" data-moz-autofill-type="tel" id="phone" maxlength="10" name="phone" pattern="[0-9]{10}" placeholder="XXXXX XXXXX" required="" type="tel" value=""/></div></div><div class="relative"><div class="relative"><label class="text-sm font-semibold text-gray-700 mb-1 block" for="service">Service <span class="text-red-500">*</span></label><div class="relative rounded-xl border-2 transition-all duration-200 border-gray-200 hover:border-gray-300"><input autocomplete="off" class="w-full pl-11 py-3 pr-10 rounded-xl bg-transparent outline-none text-gray-900 placeholder:text-gray-400 placeholder:text-xs" id="service" name="service" placeholder="Select service" required="" type="text" value=""/><div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none flex gap-1"></div></div></div></div></div><div class="relative"><label class="text-sm font-semibold text-gray-700 mb-1 block" for="message">Message</label><div class="relative rounded-xl border-2 border-gray-200"><textarea class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-transparent outline-none text-gray-900 placeholder:text-gray-400 placeholder:text-xs resize-none" id="message" name="message" placeholder="Tell us about your requirements..." rows="3"></textarea></div></div><button class="w-full bg-gradient-to-r from-purple-600 to-indigo-500 hover:from-purple-700 hover:to-indigo-600 text-white py-4 rounded-xl font-semibold shadow-lg transition-all hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2" type="submit">Submit Request</button><div class="flex items-center justify-center gap-2 text-xs text-gray-500"><span>Your information is secure</span></div>
</form>

</fieldset></body></html>
