modal__input-block relative"> <input autocomplete="email" class="green-signup-modal__text-input" data-moz-autofill-type="email" id="newUserEmailAddress" name="emailAddress" placeholder=" " type="text"/> <label class="green-signup-modal__text-input-label" for="newUserEmailAddress">Email address</label> </div> <div class="green-signup-modal__input-block relative"> <input class="green-signup-modal__text-input" id="newUserPasswordInput" name="password" placeholder=" " type="password"/> <label class="green-signup-modal__text-input-label" for="newUserPasswordInput">Password<div class="password-tooltip"> <i class="fa fa-question-circle tooltip--wide" data-html="true" data-placement="bottom" data-toggle="tooltip" title="Password must be at least 8 characters in length.&lt;/br&gt;Password must include upper &amp; lower case letters.&lt;/br&gt;Password must include at least one number or special character."> </i> </div></label> <div class="green-signup-modal__password-peek"> <input class="js--password-peek" data-target="#newUserPasswordInput" id="newUserPasswordPeek" name="showPassword" type="checkbox"/> <label for="newUserPasswordPeek"></label> </div> </div> <div class="" style="display:none"> <div class="green-signup-modal__email-optin-block"> <input checked="" class="green-modal__email-opt-in" hidden="" id="green-modal__email-opt-in" name="emailOptIn" type="checkbox" value="true"/> <label for="green-modal__email-opt-in">Yes, send me updates and news from Mercato</label> </div> </div> <div class="" style="display:none"> <div class="green-signup-modal__text-optin-block"> <input checked="" class="green-modal__text-opt-in" hidden="" id="green-modal__text-opt-in" name="textOptIn" type="checkbox" value="true"/> <label for="green-modal__text-opt-in">Can we text you about your order?</label> </div> </div> <input name="simp" type="hidden" value="true"/> <input name="mercatoGreenSignup" type="hidden" value="true"/>
