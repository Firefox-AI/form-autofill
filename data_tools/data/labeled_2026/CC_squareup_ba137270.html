<body>

<fieldset>
<h3>squareup.com</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div><div class="grid-2-at-medium gap-bottom-line"><div class="column"><div class="field"><label for="lead-form-2_LastName">姓</label><div class="field-input"><input data-container=".field" data-moz-autofill-type="family-name" id="lead-form-2_LastName" name="LastName" required="" title="このフィールドは必須です" type="text"/></div></div></div><div class="column"><div class="field"><label for="lead-form-2_FirstName">名</label><div class="field-input"><input data-container=".field" data-moz-autofill-type="given-name" id="lead-form-2_FirstName" name="FirstName" required="" title="このフィールドは必須です" type="text"/></div></div></div></div><div class="grid-2-at-medium gap-bottom-line"><div class="column"><fieldset class="field intl-phone-field" data-current-country-code="jp"><legend>電話番号</legend><div class="intl-phone-wrapper"><button aria-expanded="false" class="country-code-trigger" type="button"><span class="selected-flag icon-flag icon-flag-JP"></span><span class="arrow-icon"> </span></button><div class="intl-select-dropdown"><div class="intl-select-scroll"><div class="intl-select-option" data-country-code="US" data-country-number-code="+1" data-country-number-placeholder="000 000 0000"><input id="lead-form-2_US-country-code-prefix" name="country_code_prefix" type="radio" value="+1"/><label for="lead-form-2_US-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-US"></span><span class="intl-option-label">米国</span> <span class="intl-option-country-code">+1</span></label></div><div class="intl-select-option" data-country-code="GB" data-country-number-code="+44" data-country-number-placeholder="0000 000000"><input id="lead-form-2_GB-country-code-prefix" name="country_code_prefix" type="radio" value="+44"/><label for="lead-form-2_GB-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-GB"></span><span class="intl-option-label">イギリス</span> <span class="intl-option-country-code">+44</span></label></div><div class="intl-select-option" data-country-code="AU" data-country-number-code="+61" data-country-number-placeholder="0000-000-000"><input id="lead-form-2_AU-country-code-prefix" name="country_code_prefix" type="radio" value="+61"/><label for="lead-form-2_AU-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-AU"></span><span class="intl-option-label">オーストラリア</span> <span class="intl-option-country-code">+61</span></label></div><div class="intl-select-option" data-country-code="CA" data-country-number-code="+1" data-country-number-placeholder="000 000 0000"><input id="lead-form-2_CA-country-code-prefix" name="country_code_prefix" type="radio" value="+1"/><label for="lead-form-2_CA-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-CA"></span><span class="intl-option-label">カナダ</span> <span class="intl-option-country-code">+1</span></label></div><div class="intl-select-option" data-country-code="JP" data-country-number-code="+81" data-country-number-placeholder="00 0000 0000"><input checked="" id="lead-form-2_JP-country-code-prefix" name="country_code_prefix" type="radio" value="+81"/><label for="lead-form-2_JP-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-JP"></span><span class="intl-option-label">日本</span> <span class="intl-option-country-code">+81</span></label></div><div class="intl-select-option" data-country-code="MX" data-country-number-code="+52" data-country-number-placeholder="00 0000 0000"><input id="lead-form-2_MX-country-code-prefix" name="country_code_prefix" type="radio" value="+52"/><label for="lead-form-2_MX-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-MX"></span><span class="intl-option-label">メキシコ</span> <span class="intl-option-country-code">+52</span></label></div><div class="intl-select-option" data-country-code="IE" data-country-number-code="+353" data-country-number-placeholder="0000000000"><input id="lead-form-2_IE-country-code-prefix" name="country_code_prefix" type="radio" value="+353"/><label for="lead-form-2_IE-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-IE"></span><span class="intl-option-label">アイルランド</span> <span class="intl-option-country-code">+353</span></label></div><div class="intl-select-option" data-country-code="ES" data-country-number-code="+34" data-country-number-placeholder="000000000"><input id="lead-form-2_ES-country-code-prefix" name="country_code_prefix" type="radio" value="+34"/><label for="lead-form-2_ES-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-ES"></span><span class="intl-option-label">スペイン</span> <span class="intl-option-country-code">+34</span></label></div><div class="intl-select-option" data-country-code="FR" data-country-number-code="+33" data-country-number-placeholder="00 00 00 00 00"><input id="lead-form-2_FR-country-code-prefix" name="country_code_prefix" type="radio" value="+33"/><label for="lead-form-2_FR-country-code-prefix" tabindex="-1"><span class="icon-flag icon-flag-FR"></span><span class="intl-option-label">フランス</span> <span class="intl-option-country-code">+33</span></label></div></div></div><div class="field-input line-number-input"><input data-container=".field" data-strip-non-digits="true" data-whitelist="[\d \-()+]" pattern="^[\d]{10,11}$" placeholder="(000) 000-0000" required="" title="有効な電話番号を入力してください" type="tel"/></div><input class="full-number-with-country-code-input" id="lead-form-2_Phone" name="Phone" type="hidden"/></div></fieldset></div><div class="column"><div class="field"><label for="lead-form-2_Company">事業名を教えてください</label><div class="field-input"><input data-container=".field" id="lead-form-2_Company" name="Company" required="" title="このフィールドは必須です" type="text"/></div></div></div></div><div class="grid-2-at-medium gap-bottom-line"><div class="column"><div class="field"><label for="lead-form-2_Industry">業種を教えてください。</label><div class="field-input"><select data-container=".field" id="lead-form-2_Industry" name="Industry" required="" title="このフィールドは必須です"><option disabled="" selected="" value="">選択する...</option><option value="Beauty">美容</option><option value="Charities, Education and Membership">非営利団体</option><option value="Charities, Education and Membership">教育</option><option value="Fitness">フィットネス</option><option value="Food and Drink">飲食 </option><option value="Health">ヘルスケア</option><option value="Home and Repair">リフォーム・修理業</option><option value="Leisure and Entertainment">レジャー・エンターテイメント</option><option value="Other">その他</option><option value="Professional Services">サービス </option><option value="Retail">小売</option><option value="Transportation">交通 </option><option value="Wellness">ウェルネス</option></select></div></div></div><div class="column"><div class="field"><label for="lead-form-2_Revenue_Range__c_account">年間売上高</label><div class="field-input"><select data-container=".field" id="lead-form-2_Revenue_Range__c_account" name="Revenue_Range__c_account" required="" title="このフィールドは必須です"><option disabled="" selected="" value="">選択する</option><option value="0 - ¥10M">1円以上〜1,000万円未満</option><option value="¥10M - ¥25M">1,000万円以上〜2,500万円未満</option><option value="¥25M - ¥50M">2,500万円以上〜5,000万円未満</option><option value="¥50M - ¥100M">5,000万円以上〜1億円未満</option><option value="¥100M - ¥1B">1億円以上〜10億円未満</option><option value="¥1B - ¥5B">10億円以上〜50億円未満</option><option value="¥5B - ¥10B">50億円以上〜100億円未満</option><option value="&gt; ¥10B">100億円以上</option></select></div></div></div></div><div class="grid-1-at-medium gap-bottom-line"><div class="column"><fieldset class="field" data-container=".field" data-required="true" title="いずれかのオプションを選択してください。"><div class="grid-space-none"><div class="col"><legend></legend></div><div class="col"><input id="lead-form-2_Email_Opt_Out__c_False" name="Email_Opt_Out__c" type="checkbox" value="False"/><label for="lead-form-2_Email_Opt_Out__c_False">貴社にとって関連度の高い製品・サービスについてのお役立ち情報（メール、電話、SMS）を受信することに同意された上で、情報をご提供いただくものとします。なお、受信停止はいつでも可能です。*</label></div></div></fieldset></div></div><input id="lead-form-2_Email" name="Email" type="hidden" value="{{lead.email address}}"/><input id="lead-form-2_formDetail" name="formDetail" type="hidden" value="Passive"/><input id="lead-form-2_Sync_to_Marketo__c" name="Sync_to_Marketo__c" type="hidden" value="true"/><input id="lead-form-2_squareBU" name="squareBU" type="hidden" value="Square"/><input id="lead-form-2_cookieAffiliate" name="cookieAffiliate" type="hidden" value=""/><input id="lead-form-2_cookieCode" name="cookieCode" type="hidden" value=""/><input id="lead-form-2_cookieEntireURL" name="cookieEntireURL" type="hidden" value=""/><input name="_mkt_trk" type="hidden"/><input name="followUpList" type="hidden" value='[{"default":true,"followupType":"url","followupValue":"https://squareup.com/jp/ja/l/lead-gen-thankyou-page"}]'/><div class="column gap-bottom-line"><button class="lead-form-submit-button" type="submit">送信</button></div></div><div class="gap-bottom-line legal-text-field font-size-small"><p>*さらに詳しくは、Squareの<a href="https://squareup.com/jp/ja/legal/general/privacy" target="_blank">個人情報保護方針</a>をご覧ください。</p></div>
</form>
