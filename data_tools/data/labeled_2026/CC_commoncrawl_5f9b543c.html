<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="input-oneline" id="holdername" name="holdername" type="hidden" value=""/> <div class="label-credit-no"><label class="form-title form-title--required" for="cardno">カード番号</label><img class="credit-logo" loading="lazy" src="/images/credit-logos.png"/> </div> <p> </p> <div class=""> <input class="input-oneline data-before-input" data-moz-autofill-type="cc-number" id="cardno" ime-mode:disabled="" maxlength="16" name="cardno" pattern="\d*" placeholder="カード番号" size="20" type="text"/> </div> <label class="form-title form-title--required" for="expire_year">カード有効期限(MM/YY)</label> <p> <input class="input-small input-small--expiration-date data-before-input fill-space" id="expire_month" ime-mode:disabled="" maxlength="2" name="expire_month" pattern="\d*" placeholder="月" size="3" type="text"/> <span>/</span> <input class="input-small input-small--expiration-date data-before-input fill-space" id="expire_year" ime-mode:disabled="" maxlength="2" name="expire_year" pattern="\d*" placeholder="年" size="3" type="text"/> </p> <label class="form-title form-title--required" for="securitycode">セキュリティコード</label> <p><input class="input-oneline data-before-input" data-moz-autofill-type="cc-csc" id="securitycode" ime-mode:disabled="" maxlength="4" name="securitycode" pattern="\d*" size="5" type="text" value=""/></p> <p><input id="tokennumber" name="tokennumber" type="hidden" value="1"/> </p> <p class="mt-20"> <input class="form-check" id="save_card" type="checkbox"/> <label class="form-check-label" for="save_card"> 支払い情報を上記の情報に更新する </label> </p> <p class="mt-20 mb-20"> <button class="c-button c-button--no-fill btn--white back-tipping-menu" data-action="hideModal" data-target="credit-number-change" id="back_to_gift_btn" type="button"> &lt; ギフト選択へ戻る </button> </p>
</form>

</fieldset></body></html>
