<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="main-help-block"><ul></ul></div> <section> <div class="form-group"> <label class="form-control-label"> Social title </label> <div class="form-control-content"> <div class="custom-control custom-radio custom-control-inline"> <label> <input class="custom-control-input" name="id_gender" type="radio" value="1"/> <span class="custom-control-label">Mr.</span> </label> </div> <div class="custom-control custom-radio custom-control-inline"> <label> <input class="custom-control-input" name="id_gender" type="radio" value="2"/> <span class="custom-control-label">Mrs.</span> </label> </div> </div> </div> <div class="form-group"> <label class="form-control-label required"> First name </label> <div class="form-control-content"> <input class="form-control" data-moz-autofill-type="given-name" name="firstname" placeholder="First name" required="" type="text" value=""/> <span class="form-control-comment"> Only letters and the dot (.) character, followed by a space, are allowed. </span> </div> </div> <div class="form-group"> <label class="form-control-label required"> Last name </label> <div class="form-control-content"> <input class="form-control" data-moz-autofill-type="family-name" name="lastname" placeholder="Last name" required="" type="text" value=""/> <span class="form-control-comment"> Only letters and the dot (.) character, followed by a space, are allowed. </span> </div> </div> <div class="form-group"> <label class="form-control-label required"> Email </label> <div class="form-control-content"> <input class="form-control" data-moz-autofill-type="email" name="email" placeholder="Email" required="" type="email" value=""/> </div> </div> <div class="form-group"> <label class="form-control-label required"> Password </label> <div class="form-control-content"> <div class="input-group"> <input class="form-control js-visible-password" name="password" pattern=".{5,}" placeholder="Password" required="" type="password" value=""/> <div class="input-group-text btn-show-password py-0" data-action="show-password"> <i aria-hidden="true" class="fl-chapps-eye95"></i> </div> </div> </div> </div> <div class="form-group"> <label class="form-control-label"> Birthdate </label> <div class="form-control-content"> <input class="form-control" data-moz-autofill-type="bday" name="birthday" placeholder="Birthdate" type="text" value=""/> <span class="form-control-comment"> (E.g.: 05/31/1970) </span> </div> </div> <div class="form-group"> <div class="form-control-content"> <div class="custom-control custom-checkbox"> <label> <input class="custom-control-input" name="optin" type="checkbox" value="1"/> <span class="custom-control-label">Receive offers from our partners</span> </label> </div> </div> </div> <div class="form-group"> <div class="form-control-content"> <div class="custom-control custom-checkbox"> <label> <input class="custom-control-input" name="newsletter" type="checkbox" value="1"/> <span class="custom-control-label">Sign up for our newsletter<br/><em>You may unsubscribe at any moment. For that purpose, please find our contact info in the legal notice.</em></span> </label> </div> </div> </div> </section> <div class="header-login-footer"> <div class="submit clearfix"> <input name="email_create" type="hidden" value="1"/> <input name="is_new_customer" type="hidden" value="1"/> <input class="hidden" name="back" type="hidden" value="my-account"/> <button class="btn btn-secondary btn-md btn-block submit" name="submitAccount" type="submit"> Register </button> <div class="button-login nav d-block"> <a class="btn btn-primary btn-md btn-block" data-toggle="tab" href="#login-content-displayNav2"> Back to login </a> </div> </div> </div>
</form>

</fieldset></body></html>
