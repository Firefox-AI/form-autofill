<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="goods" type="hidden" value="9784092893290"/> <div class="fieldset block-inquiry--items"> <div class="form-group block-inquiry--subject"> <div class="form-label"><label class="control-label">件名(タイトル)</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control"> <select class="block-inquiry--subject" name="subject_id"><option value="">↓お選びください</option><option value="tokyo">クレヨンハウス東京店へのお問い合わせ</option><option value="osaka">クレヨンハウス大阪店へのお問い合わせ</option><option value="tyumon">ご注文状況のお問い合わせ（絵本・おもちゃ・コスメ・生活雑貨）</option><option value="tyumon2">ご注文状況のお問い合わせ（食品）</option><option value="shohin">商品についてのお問い合わせ</option><option value="10000001">返品・交換・キャンセル等のお問い合わせ</option><option value="matome">おまとめ購入・保育関係のお問い合わせ</option><option value="cooyon">著作権申請等のお問い合わせ（クレヨンハウスの出版物に限ります）</option><option value="BC">定期便「絵本の本棚ブッククラブ」へのお問い合わせ</option><option value="shunsai">定期便「西からの旬菜便」へのお問い合わせ</option><option value="cooii">クーヨン「定期購読」のお問い合わせ</option><option value="address">登録メールアドレスの連絡（会員登録用）</option><option value="shuzai">取材のお申し込み等のお問い合わせ</option><option value="sontoa">その他全般のお問い合わせ</option></select> </div> </div> <div class="form-group block-inquiry--order-id"> <div class="form-label"><label class="control-label">オーダーＩＤ</label></div> <div class="constraint"></div> <div class="form-control"> <input maxlength="30" name="order_id" size="40" type="text" value=""/> </div> </div> <div class="form-group block-inquiry--goods-name"> <div class="form-label"><label class="control-label">商品名</label></div> <div class="constraint"></div> <div class="form-control"> <span>彗星とさいごの竜 </span> </div> </div> <div class="form-group block-inquiry--name"> <div class="form-label"><label class="control-label">お問い合わせ時氏名</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control"> <div> <label class="block-inquiry--name-label">［姓］</label> <input data-moz-autofill-type="family-name" maxlength="20" name="name" size="15" type="text" value=""/> <label class="block-inquiry--name-label">［名］</label> <input data-moz-autofill-type="given-name" maxlength="20" name="name2" size="15" type="text" value=""/> <div class="help-block">（全角で入力してください）</div> </div> </div> </div> <div class="form-group block-inquiry--tel"> <div class="form-label"><label class="control-label">電話番号</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control"> <input data-moz-autofill-type="tel" maxlength="24" name="tel" size="15" type="text" value=""/> </div> </div> <div class="form-group block-inquiry--mail"> <div class="form-label"><label class="control-label">メールアドレス</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control"> <input data-moz-autofill-type="email" id="mail" maxlength="100" name="mail" size="40" type="text" value=""/> </div> </div> <div class="form-group block-inquiry--cmail"> <div class="form-label"><label class="control-label">メールアドレス（確認）</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control" onpaste=" alert('確認のためもう一度入力してください');return false;"> <input id="cmail" maxlength="100" name="cmail" onblur="ecblib.common.strConvert(this, false);" size="40" type="text" value=""/> <div class="help-block">（メールアドレス確認のため再度入力をお願いします)</div> </div> </div> <div class="form-group block-inquiry--inquiry-body"> <div class="form-label"><label class="control-label">内容</label></div> <div class="constraint"><span class="required"></span></div> <div class="form-control"> <textarea cols="40" name="body" rows="6"></textarea> </div> </div> </div> <div class="action-buttons"> <div class="action"> <input class="btn btn-default block-inquiry--forward" name="confirm" type="submit" value="確認画面へ"/> </div> </div>
</form>

</fieldset></body></html>
