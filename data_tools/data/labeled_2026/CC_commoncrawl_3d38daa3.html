<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form ph"> <input accesskey="Y" class="form" data-moz-autofill-type="name" id="f1" maxlength="40" name="name" pattern="[a-zA-Z]{1,10}-?[a-zA-Z]{1,10} [a-zA-Z]'?[a-zA-Z]{1,10}-?[a-zA-Z]{1,10} ?" placeholder="Your name" tabindex="1" title="Required" type="text" value=""/><label class="text" for="f1">Your name *</label><br/> <input accesskey="T" class="form" data-moz-autofill-type="tel" id="f2" maxlength="20" name="telephone" pattern="[+0]{1}[0-9]{1,10}[\-. ]?[0-9]{4,10} ?" placeholder="Telephone number" tabindex="2" title="Required" type="tel" value=""/><label class="text" for="f2">Telephone number *</label><br/> <input accesskey="E" class="form" data-moz-autofill-type="email" id="f3" maxlength="100" name="email" placeholder="Email address" tabindex="3" title="Required" type="email" value=""/><label class="email" for="f3">Email address *</label><br/> </div> <div class="form ph"> <input class="form" id="f4" name="field1" placeholder="Club name" tabindex="4" type="text" value=""/><label class="text" for="f4">Club name</label><br/> </div> <div class="form ph"> <input accesskey="S" class="form" id="f5" maxlength="40" name="subject" pattern="[\-a-zA-Z0-9 ,.?!:;'\/\(\)]{5,40}" placeholder="Subject" tabindex="5" title="Required" type="text" value=""/><label class="text" for="f5">Subject *</label><br/> <label class="textarea" for="f6">Brief Message *</label><textarea accesskey="M" class="form" cols="20" id="f6" maxlength="500" name="message" onclick="taRem(this.value, 500, 6)" oninput="taRem(this.value, 500, 6)" placeholder="Brief Message" rows="5" tabindex="6" title="Required"></textarea><br/> <p class="warning fright" id="tarem6">500 characters maximum</p><br/> </div> <p class="warning" id="privacy">Privacy: All personal data herein are processed in accordance with UK Data Protection Legislation. All feasible security measures are in place.<br/>Further details are available in our Privacy Notice and/or from the District.</p> <p class="warning"><input accesskey="n" name="Submit" tabindex="7" type="submit" value="Send"/></p>
</form>

</fieldset></body></html>
