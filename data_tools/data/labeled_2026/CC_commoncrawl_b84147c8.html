<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div><label class="block text-sm font-medium text-gray-700 mb-2" for="name">Name <span class="text-red-500">*</span></label><div class="relative"><input class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 transition-all placeholder:text-gray-500" data-moz-autofill-type="name" id="name" name="name" placeholder="Enter your name" required="" type="text" value=""/></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-5"><div><label class="block text-sm font-medium text-gray-700 mb-2" for="phone">Phone <span class="text-red-500">*</span></label><div class="relative"><input class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 transition-all placeholder:text-gray-500" data-moz-autofill-type="tel" id="phone" name="phone" placeholder="Enter your phone number" required="" type="tel" value=""/></div></div><div><label class="block text-sm font-medium text-gray-700 mb-2" for="email">Email</label><div class="relative"><input class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 transition-all placeholder:text-gray-500" data-moz-autofill-type="email" id="email" name="email" placeholder="Enter your email address" type="email" value=""/></div></div></div><div><label class="block text-sm font-medium text-gray-700 mb-2" for="message">Message</label><div class="relative"><textarea class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 transition-all resize-none placeholder:text-gray-500" id="message" name="message" placeholder="Enter your message" rows="4"></textarea></div></div><button class="w-full md:w-auto px-8 py-3 rounded-lg font-semibold text-white transition-all duration-300 hover:shadow-lg transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" style="background-color:#13639b" type="submit">Send Message</button>
</form>

</fieldset></body></html>
