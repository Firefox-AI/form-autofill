<fieldset class="fieldset-vollstaendiger-name"> <label for="vollstaendiger-name">Vollständiger Name</label> <div class="field required-field"> <input class="input-text" data-moz-autofill-type="name" id="vollstaendiger-name" maxlength="" name="vollstaendiger-name" placeholder="Max Meier" required="" type="text" value=""/> </div> </fieldset> <fieldset class="fieldset-e-mail-adresse"> <label for="e-mail-adresse">E-Mail Adresse</label> <div class="field required-field"> <input class="input-text" data-moz-autofill-type="email" id="e-mail-adresse" maxlength="" name="e-mail-adresse" placeholder="max.meier@remag.work" required="" type="text" value=""/> </div> </fieldset> <fieldset class="fieldset-telefonnummer"> <label for="telefonnummer">Telefonnummer</label> <div class="field required-field"> <input class="input-text" data-moz-autofill-type="tel" id="telefonnummer" maxlength="" name="telefonnummer" placeholder="+41 79 100 20 30" required="" type="text" value=""/> </div> </fieldset> <fieldset class="fieldset-welche-nationalitaet-hast-du"> <label for="welche-nationalitaet-hast-du">Welche Nationalität hast du? </label> <div class="field required-field"> <select autocomplete="off" id="welche-nationalitaet-hast-du" name="welche-nationalitaet-hast-du" required=""> <option value="Schweiz">Schweiz</option> <option value="Belgien">Belgien</option> <option value="Bulgarien">Bulgarien</option> <option value="Dänemark">Dänemark</option> <option value="Deutschland">Deutschland</option> <option value="Estland">Estland</option> <option value="Finnland">Finnland</option> <option value="Frankreich">Frankreich</option> <option value="Griechenland">Griechenland</option> <option value="Großbritannien">Großbritannien</option> <option value="Italien">Italien</option> <option value="Irland">Irland</option> <option value="Island">Island</option> <option value="Kroatien">Kroatien</option> <option value="Lettland">Lettland</option> <option value="Liechtenstein">Liechtenstein</option> <option value f-oder-foto-von-dir-hochladen" multiple="" name="lebenslauf-oder-foto-von-dir-hochladen[]" placeholder="" type="file"/> <small class="description"> Lade Deinen Lebenslauf / Foto oder andere relevante Dateien hoch. Maximale Dateigröße: 100 MB.<br/> Maximale Dateigröße: 32 MB.</small> </div> </fieldset> <fieldset class="fieldset-wann-moechtest-du-angerufen-werden"> <label for="wann-moechtest-du-angerufen-werden">Wann möchtest Du angerufen werden?</label> <div class="field required-field"> <select autocomplete="off" id="wann-moechtest-du-angerufen-werden" name="wann-moechtest-du-angerufen-werden" required=""> <option value="08.00 - 11.00 Uhr">08.00 - 11.00 Uhr</option> <option value="11.00 - 13.00 Uhr">11.00 - 13.00 Uhr</option> <option value="13.00 - 16.00 Uhr">13.00 - 16.00 Uhr</option> <option value="16.00 - 19.00 Uhr">16.00 - 19.00 Uhr</option> <option value="19.00 - 21.00 Uhr">19.00 - 21.00 Uhr</option> </select> <small class="description">Wähle die Zeit wann wir dir anrufen können.</small> </div> </fieldset> <p> <input class="button wp_job_manager_send_application_button" type="submit" value="Bewerbung senden"/> <input name="wp_job_manager_send_application" type="hidden" value="1"/> <input name="job_id" type="hidden" value="19529"/> <input name="form_id" type="hidden" value="0"/> </p>
