<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="input-group mb-2"> <div class="input-group-prepend"> <span class="input-group-text border-white"><i class="fas fa-comment-dots text-purple"></i></span> </div> <div class="form-group"> <label class="visually-hidden" for="mobile_number-1">Mobile Phone Number</label> <input class="form-control border-white form-text form-mobile-number" data-moz-autofill-type="tel" id="mobile_number-1" placeholder="Enter mobile number" required="" type="text"/> <label class="visually-hidden" for="first_name-1">First Name</label> <input class="form-control border-white form-text form-first-name collapse" data-moz-autofill-type="given-name" id="first_name-1" placeholder="First name" required="" type="text"/> <label class="visually-hidden" for="last_name-1">Last Name</label> <input class="form-control border-white form-text form-last-name collapse" data-moz-autofill-type="family-name" id="last_name-1" placeholder="Last name" required="" type="text"/> </div> <div class="input-group-append"> <input class="btn btn-purple" type="submit" value="Sign Up"/> </div> </div> <label aria-label="SMS Optin" class="form-optin form-checkbox fs-xs w-100 mw-300 text-break collapse" for="optin"> <input class="form-checkbox" id="optin" name="optin" required="" type="checkbox"/> I agree to receive recurring text messages from Defenders of Wildlife (70505) with news, action alerts and fundraising requests to protect wildlife. You may text HELP for info or STOP to opt out at any time. Message and data rates may apply. <a href="/terms" target="_blank">Terms and Conditions</a> and <a href="/defenders-wildlife-privacy-policy" target="_blank">Privacy Policy</a>. </label>
</form>
