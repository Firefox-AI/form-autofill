<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row g-3"> <div class="col-md-6"> <label class="form-label">Full Name</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-person"></i></span> <input class="form-control" data-moz-autofill-type="name" name="name" placeholder="Enter your name" required="" type="text"/> </div> </div> <div class="col-md-6"> <label class="form-label">Phone Number</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-telephone"></i></span> <input class="form-control" data-moz-autofill-type="tel" name="phone" placeholder="Enter phone number" required="" type="tel"/> </div> </div> <div class="col-md-6"> <label class="form-label">From (Pickup Location)</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-geo-alt"></i></span> <input class="form-control" name="pickup" placeholder="Pickup location" type="text"/> </div> </div> <div class="col-md-6"> <label class="form-label">To (Destination)</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-flag"></i></span> <input class="form-control" name="destination" placeholder="Destination" type="text"/> </div> </div> <div class="col-md-6"> <label class="form-label">Start Travel Date</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-calendar-event"></i></span> <input class="form-control" name="start_date" type="date"/> </div> </div> <div class="col-md-6"> <label class="form-label">End Travel Date</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-calendar-check"></i></span> <input class="form-control" name="end_date" type="date"/> </div> </div> <div class="col-md-12"> <label class="form-label">Number of Passengers</label> <div class="input-group"> <span class="input-group-text"><i class="bi bi-people"></i></span> <input class="form-control" name="passengers" placeholder="e.g. 12" type="number"/> </div> </div> </div> <div class="mt-4 text-center"> <button class="btn btn-form px-5" name="pop-out-form-submit" type="submit"> <i class="bi bi-send"></i> Submit Enquiry </button> </div>
</form>

</fieldset></body></html>
