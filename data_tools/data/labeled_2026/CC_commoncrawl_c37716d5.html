<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="action" type="hidden" value="submit_property_inquiry"/> <input name="formName" type="hidden" value="propertyInquiryForm"/> <div class="mb-3"> <input class="form-control" data-moz-autofill-type="name" name="fullName" placeholder="Full Name" required="" type="text"/> </div> <div class="mb-3"> <input class="form-control" data-moz-autofill-type="email" name="emailAddress" placeholder="Email Address" required="" type="email"/> </div> <div class="mb-3"> <input class="form-control" data-moz-autofill-type="tel" name="phoneNumber" placeholder="Phone Number (Required)" required="" type="tel"/> </div> <div class="mb-3"> <input class="form-control" name="location" placeholder="Preferred Location (e.g. Marbella, Mijas, Estepona)" required="" type="text"/> </div> <div class="mb-3 flying-press-lazy-bg"> <select class="form-select" name="propertyType" required=""> <option disabled="" selected="" value="">Select Property Type</option> <option value="Villa">Villa</option> <option value="Apartment/Penthouse">Apartment / Penthouse</option> <option value="Townhouse">Townhouse</option> <option value="Plot/Land">Plot / Land</option> <option value="Other">Other</option> </select> </div> <div class="mb-3 flying-press-lazy-bg"> <select class="form-select" name="budgetRange" required=""> <option disabled="" selected="" value="">Select Budget Range (€)</option> <option value="&lt; €500k">Below €500,000</option> <option value="€500k - €1M">€500k – €1M</option> <option value="€1M - €3M">€1M – €3M</option> <option value="€3M - €5M">€3M – €5M</option> <option value="&gt; €5M">Above €5M</option> </select> </div> <div class="mb-3"> <textarea class="form-control" name="requirements" placeholder="Tell us about your requirements" required="" rows="3"></textarea> </div> <input class="referrer-url" name="referrerUrl" type="hidden"/> <button class="btn btn-gold btn-lg w-100 py-3 fw-bold shadow-lg" type="submit"> Send Enquiry </button>
</form>

</fieldset></body></html>
