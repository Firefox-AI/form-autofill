<div class="absolute left-[-2000px]"><input aria-label="If you are human, leave this field blank" name="type" type="hidden" value="Area Header Booking Form"/> <input name="page" type="hidden" value="/level-2-electrician/sydney/vaucluse"/> <input autocomplete="off" class="hidden" name="anteater" type="text" value=""/></div> <fieldset> <div class="space-y-6"><div class="grid sm:grid-cols-2 gap-4"><div class="group"><label class="block text-sm font-semibold text-gray-800 mb-2" for="name">Full Name *</label> <div class="relative"><input class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-action-500 focus:bg-white focus:outline-none transition-all duration-200 text-gray-900 placeholder-gray-500" data-moz-autofill-type="name" data-testid="name-for-area-form" id="name" name="name" placeholder="John Doe" type="text" value=""/> </div> </div> <div class="group"><label class="block text-sm font-semibold text-gray-700 mb-2" for="phone">Phone Number *</label> <div class="relative"><input class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-action-500 focus:bg-white focus:outline-none transition-all duration-200 text-gray-900 placeholder-gray-400" data-moz-autofill-type="tel" data-testid="phone-for-area-form" id="phone" name="phone" placeholder="04XX XXX XXX" type="tel" value=""/> </div> </div></div> <div class="grid sm:grid-cols-2 gap-4"><div class="group"><label class="block text-sm font-semibold text-gray-700 mb-2" for="email">Email Address *</label> <div class="relative"><input class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-action-500 focus:bg-white focus:outline-none transition-all duration-200 text-gray-900 placeholder-gray-400" data-moz-autofill-type="email" data-testid="email-for-area-form" id="email" name="email" placeholder="john@example.com" type="email" value=""/> </div> </div> <div class="group"><label class="block text-sm font-semibold text-gray-700 mb-2" for="suburb">Suburb</label> <input class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-action-500 focus:bg-white focus:outline-none transition-all duration-200 text-gray-900 placeholder-gray-400" data-moz-autofill-type="address-level2" data-testid="suburb-for-area-form" id="suburb" name="suburb" placeholder="Your suburb" type="text" value=""/> </div></div> <div class="group"><label class="block text-sm font-semibold text-gray-700 mb-2" for="message">How can we help you?</label> <textarea class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-action-500 focus:bg-white focus:outline-none transition-all duration-200 text-gray-900 placeholder-gray-400 resize-none" data-testid="message-for-area-form" id="message" name="message" placeholder="Please describe your electrical needs or any questions you have..." rows="3"></textarea> </div> <div class="group"><label class="block text-sm font-semibold text-gray-700 mb-2" for="file">Attach Photo (Optional)</label> <div class="relative"><input accept="image/*, .pdf, .doc, .docx, .xls, .xlsx, .ppt, .pptx" class="hidden" data-testid="upload-for-area-form" id="file" name="file" type="file"/> <label class="flex items-center justify-center gap-1 w-full px-4 py-3 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-100 transition-all duration-200" for="file"> <span class="text-sm text-gray-600">Click to upload</span></label></div> </div> <div class="flex gap-6"><button class="md:w-32 inline-flex justify-center items-center px-4 bg-primary-dark text-white font-semibold rounded-xl hover:from-action-600 hover:to-action-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg hover:shadow-xl cursor-pointer" data-testid="submit-contact-form" type="submit">Submit</button> <a aria-label="Call 0485 900 302" class="m-1 w-40 flex justify-center items-center text-center no-underline button-action rounded-lg w-44 !border-2 !border-primary-dark" href="tel:0485 900 302" title="Call Pro Electrical">0485 900 302 </a></div></div></fieldset>
</form>
