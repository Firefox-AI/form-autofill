<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-row mb-3"> <div class="form-group col-md-6"> <input class="form-control" data-moz-autofill-type="given-name" id="first_name" name="first_name" placeholder="First Name*" type="text"/> <label class="error" for="first_name" generated="true" id="first_name-error"></label> </div> <div class="form-group col-md-6"> <input class="form-control" data-moz-autofill-type="family-name" id="last_name" name="last_name" placeholder="Last Name*" type="text"/> <label class="error" for="last_name" generated="true" id="last_name-error"></label> </div> </div> <div class="form-row mb-3"> <div class="form-group col-md-6"> <input class="form-control" data-moz-autofill-type="email" id="email" name="email" placeholder="Email Address*" type="text"/> <label class="error" for="email" generated="true" id="email-error"></label> </div> <div class="form-group col-md-6"> <input class="form-control" data-moz-autofill-type="tel" id="phone" name="phone" placeholder="Phone Number*" type="text"/> <label class="error" for="phone" generated="true" id="phone-error"></label> </div> </div> <div class="form-row mb-3"> <div class="form-group col-md-12"> <input class="form-control" data-moz-autofill-type="organization" id="company" name="company" placeholder="Company Name*" type="text"/> <label class="error" for="company" generated="true" id="#company-error"></label> </div> </div> <div class="form-row mb-3"> <div class="form-group col-md-12"> <textarea class="form-control" id="comment" name="comment" placeholder="Message" style="resize:none"></textarea> </div> </div> <div class="text-center"> <button class="btn btn-primary btn_submit" id="btn_submit" type="submit">Submit</button> </div>
</form>

</fieldset></body></html>
