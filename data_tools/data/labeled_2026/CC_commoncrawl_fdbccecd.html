<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="rhBlackFormContent"> <div class="rhBlackFrm__group"> <div class="rhBlackFrm__field-group"> <input autocomplete="off" class="rhBlackFrm__field keyval" data-json="C_FirstName" data-moz-autofill-type="name" data-validation="name" id="field_full_name" name="field_full_name" onkeypress="return event.charCode &gt;= 97 &amp;&amp; event.charCode &lt;= 122 || event.charCode &gt;= 65 &amp;&amp; event.charCode &lt;= 90 || event.charCode == 32" placeholder="Full Name" type="text" value=""/> <span class="error">Enter full name</span> <label class="rhBlackFrm__label" for="field_full_name">Full Name</label> </div> </div> <div class="rhBlackFrm__group"> <div class="rhBlackFrm__field-group"> <input autocomplete="off" class="rhBlackFrm__field keyval" data-json="C_Mobile" data-moz-autofill-type="tel" data-validation="mobileNumber" id="field_login_add_phone_number" maxlength="10" minlength="10" name="field_login_add_phone_number" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" pattern="[0-9]+" placeholder=" Mobile Number" type="tel" value=""/> <span class="error">Enter mobile number</span> <label class="rhBlackFrm__label" for="field_login_add_phone_number">Mobile Number</label> <span class="country_code rhBlackCountry"> <img alt="icon" class="rhcountry-icon" src="/content/dam/asianpaintsbeautifulhomes/bh-new-home-page-revamp/luxe-section/india%201.svg"/> +91 </span> </div> </div> <div class="rhBlackFrm__group"> <div class="rhBlackFrm__field-group"> <input autocomplete="off" class="rhBlackFrm__field keyval" data-json="C_Email" data-validation="email" id="field_email" name="field_full_email" placeholder="Email ID" type="text" value=""/> <span class="error">Enter email address</span> <label class="rhBlackFrm__label" for="field_full_name">Email</label> </div> </div> <div class="rhBlackFrm__group"> <div class="rhBlackFrm__field-group"> <input autocomplete="off" class="rhBlackFrm__field keyval" data-json="C_Pincode" data-validation="pincode" id="form-field__pincode" maxlength="6" minlength="6" name="field_full_pincode" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" pattern="[0-9]+" placeholder="Pincode*" required="" type="number" value=""/> <span class="error">Enter pincode</span> <label class="rhBlackFrm__label" for="field_full_pincode">Pincode*</label> </div> </div> </div>
</form>

</fieldset></body></html>
