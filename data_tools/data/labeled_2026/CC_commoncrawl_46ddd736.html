<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="SourceUrl" type="hidden" value="https://www.besselmanwp.com/resource-center/estate/yours-mine-and-ours-estate-strategies-for-second-marriages"/> <input name="PreferredContactMethod" type="hidden" value="Email"/> <input name="MessageSubject" type="hidden" value="Have A Question About This Topic?"/> <div class="o-form-grid__collapse"> <div class="contactName"> <label for="CFBNameText" id="CFBName">Name</label> <span aria-labelledby="CFBName" class="field-validation-valid" data-valmsg-for="Name" data-valmsg-replace="true"></span> <input aria-labelledby="CFBName" class="text-box" data-moz-autofill-type="name" data-val="true" data-val-required="*required" id="CFBNameText" name="Name" type="text" value=""/> </div> <div class="contactEmail"> <label for="CFBEmailText" id="CFBEmail">Email</label> <span aria-labelledby="CFBEmail" class="field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span> <input aria-labelledby="CFBEmail" class="text-box" data-moz-autofill-type="email" data-val="true" data-val-regex="*invalid" data-val-regex-pattern="^[\w\.=-]+@[\w\.-]+\.[\w]{2,10}$" data-val-required="*required" id="CFBEmailText" name="Email" type="text" value=""/> <span class="formRobo"><label for="CFBAddressText" id="CFBAddress">Address</label><input aria-labelledby="CFBAddress" data-moz-autofill-type="street-address" id="CFBAddressText" name="Address" type="text" value=""/></span> </div> <div class="contactMessage"> <label for="CFBMessageText" id="CFBMessage">Message</label> <span aria-labelledby="CFBMessage" class="field-validation-valid" data-valmsg-for="Message" data-valmsg-replace="true"></span> <textarea aria-labelledby="CFBMessage" cols="20" id="CFBMessageText" name="Message" rows="2"> </textarea> </div> </div> <input aria-label="Submit form" class="c-btn submit" type="submit" value="Submit"/> <span class="loading"></span> <span class="msg formSuccess">Thank you!</span> <span class="msg formError">Oops!</span>
</form>

</fieldset></body></html>
