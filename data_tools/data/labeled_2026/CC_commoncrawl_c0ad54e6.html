<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="modal-body text-left mb-2"> <div id="set-destination-address-fields"> <div class="form-group basic"> <div class="input-wrapper"> <label class="label" for="set_delivery_destination_unit_block_house_no">Unit / Block / House No. <span class="label-optional">(Optional)</span></label> <input class="form-control" data-moz-autofill-type="address-housenumber" id="set_delivery_destination_unit_block_house_no" type="text"/> </div> </div> <div class="form-group basic"> <div class="input-wrapper"> <label class="label" for="set_delivery_destination_address">Delivery Address</label> <input class="form-control" id="set_delivery_destination_address" required="" type="text"/> </div> </div> <div class="row"> <div class="col-6"> <div class="form-group basic"> <div class="input-wrapper"> <label class="label" for="set_delivery_destination_postcode">Postcode</label> <input class="form-control" data-moz-autofill-type="postal-code" id="set_delivery_destination_postcode" type="text"/> </div> </div> </div> <div class="col-6"> <div class="form-group basic"> <div class="input-wrapper"> <label class="label" for="set_delivery_destination_city">City</label> <input class="form-control" data-moz-autofill-type="address-level2" id="set_delivery_destination_city" type="text"/> </div> </div> </div> </div> <div class="form-group basic"> <div class=""> <label class="label" for="set_delivery_destination_state_id">State</label> <select class="form-control" data-moz-autofill-type="address-level1" id="set_delivery_destination_state_id" name="set_delivery_destination_state_id" style="width: 100%;"> <option value="1">Johor</option> <option value="2">Kedah</option> <option value="3">Kelantan</option> <option value="4">Kuala Lumpur</option> <option value="5">Labuan</option> <option value="6">Melaka</option> <option value="7">Negeri Sembilan</option> <option value="8">Pahang</option> <option value="9">Penang</option> <option value="10">Perak</option> <option value="11">Perlis</option> <option value="12">Putrajaya</option> <option value="13">Sabah</option> <option value="14">Sarawak</option> <option value="15">Terengganu</option> <option value="16">Selangor</option> <option value="17">[OUTSIDE OF MALAYSIA]</option> </select> </div> </div> </div> <div id="set-delivery-destination-address-spinner" style="width: 100%; text-align: center; display: none;"> <span aria-hidden="true" class="spinner-border spinner-border-sm mr-05" role="status"></span> </div> <div id="delivery_destination_map_wrapper" style="display: none;"> <span style="">Drag the marker to accurately pinpoint your location.</span> <div id="delivery_destination_map" style="width: 100%; height: 200px;"></div> </div> <div style="margin-top: 20px;"> <button class="btn btn-primary" id="btnConfirmDeliveryDestinationAddress" style="width: 100%;" type="button">Confirm Address</button> <button class="btn btn-warning" id="btnReenterDeliveryDestinationAddress" style="width: 100%; margin-bottom: 5px;" type="button">Re-enter Address</button> <button class="btn btn-primary" id="btnConfirmDeliveryDestinationCoordinates" style="width: 100%; display: none;" type="button">Confirm Location</button> </div> </div>
</form>

</fieldset></body></html>
