<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input id="so-f-product-title" name="product_title" type="hidden"/> <input id="so-f-product-handle" name="product_handle" type="hidden"/> <input id="so-f-product-id" name="product_id" type="hidden"/> <input id="so-f-variant-id" name="variant_id" type="hidden"/> <input id="so-f-product-image" name="product_image_url" type="hidden"/> <input id="so-f-product-sku" name="product_sku" type="hidden"/> <input id="so-f-product-vendor" name="product_vendor" type="hidden"/> <div class="so-grid"> <div> <label for="so-first-name">First Name <span class="so-req">*</span></label> <input data-moz-autofill-type="given-name" id="so-first-name" name="first_name" required="" type="text"/> </div> <div> <label for="so-last-name">Last Name <span class="so-req">*</span></label> <input data-moz-autofill-type="family-name" id="so-last-name" name="last_name" required="" type="text"/> </div> <div> <label for="so-email">Email <span class="so-req">*</span></label> <input data-moz-autofill-type="email" id="so-email" name="email" required="" type="email"/> </div> <div> <label for="so-phone">Phone <span class="so-req">*</span><span class="so-info">i<span class="so-tip">Required so the shipping carrier can contact you about delivery.</span></span></label> <input data-moz-autofill-type="tel" id="so-phone" name="phone" required="" type="tel"/> </div> </div> <div class="so-section">Shipping Address</div> <div class="so-grid"> <div> <label for="so-address1">Address <span class="so-req">*</span></label> <input data-moz-autofill-type="address-line1" id="so-address1" name="address1" required="" type="text"/> </div> <div> <label for="so-address2">Address Line 2</label> <input data-moz-autofill-type="address-line2" id="so-address2" name="address2" type="text"/> </div> <div> <label for="so-city">City <span class="so-req">*</span></label> <input data-moz-autofill-type="address-level2" id="so-city" name="city" required="" type="text"/> </div> <div> <label for="so-country">Country <span class="so-req">*</span></label> <select data-moz-autofill-type="country" id="so-country" name="country" required=""> <option selected="" value="US">United States</option> <option value="CA">Canada</option> <option value="MX">Mexico</option> </select> </div> <div> <label for="so-state">State / Province <span class="so-req">*</span></label> <select data-moz-autofill-type="address-level1" id="so-state" name="state_province" required=""> <option value="">Select state...</option> </select> </div> <div> <label for="so-postal">Postal Code <span class="so-req">*</span></label> <input data-moz-autofill-type="postal-code" id="so-postal" name="postal_code" required="" type="text"/> </div> </div> <div class="so-check so-full" style="margin-top:12px;"> <input checked="" id="so-billing-same" name="billing_same" onchange="toggleBillingAddress(this)" type="checkbox"/> <label for="so-billing-same">Billing address same as shipping</label> </div> <div id="so-billing-fields" style="display:none;"> <div class="so-section">Billing Address</div> <div class="so-grid"> <div> <label for="so-b-address1">Address <span class="so-req">*</span></label> <input data-moz-autofill-type="address-line1" id="so-b-address1" name="b_address1" type="text"/> </div> <div> <label for="so-b-address2">Address Line 2</label> <input data-moz-autofill-type="address-line2" id="so-b-address2" name="b_address2" type="text"/> </div> <div> <label for="so-b-city">City <span class="so-req">*</span></label> <input data-moz-autofill-type="address-level2" id="so-b-city" name="b_city" type="text"/> </div> <div> <label for="so-b-country">Country <span class="so-req">*</span></label> <select data-moz-autofill-type="country" id="so-b-country" name="b_country"> <option selected="" value="US">United States</option> <option value="CA">Canada</option> <option value="MX">Mexico</option> </select> </div> <div> <label for="so-b-state">State / Province <span class="so-req">*</span></label> <select data-moz-autofill-type="address-level1" id="so-b-state" name="b_state"> <option value="">Select state...</option> </select> </div> <div> <label for="so-b-postal">Postal Code <span class="so-req">*</span></label> <input data-moz-autofill-type="postal-code" id="so-b-postal" name="b_postal" type="text"/> </div> </div> </div> <div class="so-section">Project Details</div> <div class="so-grid"> <div class="so-full"> <label for="so-project">Project Description <span class="so-req">*</span></label> <textarea id="so-project" name="project_description" placeholder="Brief description of your project..." required=""></textarea> </div> <div> <label for="so-sqft">Sqft Needed <span class="so-req">*</span><span class="so-info">i<span class="so-tip">How much tile do you need for your project? We'll verify stock availability before sending your sample.</span></span></label> <input id="so-sqft" name="sqft_needed" placeholder="e.g. 150" required="" type="text"/> </div> <div> <label for="so-timeline">Timeline <span class="so-req">*</span></label> <select id="so-timeline" name="timeline" required=""> <option value="">Select timeline...</option> <option value="ASAP / Urgent">ASAP / Urgent</option> <option value="Within 1 week">Within 1 week</option> <option value="Within 2 weeks">Within 2 weeks</option> <option value="Within 1 month">Within 1 month</option> <option value="No rush / Flexible">No rush / Flexible</option> </select> </div> </div> <div class="so-check so-full" style="margin-top:8px;"> <input id="so-subscribe" name="subscribe_updates" type="checkbox"/> <label for="so-subscribe">Send me product updates</label> </div> <div class="so-error" id="so-error"></div> <button class="so-submit" id="so-submit-btn" type="submit">Submit Sample Request</button>
</form>

</fieldset></body></html>
