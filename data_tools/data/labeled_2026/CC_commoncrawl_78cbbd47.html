<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row"> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchNameCon">Name <span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" data-moz-autofill-type="name" id="vchNameCon" maxlength="100" name="vchNameCon" onkeyup="return textBoxValidation('vchNameCon', 100, 'Name');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchNameCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchEmailCon">Email Address <span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" data-moz-autofill-type="email" id="vchEmailCon" maxlength="100" name="vchEmailCon" onkeyup="return emailValidation1('vchEmailCon', 100, 'Email');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchEmailCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchMobileCon"> Mobile Number<span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" data-moz-autofill-type="tel-local" id="vchMobileCon" maxlength="10" name="vchMobileCon" onkeypress="return isNumberKey(event);" onkeyup="return mobileValidation('vchMobileCon', 10, 'Name');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchMobileCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchLandlineCon">Landline<span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" data-moz-autofill-type="tel-local" id="vchLandlineCon" maxlength="15" name="vchLandlineCon" onkeypress="return isNumberKey(event);" onkeyup="return textBoxValidation('vchLandlineCon', 15, 'Landline');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchLandlineCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchCurrentLocationCon">Current Location <span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" id="vchCurrentLocationCon" maxlength="100" name="vchCurrentLocationCon" onkeyup="return textBoxValidation('vchCurrentLocationCon', 200, 'Name');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchCurrentLocationCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="intHighestEQCon">Highest Educational Qualification<span class="text-danger">*</span></label> <select class="chatFieldData" id="intHighestEQCon" name="intHighestEQCon" onchange="return onlyBlankValidation('intHighestEQCon', 'Educational Qualification');"> <option value="">--Select--</option> <option value="1">Bachelors</option> <option value="2">Diploma</option> <option value="3">Doctorate</option> <option value="4">High School</option> <option value="5">Masters</option> <option value="6">Pre-Degree</option> <option value="7">Professional</option> </select> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-intHighestEQCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="intSectorsofExpertiseCon">Sectors of Expertise<span class="text-danger">*</span></label> <select class="chatFieldData" id="intSectorsofExpertiseCon" name="intSectorsofExpertiseCon" onchange="return onlyBlankValidation('intSectorsofExpertiseCon', 'Sectors of Expertise');"> <option value="">--Select--</option> <option value="1">Agricultural Development</option> <option value="2">Education &amp; Skills Development</option> <option value="3">Environment &amp; Climate Change</option> <option value="4">Health &amp; Nutrition</option> <option value="5">Infrastructure development &amp; Smart Cities</option> <option value="6">Tourism, Heritage &amp; Conservation</option> <option value="7">Economic &amp; Public Financial Management</option> <option value="8">IT &amp; e-governance</option> <option value="9">Social &amp; Inclusive Development</option> <option value="10">Others</option> </select> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-intSectorsofExpertiseCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="intCurrentStatusCon">Current Status<span class="text-danger">*</span></label> <select class="chatFieldData" id="intCurrentStatusCon" name="intCurrentStatusCon" onchange="return onlyBlankValidation('intCurrentStatusCon', 'Current Status');"> <option value="">--Select--</option> <option value="1">Contractual Employee</option> <option value="2">Part Time Employee</option> <option value="3">Freelancer</option> </select> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-intCurrentStatusCon"></small> </div> </div> <div class="col-12 col-sm-4"> <div class="custom-form"> <label for="vchResumeCon">Upload your Resume<span class="text-danger">*</span></label> <input class="form-control" id="vchResumeCon" name="vchResumeCon" onchange="return checkfiletype('vchResumeCon', 'pdf,doc,docx');" placeholder="" type="file"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <span id="sm-vchResumeCon" style="color: #e74c3c;font-size: 80%;font-weight: 400;"></span> <span style="color: #e90e0e;font-size: 12px;">(must be pdf/doc/docx)</span> </div> </div> <div class="col-12 col-sm-4" id="dvOtherSector" style="display: none;"> <div class="custom-form"> <label for="vchOtherSectorsofExpertiseCon">Sectors of Expertise Name <span class="text-danger">*</span></label> <input autocomplete="off" class="chatFieldData" id="vchOtherSectorsofExpertiseCon" maxlength="100" name="vchOtherSectorsofExpertiseCon" onkeyup="return textBoxValidation('vchOtherSectorsofExpertiseCon', 100, 'Sectors of Expertise Name');" type="text"/> <span class="icon icon-check1"></span> <span class="icon icon-alert-circle2"></span> <small id="sm-vchOtherSectorsofExpertiseCon"></small> </div> </div> <div class="col-12"> <button class="c-button c-button--blueBG" id="btnConsult" onclick="return validateConsultant();" type="button"> <span class="c-button__background"></span> <span class="c-button__hover"></span> <span class="c-button__txt">Submit</span> </button> </div> </div>
</form>

</fieldset></body></html>
