<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div style="display:none;"> <input aria-hidden="true" name="username" type="text" value=""/> <input aria-hidden="true" name="sludge_tank" type="text" value=""/> </div> <div class="contact__fields"> <div class="contact__field"> <input autocomplete="off" class="contact__input f-body" data-moz-autofill-type="name" name="name" placeholder="Full name" required="required" type="text"/> </div> <div class="contact__field" data-behavior="checkEmail"> <input autocomplete="off" class="contact__input f-body" data-email="" data-moz-autofill-type="email" name="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" placeholder="Email" required="required" type="email"/> </div> <div class="contact__field"> <input autocomplete="off" class="contact__input f-body" data-moz-autofill-type="organization" name="company" placeholder="Company" required="required" type="text"/> </div> <div class="contact__field"> <input autocomplete="off" class="contact__input f-body" data-moz-autofill-type="organization-title" name="title" placeholder="Title" required="required" type="text"/> </div> <div class="contact__field contact__field--full"> <label class="contact__label f-body" for="shedule_0">When are you looking to get started?</label> <div class="contact__radios"> <div class="contact__radio"><input id="shedule_0" name="schedule" type="radio" value="now"/> <label class="f-body" for="shedule_0">Immediately</label></div> <div class="contact__radio"><input id="shedule_1" name="schedule" type="radio" value="3-6months"/> <label class="f-body" for="shedule_1">Within 3-6 months</label></div> <div class="contact__radio"><input id="shedule_2" name="schedule" type="radio" value="6-months"/> <label class="f-body" for="shedule_2">After 6+ months</label></div> <div class="contact__radio"><input id="shedule_3" name="schedule" type="radio" value="no-schedule"/> <label class="f-body" for="shedule_3">Start date not set</label></div> <div class="contact__radio"><input id="shedule_4" name="schedule" type="radio" value="curious"/> <label class="f-body" for="shedule_4">No plans, just curious</label></div> </div> </div> <div class="contact__field contact__field--full"> <label class="contact__label f-body" for="description">Tell us a bit about your plans and needs</label> <textarea class="contact__textarea f-body" id="description" name="description"></textarea> </div> <div class="contact__field"> <button class="contact__submit f-body" data-default="Submit" data-loading="Sending..." name="submit" type="submit">Send</button> <div class="contact__validator" data-contact-validator=""></div> </div> </div>
</form>

</fieldset></body></html>
