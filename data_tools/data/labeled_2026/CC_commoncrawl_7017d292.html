<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="yui3-g"> <div class="yui3-u-7-24"> <div class="name-search-field-wrapper"> <label for="firstName"><span class="caret"></span>First Name </label> <input class="form-control input-lg" data-bvalidator="required,minlength[2],alpha" data-bvalidator-msg="Please enter a first name. A minimum of 2 letters is required." data-moz-autofill-type="given-name" id="firstName" name="firstName" type="text"/> </div> </div> <div class="yui3-u-7-24"> <div class="name-search-field-wrapper"> <label for="lastName"><span class="caret"></span>Last Name </label> <input class="form-control input-lg" data-bvalidator="required,minlength[1]" data-bvalidator-msg="Please enter a last name." data-moz-autofill-type="family-name" id="lastName" name="lastName" type="text"/> </div> </div> <div class="yui3-u-7-24"> <div class="name-search-field-wrapper"> <label for="birthday"><span class="caret"></span>Date of Birth (optional) </label> <input class="form-control input-lg datepicker" data-bvalidator="date[mm/dd/yyyy]" data-moz-autofill-type="bday" id="birthday" name="birthday" type="text"/> </div> </div> <div class="yui3-u-1-12"> <button aria-label="Submit" class="btn btn-default btn-lg" id="case-search-button" type="submit"><span class="glyphicon glyphicon-search"></span></button> </div> </div>
</form>

</fieldset></body></html>
