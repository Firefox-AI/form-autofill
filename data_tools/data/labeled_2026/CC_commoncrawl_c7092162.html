<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="nr" type="hidden" value="posts_bottom"/> <input name="nlang" type="hidden" value=""/> <div class="tnp-field tnp-field-firstname"><label for="tnp-1">First name or full name</label> <input class="tnp-name" data-moz-autofill-type="given-name" id="tnp-1" name="nn" placeholder="" type="text" value=""/></div> <div class="tnp-field tnp-field-surname"><label for="tnp-2">Last name</label> <input class="tnp-surname" data-moz-autofill-type="family-name" id="tnp-2" name="ns" placeholder="" type="text" value=""/></div><div class="tnp-field tnp-field-email"><label for="tnp-3">Email</label> <input class="tnp-email" data-moz-autofill-type="email" id="tnp-3" name="ne" placeholder="" required="" type="email" value=""/></div> <div class="tnp-field tnp-field-profile"><label for="tnp-4">If referred to subscribe, enter name of referrer</label> <input class="tnp-profile tnp-profile-2" id="tnp-profile_2" name="np2" placeholder="" size="" type="text"/></div> <div class="tnp-field tnp-lists"><div class="tnp-field tnp-field-checkbox tnp-field-list"><label for="nl6"><input id="nl6" name="nl[]" type="checkbox" value="1"/> Articles Only</label></div> <div class="tnp-field tnp-field-checkbox tnp-field-list"><label for="nl7"><input id="nl7" name="nl[]" type="checkbox" value="2"/> Weekly Digest Only</label></div> <div class="tnp-field tnp-field-checkbox tnp-field-list"><label for="nl8"><input checked="" id="nl8" name="nl[]" type="checkbox" value="3"/> All Emails</label></div> </div><div class="tnp-field tnp-privacy-field"><label><input class="tnp-privacy" name="ny" required="" type="checkbox"/> By continuing, you accept the privacy policy</label></div><div class="tnp-field tnp-field-button" style="text-align: left"><input class="tnp-submit" style="" type="submit" value="Subscribe"/> </div>
</form>

</fieldset></body></html>
