<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row" style="margin: 0px;"><div class="col-xs-6"><div class="form-group"><label class="text-ellipsis sr-only">FName</label><input class="form-control" data-mask="" data-moz-autofill-type="given-name" name="FNAME" placeholder="Nombres" required="" type="text"/></div></div><div class="col-xs-6"><div class="form-group"><label class="text-ellipsis sr-only">Last Name</label><input class="form-control" data-mask="" data-moz-autofill-type="family-name" name="LNAME" placeholder="Apellidos" required="" type="text"/></div></div></div><div class="row" style="margin: 0px;"><div class="col-xs-12"><div class="form-group"><label class="text-ellipsis sr-only">Email</label><input class="form-control" data-moz-autofill-type="email" name="input_name" placeholder="Correo Electrónico" required="" type="email"/></div><div class="form-group"><label class="text-ellipsis sr-only">Text</label><input class="form-control" data-mask="" name="EMPRESA_text" placeholder="Empresa" required="" type="text"/></div><div class="form-group"><label class="text-ellipsis sr-only">Text</label><input class="form-control" data-mask="" name="CARGO_PUESTO_text" placeholder="Cargo" required="" type="text"/></div></div></div><div class="row" style="margin: 0px;"><div class="col-xs-12"><div class="form-group"><label class="text-ellipsis sr-only">Text</label><input class="form-control" data-mask="" name="SUBJECT" placeholder="Asunto" required="" type="text"/></div></div></div><div class="row" style="margin: 0px;"><div class="col-xs-12"><div class="form-group"><label class="text-ellipsis sr-only">Textarea</label><textarea class="form-control" name="textarea" placeholder="Mensaje" required="" style="resize: none; height: 200px;"></textarea></div></div></div><div class="containerBtn"><button class="text-ellipsis btn-form btn-form-style_0" id="id" style="display: inline-block;" type="submit"><span>ENVIAR</span></button></div>
</form>

</fieldset></body></html>
