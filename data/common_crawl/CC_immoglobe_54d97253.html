ss der Immobilienmakler vor Ablauf der Widerrufsfrist mit der Dienstleistung beginnen darf. * </label> </div> </div> </div> <div class="form-group"> <div class="col-xs-12"> <div class="checkbox"> <input id="check_privacy" name="check_privacy" required="" type="checkbox" value="1"/> <label for="check_privacy"> Ich willige in die Verarbeitung meiner Daten zum Zweck der Bearbeitung meiner Anfrage ein und habe die <a href="https://immoglobe.de/datenschutz/" target="_blank">Datenschutzerklärung</a> gelesen. * </label> </div> </div> </div> <div class="col-xs-12"> <span class="mandatory">* Pflichtangaben</span> </div> <div class="form-group immomakler-contactform-send"> <div class="col-xs-12 col-sm-4"> <input autocomplete="off" class="form-control immomakler-contact-sender-email" name="sender-email" tabindex="-1" type="text" value=""/> <input name="request" type="hidden" value="send"/> <input name="recipient" type="hidden" value=""/> <input name="subject" type="hidden" value=""/> <input name="posts" type="hidden" value="6592"/> <button class="submit btn btn-primary" type="submit">Anfrage senden</button> <div class="send-over-https"><span class="glyphicon glyphicon-lock https-lock"></span> SSL-verschlüsselt</div> </div> <div class="col-xs-12 col-sm-8"> <div class="immomakler-iconcaptcha-widget iconcaptcha-widget" data-theme="light"></div><input name="_iconcaptcha-token" type="hidden" value="bf4f394fc4cabcb9f5b19030389d31e1120c611c4983baf59626a86ced9efb62"/> </div> </div>
