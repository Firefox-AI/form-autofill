<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="modal-header"> <button aria-label="Close" class="close" data-dismiss="modal" type="button"><span aria-hidden="true">×</span></button> <h4 class="modal-title">Register</h4> </div> <div class="modal-body"> <div class="form_status alert alert-danger mb" style="display:none;"></div> <div class="form-group mb"> <div class="input-wrap"> <label class="input-label">Username*</label> <input class="form-control" data-moz-autofill-type="loginname" name="bu_login" title="Username" type="text"/> </div> </div> <div class="form-group mb"> <div class="input-wrap"> <label class="input-label">Password*</label> <input autocomplete="off" class="form-control" name="bu_password" title="Password" type="password"/> </div> </div> <div class="form-group mb"> <div class="input-wrap"> <label class="input-label">First Name*</label> <input class="form-control" data-moz-autofill-type="given-name" name="bu_first" title="First Name" type="text"/> </div> </div> <div class="form-group mb"> <div class="input-wrap"> <label class="input-label">Last Name*</label> <input class="form-control" data-moz-autofill-type="family-name" name="bu_last" title="Last Name" type="text"/> </div> </div> <div class="form-group mb"> <div class="input-wrap"> <label class="input-label">Email*</label> <input class="form-control" data-moz-autofill-type="email" name="bu_email" title="Email" type="email"/> </div> </div> <div class="form-group mb"> <div class="input-wrap has-content"> <label class="input-label">Image (88x80)</label> <div class="upload-control custom_upload_control"><input class="form-control file-name upload_file_caption" disabled="" pplaceholder="No File Selected" title="File Name" type="text"/><div class="upload_file_btn btn btn-default"><span>Select File</span><input name="bu_avatar_image" title="File Upload" type="file"/></div></div> </div> </div> </div> <div class="modal-footer"> <button class="btn btn-link" data-dismiss="modal" type="button">Close</button> <button class="btn btn-primary" type="submit">Register</button> </div>
</form>

</fieldset></body></html>
