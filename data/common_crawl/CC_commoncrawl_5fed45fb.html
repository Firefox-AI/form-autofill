ocus:outline-red-600 [@media(hover:hover)]:hover:border-gray-400" id="field_10" name="10" rows="20"></textarea></div></div><div class="col-span-12"></div><div class="my-4"><button aria-pressed="false" class="inline-block min-w-0 rounded-full border whitespace-nowrap text-center ring-offset-2 ring-offset-current transition duration-300 ease-in-out hover:cursor-pointer hover:shadow-md focus:outline-none focus:ring-2 border-primary bg-primary text-primary-content hover:bg-primary-dark hover:text-primary-content px-8 py-3 text-base font-normal" role="button" type="submit">Submit</button></div>
