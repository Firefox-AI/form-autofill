<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="submitContact" type="hidden"/> <div class="groupWrapper"> <label for="fullName">Enter your full name:</label> <input class="slideOutInput validate[required] shortField" data-moz-autofill-type="name" id="fullName" name="fullName" title="Full Name" type="text"/> </div> <div class="groupWrapper"> <label for="phoneNumber">Enter your phone number:</label> <input class="slideOutInput validate[required,custom[phone]]" data-moz-autofill-type="tel" id="phoneNumber" name="phoneNumber" title="Phone Number" type="text"/> </div> <div class="groupWrapper"> <label for="emailAddress">Enter your email address:</label> <input class="slideOutInput validate[required,custom[emailAddress]]" data-moz-autofill-type="email" id="emailAddress" name="emailAddress" title="Email Address" type="text"/> </div> <div class="groupWrapper"> <label for="emailMessage">Enter your message:</label> <textarea class="validate[required]" id="emailMessage" name="emailMessage" title="Your Message" type="text"></textarea> </div> <div class="submitWrapper slideOut"> <button class="submit right" id="submitContact" name="submitContact" type="submit">SEND</button> </div> <input name="akismet_check" type="hidden" value="1"/><input name="lnm_recaptcha" type="hidden" value="1"/><input name="g-recaptcha-response" type="hidden" value=""/>
</form>

</fieldset></body></html>
