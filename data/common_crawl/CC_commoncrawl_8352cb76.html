<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="controls hide_placeholder"> <label for="reporter_name">Your Name:</label> <input data-moz-autofill-type="name" id="adver_name" name="adver_name" type="text"/> <span class="error">This field is required.</span> </div> <div class="controls hide_placeholder"> <label for="reporter_name">Company Name:</label> <input data-moz-autofill-type="organization" id="advercompany_name" name="company_name" type="text"/> <span class="error">This field is required.</span> </div> <div class="controls hide_placeholder"> <label for="reporter_email">Email Address:</label> <input data-moz-autofill-type="email" id="adver_email" name="adver_email" type="text"/> <span class="error">This field is required.</span> </div> <div class="controls hide_placeholder"> <label for="reporter_phone">Contact Number:</label> <input data-moz-autofill-type="tel" id="adver_phone" name="adver_phone" type="text"/> <span class="error">This field is required.</span> </div> <div class="controls hide_placeholder"> <label for="reporter_message">Message:</label> <textarea id="adver_message" name="adver_message"></textarea> <span class="error">This field is required.</span> </div> <div class="action"> <input class="btn btn-pink-light btn-extra-large adver_submit" type="submit" value="Submit"/> <input class="btn btn-blue btn-extra-large b-close" type="button" value="Cancel"/> </div>
</form>

</fieldset></body></html>
