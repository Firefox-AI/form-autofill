<form>
<input name="objid" type="hidden" value="7"/> <fieldset class="has-separator form-fieldset-rating"> <div class="fewo-rating" style="width: 50%;float: left;margin-bottom: 10px;"> <span class="label_picker"></span> <div class="sterne getSterne" id="star"> </div> </div> <input class="form-control" id="Inputstar" name="BewInput" style="display: none;" type="number" value="5"/> <div class="fewo-rating" style="width: 50%;float: left;margin-bottom: 10px;"> <span class="label_picker"></span> <div class="sterne getSterne" id="star"> </div> </div> <input class="form-control" id="Inputstar" name="BewInput" style="display: none;" type="number" value="5"/> <div class="form-field-row full"> <label class="rating_subject w-100" for="rating_subject">Bewertungstitel*</label> <div class="input_ratingsubject"><input class="form-control" id="rating_subject" name="rating_subject" placeholder="Ihr Urlaub" type="text"/></div> </div> <div class="form-field-row full"> <label class="rating_message" for="rating_message">Ihre Bewertung*</label> <div class="input_ratingtext"><textarea class="form-control" cols="80" id="rating_message" name="rating_message" placeholder="Ihre Erfahrungen. Wie hat Ihnen die Unterkunft gefallen?" required="required" rows="3"></textarea></div> </div> </fieldset> <fieldset class="form-fieldset-personal_details"> <span class="form-field field-title">Bewertungstext</span> <div class="form-field-row"> <label class="rating_anrede" for="rating_anrede">Anrede*</label> <div class="input_rating_anrede"><select class="form-control" data-moz-autofill-type="honorific-prefix" id="rating_anrede" name="rating_anrede" size="1"><option selected="selected" value="0">keine Auswahl</option><option value="2">Herr</option><option value="3">Frau</option><option value="4">Familie</option></select><div class="required"></div></div> </div> <div class="form-field-row full"> <label class="rating_vorname" for="rating_vorname">Vorname</label> <div class="input_ratingvorname"><input class="form-control" data-moz-autofill-type="given-name" id="rating_vorname" name="rating_vorname" placeholder="Vorname" type="text"/></div> <label class="rating_name" for="rating_name">Name*</label> <div class="input_ratingname"><input class="form-control" data-moz-autofill-type="family-name" id="rating_name" name="rating_name" placeholder="Name" required="required" type="text"/></div> </div> <div class="form-field-row full"> <label class="rating_ort" for="rating_ort">Ort*</label> <div class="input_ratingort"><input class="form-control" data-moz-autofill-type="address-level2" id="rating_ort" name="rating_ort" placeholder="Ort" required="required" type="text"/></div> </div> <div class="form-field-row full"> <label class="rating_mail" for="rating_mail">Mail* <small>(Wird nicht veröffentlicht)</small></label> <div class="input_ratingmail"><input class="form-control" data-moz-autofill-type="email" id="rating_mail" name="rating_mail" placeholder="Ihre Mail" required="required" type="email"/></div> </div> </fieldset> <div class="submit-container" style="margin-top:10px;"> <input class="btn_submit" id="rating_submit" name="submit" type="submit" value="Bewertung abgeben"/> </div>
</form>
