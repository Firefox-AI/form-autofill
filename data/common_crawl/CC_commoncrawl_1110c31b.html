<section> <input name="id_customer" type="hidden" value=""/> <div class="form-group row no-gutters novform-firstname"> <div class="col-md-8"><input class="form-control" data-moz-autofill-type="given-name" name="firstname" placeholder="Nombre de pila" required="" type="text" value=""/></div> </div> <div class="form-group row no-gutters novform-lastname"> <div class="col-md-8"><input class="form-control" data-moz-autofill-type="family-name" name="lastname" placeholder="Apellido" required="" type="text" value=""/></div> </div> <div class="form-group row no-gutters novform-email"> <div class="col-md-8"><input class="form-control" data-moz-autofill-type="email" name="email" placeholder="Email" required="" type="email" value=""/></div> </div> <div class="form-group row no-gutters novform-password"> <div class="col-md-8"> <div class="input-group js-parent-focus"> <input class="form-control js-child-focus js-visible-password" name="password" placeholder="Contraseña" required="" type="password" value=""/> </div> </div> </div> <div class="form-group row no-gutters novform-newsletter"> <div class="col-md-8"> <span class="custom-checkbox d-inline-flex"> <input name="newsletter" type="checkbox" value="1"/> <span><i class="material-icons checkbox-checked">check</i></span> <label>Suscríbase a nuestro boletín</label> </span> </div> </div> </section> <footer class="form-footer clearfix"> <div class="row no-gutters"> <div class="col-md-10 offset-md-2"> <input name="submitCreate" type="hidden" value="1"/> <button class="btn btn-primary form-control-submit mb-30" data-link-action="save-customer" type="submit"> Registro </button> </div> </div> </footer>
