<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<ol class="feedback_box_left"> <ol class="feedback_box_left_con"> <ol class="feedback_box_left_con_l">Name：</ol> <ol class="feedback_box_left_con_r"><input autocomplete="on" class="rounded" data-moz-autofill-type="name" name="姓名" placeholder="Name" required="" style="border:1px #CCC solid; padding:0 0 0 10px; margin:0; font-size: 19px; color:#000000; height:35px; width:450px" type="text"/> <span style="color:#F00">*</span></ol> </ol> <ol class="feedback_box_left_con"> <ol class="feedback_box_left_con_l">Company：</ol> <ol class="feedback_box_left_con_r"><input autocomplete="on" class="rounded" data-moz-autofill-type="organization" name="公司名称" placeholder="Company name" required="" style="border:1px #CCC solid; padding:0 0 0 10px; margin:0; font-size: 19px; color:#000000; height:35px; width:450px" type="text"/><span style="color:#F00"> *</span></ol> </ol> <ol class="feedback_box_left_con"> <ol class="feedback_box_left_con_l">Email：</ol> <ol class="feedback_box_down1_con_r"><input autocomplete="on" class="rounded" data-moz-autofill-type="email" name="邮箱" placeholder="We will reply you via email in 24 hours" required="" style="border:1px #CCC solid; padding:0 0 0 10px; margin:0; font-size: 19px; color:#000000; height:35px; width:450px" type="email"/><span style="color:#F00"> *</span></ol> </ol> <ol class="feedback_box_left_con"> <ol class="feedback_box_left_con_l">Tel：</ol> <ol class="feedback_box_left_con_r"><input autocomplete="on" class="rounded" data-moz-autofill-type="tel" name="联系电话" placeholder="Phone/WhatsApp/WeChat (very important)" required="" style="border:1px #CCC solid; padding:0 0 0 10px; margin:0; font-size: 19px; color:#000000; height:35px; width:450px" type="text"/><span style="color:#F00"> *</span></ol> </ol> </ol> <ol class="feedback_box_right"></ol> <ol class="feedback_box_down1"> <ol class="feedback_box_left_con_l">Address：</ol> <ol class="feedback_box_left_con_r"><input autocomplete="on" class="rounded" name="公司地址" placeholder="Abt freight, country plug, standard etc." style="border:1px #CCC solid; padding:0 0 0 10px; margin:0; font-size: 19px; color:#000000; height:35px; width:710px" type="text"/></ol> </ol> <ol class="feedback_box_down2"> <ol class="feedback_box_down2_con_l">Comments：</ol> <ol class="feedback_box_down2_con_r"><textarea autocomplete="on" name="客户留言信息" placeholder="Enter product details such as output voltage, current, application etc, and other specific requirements to receive an accurate quote." required="" style="width:688px; height:230px; padding:0 0 0 10px; font-size: 19px; color:#000000; overflow:hidden;"></textarea><span style="color:#F00"> *</span></ol> </ol> <ol class="feedback_box_down3"> <ol class="send_buttom1"><input name="submit" style=" background:black; border:0px; width:100px; height:32px; font-size: 19px; overflow:hidden; color:#FFF;" type="submit" value="Send"/></ol> </ol>
</form>
