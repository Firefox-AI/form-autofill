<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="_source" type="hidden" value="/request-info/human-rights-information-kit.html"/> <input name="captcha" type="hidden" value=""/> <div class="row"><div class="form-group col-xs-24 col-sm-4"> <label class="required salutation" for="salutation">Salutation</label> <select autofocus="" class="form-control" name="salutation" required=""> <option value="">Select…</option> <option value="Mr.">Mr.</option> <option value="Mrs.">Mrs.</option> <option value="Miss.">Miss</option> <option value="Ms.">Ms.</option> </select> </div><div class="form-group col-xs-24 col-sm-10"> <label class="required" for="firstName">First Name</label> <input autocomplete="given-name" class="form-control" data-moz-autofill-type="given-name" name="firstName" required="" type="text"/> </div><div class="form-group col-xs-24 col-sm-10"> <label class="required" for="lastName">Last Name</label> <input autocomplete="family-name" class="form-control" data-moz-autofill-type="family-name" name="lastName" required="" type="text"/> </div></div> <div class="row"><div class="form-group col-xs-24 col-sm-10"> <label class="required" for="address">Street Address</label> <input autocomplete="street-address" class="form-control" data-moz-autofill-type="address-line1" maxlength="120" name="address" placeholder="" required="" type="text"/> </div><div class="form-group col-xs-24 col-sm-6"> <label for="address2">Apartment<wbr/>/<wbr/>Suite<wbr/>/<wbr/>Room, etc.</label> <input class="form-control" data-moz-autofill-type="apartment" name="address2" type="text"/> </div><div class="form-group col-xs-24 col-sm-8"> <label class="required" for="city">City</label> <input autocomplete="address-level2" class="form-control" data-moz-autofill-type="address-level2" name="city" required="" type="text"/> </div></div> <div class="row"><div class="form-group col-xs-24 col-sm-6"> <label class="required" for="countryCode">Country</label> <select class="form-control" data-moz-autofill-type="country" name="countryCode" required=""> <option value="">Select…</option> </select> </div><div class="form-group col-xs-24 col-sm-8"> <label class="required" for="postalCode">Postal Code</label> <input autocomplete="postal-code" class="form-control" data-moz-autofill-type="postal-code" name="postalCode" required="" type="text"/> </div><div class="form-group col-xs-24 col-sm-10"> <label class="required" for="stateProvince">State/Province</label> <select class="form-control" data-moz-autofill-type="address-level1" name="stateProvince" required=""> <option value="">Select…</option> </select> </div></div> <div class="row"><div class="form-group col-xs-24 col-sm-12"> <label class="required" for="email">Email Address</label> <input autocomplete="email" class="form-control" data-moz-autofill-type="email" name="email" required="" type="email"/> </div><div class="form-group col-xs-24 col-sm-12"> <label class="required" for="phoneNumber">Phone Number</label> <input autocomplete="tel" class="form-control" data-moz-autofill-type="tel" name="phoneNumber" required="" type="text"/> </div></div> <div class="row"><div class="form-group col-xs-24 col-sm-12"> <label class="required" for="howFound">How did you find out about us?</label> <select class="form-control" name="howFound" required=""> <option value="">Select…</option> <option value="Booklet/Handout">Booklet/Handout</option> <option value="Class/Teacher">Class/Teacher</option> <option value="Colleague">Colleague</option> <option value="Event/Presentation">Event/Presentation</option> <option value="Family Member">Family Member</option> <option value="Friend">Friend</option> <option value="Information Kit">Information Kit</option> <option value="Internet Ad">Internet Ad</option> <option data-other="true" value="Other Internet">Other Internet (Specify)</option> <option value="Magazine Ad">Magazine Ad</option> <option value="Media Report">Media Report</option> <option value="Postcard">Postcard</option> <option value="Seminar">Seminar</option> <option data-other="true" value="Other TV Ads">TV Ad</option> <option data-other="true" value="other">Other (Specify)</option> </select> </div><div class="form-group col-xs-24 col-sm-12"> <label class="required" for="productCode">Booklet Language</label> <select class="form-control" name="productCode" required=""> <option value="">Select…</option> </select> </div> </div> <div class="row"><div class="form-group col-xs-24"> <div class="checkbox mb-0 non-eu"> <label class="smaller"> <input checked="" name="sign-up-for-newsletter" type="checkbox"/> Yes, please send me more information on the Church of Scientology's Social Betterment and Humanitarian programs. (Delivered via email, approximately once per week, you can easily unsubscribe any time.) </label> </div> <div class="checkbox mb-0 eu-only email-wrapper" data-placement="left" title="This needs to be checked"> <label class="smaller"> <input checked="" name="sign-up-for-newsletter-eu" type="checkbox"/> </label> </div> </div><div class="form-group col-xs-24"> <div class="checkbox mb-0"> <label class="required smaller"> <input name="terms-and-privacy-notice" required="" type="checkbox"/> I agree to the <a href="/privacy-notice.html" target="_blank">Privacy Notice</a> of this site. <a class="gcui-privacy-notice-hint" data-hint="gcui_dynaform:priv_notice_new_small" data-placement="top" data-toggle="tooltip" href="#" title="Your data will only be used to provide the information you are requesting on this form. The security and privacy of your personal data is important to us. Click the appropriate link for full details."><span class="glyphicon glyphicon-info-sign"></span></a> </label> </div> </div></div> <div class="row eu-only"><div class="form-group col-xs-24 col-sm-12"> <div class="checkbox by-phone-wrapper" data-placement="left" title="This needs to be checked"> <label class="smaller"> <input name="by-phone" type="checkbox"/> I would like to be contacted by telephone. </label> </div> </div><div class="form-group col-xs-24"> <div class="checkbox by-mail-wrapper" data-placement="left" title="This needs to be checked"> <label class="smaller"> <input name="by-mail" type="checkbox"/> I would like to be contacted by mail. </label> </div> </div></div> <div class="gcui-eu-message eu-only"> </div> <div class="survey-submit-button"> <button autocomplete="off" class="btn btn-primary btn-lg" type="submit">Request</button> </div>
</form>
