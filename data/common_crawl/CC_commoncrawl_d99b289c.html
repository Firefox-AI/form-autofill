td class="no_wrap"> <label>Phone:</label> <input class="fancy_textbox30" data-moz-autofill-type="tel-area-code" id="lc_phone_number1" maxlength="3" name="lc_phone_number1" type="text" value=""/> - <input class="fancy_textbox30" data-moz-autofill-type="tel-local-prefix" id="lc_phone_number2" maxlength="3" name="lc_phone_number2" type="text" value=""/> - <input class="fancy_textbox30" data-moz-autofill-type="tel-local-suffix" id="lc_phone_number3" maxlength="4" name="lc_phone_number3" type="text" value=""/><input class="textbox_255 fields" id="lc_phone_number" name="lc_phone_number" type="hidden" value=""/> </td> </tr> <tr> <td class="caption"> <label>Zip code:</label> <input class="fancy_textbox251" data-moz-autofill-type="postal-code" id="lc_zip" maxlength="30" name="lc_zip" type="text" value=""/> <span class="fff"></span> </td> <td class="no_wrap"> <label>Task name:</label> <select class="fields fancy_select" id="lc_id_networx_task" name="lc_id_networx_task"><option value="">Select task name</option> <option value="1">Gardening - Bushes/Flowers/etc</option> <option value="2">Hardscapes</option> <option value="3">Landscape Design/Install</option> <option value="4">Landscape Lighting</option> <option value="5">Landscape Repair</option> <option value="6">Landscaping</option> <option value="7">Lawn Care And Maintenance</option> <option value="8">Leaf Removal</option> <option value="9">Snow Removal</option> <option value="10">Sod Installation</option> <option value="11">Sprinklers/Irrigation System</option> <option value="12">Tree Removal/Trimming</option> <option value="13">Water Features</option> </select> </td> </tr> <tr> <td> <div class="relative pt10"> <input class="black_btn" id="submit_leadconnect" name="commit" onclick="return leadConnect_validate();" type="submit" value="Get Quotes"/> <div class="loading_leadConnect" id="loading_leadconnect">Loading</div> </div> </td> </tr> </table> </div> </div> <input id="lc_location_info" name="lc_location_info" type="hidden
