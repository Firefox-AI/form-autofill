<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="page page-1" data-bind="visible: page() == 1" style="display: none;"> <div class="rating-form-stars"> <div class="heading" id="jetzt-bewerten">Ihre Gesamtbewertung*</div> <div class="stars-line"> <button class="rating-one-star" data-bind="click: rate.bind( $data, 1 ), event: { mouseover: rateMouseOver.bind( $data, 1 ), mouseout: rateMouseOut}, css: (hoveredRate() &gt;= 1 || ( hoveredRate() == 0 &amp;&amp; selectedRate() &gt;= 1 )) ? 'icon-star' : 'icon-star-empty' "></button> <button class="rating-one-star" data-bind="click: rate.bind( $data, 2 ), event: { mouseover: rateMouseOver.bind( $data, 2 ), mouseout: rateMouseOut}, css: (hoveredRate() &gt;= 2 || ( hoveredRate() == 0 &amp;&amp; selectedRate() &gt;= 2 )) ? 'icon-star' : 'icon-star-empty' "></button> <button class="rating-one-star" data-bind="click: rate.bind( $data, 3 ), event: { mouseover: rateMouseOver.bind( $data, 3 ), mouseout: rateMouseOut}, css: (hoveredRate() &gt;= 3 || ( hoveredRate() == 0 &amp;&amp; selectedRate() &gt;= 3 )) ? 'icon-star' : 'icon-star-empty' "></button> <button class="rating-one-star" data-bind="click: rate.bind( $data, 4 ), event: { mouseover: rateMouseOver.bind( $data, 4 ), mouseout: rateMouseOut}, css: (hoveredRate() &gt;= 4 || ( hoveredRate() == 0 &amp;&amp; selectedRate() &gt;= 4 )) ? 'icon-star' : 'icon-star-empty' "></button> <button class="rating-one-star" data-bind="click: rate.bind( $data, 5 ), event: { mouseover: rateMouseOver.bind( $data, 5 ), mouseout: rateMouseOut}, css: (hoveredRate() &gt;= 5 || ( hoveredRate() == 0 &amp;&amp; selectedRate() &gt;= 5 )) ? 'icon-star' : 'icon-star-empty' "></button> <span class="star-status" data-bind="text: rateDescription"></span> <input data-bind=" value: selectedRate" name="rating[rating_stars]" type="hidden"/> <input name="rating[company_id]" type="hidden" value="112550118"/> <input name="rating[city_id]" type="hidden" value="90121219"/> </div> <div class="error-msg" data-bind="visible: invalidRate()" style="display: none;">Bitte geben Sie eine Bewertung ab!</div> </div> <div class="rating-form-box"> <label class="heading" for="rating_message">Ihre Bewertung*</label> <textarea class="form-control" data-bind="value: comment, valueUpdate: 'afterkeydown', css: { error: errorMessage() }" id="rating_message" name="rating[rating_message]" placeholder="Schreiben Sie Ihren Text so, als würden Sie einem guten Freund erklären, warum gerade dieses Unternehmen besonders gut oder schlecht ist."></textarea> <span class="char-count"><span data-bind="text: commentSymbolsCount"></span> Zeichen verfügbar</span> <span data-bind="text: errorMessage() ? errorMessage() : '', css: errorMessage() ? 'error-msg' : '' "></span> <div class="buttons-box"> <div class="heading">Fügen Sie ein Foto hinzu</div> <rating-img-upload params="isRating: true, id: 'rating-img-upload'"></rating-img-upload> <span class="caption-error error-msg" data-bind="visible: isUploadHasNoImagesError">Sie müssen mindestens ein Bild hochladen.</span> </div> </div> <div class="rating-form-buttons clearfix"> <button class="btn btn-default-highlight btn-right" type="submit" value="submit">Jetzt bewerten</button> </div> </div> <div class="page page-2" data-bind="visible: page() == 2" style="display: none;"> <div class="rating-form-box"> <div class="buttons-box"> <label class="heading" for="rating_name" id="rating_name--label">Ihr Name* </label> <input autocomplete="off" class="rating_name" data-bind="valueUpdate: 'afterkeydown', css: { error: nameErrorMessage() }, hasFocus: ratingNameSelected" data-moz-autofill-type="name" id="rating_name" name="rating[name]" placeholder="Max Mustermann" type="text" value=""/> <span data-bind="html: nameErrorMessage() ? nameErrorMessage() : '', css: nameErrorMessage() ? 'error-msg' : '' "></span> <label class="heading" for="rating_email">Ihre E-Mail-Adresse* <span class="subtext">(wird nicht angezeigt, nur für die Bestätigungs-E-Mail)</span></label> <input class="rating_email" data-bind="value: email, valueUpdate: 'afterkeydown', css: { error: emailErrorMessage() }, hasFocus: ratingEmailSelected" data-moz-autofill-type="email" id="rating_email" name="rating[email]" placeholder="max.mustermann@musterhausen.de" type="text" value=""/> <span data-bind="html: emailErrorMessage() ? emailErrorMessage() : '', css: emailErrorMessage() ? 'error-msg' : '' "></span> <span data-bind="text: errorMessage() ? errorMessage() : '', css: errorMessage() ? 'error-msg' : '' "></span> </div> </div> <div class="rating-form-buttons clearfix"> <button class="js-rating-back-button btn btn-default btn-left" data-bind="visible: page() == 2, event: { click: function () { goToPage(1); } }" style="display: none;" type="button">Zurück</button> <button class="btn btn-default-highlight btn-right" id="rating-submit-button" type="submit" value="submit">Veröffentlichen</button> </div> </div>
</form>

</fieldset></body></html>
