<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="accommodation_id" type="hidden" value="8944"/> <input name="type" type="hidden" value="send_problem"/> <div aria-hidden="true" class="sr-only"> <label for="legal_problem_website">Website</label> <input autocomplete="off" id="legal_problem_website" name="website" tabindex="-1" type="text"/> </div> <div class="mb-3"> <label class="form-label" for="accommodation_id">Unterkunfts-ID:</label> <span id="accommodation_id">8944</span> </div> <div class="mb-3"> <label class="form-label">Anrede:</label><br/> <div class="form-check form-check-inline"> <input class="form-check-input" id="herr" name="salutation" required="" type="radio" value="Herr"/> <label class="form-check-label" for="herr">Herr</label> </div> <div class="form-check form-check-inline"> <input class="form-check-input" id="frau" name="salutation" type="radio" value="Frau"/> <label class="form-check-label" for="frau">Frau</label> </div> </div> <div class="row mb-3"> <div class="col-md-6"> <label class="form-label" for="first_name">Vorname *:</label> <input class="form-control" data-moz-autofill-type="given-name" id="first_name" name="first_name" required="" type="text"/> </div> <div class="col-md-6"> <label class="form-label" for="last_name">Nachname *:</label> <input class="form-control" data-moz-autofill-type="family-name" id="last_name" name="last_name" required="" type="text"/> </div> </div> <div class="row mb-3"> <div class="col-md-6"> <label class="form-label" for="email">E-Mail *:</label> <input class="form-control" data-moz-autofill-type="email" id="email" name="email" required="" type="email"/> </div> <div class="col-md-6"> <label class="form-label" for="phone">Telefonnummer:</label> <input class="form-control" data-moz-autofill-type="tel" id="phone" name="phone" type="tel"/> </div> </div> <div class="mb-3"> <label class="form-label" for="violation_category">Verstoß-Kategorie *:</label> <select class="form-select" id="violation_category" name="violation_category" required=""> <option value="">Bitte wählen</option> <option value="tierschutz">Tierschutz</option> <option value="datenschutz">Datenschutz und Privatsphäre</option> <option value="cybergewalt">Cybergewalt und Sicherheit</option> <option value="selbstverletzung">Selbstverletzung</option> <option value="rechtswidrig">Rechtswidrige Äußerungen und Meinungsfreiheit</option> <option value="minderjaehrigenschutz">Schutz von Minderjährigen</option> <option value="betrug">Betrug und Täuschung</option> <option value="geistiges_eigentum">Geistiges Eigentum</option> <option value="agb_verstoss">Verstoß gegen die Geschäftsbedingungen des Anbieters</option> <option value="sonstiges">Sonstiges/Unbestimmtes</option> </select> </div> <div class="mb-3"> <label class="form-label" for="message">Nachricht *:</label> <textarea class="form-control" id="message" maxlength="5000" name="message" required="" rows="4"></textarea> <small class="form-text text-muted"> Erläutere bitte klar und ausführlich, warum du diesen Inhalt für rechtswidrig hältst und warum er gegen unsere Nutzungsbedingungen oder Inhaltsrichtlinien verstößt. </small> </div> <div class="mb-3 form-check"> <input class="form-check-input" id="confirmation" name="confirmation" required="" type="checkbox"/> <label class="form-check-label" for="confirmation"> Ich bestätige, dass ich aufrichtig glaube, dass die bereitgestellten Informationen und Behauptungen korrekt und vollständig sind. </label> </div> <p>Weitere Informationen befinden sich in der <a href="/datenschutz.html">Datenschutzerklärung</a>.</p> <div class="modal-footer"> <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Abbrechen</button> <button class="btn btn-primary" id="submitLegalProblemFormButton" type="button">Senden</button> </div>
</form>

</fieldset></body></html>
