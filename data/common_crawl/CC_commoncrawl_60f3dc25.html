<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="mb-3"> <label class="form-label require" for="first-name-input">First Name</label> <input class="form-control" data-moz-autofill-type="given-name" id="first-name-input" maxlength="400" name="first-name" size="40" type="text"/> </div> <div class="mb-3"> <label class="form-label" for="company-name-input">Company Name</label> <input class="form-control" data-moz-autofill-type="organization" id="company-name-input" maxlength="400" name="company" size="40" type="text"/> </div> <div class="mb-3"> <label class="form-label require" for="phone-input">Phone Number</label> <input class="form-control" data-moz-autofill-type="tel" id="phone-input" maxlength="400" name="phone" size="40" type="tel"/> </div> <div class="mb-3"> <label class="form-label" for="coupon-code-input">Coupon Code</label> <input class="form-control" id="coupon-code-input" maxlength="400" name="coupon-code" size="40" type="text" value="XM888888"/> </div> <div class="mb-3"> <label class="form-label require" for="project-description-input">Please describe your project</label> <textarea class="form-control" cols="40" id="project-description-input" maxlength="2000" name="project-description" rows="4"></textarea> </div> <input name="back" type="hidden" value="https://www.staplesphotoprinting.com/blog/24/"/> <button class="btn btn-primary py-3 px-4" type="submit">Submit</button>
</form>

</fieldset></body></html>
