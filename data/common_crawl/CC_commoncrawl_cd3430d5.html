<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="product_id" type="hidden" value="12556"/> <div aria-hidden="true" style="display:none !important;"> <input autocomplete="off" name="website" tabindex="-1" type="text" value=""/> </div> <div class="form-group"> <label for="itdr-enquiry-name">Name</label> <input class="form-control" data-moz-autofill-type="name" id="itdr-enquiry-name" name="name" placeholder="Your name" type="text"/> </div> <div class="form-group"> <label for="itdr-enquiry-email">Email address</label> <input class="form-control" data-moz-autofill-type="email" id="itdr-enquiry-email" name="email" placeholder="you@example.com" type="email"/> </div> <div class="form-group"> <label for="itdr-enquiry-phone">Phone number <small class="text-muted">(optional)</small></label> <input class="form-control" data-moz-autofill-type="tel" id="itdr-enquiry-phone" name="phone" placeholder="Optional" type="text"/> </div> <div class="form-group"> <label for="itdr-enquiry-message">Your question</label> <textarea class="form-control" id="itdr-enquiry-message" name="message" placeholder="Please include what you want to use the product for, if relevant." rows="4"></textarea> </div> <button class="btn-buy" id="button-itdr-product-enquiry" style="margin-top:4px;" type="button"> <i class="fa fa-paper-plane"></i> Send product question </button>
</form>
