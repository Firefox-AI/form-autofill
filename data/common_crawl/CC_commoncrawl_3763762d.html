<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="frm__group"> <label class="frm__label frm__mgz__label" for="field_full_name">Full Name</label> <div class="frm__field-group"> <input class="frm__field frm__field keyval" data-json="C_FirstName" data-moz-autofill-type="name" data-validation="name" id="field_full_name" name="field_full_name" onkeypress="return event.charCode &gt;= 97 &amp;&amp; event.charCode &lt;= 122 || event.charCode &gt;= 65 &amp;&amp; event.charCode &lt;= 90 || event.charCode == 32" placeholder=" Enter Your Name" type="text" value=""/><span class="error">Please enter your Name</span> <label class="ids_frm__label" for="field_full_name">Full Name</label> </div> </div> <div class="new_thankup_popup__mobile_pincode"> <div class="frm__group login_phone_number"> <label class="frm__label frm__mgz__label" for="field_login_add_phone_number">Mobile Number</label> <div class="frm__field-group"> <input class="frm__field frm__field keyval" data-json="C_Mobile" data-moz-autofill-type="tel" data-validation="mobileNumber" data-value="" id="field_login_add_phone_number" maxlength="10" minlength="10" name="field_login_add_phone_number" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" pattern="[0-9]+" placeholder=" Enter Your Number" type="tel" value=""/><span class="error">Please enter your Mobile Number</span> <label class="ids_frm__label" for="field_login_add_phone_number">Mobile Number</label> <span class="country_code"> +91 </span> </div> </div> <div class="frm__group"> <label class="frm__label frm__mgz__label" for="form-field__pincode">Pincode</label> <div class="frm__field-group"> <input class="frm__field frm__field keyval" data-json="C_Pincode" data-moz-autofill-type="postal-code" data-validation="pincode" id="form-field__pincode" maxlength="6" minlength="6" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" pattern="[0-9]+" placeholder=" Enter Your Pincode" required="" type="tel"/><span class="error">Please enter your Pincode</span> <label class="ids_frm__label" for="form-field__pincode">Pincode</label> </div> </div> </div> <div class="frm__group"> <label class="frm__label frm__mgz__label" for="field_email">Your Email ID</label> <div class="frm__field-group"> <input class="frm__field frm__field keyval" data-json="C_Email" data-moz-autofill-type="email" data-validation="email" id="field_email" name="field_email" placeholder=" Enter Your Email" type="email"/><span class="error">Please enter your Email ID</span> <label class="ids_frm__label" for="field_email">Your Email ID</label> </div> </div> <div class="frm__group field_whatsapp_group" for="field_whatsapp"> <div class="whatsapp-field-group"> <label for="field_whatsapp">Yes, I would like to receive important updates and notifications on WhatsApp <input class="custom-checkbox" data-json="C_WhatsappNotification" id="field_whatsapp" type="checkbox"/> <span class="checkmark"></span> </label> </div> <span class="error"></span> </div> <div class="form_hidden"><input data-json="C_CampaignId" type="hidden" value="Decor_organic"/> </div> <p class="book-appointment-get-started_desc">By proceeding, you are authorizing Beautiful Homes and its suggested contractors to get in touch with you through calls, sms, or e-mail.</p> <div class="dialog__body-both-btn"> <div class="dialog__body-cta"> <button class="btn btn--lg btn--primary mgz-form-btn desktop" id="btn-save-personal-details" onclick="sfform(event)" type="button">Submit</button> </div> </div>
</form>

</fieldset></body></html>
