<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<ol class="list-unstyled"> <li> <label for="form-first-name">First name</label> <input class="dark-blue required" data-moz-autofill-type="given-name" id="form-first-name" name="firstname" title="First name" type="text"/> </li> <li> <label for="form-last-name">Last name</label> <input class="dark-blue required" data-moz-autofill-type="family-name" id="form-last-name" name="lastname" title="Last name" type="text"/> </li> <li> <label for="form-telephone">Telephone</label> <input class="dark-blue required" data-moz-autofill-type="tel" id="form-telephone" name="phone_main" title="Telephone" type="tel"/> </li> <li> <label for="form-email">E-mail</label> <input class="dark-blue required" data-moz-autofill-type="email" id="form-email" name="email" title="E-mail" type="email"/> </li> <li> <label for="form-question">Your questions</label> <textarea class="dark-blue required" id="form-question" name="question" title="Your question">I am looking for a touring holiday along the theme of foodie please.</textarea> <input name="how" type="hidden" value="touring"/> </li> <li> <label for="form-how-did-you-find-us">How did you find us?</label> <select class="dark-blue required" id="form-how-did-you-find-us" name="how_did_you_find_us" title="How did you find us?"> <option value="none"></option> <option>Social media</option> <option>We’ve travelled with you before</option> <option>Search engine (Google etc.)</option> <option>Recommendation</option> <option data-display-additional="#display-read-about-you-in">Read about you in ... </option> </select> </li> <li id="display-read-about-you-in" style="display: none;"> <label for="form-read-about-you-in">Read about you in (please specify)</label> <input class="dark-blue req-when-displayed" id="form-read-about-you-in" name="read_about_you_in" title="Read about you in (please specify)" type="text"/> </li> </ol> <div class="indent"> <p>Fields marked with * are mandatory</p> <p> <input class="bg-dark-blue white mont" type="submit" value="Submit"/> </p> </div>
</form>

</fieldset></body></html>
