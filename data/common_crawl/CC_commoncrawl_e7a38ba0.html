<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<p class="kid-comment-form-sub-title">Your email address will not be published. Required fields are marked *</p><p class="comment-form-comment"><textarea aria-required="true" cols="45" id="comment" name="comment" placeholder="Write your comment here" rows="8"></textarea></p><p class="comment-form-author"><input aria-required="true" data-moz-autofill-type="name" id="author" name="author" placeholder="Name*..." size="30" type="text"/></p><p class="comment-form-email"><input aria-required="true" data-moz-autofill-type="email" id="email" name="email" placeholder="Email*..." size="30" type="text"/></p><p class="comment-form-url"><input id="url" name="url" placeholder="Website..." size="30" type="text"/></p> <p class="comment-form-cookies-consent"><input id="wp-comment-cookies-consent" name="wp-comment-cookies-consent" type="checkbox" value="yes"/><label for="wp-comment-cookies-consent">Salva il mio nome, email e sito web in questo browser per la prossima volta che commento.</label></p> <p class="form-submit"><input class="submit" id="comment-submit" name="submit" type="submit" value="Send"/> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="16855"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </p>
</form>
