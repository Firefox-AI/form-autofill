<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="space-y-4"> <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" data-moz-autofill-type="name" name="fullname" placeholder="Your Name" required="" type="text"/> <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" data-moz-autofill-type="email" name="emailaddress" placeholder="Your Email" required="" type="email"/> <input class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" data-moz-autofill-type="tel" name="phonenumber" pattern="[0-9]+" placeholder="Phone Number" required="" type="tel"/> </div> <div> <label class="block text-paragraph text-sm font-medium mb-1" for="contact-message">Message</label> <textarea class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" name="yourrequirements" placeholder="Your Message" rows="3"></textarea> </div> <input id="pageurl" name="pageurl" type="hidden"/> <input id="pagetitle" name="pagetitle" type="hidden"/> <input name="form_type" type="hidden" value="quote_form"/> <button class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-hover-color hover:shadow-xl hover:-translate-y-1 transition-all duration-300 shadow-md" type="submit">Send Message</button>
</form>
