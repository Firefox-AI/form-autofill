<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="referencia-imovel" type="hidden" value="285"/> <fieldset class="main"> <div class="inteira required form-group cg-addon" title="sua mensagem"> <label class="control-label" for="mensagem">Mensagem</label> <textarea class="textarea form-control input validate[required,minSize[10]]" id="mensagem" name="mensagem" rows="3">Olá, tenho interesse no imóvel: ref #285 Terreno em Condomínio - Venda, Maceió - Guaxuma. Aguardo o contato. Obrigado.</textarea> </div> <div class="inteira form-group required cg-addon"> <label class="control-label" for="nome">Nome Completo</label> <div class="input-group"> <input autocomplete="nome" class="input form-control validate[required,minSize[5],maxSize[40]]" data-moz-autofill-type="name" form_icon="append" id="nome" maxlength="50" name="nome" type="text"/> <span class="input-group-addon"><span aria-hidden="true" class="icon-user icon"></span></span> </div> </div> <div class="inteira form-group required cg-addon"> <label class="control-label" for="email">Email</label> <div class="input-group"> <input autocomplete="email" class="input form-control validate[required,custom[email]]" data-moz-autofill-type="email" form_icon="append" id="email" maxlength="250" name="email" type="email"/> <span class="input-group-addon"><span aria-hidden="true" class="icon-mail icon"></span></span> </div> </div> <div class="inteira form-group required cg-addon"> <label class="control-label" for="telefone">Telefone</label> <div class="input-group"> <input autocomplete="telefone" class="input form-control fone mask validate[required,minSize[8]]" data-mask="(99) 9999-9999?9" data-moz-autofill-type="tel" form_icon="append" id="telefone" maxlength="20" name="telefone" type="tel"/> <span class="input-group-addon"><span aria-hidden="true" class="icon-phone icon"></span></span> </div> </div> <div class="row"> <div class="legenda_asterisco col-sm-10"> <span class="form_asterisco">*</span> campos obrigatórios <p class="form-aceite-lgpd"><i class="fa fa-lock icon large"></i> Ao enviar você está aceitando a <a href="/politica-de-privacidade/" target="_blank">política de privacidade</a>.</p> <div class="mosparo-container pull-left captcha-container" data-loadcss="1" id="mosparo-box"></div> </div> <div class="col-sm-2"> <button class="btn btn-small btn-tema pull-right" data-loading-text="enviando..." type="submit"> <span aria-hidden="true" class="icon-raquo icon"></span>enviar </button> </div> </div> </fieldset>
</form>

</fieldset></body></html>
