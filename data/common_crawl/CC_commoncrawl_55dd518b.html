<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row col-sm-6 text-center"> <div class="col-sm-6"> <div class="form-group"> <label>CPF</label> <input checked="" class="" name="tipoDocumento" onclick="mudarCpfCnpj(this.value)" type="radio" value="cpf"/> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label>CNPJ</label> <input class="" name="tipoDocumento" onclick="mudarCpfCnpj(this.value)" type="radio" value="cnpj"/> </div> </div> </div> <div id="grupoPF"> <div class="row"> <div class="col-sm-12"> <div class="form-group"> <label>CPF</label> <input class="form-control cpf" data-moz-autofill-type="id-number" placeholder="Ex: 987.654.321-00" type="text"/> </div> </div> </div> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label>Nome</label> <input class="form-control" data-moz-autofill-type="given-name" placeholder="Ex: Pedro" type="text"/> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label>Sobrenome</label> <input class="form-control" data-moz-autofill-type="family-name" placeholder="Ex: Álvares Cabral" type="text"/> </div> </div> </div> </div> <div id="grupoPJ" style="display:none;"> <div class="row"> <div class="col-sm-6"> <div class="form-group"> <label>CNPJ</label> <input class="form-control cnpj" id="cnpj" name="cnpj" placeholder="10.731.444/0001-80" type="text"/> </div> </div> <div class="col-sm-6"> <div class="form-group"> <label>Razão Social</label> <input class="form-control" id="razaosocial" name="razaosocial" placeholder="Mineradora Brasil LTDA" readonly="" type="text"/> </div> </div> </div> </div> <div class="row"> <div class="col-sm-6 mt-3"> <div class="form-group"> <label>E-mail</label> <input class="form-control" data-moz-autofill-type="email" id="email" name="email" placeholder="Informe seu E-mail" type="email"/> </div> </div> <div class="col-sm-6 mt-3"> <div class="form-group"> <label>Confirmar E-mail</label> <input class="form-control" data-moz-autofill-type="email" id="confemail" name="confemail" placeholder="Confirme seu E-mail" type="email"/> </div> </div> </div> <div class="row"> <div class="col-sm-6 mt-3"> <div class="form-group"> <label>Senha*</label> <input class="form-control" id="password" placeholder="Senha" required="" type="password"/> </div> </div> <div class="col-sm-6 mt-3"> <div class="form-group"> <label>Confirmar Senha*</label> <input class="form-control" id="confirm_password" placeholder="Confirmar Senha" required="" type="password"/> </div> </div> </div> <div class="row"> <div class="col-sm-12 mt-3"> <div class="form-group"> <label>Profissão</label> <select class="form-control w-100 h-100 js-example-basic-hide-search"> <optgroup> <option selected="selected">Profissão</option> <option>Empregado - setor privado</option> <option>Empresário/empreendedor</option> <option>Estudante</option> <option>Jornalista</option> <option>Membro de ONG internacional</option> <option>Membro de ONG nacional</option> <option>Membro de partido político</option> <option>Pesquisador</option> <option>Professor</option> <option>Profis. Liberal/autônomo</option> <option>Representante de sindicato</option> <option>Servidor público estadual</option> <option>Servidor público federal</option> <option>Servidor público municipal</option> <option>Outro</option> </optgroup> </select> </div> </div> </div> <div class="row"> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>CEP</label> <input class="form-control cep" data-moz-autofill-type="postal-code" id="cep" name="cep" placeholder="Informe seu CEP" type="text"/> </div> </div> <div class="col-sm-8 mt-3"> <div class="form-group"> <label>Rua, Avenida, Logradouro...</label> <input class="form-control" data-moz-autofill-type="address-line1" id="rua" name="rua" placeholder="" type="text"/> </div> </div> </div> <div class="row"> <div class="col-sm-8 mt-3"> <div class="form-group"> <label>Bairro</label> <input class="form-control" data-moz-autofill-type="address-level3" id="bairro" name="bairro" placeholder="" type="text"/> </div> </div> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>Número, Ap...</label> <input class="form-control" data-moz-autofill-type="address-housenumber" id="numero" name="numero" placeholder="" type="text"/> </div> </div> </div> <div class="row"> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>Estado</label> <select class="form-control w-100 h-100 js-example-basic-hide-search" data-moz-autofill-type="address-level1" id="uf" name="uf" style="width: 100%;"> <optgroup> <option value="NULO">Selecione ...</option> <option value="AC">Acre</option> <option value="AL">Alagoas</option> <option value="AP">Amapá</option> <option value="AM">Amazonas</option> <option value="BA">Bahia</option> <option value="CE">Ceará</option> <option value="DF">Distrito Federal</option> <option value="ES">Espírito Santo</option> <option value="GO">Goiás</option> <option value="MA">Maranhão</option> <option value="MT">Mato Grosso</option> <option value="MS">Mato Grosso do Sul</option> <option value="MG">Minas Gerais</option> <option value="PA">Pará</option> <option value="PB">Paraíba</option> <option value="PR">Paraná</option> <option value="PE">Pernambuco</option> <option value="PI">Piauí</option> <option value="RJ">Rio de Janeiro</option> <option value="RN">Rio Grande do Norte</option> <option value="RS">Rio Grande do Sul</option> <option value="RO">Rondônia</option> <option value="RR">Roraima</option> <option value="SC">Santa Catarina</option> <option value="SP">São Paulo</option> <option value="SE">Sergipe</option> <option value="TO">Tocantins</option> </optgroup> </select> </div> </div> <div class="col-sm-8 mt-3"> <div class="form-group"> <label>Cidade</label> <input class="form-control" data-moz-autofill-type="address-level2" id="cidadeM" name="cidadeM" placeholder="Ex: São Luís" type="text"/> </div> </div> </div> <input id="ibge" name="ibge" size="8" type="hidden"/><br/> <div class="row"> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>Sexo</label> <select class="form-control w-100 h-100 js-example-basic-hide-search" data-moz-autofill-type="sex" id="genero" name="genero"> <optgroup> <option selected="selected">Selecione...</option> <option value="m">Masculino</option> <option value="f">Feninino</option> </optgroup> </select> </div> </div> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>Escolaridade</label> <select class="form-control w-100 h-100 js-example-basic-hide-search"> <optgroup> <option selected="selected">Escolaridade</option> <option value="ef">Ensino Fundamental</option> <option value="em">Ensino Médio</option> <option value="es">Ensino Superior</option> <option value="md">Mestrado/Doutorado</option> <option value="pg">Pós-graduação</option> <option value="an">Sem instrução de ensino</option> </optgroup> </select> </div> </div> <div class="col-sm-4 mt-3"> <div class="form-group"> <label>Data de Nascimento</label> <input class="form-control date" data-inputmask-alias="datetime" data-moz-autofill-type="bday" id="datanascimento" type="text"/> </div> </div> </div> <div class="col-12 mt-3"> <button class="btn btn-warning" data-dismiss="modal" data-target="#manifestacaoanonima" data-toggle="modal" type="button"> <i class="fal fa-bullhorn"></i> Cadastre sua Manifestação de maneira Anônima </button> </div>
</form>

</fieldset></body></html>
