<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div><h2 class="CatalogRequestForm_title">Mailing Address (US Only)</h2><div class="AddressFormFields_field-wrapper"><div class="AddressNameFields_name-wrapper"><div class="AddressNameFields_field-container"><div class="FormBuilder_fieldWrapper firstName_fieldWrapper"><label for="firstName">First Name</label><input aria-errormessage="firstName-error" aria-invalid="false" aria-required="true" autocapitalize="off" autocomplete="off" autocorrect="off" data-moz-autofill-type="given-name" id="firstName" maxlength="20" name="firstName" type="text"/></div></div><div class="AddressNameFields_field-container"><div class="FormBuilder_fieldWrapper lastName_fieldWrapper"><label for="lastName">Last Name</label><input aria-errormessage="lastName-error" aria-invalid="false" aria-required="true" autocapitalize="off" autocomplete="off" autocorrect="off" data-moz-autofill-type="family-name" id="lastName" maxlength="20" name="lastName" type="text"/></div></div></div><div class="AddressFormFields_address-wrapper"><div class="FormBuilder_fieldWrapper addressLine1_fieldWrapper AddressFormFields_field-wrapper"><label for="addressLine1">Street Address<br/><i>(P.O. Box Customers: For faster delivery, please enter a physical address.)</i></label><input aria-errormessage="addressLine1-error" aria-invalid="false" aria-required="true" autocomplete="address-line1" autocorrect="off" data-moz-autofill-type="address-line1" data-testid="address-typeahead" id="addressLine1" maxlength="35" name="addressLine1" spellcheck="false" type="text"/><div class="AddressTypeAhead_suggestions-popper" style="position:absolute;left:0;top:0"><div aria-atomic="true" aria-live="polite" class="AddressTypeAhead_sr-only" role="status"></div></div></div><div class="AddressFormFields_field-wrapper"><button aria-label="Add more address lines (optional)" class="Anchor_button Anchor_anchor" data-testid="add-address-lines" tabindex="0" type="submit">+ More Address lines (optional)</button></div><div class="hidden"><div class="FormBuilder_fieldWrapper addressLine2_fieldWrapper AddressFormFields_field-wrapper"><label for="addressLine2">Address Line 2 <i>(optional)</i></label><input aria-errormessage="addressLine2-error" aria-invalid="false" aria-required="false" autocomplete="address-line2" autocorrect="off" data-moz-autofill-type="address-line2" data-testid="address-line2" id="addressLine2" maxlength="35" name="addressLine2" spellcheck="false" type="text"/><span class="AddressLines_helperText">Ex.: Apt. #3, Suite 4</span></div><div class="FormBuilder_fieldWrapper addressLine3_fieldWrapper AddressFormFields_field-wrapper"><label for="addressLine3">Address Line 3 <i>(optional)</i></label><input aria-errormessage="addressLine3-error" aria-invalid="false" aria-required="false" autocomplete="address-line3" autocorrect="off" data-testid="address-line3" id="addressLine3" maxlength="35" name="addressLine3" spellcheck="false" type="text"/></div><div class="AddressFormFields_field-wrapper"><div class="FormBuilder_fieldWrapper orgName_fieldWrapper AddressLines_no-margin"><label for="orgName">Business, Attention, or In Care of Name <i>(optional)</i></label><input aria-errormessage="orgName-error" aria-invalid="false" aria-required="false" data-testid="add-business-name-input" id="orgName" maxlength="40" name="orgName" type="text"/></div><fieldset class="AddressLines_radiobutton-wrapper"><div class="AddressLines_radiobutton-group-wrapper"><legend>Business, Attention, or In Care of Name</legend><div class="FormBuilder_fieldWrapper input_orgNameInd_0_fieldWrapper AddressLines_radiobutton-input"><label for="input_orgNameInd_0"><input aria-describedby="orgType-error" id="input_orgNameInd_0" name="orgType" type="radio" value="BUS"/>Business</label></div><div class="FormBuilder_fieldWrapper input_orgNameInd_1_fieldWrapper AddressLines_radiobutton-input"><label for="input_orgNameInd_1"><input aria-describedby="orgType-error" id="input_orgNameInd_1" name="orgType" type="radio" value="C/O"/>In care of</label></div><div class="FormBuilder_fieldWrapper input_orgNameInd_2_fieldWrapper AddressLines_radiobutton-input"><label for="input_orgNameInd_2"><input aria-describedby="orgType-error" id="input_orgNameInd_2" name="orgType" type="radio" value="ATTN"/>Attention</label></div></div></fieldset></div></div><div><div class="USAFormFields_field-wrapper"><div class="FormBuilder_fieldWrapper zipCode_fieldWrapper USAFormFields_no-margin"><label for="zipCode">Zip Code</label><input aria-describedby="zipCode-error" aria-invalid="false" aria-required="true" class="USAFormFields_zip-field" data-mask-postal-code="true" data-moz-autofill-type="postal-code" data-testid="zip-code" id="zipCode" inputmode="decimal" maxlength="10" name="zipCode" type="text" value=""/></div><span class="USAFormFields_helperText">5 or 9 digits</span></div></div></div></div></div><div class="CatalogRequestForm_button-container"><button class="Button_buttonComponent Button_primary Button_large" type="submit">Submit Request</button></div>
</form>

</fieldset></body></html>
