<form>
<p class="h4 mb-6 uppercase">neem contact op</p><div class="mb-4"></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" id="account-manager_company" name="account-manager_company" placeholder="BEDRIJFSNAAM" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_company"></p></div></div><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="email" id="account-manager_email" name="account-manager_email" placeholder="E-MAILADRES" type="email"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_email"></p></div></div></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="given-name" id="account-manager_first-name" name="account-manager_first-name" placeholder="VOORNAAM" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_first-name"></p></div></div><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="family-name" id="account-manager_last-name" name="account-manager_last-name" placeholder="ACHTERNAAM" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_last-name"></p></div></div></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><div class="w-full sm:w-1/2"><div class=""><select class="form-input h-max w-full text-[0.7rem] invalid:text-slate-300 md:text-[1rem] text-slate-500" id="account-manager_country" name="account-manager_country"><option disabled="" selected="" value="">LAND</option></select><div class="flex justify-end"><p class="text-sm text-red-500" data-testid="error-message-account-manager_country"></p></div></div></div><div class="flex flex-col gap-4 sm:w-1/2 sm:flex-row"><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="address-level2" id="account-manager_city" name="account-manager_city" placeholder="STAD" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_city"></p></div></div><div class="w-full sm:w-1/2"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="postal-code" id="account-manager_postal-code" name="account-manager_postal-code" placeholder="POSTCODE" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_postal-code"></p></div></div></div></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><div class="w-full"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" data-moz-autofill-type="tel" id="account-manager_phone-number" name="account-manager_phone-number" placeholder="TELEFOONNUMMER " type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_phone-number"></p></div></div></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><div class="w-full"><div class="flex flex-col items-end"><input class="form-input text-[0.7rem] md:text-[1rem] w-full" id="account-manager_subject" name="account-manager_subject" placeholder="ONDERWERP" type="text"/><p class="text-sm text-red-500" data-testid="error-message-account-manager_subject"></p></div></div></div><div class="flex flex-col gap-4 pb-4 sm:flex-row"><textarea class="form-input text-[0.7rem] md:text-[1rem] w-full h-22 xl:32" id="account-manager_message" name="account-manager_message" placeholder="BERICHT"></textarea></div><div class="mb-4"><div class="input-field gd-input-field col l9 m9 s10"><div><input id="account-manager_terms" name="account-manager_terms" type="checkbox"/><label for="account-manager_terms"><span class="ml-2 text-sm text-muted-500">Klik hier om ons <a class="uppercase underline" href="https://www.gindumac.nl/privacy" target="_blank">PRIVACYBELEID</a>, <a class="uppercase underline" href="https://www.gindumac.nl/general-terms-and-conditions-of-sale" target="_blank">Aankoopvoorwaarden</a> en <a class="uppercase underline" href="https://www.gindumac.nl/general-terms-and-conditions-of-purchase" target="_blank">Verkoopvoorwaarden</a></span></label><p class="text-sm text-red-500" data-testid="error-message-account-manager_terms"></p></div></div></div><div class=""><div class="flex justify-end"><button class="rounded bg-brand-500 px-24 py-4 text-sm uppercase tracking-wider text-white" data-testid="account-manager_form_submit" type="submit">verzenden</button></div></div>
