<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<table class="ui table segment"> <thead> <tr> <th><lable style="color:red;">*</lable>Part No.</th> <th>Manufacturer</th> <th>Target Price(USD)</th> <th><lable style="color:red;">*</lable>Request Qty</th> <th>Action</th> </tr> </thead> <tbody class="quote-list"> </tbody> <tfoot> <tr><th colspan="5"> <div class="tiny ui blue button add-item"> Add Item <i class="icon add"></i> </div> </th></tr> </tfoot> </table> <div class="row"> <div class="column"> <div class="ui form segment"> <div class="ui info message tips"> <h3 class="header">Enter Your Contact Information</h3> <p></p> </div> <div class="fields"> <div class="eight wide field"> <label>Company</label> <div class="ui left labeled input"> <input id="Company" name="Company" placeholder="Company" type="text"/> <div class="ui corner label"> <i class="icon asterisk"></i> </div> </div> </div> <div class="eight wide field"> <label>Contact Name</label> <div class="ui left labeled input"> <input data-moz-autofill-type="name" id="Contacts" name="Contacts" placeholder="Contact Name" type="text"/> <div class="ui corner label"> <i class="icon asterisk"></i> </div> </div> </div> </div> <div class="fields"> <div class="eight wide field"> <label>Phone</label> <div class="ui left labeled input"> <input data-moz-autofill-type="tel" id="Phone" name="Phone" placeholder="Phone" type="text"/> <div class="ui corner label"> <i class="icon asterisk"></i> </div> </div> </div> <div class="eight wide field"> <label>E-mail</label> <div class="ui left labeled input"> <input data-moz-autofill-type="email" id="Email" name="Email" placeholder="E-mail" type="text"/> <div class="ui corner label"> <i class="icon asterisk"></i> </div> </div> </div> </div> <div class="field"> <label>Fax</label> <input id="Fax" name="Fax" placeholder="Fax" type="text"/> </div> <div class="field"> <label>Delivery Address</label> <input data-moz-autofill-type="street-address" id="Address" name="Address" placeholder="Delivery Address" type="text"/> </div> <div class="field"> <label>Message</label> <textarea id="Comments" name="Comments"></textarea> </div> <div class="fields"> <div class="six wide field"> </div> <div class="three wide field"> <div class="ui green button sub-mit"> <i class="mail icon"></i> Submit </div> </div> </div> </div> </div> </div>
</form>
