<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<h2>Submit a Message</h2> <div class="h-pot"> <label for="-middleName">Middle Name</label> <input autocomplete="off" data-moz-autofill-type="additional-name" id="-middleName" name="middleName" tabindex="-1" value=""/> </div> <div class="lp-input-group"> <label class="lp-label" for="prod-name">Name</label> <input class="lp-input lp-input--light" data-moz-autofill-type="name" id="prod-name" name="name" required="" value=""/> </div> <div class="lp-input-group"> <label class="lp-label" for="prod-email">Email</label> <input class="lp-input lp-input--light" data-moz-autofill-type="email" id="prod-email" name="email" required="" type="email" value=""/> </div> <div class="lp-input-group"> <label class="lp-label" for="prod-phone">Phone</label> <input class="lp-input lp-input--light" data-moz-autofill-type="tel" id="prod-phone" name="phoneNumber" required="" type="tel" value=""/> </div> <div class="lp-input-group m16"> <label class="lp-label" for="prod-message">Message</label> <textarea class="lp-input" id="prod-message" name="message" required="" value=""></textarea> </div> <div class="lp-disclaimer"> <label for="-termsAccepted" style="display: none;">Opt In/Disclaimer Consent:</label> <label class="lp-tcr-content"> <span class="lp-tcr-checkbox"> <input id="-termsAccepted" name="termsAccepted" oninput="this.setCustomValidity('')" oninvalid="this.setCustomValidity('Please accept the terms and conditions')" required="" type="checkbox"/></span> <span class="lp-tcr-message"> I agree to be contacted by Candace Hagen via call, email, and text for real estate services. To opt out, you can reply 'stop' at any time or reply 'help' for assistance. You can also click the unsubscribe link in the emails. Message and data rates may apply. Message frequency may vary. <a href="/terms-and-conditions" target="_blank">Privacy Policy</a>. </span> </label> </div> <input name="source" style="display: none;" type="text" value="CONTACT_INQUIRY"/> <button class="submitButton lp-btn button-style-2" type="submit"> <span class="label-initial">Submit</span> <span class="label-loading">Submitting</span> <span class="label-success">Submitted</span> <span class="submit-icon lp-i lp-i--circle-notch lp-i--spin"></span> </button> <p class="success-message success hide"> Message sent successfully! </p>
</form>

</fieldset></body></html>
