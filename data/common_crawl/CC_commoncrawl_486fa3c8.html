 target="_blank">Privacy Policy</a>. </span> </label> </div> <input name="source" type="hidden" value="CONTACT_INQUIRY"/> <button class="contact-form__submit btn lp-btn lp-btn--filled button-style-2" type="submit"> <span class="sync-icon lp-i--spin"> </span> <span class="success-icon"> </span> Submit<span class="success-text">ted</span> </button>
