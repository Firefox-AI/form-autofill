<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group col-md-6"> <label>First Name:</label> <input class="form-control" data-moz-autofill-type="given-name" name="firstname" placeholder="First Name" type="text"/> </div> <div class="form-group col-md-6"> <label>Last Name:</label> <input class="form-control" data-moz-autofill-type="family-name" name="lastname" placeholder="Last Name" type="text"/> </div> <div class="form-group col-md-6"> <label>Organization:</label> <input class="form-control" data-moz-autofill-type="organization" name="org" placeholder="Organization" type="text"/> </div> <div class="form-group col-md-6"> <label>Address:</label> <input class="form-control" data-moz-autofill-type="street-address" name="address" placeholder="Address" type="text"/> </div> <div class="form-group col-md-6"> <label>Email: *</label> <input class="form-control validate[required,custom[email]]" data-moz-autofill-type="email" name="email" placeholder="Email" type="email"/> </div> <div class="form-group col-md-6"> <label>Phone: </label> <input class="inputborderSecond form-control" data-moz-autofill-type="tel" name="phone" placeholder="Phone" type="tel"/> </div> <div class="form-group col-md-6"> <label>Services &amp; Products of Interest: *</label> <textarea class="form-control" name="service1" placeholder="Services &amp; Products of Interest" rows="2">RNAi for Breeding Nematode Resistant Varieties</textarea> </div> <div class="form-group col-md-6"> <label>Project Description:</label> <textarea class="form-control" name="description" placeholder="Project Description" rows="2"></textarea> </div> <input id="g-recaptcha-responseid" name="g-recaptcha-response" type="hidden"/> <input name="refAuthor" type="hidden" value=""/> <div class="col-md-6"> <button class="btn btn-default inquiry-submit" onclick="onClickSubmit1(this)" type="button">Submit</button><input name="act" type="hidden" value="send"/> </div>
</form>

</fieldset></body></html>
