<html><head>

<body>

<fieldset>
<h3>accounts.google.com</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-step form-step-active"><div class="register-modal-title"><h4>Your Personal Details</h4></div><div class="row" id="StepOneField"><div class="col-md-6"><label>First Name</label><input data-moz-autofill-type="given-name" id="registerFirstName" placeholder="First Name" type="text"/><span class="text-danger" id="registerFirstNameError"></span></div><div class="col-md-6"><label>Last Name</label><input data-moz-autofill-type="family-name" id="registerLastName" placeholder="Last Name" type="text"/><span class="text-danger" id="registerLastNameError"></span></div><div class="col-md-12"><label>Email</label><input data-moz-autofill-type="email" id="registerEmail" placeholder="Email" type="email"/><span class="text-danger" id="registerEmailError"></span></div><div class="col-md-12"><label>Telephone</label><input data-moz-autofill-type="tel" id="registerTelephone" placeholder="Telephone" type="number"/><span class="text-danger" id="registerTelephoneError"></span></div></div><div class="register-modal-btns"><button class="next-btn" type="button">Continue <i aria-hidden="true" class="fa fa-long-arrow-right"></i></button></div><div class="register-or-continue"><p>or continue with</p><div class="register-socials"><a href="https://accounts.google.com/o/oauth2/auth?response_type=code&amp;redirect_uri=https%3A%2F%2Fwww.phonebot.com.au%2Findex.php%3Froute%3Dmodule%2Ftmdsociallogin%2Fgogleredirect&amp;client_id=733708905880-qvbdjcuu5cj7p8r4aesjo3i72sul6pjt.apps.googleusercontent.com&amp;scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email&amp;access_type=offline&amp;approval_prompt=force"><img alt="Google" loading="lazy" src="https://www.phonebot.com.au/image/google.png"/>Google</a><div id="signin-button"><a class="social-icon-apple" href="https://www.phonebot.com.au/index.php?route=apple/login/start"><img alt="Apple" loading="lazy" src="https://www.phonebot.com.au/image/catalog/login-social/apple-social.png"/>Apple</a></div><a onclick="facebookLogin()"><img alt="Facebook" loading="lazy" src="https://www.phonebot.com.au/image/facebook.png"/>Facebook</a></div><h5><span>Already a member? Log-in </span><button id="openLoginModal" type="button">here. </button></h5></div></div><div class="form-step"><div class="register-modal-title"><h4>Your Address</h4></div><div class="row" id="StepTwoField"><div class="col-md-12"><label>Company</label><input data-moz-autofill-type="organization" id="registerCompany" placeholder="Company" type="text"/></div><div class="col-md-12"><label>Address 1</label><input data-moz-autofill-type="address-line1" id="registerAddress_1" placeholder="Address 1" type="text"/><span class="text-danger" id="registerAddress1Error"></span></div><div class="col-md-12"><label>Address 2</label><input data-moz-autofill-type="address-line2" id="registerAddress_2" placeholder="Address 2" type="text"/></div><div class="col-md-12"><label>City</label><input data-moz-autofill-type="address-level2" id="registerCity" placeholder="City" type="text"/><span class="text-danger" id="registerCityError"></span></div><div class="col-md-12"><label>Post Code</label><input data-moz-autofill-type="postal-code" id="registerPostCode" placeholder="Post Code" type="number"/><span class="text-danger" id="registerPostCodeError"></span></div><div class="col-md-12"><label>Country</label><select data-moz-autofill-type="country" id="registerCountry" name="country_id"><option selected="selected" value="13">Australia</option><option value="153">New Zealand</option></select><span class="text-danger" id="registerCountryError"></span></div><div class="col-md-12"><label>Region/State</label><select data-moz-autofill-type="address-level1" id="registerZone" name="zone_id"></select><span class="text-danger" id="registerZoneError"></span></div></div><div class="register-more-btns"><button class="prev-btn" type="button"><i aria-hidden="true" class="fa fa-long-arrow-left"></i> Previous</button><button class="next-btn" type="button">Continue <i aria-hidden="true" class="fa fa-long-arrow-right"></i></button></div></div><div class="form-step"><div class="register-modal-title"><h4>Create Password</h4></div><div class="row" id="StepThreeField"><div class="col-md-12 register-password"><label>Password</label><input id="registerPassword" placeholder="Password" type="password"/><button aria-label="Show password" data-password-field="registerPassword" data-toggle="password-visibility" type="button"><span class="eye" id="eye-close"><i aria-hidden="true" class="fa fa-eye-slash"></i></span><span class="eye" id="eye-open" style="display: none;"><i aria-hidden="true" class="fa fa-eye"></i></span></button><span class="text-danger" id="registerPasswordError"></span></div><div class="col-md-12 register-password"><label>Confirm Password</label><input id="registerConfirmPassword" placeholder="Confirm Password" type="password"/><button aria-label="Show confirm password" data-password-field="registerConfirmPassword" data-toggle="password-visibility" type="button"><span class="eye" id="eye-close-confirm"><i aria-hidden="true" class="fa fa-eye-slash"></i></span><span class="eye" id="eye-open-confirm" style="display: none;"><i aria-hidden="true" class="fa fa-eye"></i></span></button><span class="text-danger" id="registerConfirmPasswordError"></span></div><div class="col-md-12 regiter-subscribe"><input id="registerSubscribe" type="checkbox"/><label> Subscribe to our newsletter for exclusive content and early access to promotions.I have read and agree to the </label></div><div class="col-md-12" style="margin-top: 10px;"><div class="g-recaptcha" data-sitekey="6Lc43YMeAAAAAJM5vrJ5oQZfOJfL3AXgeAjZyyqp" id="pb-recaptcha-register-popup"></div><div class="text-danger" id="registerRecaptchaError" style="margin-top:6px;"></div></div></div><div class="register-btns-submit"><button type="button">Create an account <i aria-hidden="true" class="fa fa-long-arrow-right"></i></button><button class="prev-btn prev-submit" type="button"><i aria-hidden="true" class="fa fa-long-arrow-left"></i> Previous</button></div><div class="register-create-account"><p><span>By creating an account, you agree to our </span><a href="https://www.phonebot.com.au/terms">Terms of Service</a><span> and </span><a href="https://www.phonebot.com.au/privacy">Privacy Policy</a>.</p></div></div>
</form>

</fieldset></body></html>
