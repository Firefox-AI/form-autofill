<form>
<div class="generic-form__field-wrapper"> <label class="input-field"> <span class="input-field__label">Email address *</span> <input autocomplete="email" class="input-field__input" data-moz-autofill-type="email" name="email" placeholder="Your email address" required="required" type="email" value=""/> </label> </div> <div class="generic-form__field-wrapper"> <label class="input-field"> <span class="input-field__label">First name </span> <input autocomplete="given-name" class="input-field__input" data-moz-autofill-type="given-name" name="firstName" placeholder="Your first name" type="" value=""/> </label> </div> <div class="generic-form__field-wrapper"> <label class="input-field"> <span class="input-field__label">Last name </span> <input autocomplete="family-name" class="input-field__input" data-moz-autofill-type="family-name" name="lastName" placeholder="Your last name" type="" value=""/> </label> </div> <div class="generic-form__field-wrapper"> <fieldset class="checkbox-group" data-required="true"> <legend class="checkbox-group__label">Language *</legend> <div class="checkbox-group__grid"> <div class="checkbox-group__col"> <label class="checkbox"> <span class="checkbox__input-wrapper"> <input class="checkbox__input" name="language" type="checkbox" value="de"/> <span class="checkbox__text">German </span> </span> </label> </div> <div class="checkbox-group__col"> <label class="checkbox"> <span class="checkbox__input-wrapper"> <input class="checkbox__input" name="language" type="checkbox" value="en"/> <span class="checkbox__text">English </span> </span> </label> </div> <div class="checkbox-group__col"> <label class="checkbox"> <span class="checkbox__input-wrapper"> <input class="checkbox__input" name="language" type="checkbox" value="es"/> <span class="checkbox__text">Spanish </span> </span> </label> </div> </div> </fieldset> </div> <div class="generic-form__field-wrapper"> <label class="checkbox"> <span class="checkbox__input-wrapper"> <input class="checkbox__input" name="accept" required="required" type="checkbox" value="1"/> <span class="checkbox__text">I have read and accepted the <a href="/en/node/8" target="_blank">data protection statement</a>. *</span> </span> </label> </div> <div class="generic-form__field-wrapper text-container"> <small>* Required fields</small> </div> <div class="form-buttons"> <div class="form-buttons__col"> <button class="button button--primary-strong button--colorful" data-label="Subscribe" type="submit"> Subscribe </button> </div> </div>
</form>
