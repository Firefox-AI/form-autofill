<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<label class="field-label" for="name">"<span class="text-span-5">*</span>" indicates required fields</label><div class="div-block-5"><div><label for="Full-Name"><strong>Full Name </strong><span class="text-span-4"><strong class="bold-text">*</strong></span></label><input class="text-field-2 w-input" data-moz-autofill-type="name" data-name="Full Name" id="Full-Name" maxlength="256" name="Full-Name" placeholder="Full Name" required="" type="text"/></div><div><label for="Phone"><strong>Phone </strong><span class="text-span-3"><strong class="bold-text-2">*</strong></span></label><input class="text-field w-input" data-moz-autofill-type="tel" data-name="Phone" id="Phone" maxlength="256" name="Phone" placeholder="(###) ###-####" required="" type="tel"/></div><div><label for="Select-a-Service"><strong>How can we help? </strong><span class="text-span-3"><strong class="bold-text-2">*</strong></span></label><select class="select-field w-select" data-name="Select a Service" id="Select-a-Service" name="Select-a-Service" required=""><option value="Select a option...">Select a option...</option><option value="Basement Waterproofing">Basement Waterproofing</option><option value="Foundation Repair">Foundation Repair</option><option value="Sump Pump Repair/Installation">Sump Pump Repair/Installation</option><option value="Drainage Systems">Drainage Systems</option><option value="Moisture Control">Moisture Control</option><option value="Cooling Services">Cooling Services</option><option value="Heating Services">Heating Services</option><option value="Plumbing Services">Plumbing Services</option></select></div><div><label for="email"><strong>Email </strong><span class="text-span-3"><strong class="bold-text-2">*</strong></span></label><input class="text-field-3 w-input" data-moz-autofill-type="email" data-name="Email" id="email" maxlength="256" name="email" placeholder="email@domain.com" required="" type="email"/></div></div><label for="Address"><strong>Address </strong><span class="text-span-3"><strong class="bold-text-2">*</strong></span></label><input class="text-field-2 w-input" data-moz-autofill-type="street-address" data-name="Address" id="Address" maxlength="256" name="Address" placeholder="Address" required="" type="text"/><div class="div-block-5"><div><label class="field-label-2" for="City">City</label><input class="text-field-2 w-input" data-moz-autofill-type="address-level2" data-name="City" id="City" maxlength="256" name="City" placeholder="City" required="" type="text"/></div><div><label for="Zip"><strong class="field-label-2">Zip</strong></label><input class="text-field w-input" data-moz-autofill-type="postal-code" data-name="Zip" id="Zip" maxlength="256" name="Zip" placeholder="" type="text"/></div></div><label for="field-2"><strong>How can we help? </strong><span class="text-span-3"><strong class="bold-text-2">*</strong></span></label><textarea class="textarea w-input" data-name="How Can We Help" id="How-Can-We-Help" maxlength="5000" name="How-Can-We-Help" placeholder="Example Text"></textarea><div class="w-form-formrecaptcha g-recaptcha g-recaptcha-error g-recaptcha-disabled" data-sitekey="6LeeQ5ksAAAAALXbnfR4HeT-lHVT4hqHZTCQ3Vji"></div><label for="field-2"><strong>Consent</strong></label><label class="w-checkbox"><input class="w-checkbox-input" data-name="Checkbox" id="Checkbox" name="Checkbox" type="checkbox"/><span class="checkbox-label-2 w-form-label" for="Checkbox">By ticking this checkbox, you are granting us permission to contact you through text messages (SMS). These messages are designed to be brief and will be delivered directly to your mobile device for quick and immediate communication. Please note that standard messaging rates may apply, depending on your mobile plan and service provider.</span></label><input class="submit-button w-button" data-wait="Please wait..." type="submit" value="Submit"/>
</form>

</fieldset></body></html>
