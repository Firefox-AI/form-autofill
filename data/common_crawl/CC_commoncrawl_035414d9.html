<form>
<input id="Tour" name="Tour" type="hidden" value="Sunrise Taj Mahal Tour"/> <h5 class="package-d-head">Book This Package</h5> <div class="row"> <div class="col-lg-12"> <input data-moz-autofill-type="name" name="name" placeholder="Your Full Name" required="required" type="text"/> </div> <div class="col-lg-12"> <input data-moz-autofill-type="email" name="email" placeholder="Your Email" required="required" type="email"/> </div> <div class="col-lg-12"> <input data-moz-autofill-type="tel" name="phone" placeholder="Phone" required="required" type="tel"/> </div> <div class="col-lg-12"> <input data-moz-autofill-type="country" name="country" placeholder="Country" required="required" type="text"/> </div> <div class="col-lg-12"> <select class="form-select" name="hotel" required="required"> <option selected="">Hotel Type</option> <option value="3 Star Hotel">3 Star Hotel</option> <option value="4 Star Hotel">4 Star Hotel</option> <option value="5 Star Hotel">5 Star Hotel</option> <option value="5 Star Luxury Hotel">5 Star Luxury Hotel</option> </select> </div> <div class="col-lg-6"> <select class="form-select" name="adults" required="required"> <option selected="">Adult</option> <option value="1">1</option> <option value="2">2</option> <option value="3">3</option> <option value="4">4</option> <option value="5">5</option> <option value="6">6</option> <option value="7">7</option> <option value="8">8</option> <option value="9">9</option> <option value="10">10+</option> </select> </div> <div class="col-lg-6"> <select aria-label="Default select example" class="form-select" name="child"> <option selected="">Child</option> <option value="1">1</option> <option value="2">2</option> <option value="3">3</option> <option value="4">4</option> <option value="5">5</option> <option value="6">6</option> <option value="7">7</option> <option value="8">8</option> <option value="9">9</option> <option value="10">10+</option> </select> </div> <div class="col-lg-12"> <div class="calendar-input"> <input class="input-field check-in" name="tourdate" placeholder="dd-mm-yy" required="required" type="text"/> <i class="flaticon-calendar"></i> </div> </div> <div class="col-lg-12"> <textarea cols="30" name="desc" placeholder="Message" required="required" rows="4"></textarea> </div> <div class="capbox form-group"> <div id="CaptchaDiv"></div> <div class="capbox-inner"> Type the number:<br/> <input id="txtCaptcha" type="hidden"/> <input id="CaptchaInput" name="CaptchaInput" size="15" type="text"/><br/> </div> </div> <div class="col-lg-12"> <input type="submit" value="Book Now"/> </div> </div>
