ow form__row-textarea"> <h2><label for="other">その他</label></h2> <p> <textarea cols="50" id="other" name="other" rows="5"></textarea> </p> </div> <p class="privacypolicy">お問い合わせ前に弊社の<a href="https://recruit.headlight-inc.com/privacy/">「プライバシーポリシー」</a>をご確認いただき、ご同意の上「送信」をお願いいたします。</p> <p class="error-message">入力内容に問題があります。<br class="sp-only"/>確認して再度お試しください。</p> <div class="form__submit"> <button class="subit" name="subit" type="submit" value="send">送信</button> </div><input name="mw-wp-form-form-id" type="hidden" value="667"/><input name="mw_wp_form_token" type="hidden" value="450edaaf75b067d76858ad9ffba3d86df6414dbdf820f0b105dc1dd1c80a1025"/></div>
