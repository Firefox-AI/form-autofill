<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Please Rate Our Service</label></div> <div class="twelve columns review-rating"> <label for="rating-five" style="display:inline;"><input id="rating-five" name="rating" type="radio" value="5"/><span class="custom radio"></span> 5 (excellent)</label> <label for="rating-four" style="display:inline;"><input id="rating-four" name="rating" type="radio" value="4"/><span class="custom radio"></span> 4</label> <label for="rating-three" style="display:inline;"><input id="rating-three" name="rating" type="radio" value="3"/><span class="custom radio"></span> 3 (good)</label> <label for="rating-two" style="display:inline;"><input id="rating-two" name="rating" type="radio" value="2"/><span class="custom radio"></span> 2</label> <label for="rating-one" style="display:inline;"><input id="rating-one" name="rating" type="radio" value="1"/><span class="custom radio"></span> 1 (poor)</label> </div> </div> <div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Would You Recommend Our Locksmith Services?</label></div> <div class="twelve columns"> <label for="recommend-yes" style="display:inline;"><input id="recommend-yes" name="recommend" type="radio" value="Yes"/><span class="custom radio"></span> Yes</label> <label for="recommend-no" style="display:inline;"><input id="recommend-no" name="recommend" type="radio" value="No"/><span class="custom radio"></span> No</label> </div> </div> <div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Review Title :</label></div> <div class="twelve columns"><input id="reviewTitle" name="reviewTitle" type="text"/></div> </div> <div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Your Review:</label></div> <div class="twelve columns"><textarea id="reviewDescription" name="reviewDescription" rows="4"></textarea></div> </div> <div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Your Name (this may be published) :</label></div> <div class="twelve columns"><input data-moz-autofill-type="name" id="Name" name="Name" placeholder="eg. Mr. A Jones, Mrs. M" type="text"/></div> </div> <div class="row collapse"> <div class="twelve columns"><label class="formsection-title">Postcode (where work was carried out) :</label></div> <div class="twelve columns"><input data-moz-autofill-type="postal-code" id="postcode" name="postcode" placeholder="EX2" type="text"/></div> </div> <div class="row collapse"> <div class="twelve columns"><span class="has-tip float-right smalltext" data-width="210" title="This will appear on the job sheet given to you by your locksmith. The unique job number is needed for our verification process.">What is this?</span><label class="formsection-title">Job Number :</label></div> <div class="twelve columns"><input id="jobno" name="jobno" placeholder="From Jobsheet eg. 367100" type="text"/></div> <input id="Area" name="Area" type="hidden" value=""/> </div> <div class="is-hidden"> <label> <input id="URL" name="URL" type="text"/> </label> </div> <div class="row collapse text-center"> <p class="smalltext">By submitting your review, you agree to have your review displayed on our websites and marketing materials</p> </div> <div class="row collapse"> <input class="success button large button-expand" id="sendmail" name="sendmail" type="submit" value="Submit Review"/> </div>
</form>

</fieldset></body></html>
