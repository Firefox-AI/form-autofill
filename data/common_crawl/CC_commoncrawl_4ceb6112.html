<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input class="inp contact-popup__input" data-moz-autofill-type="name" name="name" placeholder="Full Name" required="" type="text"/> <input class="inp contact-popup__input" data-moz-autofill-type="email" name="email" pattern="[a-zA-Z0-9.!#$%&amp;’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+" placeholder="Email" required="" type="email"/> <input class="inp contact-popup__input" data-moz-autofill-type="tel" name="phone" placeholder="Phone" required="" type="tel"/> <div class="h-pot"> <label for="__ebookMiddleName">Middle Name</label> <input autocomplete="off" data-moz-autofill-type="additional-name" id="__ebookMiddleName" name="middleName" tabindex="-1" value=""/> </div> <textarea class="inp contact-popup__input" name="message" placeholder="Message" required=""></textarea> <div class="lp-disclaimer"> <label for="-termsAccepted" style="display: none;">Opt In/Disclaimer Consent:</label> <label class="lp-tcr-content"> <span class="lp-tcr-checkbox"> <input id="-termsAccepted" name="termsAccepted" oninput="this.setCustomValidity('')" oninvalid="this.setCustomValidity('Please accept the terms and conditions')" required="" type="checkbox"/></span> <span class="lp-tcr-message"> I agree to be contacted by Donna Calamia via call, email, and text for real estate services. To opt out, you can reply 'stop' at any time or reply 'help' for assistance. You can also click the unsubscribe link in the emails. Message and data rates may apply. Message frequency may vary. <a href="/terms-and-conditions" target="_blank">Privacy Policy</a>. </span> </label> </div> <button class="btn btn--solid-black contact-popup__submit button-style-1" type="submit">SUBMIT</button> <p class="success hide"> Message sent successfully! </p>
</form>

</fieldset></body></html>
