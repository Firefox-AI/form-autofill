<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_key" type="hidden" value="8CPfUm7CGwYtlV7e"/> <fieldset class="fieldset" data-hasrequired="* Pflichtfelder"> <div class="field required"> <label class="label" for="amfaq-title"> Ihre Frage: </label> <div class="control"> <textarea class="required-entry input-text" cols="5" data-bind="value: title" id="amfaq-title" name="title" placeholder="Geben Sie Ihre Frage hier ein" rows="3" title="Question"></textarea> </div> </div> <div class="field"> <label class="label" for="amfaq-name"> Ihr Name: </label> <div class="control"> <input class="input-text" data-bind="value: name" data-moz-autofill-type="name" id="amfaq-name" name="name" title="Name" type="text"/> </div> </div> <div class="field"> <input data-bind="event: {change: toggleEmail($element)};" id="amfaq-notification" name="notification" title="Notification" type="checkbox" value="1"/> <label class="label" for="amfaq-notification"> Benachrichtigung per E-Mail, wenn Geantwortet wurde </label> </div> <div class="field amfaq-hidden email-field required" data-bind="fadeVisible: isEmailVisible"> <label class="label required" for="amfaq-email"> Ihre E-Mail: </label> <div class="control"> <input class="required validate-email" data-bind="value: email" data-moz-autofill-type="email" id="amfaq-email" name="email" title="E-Mail" type="text"/> </div> </div> <button class="action submit primary" type="submit"> Frage abschicken </button> </fieldset>
</form>

</fieldset></body></html>
