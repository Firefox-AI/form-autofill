<html><head>

<body>

<fieldset>
<h3>casartusi.it</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div style="display:none;"><input name="_method" type="hidden" value="POST"/></div><input class="input--antibot-timestamp" id="6a7c5e731fdac_AntibotTimestamp" name="data[_Antibot][timestamp]" type="hidden" value="1786535538"/><input class="input--antibot-honeypot" id="6a7c5e731fdac_AntibotHoneypot" name="data[_Antibot][honeypot]" type="hidden" value='{"name":"h_website_url","type":"url","model":"User"}'/><div data-toggle="remove" style="display: none;"><div class="input url form-group form-group-h-website-url"><label class="form-label" for="6a7c5e731fdacUserHWebsiteUrl">Lascia vuoto questo campo</label><div class="controls"><input autocomplete="off" class="form-control input-h-website-url" id="6a7c5e731fdacUserHWebsiteUrl" name="data[User][h_website_url]" type="url"/></div></div></div> <p class="form-help">Il simbolo <i>*</i> indica che il campo è obbligatorio.</p> <div class="input text required form-group form-group-first-name"><label class="form-label" for="6a7c5e73202c7UserFirstName"><i>*</i> Nome</label><div class="controls"><input autocomplete="given-name" class="form-control input-first-name" data-moz-autofill-type="given-name" id="6a7c5e73202c7UserFirstName" maxlength="255" name="data[User][first_name]" required="required" type="text"/></div></div><div class="input text required form-group form-group-last-name"><label class="form-label" for="6a7c5e73202c7UserLastName"><i>*</i> Cognome</label><div class="controls"><input autocomplete="family-name" class="form-control input-last-name" data-moz-autofill-type="family-name" id="6a7c5e73202c7UserLastName" maxlength="255" name="data[User][last_name]" required="required" type="text"/></div></div><div class="input text form-group form-group-company-name"><label class="form-label" for="6a7c5e73202c7UserCompanyName">Ragione Sociale</label><div class="controls"><input autocomplete="organization" class="form-control input-company-name" data-moz-autofill-type="organization" id="6a7c5e73202c7UserCompanyName" maxlength="255" name="data[User][company_name]" type="text"/></div></div><div class="input text form-group form-group-partita-iva"><label class="form-label" for="6a7c5e73202c7UserPartitaIva">Partita IVA</label><div class="controls"><input class="form-control input-partita-iva" id="6a7c5e73202c7UserPartitaIva" maxlength="255" name="data[User][partita_iva]" type="text"/></div></div><div class="input text required form-group form-group-codice-fiscale"><label class="form-label" for="6a7c5e73202c7UserCodiceFiscale"><i>*</i> Codice Fiscale</label><div class="controls"><input class="form-control input-codice-fiscale" data-moz-autofill-type="id-number" id="6a7c5e73202c7UserCodiceFiscale" maxlength="255" name="data[User][codice_fiscale]" required="required" type="text"/></div></div><div class="input tel required form-group form-group-phone"><label class="form-label" for="6a7c5e73202c7UserPhone"><i>*</i> Telefono</label><div class="controls"><input autocomplete="tel" class="form-control input-phone" data-moz-autofill-type="tel" id="6a7c5e73202c7UserPhone" maxlength="255" name="data[User][phone]" required="required" type="tel"/></div></div><div class="input email required form-group form-group-email"><label class="form-label" for="6a7c5e73202c7UserEmail"><i>*</i> Email</label><div class="controls"><input autocomplete="email" class="form-control input-email" data-mailcheck="Intendevi {{suggestion}}?" data-moz-autofill-type="email" id="6a7c5e73202c7UserEmail" maxlength="100" name="data[User][email]" required="required" type="email"/></div></div><div class="input password required form-group form-group-password"><label class="form-label" for="6a7c5e73202c7UserPassword"><i>*</i> Password</label><div class="controls"><input class="strength-password form-control input-password" data-min-length="8" data-normal-label="Media" data-strength-factor="0.6" data-strong-label="Forte" data-weak-label="Debole" help="Minimo 8 caratteri" id="6a7c5e73202c7UserPassword" name="data[User][password]" pattern=".{8,}" required="required" title="Minimo 8 caratteri" type="password" value=""/></div><p class="form-text">Minimo 8 caratteri</p></div><input class="input-timezone" id="6a7c5e73202c7UserTimezone" name="data[User][timezone]" type="hidden"/><input class="input-gdpr-text" data-field="gdpr-text" id="6a7c5e73202c7UserGdprText" name="data[User][gdpr_text]" type="hidden"/><div class="input radio form-group form-group-gdpr-cons gdpr-consent form-group-acceptance" data-gdpr-text="#6a7c5e73202c7UserGdprText" data-modal-gdpr="#modalGDPRprivacy-area-eshop"><label class="form-label" for="6a7c5e73202c7UserGdprCons"><i>*</i> Acconsenti al <a href="https://www.casartusi.it/it/privacy-area-eshop/">trattamento dei dati</a>?</label><div class="controls"><div class="form-check"><input autocomplete="off" class="form-acceptance form-check-input input-gdpr-cons" id="6a7c5e73202c7UserGdprConsYES" name="data[User][gdpr_cons]" required="required" type="radio" value="YES"/><label class="form-check-label" for="6a7c5e73202c7UserGdprConsYES">Sì</label></div><div class="form-check"><input autocomplete="off" class="form-acceptance form-check-input input-gdpr-cons" id="6a7c5e73202c7UserGdprConsNO" name="data[User][gdpr_cons]" required="required" type="radio" value="NO"/><label class="form-check-label" for="6a7c5e73202c7UserGdprConsNO">No</label></div></div></div> <div class="form-actions"> <button class="btn btn-primary btn-submit" type="submit">Iscriviti</button> </div>
</form>

</fieldset></body></html>
