dule test drive" data-moz-autofill-type="postal-code" id="ZipCodeTestDrive" name="Zip" required="" type="tel"/> </div> </div> <div class="form-group"> </div> </div> <div class="col-md-6"> <h3>Test Drive Appointment:</h3> <div class="form-group"> <do-date-picker country="US" data-date-format="Y-m-d H:iK" data-enable-time="true" data-max-date="2026-08-23" dealer-id="32336" enable-dealer-dates="true" enable-dealer-hours="true" input-class="col-md-8 custom-dealer-styling__chevron-down--black" is-required="true" label="Preferred Date and Time:" label-class="col-md-4 control-label" language="en" name="selDateAndTime" placeholder="- Select Date and Time -"></do-date-picker> </div> </div> </div> <div class="row"> <div class="form-group col-md-12 form-group-disclaimers"> <div class="form-group checkbox col-sm-12"> <label for="tcpaDisclaimerTestDrive"> <input class="checkbox stat-checkbox" data-dlron-ext="true" data-dlron-type="textconsent" id="tcpaDisclaimerTestDrive" name="TCPA_Consent" style="z-index: 1;" type="checkbox" value="true"/> <p name="TCPA_Disclaimer"> Yes, I agree to receive marketing/promotional SMS messages from Serra Ford Gaylord, including special offers, exclusive incentives, event invitations, and dealership news. <br/> <input type="checkbox"/> Yes, I agree to receive informational/transactional SMS messages from Serra Ford Gaylord, such as appointment reminders, service updates, vehicle status notifications, and important account-related information. <br/> <input type="checkbox"/> By providing your mobile number and checking the above box/es, you agree to related text messages from Serra Ford Gaylord at the phone number you provided when signing up. Reply STOP to unsubscribe, Reply HELP for help. Message frequency varies. Message &amp; data rates may apply. Consent is not a condition of purchase. For more information, please review our <a href="/privacy.aspx">Privacy Policy</a> and <a href="/sms-terms-of-service.html">Terms of Service</a>. </p> </label> <
