<body>

<fieldset>
<h3>estheticon.it</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form-group form-group--large form-group--icon"> <label>Nome del medico/della clinica</label> <input autocomplete="off" class="large" data-label="Nome del medico/della clinica" data-msg-required="Compila tutti i campi obbligatori." data-placeholder="Nome del medico o della clinica" id="name" name="name" placeholder="Nome del medico/della clinica" type="text" value=""/> <div class="form-group__icon"> </div> </div> <div class="form-group form-group--large form-group--icon"> <label>Cognome</label> <input autocomplete="off" class="large" data-label="Cognome" data-moz-autofill-type="family-name" data-msg-required="Compila tutti i campi obbligatori." data-placeholder="Cognome del medico" id="surname" name="surname" placeholder="Cognome" type="text" value=""/> <div class="form-group__icon"> </div> </div> <div class="form-group form-group--large form-group--icon"> <label>Indirizzo e-mail</label> <input autocomplete="off" class="large" data-label="Indirizzo e-mail" data-moz-autofill-type="email" data-msg-email="Inserisci l'email corretta." data-msg-remote="Questo indirizzo e-mail è già stato registrato. Se è tuo puoi fare il login. &lt;a data-open-auth-modal=&quot;login&quot; data-auth-params='{:AUTH_PARAMS}'&gt;Hai dimenticato la password?&lt;/a&gt;" data-msg-required="Compila tutti i campi obbligatori." data-placeholder="La tua email non sarà pubblicata!" fieldtype="email" id="email" name="email" placeholder="Indirizzo e-mail" type="email" value=""/> <div class="form-group__icon"> </div> </div> <div class="form-group form-group--large form-group--icon relative"> <label>Scelga una password</label> <input autocomplete="off" class="large" data-label="Scelga una password" data-msg-minlength="Inserisci almeno 6 caratteri." data-msg-required="Compila tutti i campi obbligatori." data-placeholder="Min. 6 caratteri..." id="password" name="password" placeholder="Scelga una password" type="password" value=""/> <i aria-title="Visualizza i caratteri della password" class="fa fa-eye form__input-icon form__input-icon--pwd js-show-password hide" data-for="password" role="button"></i> <div class="form-group__icon"> </div> </div> <div class="mt-1@small mb-1@small"> <label class="inline form-check" for="terms1"> <input data-msg-required="Per la registrazione è necessario accettare le condizioni." id="terms1" name="terms1" type="checkbox" value="1"/> <div class="form-checkbox"><i class="fa fa-check"></i></div> <div class="form-checkbox"><i class="fa fa-check"></i></div>Accetto i <a href="https://www.estheticon.it/criteria" target="_blank">Termini e le Condizioni di uso</a>, nonché <a href="https://www.estheticon.it/privacy-policy-doctor" target="_blank">l'Informativa sulla tutela della privacy</a>. Acconsento, inoltre, <a href="https://www.estheticon.it/personal-data-agreement-doctor" target="_blank"> all’elaborazione dei miei dati personali</a>. </label> </div> <div class="a-spm"> <input class="a-spm" id="phone" name="phone" type="text" value=""/> <input class="a-spm" id="address" name="address" type="text" value=""/> <input class="a-spm" id="signup_form_add" name="signup_form_add" type="submit" value="Aggiungi recensione"/> </div> <div> <button class="button button--primary button--block large" id="submit" name="submit" type="submit">Registrati e continua a creare il profilo</button> </div> <div class="row column text-center mt-1-5@small"> <a data-log-action="open" data-log-delay="false" data-log-source="client_signupform" data-log-type="login" data-logger="form" data-open-auth-modal="login" href="/sign-in">Hai già un account? Log in</a> </div>
</form>

</fieldset></body></html>
