<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="mt-10"> <input class="single-input" data-moz-autofill-type="name" name="NomeSegurado" onblur="this.placeholder = 'Nome do Segurado'" onfocus="this.placeholder = ''" placeholder="Nome do Segurado" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="tel-local" name="ContactoMovel" onblur="this.placeholder = 'Contacto Móvel'" onfocus="this.placeholder = ''" placeholder="Contacto Móvel" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="email" name="ContactoEmail" onblur="this.placeholder = 'Contacto Email'" onfocus="this.placeholder = ''" placeholder="Contacto Email" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="id-number" name="NIF" onblur="this.placeholder = 'Número de Contribuinte'" onfocus="this.placeholder = ''" placeholder="Número de Contribuinte" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="bday" name="DataNascimento" onblur="this.placeholder = 'Data de Nascimento'" onfocus="this.placeholder = ''" placeholder="Data de Nascimento" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="postal-code" name="CPMorada" onblur="this.placeholder = 'Código Postal da Morada'" onfocus="this.placeholder = ''" placeholder="Código Postal da Morada" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" data-moz-autofill-type="other" name="Profissao" onblur="this.placeholder = 'Profissão'" onfocus="this.placeholder = ''" placeholder="Profissão" required="" type="text"/> </div> <div class="input-group-icon mt-10"> <div class="icon"><i aria-hidden="true" class="fa fa-ellipsis-v"></i></div> <div class="form-select" id="default-select"> <select name="Segurado"> <option value="Imóvel">Imóvel</option> <option value="Recheio">Recheio</option> <option value="Imóvel e Recheio">Imóvel e Recheio</option> </select> </div> </div> <div class="mt-10"> <input class="single-input" name="Valor" onblur="this.placeholder = 'Valor'" onfocus="this.placeholder = ''" placeholder="Valor" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" name="MetrosQuadrados" onblur="this.placeholder = 'Metros Quadrados'" onfocus="this.placeholder = ''" placeholder="Metros Quadrados" required="" type="text"/> </div> <div class="mt-10"> <input class="single-input" name="AnoConstrucao" onblur="this.placeholder = 'Ano de Construção'" onfocus="this.placeholder = ''" placeholder="Ano de Construção" required="" type="text"/> </div> <div class="input-group-icon mt-10"> <div class="icon"><i aria-hidden="true" class="fa fa-ellipsis-v"></i></div> <div class="form-select" id="default-select"> <select name="TipoImovel"> <option value="Moradia">Moradia</option> <option value="Andar">Andar</option> <option value="Edifício">Edifício</option> </select> </div> </div> <div class="mt-10"> <input class="single-input" name="DispositivosSeguranca" onblur="this.placeholder = 'Dispositivos de Segurança'" onfocus="this.placeholder = ''" placeholder="Dispositivos de Segurança" type="text"/> </div> <div class="mt-10"> <input class="genric-btn primary" type="submit" value="ENVIAR"/> </div>
</form>

</fieldset></body></html>
