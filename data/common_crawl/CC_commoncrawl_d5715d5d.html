<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label>Company website (leave this field empty)<input autocomplete="off" name="company_website" tabindex="-1" type="text"/></label></div><div class="expert-form-grid"><div class="expert-form-field"><label for="ef-name">Name <span>*</span></label><input data-moz-autofill-type="name" id="ef-name" name="name" placeholder="Your full name" required="" type="text" value=""/></div><div class="expert-form-field"><label for="ef-email">Email <span>*</span></label><input data-moz-autofill-type="email" id="ef-email" name="email" placeholder="your@email.com" required="" type="email" value=""/></div><div class="expert-form-field"><label for="ef-phone">Phone *</label><input data-moz-autofill-type="tel" id="ef-phone" name="phone" placeholder="+44 or +1…" required="" type="tel"/></div><div class="expert-form-field"><label for="ef-budget">Approximate Budget</label><select id="ef-budget" name="budget"><option value="">Select range</option><option value="under-100k">Under €100,000</option><option value="100-200k">€100,000 – €200,000</option><option value="200-350k">€200,000 – €350,000</option><option value="350-500k">€350,000 – €500,000</option><option value="500-750k">€500,000 – €750,000</option><option value="750k-1m">€750,000 – €1,000,000</option><option value="1m-plus">€1,000,000+</option></select></div><div class="expert-form-field expert-form-field--wide"><label>Destinations Interested In</label><div class="dest-multiselect"><div aria-expanded="false" aria-haspopup="listbox" class="dest-trigger" role="button" tabindex="0"><span class="dest-placeholder">Select destinations…</span></div><div aria-multiselectable="true" class="dest-dropdown" role="listbox"><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>Spain</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>France</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>Italy</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>USA — Colorado</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>USA — Florida</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>USA — California</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>USA — Utah</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>United Kingdom</div></div><div class="dest-group"><div class="dest-group-header"><span class="dest-group-arrow">›</span>Other</div></div></div></div></div><div class="expert-form-field expert-form-field--wide"><label for="ef-message">Message</label><textarea id="ef-message" name="message" placeholder="Tell us about the destination, property type, or anything else…" rows="4"></textarea></div></div><button class="expert-submit-btn" type="submit">Send Enquiry</button>
</form>

</fieldset></body></html>
