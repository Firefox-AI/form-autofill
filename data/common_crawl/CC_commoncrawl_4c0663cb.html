<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="input-group"><label for="Name">Vor- &amp; Nachname</label><input class="form-input w-input" data-moz-autofill-type="name" data-name="Name" id="Name" maxlength="256" name="Name" placeholder="Max Zimmermann" type="text"/></div><div class="input-group"><label for="Email">Email</label><input class="form-input w-input" data-moz-autofill-type="email" data-name="Email" id="Email" maxlength="256" name="Email" placeholder="beispiel@gmail.com" required="" type="email"/></div><div class="input-group-wrap"><div class="input-group"><label for="Telefon">Telefon</label><input class="form-input w-input" data-moz-autofill-type="tel" data-name="Telefon" id="Telefon" maxlength="256" name="Telefon" placeholder="+49123456789" type="tel"/></div><div class="input-group"><label for="Leistung">Leistung wählen</label><select class="form-select w-select" data-name="Leistung" id="Leistung" name="Leistung"><option value="">Leistung wählen..</option><option value="First">Neubaudächer</option><option value="Third">Holzrahmenbauhäuser</option><option value="Another option">Aufstockungen</option><option value="Second">Dachsanierung</option><option value="Another option">Hallenbau</option><option value="Another option">Dachgauben</option><option value="Another option">Carports</option><option value="Another option">Fassadenverkleidung</option><option value="Another option">Terrassen- und Gartenüberdachungen</option><option value="Another option">Dachfenster</option><option value="Another option">Weitere Holzbauarbeiten</option></select></div></div><div class="input-group-wrap"><div class="input-group"><label for="Ort">Wo?</label><input class="form-input w-input" data-name="Ort" id="Ort" maxlength="256" name="Ort" placeholder="Kleinwallstadt" type="text"/></div><div class="input-group"><label for="Wann">Wann?</label><input class="form-input w-input" data-name="Wann" id="Wann" maxlength="256" name="Wann" placeholder="Mai 2026" type="text"/></div></div><div class="input-group"><label for="Anliegen">Ihr Anliegen</label><input class="form-input w-input" data-name="Anliegen" id="Anliegen" maxlength="256" name="Anliegen" placeholder="Details zu Ihrem Projekt" type="text"/></div><input class="button-primary button-full w-button" data-wait="Bitte warten..." type="submit" value="Anfrage senden"/>
</form>

</fieldset></body></html>
