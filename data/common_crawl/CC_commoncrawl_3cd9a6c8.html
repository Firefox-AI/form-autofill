<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="source" type="hidden" value="proposal_modal"/> <div class="form-group"> <label for="modal_name">Name *</label> <input data-moz-autofill-type="name" id="modal_name" name="name" placeholder="Your full name" required="" type="text"/> </div> <div class="form-group"> <label for="modal_email">Email *</label> <input data-moz-autofill-type="email" id="modal_email" name="email" placeholder="your@email.com" required="" type="email"/> </div> <div class="form-group"> <label for="modal_phone">Phone</label> <input data-moz-autofill-type="tel" id="modal_phone" name="phone" placeholder="Phone" type="tel"/> </div> <div class="form-group"> <label for="modal_service">Service Interest</label> <select id="modal_service" name="service"> <option value="">Select a service...</option> <option value="Video Production">Video Production</option> <option value="Animation">Animation</option> <option value="Corporate Video">Corporate Video</option> <option value="Event Coverage">Event Coverage</option> <option value="Live Streaming">Live Streaming</option> <option value="Photography">Photography</option> <option value="Equipment Rental">Equipment Rental</option> </select> </div> <div class="form-group"> <label for="modal_message">Project Details</label> <textarea id="modal_message" name="message" placeholder="Describe your project..."></textarea> </div> <button class="btn btn-primary" type="submit">Request Proposal</button>
</form>

</fieldset></body></html>
