<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="flex flex-col md:flex-row gap-4"><input autocomplete="name" class="flex-1 rounded border border-[#E0E3EA] px-4 py-2 text-base text-[#23272F] bg-white" data-moz-autofill-type="name" maxlength="100" minlength="2" name="name" placeholder="Ihr Vor- und Nachname" required="" type="text"/><input autocomplete="organization" class="flex-1 rounded border border-[#E0E3EA] px-4 py-2 text-base text-[#23272F] bg-white" maxlength="100" name="company" placeholder="Ihr Unternehmen (optional)" type="text"/></div><div class="flex flex-col md:flex-row gap-4"><input autocomplete="email" class="flex-1 rounded border border-[#E0E3EA] px-4 py-2 text-base text-[#23272F] bg-white" data-moz-autofill-type="email" maxlength="254" name="email" placeholder="Ihre E-Mail-Adresse" required="" type="email"/><input autocomplete="tel" class="flex-1 rounded border border-[#E0E3EA] px-4 py-2 text-base text-[#23272F] bg-white" data-moz-autofill-type="tel" maxlength="50" name="phone" placeholder="Ihre Telefonnummer (optional)" type="text"/></div><textarea class="rounded border border-[#E0E3EA] px-4 py-2 text-base text-[#23272F] bg-white" maxlength="2000" minlength="10" name="message" placeholder="Ihre Nachricht an uns" required="" rows="3"></textarea><div class="flex items-center gap-2"><input class="accent-[#22C55E]" id="consent" name="consent" required="" type="checkbox"/><label class="text-sm text-[#5B5F67]" for="consent">Ich stimme der Verarbeitung meiner personenbezogenen Daten im Sinne der Datenschutzerklärung zu.</label></div><button class="mt-2 px-6 py-2 rounded bg-[#23272F] text-white font-semibold text-base shadow hover:bg-[#181A1B] transition disabled:opacity-60" type="submit">Nachricht senden</button>
</form>

</fieldset></body></html>
