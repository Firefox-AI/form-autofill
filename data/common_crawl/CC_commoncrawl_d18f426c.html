<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="bodyOuter"><div class="form-group pb-0 labelFlex"><label class="radio-inline radio-button-container"><input checked="" name="optradio" type="radio"/>USA <span class="checkmark"></span></label> <label class="radio-inline radio-button-container disabled"><input disabled="" name="optradio" type="radio"/>international - currently unavailable <span class="checkmark"></span></label></div> <div class="form-inline"><div class="form-group"><label for="fname">First name<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" data-moz-autofill-type="given-name" id="fname" maxlength="50" name="fname" onkeydown="return /^[a-zA-Z ]*$/i.test(event.key)" type="text"/></div> <div class="form-group"><label for="lName">Last name<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" data-moz-autofill-type="family-name" id="lName" maxlength="50" name="lName" onkeydown="return /^[a-zA-Z ]*$/i.test(event.key)" type="text"/></div></div> <div class="form-inline"><div class="form-group"><label for="email">Email address<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" data-moz-autofill-type="email" id="email" maxlength="100" name="email" type="text"/></div> <div class="form-group"><label for="firm">Enter firm<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" id="firm" maxlength="100" name="firm" onkeydown="return /^[a-zA-Z0-9 ]*$/i.test(event.key)" type="text"/></div></div> <div class="form-inline"><div class="form-group"><label for="city">City<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" data-moz-autofill-type="address-level2" id="city" maxlength="50" name="city" onkeydown="return /^[a-zA-Z0-9 ]*$/i.test(event.key)" type="text"/></div> <div class="form-group"><label for="state">State<span style="color: var(--naa-danger);">*</span></label> <select class="form-control" data-moz-autofill-type="address-level1" id="state" name="state"><option value="">-- select a state --</option> <option value="AK">AK</option> <option value="AL">AL</option> <option value="AR">AR</option> <option value="AZ">AZ</option> <option value="CA">CA</option> <option value="CO">CO</option> <option value="CT">CT</option> <option value="DC">DC</option> <option value="DE">DE</option> <option value="FL">FL</option> <option value="GA">GA</option> <option value="HI">HI</option> <option value="IA">IA</option> <option value="ID">ID</option> <option value="IL">IL</option> <option value="IN">IN</option> <option value="KS">KS</option> <option value="KY">KY</option> <option value="LA">LA</option> <option value="MA">MA</option> <option value="MD">MD</option> <option value="ME">ME</option> <option value="MI">MI</option> <option value="MN">MN</option> <option value="MO">MO</option> <option value="MS">MS</option> <option value="MT">MT</option> <option value="NC">NC</option> <option value="ND">ND</option> <option value="NE">NE</option> <option value="NH">NH</option> <option value="NJ">NJ</option> <option value="NM">NM</option> <option value="NV">NV</option> <option value="NY">NY</option> <option value="OH">OH</option> <option value="OK">OK</option> <option value="OR">OR</option> <option value="PA">PA</option> <option value="PR">PR</option> <option value="RI">RI</option> <option value="SC">SC</option> <option value="SD">SD</option> <option value="TN">TN</option> <option value="TX">TX</option> <option value="UT">UT</option> <option value="VA">VA</option> <option value="VT">VT</option> <option value="WA">WA</option> <option value="WI">WI</option> <option value="WV">WV</option> <option value="WY">WY</option></select></div></div> <div class="form-inline"><div class="form-group"><label for="phno">Phone number<span style="color: var(--naa-danger);">*</span></label> <input class="form-control" data-moz-autofill-type="tel" id="phno" name="phno" type="text"/></div></div> <div class="form-group pb-0" style="margin-bottom: 0 !important"><label style="display: table;">Investor type<span style="color: var(--naa-danger);">*</span></label> <div class="radio"><label class="radio-button-container"><input checked="" name="Investor" type="radio" value="Financial Advisor/RIA/Multi-Family Office"/>financial advisor/RIA/multi-family office <span class="checkmark"></span></label> <label class="radio-button-container"><input name="Investor" type="radio" value="Institution"/>institution <span class="checkmark"></span></label> <label class="radio-button-container"><input name="Investor" type="radio" value="Single Family Office"/>single family office <span class="checkmark"></span></label> <label class="radio-button-container disabled" style="padding-bottom: 0"><input disabled="" name="Investor" type="radio" value="Individual"/>individual - currently unavailable outside of single family offices <span class="checkmark"></span></label></div></div> <div class="form-group" style="padding-top: 0.5rem; padding-bottom: 0; margin-bottom: 0; display: none"><label id="lbltipAddedComment" style="color: var(--naa-danger);">please enter the following required fields</label></div></div> <div class="form_foot"><div><a class="formLink" href="/disclaimers">important disclosure </a></div> <div><button class="dialog_btn_P small requestAccSubmit" type="submit">SUBMIT</button></div></div>
</form>

</fieldset></body></html>
