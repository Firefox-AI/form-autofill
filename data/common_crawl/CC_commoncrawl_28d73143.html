<form>
<div class="relative w-full"><div class="rbt" style="outline:none;position:relative" tabindex="-1"><div style="display:flex;flex:1;height:100%;position:relative"><input aria-autocomplete="both" aria-expanded="false" aria-haspopup="listbox" autocomplete="off" class="rbt-input-main form-control rbt-input typeahead data-hj-whitelist outline-none border-disabled notify" inputmode="search" placeholder="Select your instrument" role="combobox" type="text" value="Ukulele"/><input aria-hidden="true" class="rbt-input-hint" readonly="" style="background-color:transparent;border-color:transparent;box-shadow:none;color:rgba(0, 0, 0, 0.54);left:0;pointer-events:none;position:absolute;top:0;width:100%" tabindex="-1" value=""/></div></div></div><input class="notify-me-input mt-4" data-moz-autofill-type="postal-code" inputmode="numeric" name="ZIP" placeholder="Enter your ZIP code" type="text"/><div class="notify-me-pair"><div><input class="notify-me-input mt-4" data-moz-autofill-type="given-name" inputmode="search" name="FirstName" placeholder="First name" type="text"/></div><div><input class="notify-me-input mt-4 border-red-600" data-moz-autofill-type="family-name" inputmode="search" name="LastName" placeholder="Last Name" type="text"/></div></div><input class="notify-me-input mt-4" data-moz-autofill-type="email" inputmode="search" name="Email" placeholder="E-mail address" type="email"/><textarea class="notify-me-input mt-4" inputmode="search" name="Message" placeholder="Leave us a note" rows="3"></textarea><div class="notify-me-buttons"><button class="btn-outline py-3 px-11" type="button">CANCEL</button><button class="btn-primary bg-primary py-3 px-11 uppercase" type="submit">SUBMIT</button></div>
