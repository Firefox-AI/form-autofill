<p> <img alt="必要項目の入力" src="/images/search/img_detailcontact_flow.jpg"/> <input name="companyId" type="hidden" value="3541"/> <input name="tN" type="hidden" value="ヴィゴラスビル"/> <input id="type" name="type" type="hidden" value="1"/> <input id="hash" name="hash" type="hidden" value="04d12fa0cb44e960ab3c34797e8ef382"/> </p> <table border="0" cellpadding="0" cellspacing="0"> <div id="remain"> <p class="submit_no"><span class="emphasis"><span class="denominator">0</span>/<span class="numerator">0</span></span><br/>必須項目完了</p> <p class="submit_ok">確認画面へ<br/>お進み下さい</p> </div> <div id="fixed" style="position: fixed;"> <p class="submit_no"><span class="emphasis"><span class="denominator">0</span>/<span class="numerator">0</span></span><br/>必須項目完了</p> <p class="submit_ok">確認画面へ<br/>お進み下さい</p> </div> <tr id="nameKanjiGroup"> <th> <span class="requiredmark">必須</span> <p class="item-name"> お名前 </p> </th> <td class="input-table"> <input data-moz-autofill-type="name" id="nameKanjiGroup" name="nameKanjiGroup" placeholder="例）山田太郎" type="text" value=""/> </td> </tr> <tr id="nameKanaGroup"> <th> <span class="requiredmark">必須</span> <p class="item-name"> フリガナ </p> </th> <td class="input-table"> <input data-moz-autofill-type="name" id="nameKanaGroup" name="nameKanaGroup" placeholder="例）ヤマダタロウ" type="text" value=""/> </td> </tr> <tr id="email"> <th> <span class="requiredmark">必須</span> <p class="item-name"> メールアドレス </p> </th> <td class="input-table"> <input data-moz-autofill-type="email" id="email" name="email" placeholder="例）example@peaceliving.net" type="text" value=""/> </td> </tr> <tr id="phone"> <th> <span class="requiredmark">必須</span> <p class="item-name"> 電話番号 </p> </th> <td class="input-table"> <input data-moz-autofill-type="tel" id="phone" name="phone" placeholder="例）00-0000-0000" type="text" value=""/> </td> </tr> <tr id="howToReturn"> <th> <span class="optionalmark">任意</span> <p class="item-name"> 希望連絡方法 </p> </th> <td class="input-table"> <label for="howToReturn-returnMail"><input id="howToReturn-returnMail" name="howToReturn[]" type="checkbox" value="returnMail"/>メール</label><label for="howToReturn-returnTell"><input id="howToReturn-returnTell" name="howToReturn[]" type="checkbox" value="returnTell"/>電話</label> </td> </tr> <tr id="receiveTime"> <th> <span class="optionalmark">任意</span> <p class="item-name"> 希望連絡時間 </p> </th> <td class="input-table"> <select id="receiveTime" name="receiveTime"> <option label="" value=""></option> <option label="午前" value="1">午前</option> <option label="12:00～14:00" value="2">12:00～14:00</option> <option label="14:00～16:00" value="3">14:00～16:00</option> <option label="16:00～18:00" value="4">16:00～18:00</option> <option label="18:00～20:00" value="5">18:00～20:00</option> <option label="20:00～" value="6">20:00～</option> </select> </td> </tr> <tr id="message"> <th> <span class="requiredmark">必須</span> <p class="item-name"> 内容 </p> </th> <td class="input-table"> 【ヴィゴラスビルへのお問い合わせ】 <textarea cols="80" id="message" name="message" placeholder="例） ・入居までの流れを教えてほしい ・◯月◯日に見学したい ・ペット可の物件を紹介してほしい ・近所の病院教えてほしい など" rows="24"></textarea> </td> </tr> <tr id="contractedRequestGroup"> <th> <span class="optionalmark">任意</span> <p class="item-name"> 要望 </p> </th> <td class="input-table"> <label for="contractedRequestGroup-request1"><input id="contractedRequestGroup-request1" name="contractedRequestGroup[]" type="checkbox" value="request1"/>物件の詳細を知りたい</label><label for="contractedRequestGroup-request2"><input id="contractedRequestGroup-request2" name="contractedRequestGroup[]" type="checkbox" value="request2"/>資料がほしい</label><label for="contractedRequestGroup-request5"><input id="contractedRequestGroup-request5" name="contractedRequestGroup[]" type="checkbox" value="request5"/>不動産会社に行きたい</label><label for="contractedRequestGroup-request99"><input id="contractedRequestGroup-request99" name="contractedRequestGroup[]" type="checkbox" value="request99"/>その他</label> </td> </tr> </table> <p class="agreement"> ※<a href="/rule/" target="_b
