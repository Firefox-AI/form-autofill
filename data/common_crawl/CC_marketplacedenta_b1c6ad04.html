<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>marketplacedentalpractice.com</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="form__row"><div class="form__column"><div class="form__input form__input--focus form__input--span"> <input aria-label="First name" aria-required="true" data-input="first" data-moz-autofill-type="name" id="name" name="name" placeholder="Enter your full name" required="" type="text"/> <label for="name">Your full name<sup aria-label="required">*</sup></label></div><div class="form__input form__input--focus form__input--span"> <input aria-label="Telephone number" aria-required="true" data-moz-autofill-type="tel" id="telephone" name="telephone" placeholder="Enter your telephone number" required="" type="tel"/> <label for="telephone">Your phone number<sup aria-label="required">*</sup></label></div><div class="form__input form__input--focus form__input--span"> <input aria-label="Email address" aria-required="true" data-moz-autofill-type="email" id="email_address" name="submit_by" placeholder="Enter your email address" required="" type="email"/> <label for="email_address">Email address<sup aria-label="required">*</sup></label></div><div class="form__input form__input--radio form__input--span"><fieldset class="radio"><legend hidden="">Are you a new patient?</legend><span class="radio__label">Are you a new patient?</span><span class="radio__options"> <span class="btn btn--radio"> <input aria-label="Yes, I’m a new patient" id="patient_1" name="new_patient" type="radio" value="Yes"/> <label for="patient_1" tabindex="0"> <span class="icon icon--tick"></span> <span>Yes</span> </label> </span> <span class="btn btn--radio"> <input aria-label="No, I’m an existing patient" id="patient_2" name="new_patient" type="radio" value="No"/> <label for="patient_2" tabindex="0"> <span class="icon icon--tick"></span> <span>No</span> </label> </span> </span></fieldset></div></div><div class="form__column"><div class="form__input form__input--focus form__input--textarea"><textarea aria-label="Your message" id="message" name="message" placeholder="Please give a brief description about your enquiry" rows="3"></textarea><label for="message">Your message</label></div></div><div class="form__input--submit form__input--span"><div class="form__checkbox"> <input aria-label="Marketing consent checkbox" id="marketing" name="marketing" type="checkbox" value="Yes"/> <label for="marketing"> <small>Tick this box to receive our latest updates &amp; news. On submitting you agree to <strong>Market Place Dental Practice</strong> collecting your personal data (see our <a href="https://marketplacedentalpractice.com/privacy-policy/">privacy policy</a>).</small> </label></div><div><button class="btn btn--blue-light btn--submit" type="submit"> <span class="btn__text">Send message <span class="icon icon--arrow"></span></span> <span class="btn__sending">Sending <span class="icon icon--loader"></span></span> </button></div></div></div><input id="recaptchaResponse" name="recaptcha_response" type="hidden"/> <input name="form_uid" type="hidden" value="fc5e43e2-05ed-4565-925f-0de2197ee9f2"/> <input name="required" type="hidden" value="name,telephone,submit_by"/> <input name="data_order" type="hidden" value="name,telephone,submit_by,new_patient,message,marketing"/> <input id="ok_url" name="ok_url" type="hidden" value="https://marketplacedentalpractice.com/thanks/"/> <input id="not_ok_url" name="not_ok_url" type="hidden" value="https://marketplacedentalpractice.com/sorry/"/>
</form>

</fieldset></body></html>
