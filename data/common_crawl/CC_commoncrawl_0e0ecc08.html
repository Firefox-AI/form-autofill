rivacy Browser</option> <option class="bg-ink-900" value="AI Apps &amp; Integration">AI Apps &amp; Integration</option> <option class="bg-ink-900" value="Desktop Application">Desktop Application</option> <option class="bg-ink-900" value="Mobile Application">Mobile Application</option> <option class="bg-ink-900" value="Blockchain / Web3">Blockchain / Web3</option> <option class="bg-ink-900" value="Web Development">Web Development</option> <option class="bg-ink-900" value="Scripts &amp; Automation">Scripts &amp; Automation</option> <option class="bg-ink-900" value="QA Testing">QA Testing</option> <option class="bg-ink-900" value="DevOps &amp; Architecture">DevOps &amp; Architecture</option> <option class="bg-ink-900" value="Other">Other</option> </select> </div> <div> <label class="block text-xs font-medium text-slate-400 mb-1.5" for="message">Project details <span class="text-rose-400">*</span></label> <textarea class="w-full rounded-lg border border-white/10 bg-ink-900/80 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-gold-400/50 focus:ring-1 focus:ring-gold-400/30 focus:outline-none transition-colors resize-none" id="message" name="message" placeholder="Tell us about your project, goals, timeline..." required="" rows="4"></textarea> </div> <div> <label class="block text-xs font-medium text-slate-400 mb-1.5" for="preferred_contact">Preferred contact URLs <span class="text-rose-400">*</span></label> <input class="w-full rounded-lg border border-white/10 bg-ink-900/80 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-gold-400/50 focus:ring-1 focus:ring-gold-400/30 focus:outline-none transition-colors" id="preferred_contact" name="preferred_contact" placeholder="LinkedIn, Website, Facebook, WhatsApp, iMessage, Telegram..." required="" type="text"/> </div> <button class="w-full inline-flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-gold-400 to-gold-500 px-6 py-3.5 text-sm font-semibold text-ink-950 hover:from-gold-300 hover:to-gold-400 transition-all shadow-lg shadow-gold-500/20 hover:shadow-gold-500/40 disabled:opacity-60 disabled:cursor-not-allowed" type="submit"> Send message </button>
