<html><head>

</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="modal__header uk-modal-header"> <button class="modal__close text--primary text--primary-hover uk-modal-close-default uk-close-large" type="button" uk-close=""></button> <p class="modal__title uk-modal-title text--primary">Solicitar cuenta mayorista</p> <p class="modal__subtitle uk-text-justify">Usted solicitará una cuenta mayorista para poder acceder a nuestra lista de productos mayoristas. Esta solicitud será revisada a la brevedad y será notificado por email cuando la verificación haya concluído.</p> </div> <div class="modal__body uk-modal-body" uk-overflow-auto=""> <div id="wholesaler-alert"></div> <div id="wholesaler-modal-content"> <div class="uk-grid-small" uk-grid=""> <div class="uk-width-1-2"> <div class="field field--wholesaler_name"> <input class="field__input border-radius" data-message="Ingrese un nombre válido" data-regex="/^(?=.{2,45}$)([a-zA-Zá-úÁ-Ú](\s[a-zA-Zá-úÁ-Ú])?(\s)?)*$/" data-required="1" id="wholesaler_name" name="wholesaler_name" placeholder="Su nombre" type="text"/> <p class="field__message field__message--wholesaler_name"></p> </div> </div> <div class="uk-width-1-2"> <div class="field field--wholesaler_surname"> <input class="field__input border-radius" data-message="Ingrese un apellido válido" data-moz-autofill-type="family-name" data-regex="/^(?=.{2,45}$)([a-zA-Zá-úÁ-Ú](\s[a-zA-Zá-úÁ-Ú])?(\s)?)*$/" data-required="1" id="wholesaler_surname" name="wholesaler_surname" placeholder="Su apellido" type="text"/> <p class="field__message field__message--wholesaler_surname"></p> </div> </div> <div class="uk-width-1-1"> <div class="field field--wholesaler_email"> <input class="field__input border-radius" data-message="Ingrese un email válido" data-moz-autofill-type="email" data-regex="/^[\w\-\.]+\@[a-zA-Z0-9\.\-]+\.[a-zA-z]{2,7}$/" data-required="1" id="wholesaler_email" name="wholesaler_email" placeholder="Su email" type="email"/> <p class="field__message field__message--wholesaler_email"></p> </div> </div> <div class="uk-width-1-1"> <div class="field field--wholesaler_phone"> <input class="field__input border-radius" data-message="Ingrese un número de teléfono válido con código de area" data-moz-autofill-type="tel" data-regex="/^((\+)?(54|549)?(\s)?(\()?(0)?(?!15)((11)(\))?[\-\s]{0,3}(15)?[\-\s]{0,3}[\d]{4}[\-\s]{0,3}[\d]{4}|(2|3)[\d]{2}(\))?[\-\s]{0,3}(15)?[\-\s]{0,3}[\d]{3}[\-\s]{0,3}[\d]{4}|(2|3)[\d]{3}(\))?[\-\s]{0,3}(15)?[\-\s]{0,3}[\d]{3}[\-\s]{0,3}[\d]{3})|[\+\(]{0,2}(56|569|598|595|55|52|57|58|51|591)[\s\-\(\)]{0,3}[\d]{1}[\s\-\(\)]{0,3}[\d]{1,3}[\s\-\)]{0,3}[\d]{3}[\s\-\)]{0,3}[\d]{3,4})$/" data-required="1" id="wholesaler_phone" name="wholesaler_phone" placeholder="Su teléfono" type="tel"/> <p class="field__message field__message--wholesaler_phone"></p> </div> </div> <div class="uk-width-1-2"> <div class="field field--wholesaler_password"> <input class="field__input border-radius" data-message="Ingrese una contraseña válida [6-12 caracteres de longitud]" data-regex="/^.{6,12}$/" data-required="1" id="wholesaler_password" name="wholesaler_password" placeholder="Contraseña" type="password"/> <p class="field__message field__message--wholesaler_password"></p> </div> </div> <div class="uk-width-1-2"> <div class="field field--wholesaler_repeat_password"> <input class="field__input border-radius" data-message="Ingrese una contraseña válida [6-12 caracteres de longitud]" data-regex="/^.{6,12}$/" data-required="1" id="wholesaler_repeat_password" name="wholesaler_repeat_password" placeholder="Repetir contraseña" type="password"/> <p class="field__message field__message--wholesaler_repeat_password"></p> </div> </div> <div class="uk-width-1-1"> <div class="field field--wholesaler_message"> <textarea class="field__textarea border-radius" data-message="Ingrese un mensaje válido [Debe contener al menos 20 caracteres]" data-regex="/^[\s\S]{20,5000}$/" data-required="0" id="wholesaler_message" name="wholesaler_message" placeholder="Su mensaje (opcional)"></textarea> <p class="field__message field__message--wholesaler_message"></p> </div> </div> </div> </div> </div> <div class="modal__footer uk-modal-footer" id="wholesaler-modal-footer"> <div class="uk-flex uk-flex-right"> <button class="button button--half background--primary background--primary-hover contrast_text--primary contrast_text--primary-hover uk-button uk-button-normal border-radius" data-label="Enviar solicitud" data-spinner-ratio="0.75" id="wholesaler-btn" type="submit"> Enviar solicitud </button> </div> </div>
</form>

</fieldset></body></html>
