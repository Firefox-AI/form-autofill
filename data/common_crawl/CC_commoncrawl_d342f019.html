<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div id="guest_info"> <div id="guest_name"><label for="author"><span>名前（例：山田 太郎）</span>( 必須 )</label><input aria-required="true" data-moz-autofill-type="name" id="author" name="author" size="22" tabindex="1" type="text" value=""/></div> <div id="guest_email"><label for="email"><span>E-MAIL</span>( 必須 ) - 公開されません -</label><input aria-required="true" data-moz-autofill-type="email" id="email" name="email" size="22" tabindex="2" type="text" value=""/></div> <div id="guest_url"><label for="url"><span>URL</span></label><input id="url" name="url" size="22" tabindex="3" type="text" value=""/></div> </div> <div id="comment_textarea"> <textarea cols="50" id="comment" name="comment" rows="10" tabindex="4"></textarea> </div> <div id="submit_comment_wrapper"> <input id="submit_comment" name="submit" tabindex="5" title="コメントを書く" type="submit" value="コメントを書く"/> </div> <div id="input_hidden_field"> <input id="comment_post_ID" name="comment_post_ID" type="hidden" value="880"/> <input id="comment_parent" name="comment_parent" type="hidden" value="0"/> </div>
</form>

</fieldset></body></html>
