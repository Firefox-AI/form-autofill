<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<input name="form_type" type="hidden" value="create_customer"/><input name="utf8" type="hidden" value="✓"/><header class="popover__header"> <h2 class="popover__title heading">Criar minha conta</h2> <p class="popover__legend">Preencha os campos abaixo:</p> </header> <div class="form__input-wrapper form__input-wrapper--labelled"> <input class="form__field form__field--text" data-moz-autofill-type="given-name" id="register-customer[first_name]" name="customer[first_name]" required="required" type="text"/> <label class="form__floating-label" for="register-customer[first_name]">Primeiro nome</label> </div> <div class="form__input-wrapper form__input-wrapper--labelled"> <input class="form__field form__field--text" data-moz-autofill-type="family-name" id="register-customer[last_name]" name="customer[last_name]" required="required" type="text"/> <label class="form__floating-label" for="register-customer[last_name]">Sobrenome</label> </div> <div class="form__input-wrapper form__input-wrapper--labelled"> <input class="form__field form__field--text" data-moz-autofill-type="email" id="register-customer[email]" name="customer[email]" required="required" type="email"/> <label class="form__floating-label" for="register-customer[email]">E-mail</label> </div> <div class="form__input-wrapper form__input-wrapper--labelled"> <input autocomplete="new-password" class="form__field form__field--text" id="register-customer[password]" name="customer[password]" required="required" type="password"/> <label class="form__floating-label" for="register-customer[password]">Senha</label> </div> <button class="form__submit button button--primary button--full" type="submit">Criar minha conta</button>
</form>

</fieldset></body></html>
