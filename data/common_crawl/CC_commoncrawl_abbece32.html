<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="div_login"> <div> <input autocomplete="off" class="topf" data-moz-autofill-type="name" name="name" placeholder="your name" type="text"/> <input autocomplete="off" class="topf" data-moz-autofill-type="email" name="email" placeholder="your email" type="email"/> <input class="textbox" data-moz-autofill-type="loginname" id="register_uname" maxlength="16" name="txt_uname" onkeyup="remove_space();" placeholder="new username" required="" type="text"/> <br/> <input class="textbox" data-moz-autofill-type="email" name="xyzcourriel" placeholder="email address" required="" type="email"/> <div id="pseudo_warning" style="color:red; font-size:0.95em; visibility:hidden;">Your username should not contain any spaces!</div> <br/> <input class="textbox" id="abe2" name="txt_abe2" onkeyup="checkPass('abe');" placeholder="password" required="" type="password"/><br/> <input class="textbox" id="abea" name="txt_abea" onkeyup="checkPass('abe');" placeholder="confirm password" type="password"/><br/> <span style="background:#dedede"> <span class="">2 </span><span><span style="">*</span> 6 =</span> </span> <input name="captcha" required="" style="width:26px;" type="text"/> <input name="but_register" type="submit" value="Register"/> <input onclick="document.getElementById('login_div').style.display='block'; document.getElementById('forgot_div').style.display='none'; document.getElementById('register_div').style.display='none';" type="button" value="cancel"/> </div> </div>
</form>

</fieldset></body></html>
