</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="field"><label for="vp-first">First name</label><input autocomplete="given-name" data-moz-autofill-type="given-name" id="vp-first" name="first_name" required="" type="text"/></div> <div class="field"><label for="vp-last">Last name</label><input autocomplete="family-name" data-moz-autofill-type="family-name" id="vp-last" name="last_name" required="" type="text"/></div> <div class="field"><label for="vp-email">Email</label><input autocomplete="email" data-moz-autofill-type="email" id="vp-email" name="email" required="" type="email"/></div> <div class="field"><label for="vp-phone">Mobile</label><input autocomplete="tel" data-moz-autofill-type="tel" id="vp-phone" name="phone" placeholder="for your welcome code" required="" type="tel"/></div> <div class="field"><label for="vp-bday">Birthday</label><input data-moz-autofill-type="bday" id="vp-bday" name="birthday" type="date"/></div> <div class="field"><label for="vp-anniv">Anniversary <span class="opt">(optional)</span></label><input id="vp-anniv" name="anniversary" type="date"/></div> <div class="field field-wide"> <label class="check"> <input checked="" name="sms_optin" type="checkbox" value="yes"/> <span>Yes, text me VIP invites and reward notifications. (We’ll never spam you. Reply STOP to opt out.)</span> </label> </div> <div class="field field-wide form-actions"> <button class="btn btn-gold btn-large" type="submit">Sign Me Up — Free</button> <p class="form-or">already a member? <a href="tel:13528771017">give us a ring</a></p> </div>
</form>

</fieldset></body></html>
