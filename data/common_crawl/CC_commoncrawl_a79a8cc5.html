<meta http-equiv="content-type" content="text/html; charset=UTF-8">

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="w101-inquiry-form-item col-1-2"> <label class="w101-inquiry-label">Name : </label> <input class="w101-inquiry-input" data-moz-autofill-type="name" name="name" placeholder="What's your name?" type="text"/> <span class="w101-inquiry-tips">This field is required</span> </div> <div class="w101-inquiry-form-item col-1-2"> <label class="w101-inquiry-label">Phone :</label> <input class="w101-inquiry-input" data-moz-autofill-type="tel" name="phone" placeholder="Contact number:" type="text"/> <span class="w101-inquiry-tips">This field is required</span> </div> <div class="w101-inquiry-form-item col-1-2"> <label class="w101-inquiry-label"><em>*</em>Email : </label> <input class="w101-inquiry-input" data-moz-autofill-type="email" name="email" placeholder="Your contact email:" type="text"/> <span class="w101-inquiry-tips">Required and valid email address</span> </div> <div class="w101-inquiry-form-item col-1-2"> <label class="w101-inquiry-label">Company : </label> <input class="w101-inquiry-input" data-moz-autofill-type="organization" name="company" placeholder="Your company name:" type="text"/> <span class="w101-inquiry-tips">This field is required</span> </div> <div class="w101-inquiry-form-item"> <label class="w101-inquiry-label"><em>*</em>Message : </label> <textarea class="w101-inquiry-textarea" name="message" placeholder="What do you wish to enquire about?" rows="5"></textarea> <span class="w101-inquiry-tips">This field is required</span> </div> <div class="w101-inquiry-form-item"> <button class="w101-inquiry-button" type="submit"> <span>Submit</span> </button> <label class="w101-inquiry-checkbox"> <input checked="" type="checkbox"/> <span> <a href="/privacypolicy"> Privacy policy </a> </span> </label> </div>
</form>

</fieldset></body></html>
