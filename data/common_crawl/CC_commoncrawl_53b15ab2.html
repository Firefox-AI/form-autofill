<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<select id="program" name="program" required=""> <option disabled="" selected="" value="">Program interested</option> <option value="Software Development">Software Development</option> <option value="QA Automation">QA Automation</option> <option value="Data Analytics">Data Analytics</option> </select> <input data-moz-autofill-type="name" id="fullName" minlength="3" name="name" placeholder="Enter name" required="" type="text"/> <input data-moz-autofill-type="email" id="email" name="email" placeholder="Enter email" required="" type="email"/> <div class="input-group"> <input disabled="" placeholder="+91" style="width: 50px; padding: 0.75rem 0.5rem;" type="text"/> <input class="phone" data-moz-autofill-type="tel" id="phone" maxlength="10" minlength="10" name="phone" onkeypress="return event.charCode &gt;= 48 &amp;&amp; event.charCode &lt;= 57" pattern="[0-9]*" placeholder="Enter phone" required="" style="flex:1;" type="tel"/> </div> <div class="additional-fields"> <select class="education" id="education" name="highestQualification" required=""> <option disabled="" selected="" value="">Education Qualification (Eg. BTech)</option> </select> <select class="graduationYear" id="graduationYear" name="graduationYear" required=""> <option disabled="" selected="" value="">Graduation Year</option> </select> <select class="workingStatus" id="workingStatus" name="currentlyWorking" required=""> <option disabled="" selected="" value="">Are you currently working?</option> <option value="Yes">Yes</option> <option value="No">No</option> </select> <div class="job-details"> <select id="jobDomain" name="jobDomain"> <option disabled="" selected="" value="">Job Domain</option> <option value="tech">Tech</option> <option value="non-tech">Non Tech</option> </select> <input id="jobRole" minlength="3" name="jobRole" placeholder="Enter job role" type="text"/> <input id="company" minlength="3" name="currentCompany" placeholder="Enter company" type="text"/> </div> <select class="trialDemoSlot" id="trialDemoSlot" name="demoSlotStartTime" required=""> <option disabled="" selected="" value="">Trial Workshop Slot</option> </select> </div> <button class="button-5" type="submit">Book Your Trial</button>
</form>

</fieldset></body></html>
