<div class="cart__widget" data-cart-widget=""> <a data-expand-button="" href="#notes">Add order notes</a> <div class="cart__widget-content" id="notes"> <label for="note">Leave a note about your order</label> <textarea aria-label="Leave a note about your order" class="cart__field cart__field--textarea" id="note" name="note"></textarea> </div> </div> <div class="cart__widget" data-cart-widget=""> <a data-expand-button="" href="#gift-notes">Is this a gift?</a> <div class="cart__widget-content" id="gift-notes"><label for="gift-note">Leave a note about your order</label> <textarea aria-label="Leave a note about your order" class="cart__field cart__field--textarea" id="gift-note" name="attributes[Gift note]"></textarea> </div> </div> <div class="cart__widget" data-cart-widget=""> <a data-expand-button="" href="#estimate-shipping-calculator">Estimate shipping</a> <div class="cart__widget-content" id="estimate-shipping-calculator"> <div class="shipping-calculator" id="shipping-calculator"> <div class="shipping-calculator__container" id="address_container"> <div class="is-hidden"> <label for="AddressFirstName">First Name</label> <input data-moz-autofill-type="given-name" id="AddressFirstName" name="address[first_name]" type="text" value=""/> </div> <div class="is-hidden"> <label for="AddressLastName">Last Name</label> <input data-moz-autofill-type="family-name" id="AddressLastName" name="address[last_name]" type="text" value=""/> </div> <div class="is-hidden"> <label for="AddressCompany">Company</label> <input data-moz-autofill-type="organization" id="AddressCompany" name="address[company]" type="text" value=""/> </div> <div class="is-hidden"> <label for="AddressAddress1">Address1</label> <input data-moz-autofill-type="address-line1" id="AddressAddress1" name="address[address1]" type="text" value=""/> </div> <div class="is-hidden"> <label for="AddressAddress2">Address2</label> <input data-moz-autofill-type="address-line2" id="AddressAddress2" name="address[address2]" type="text" value=""/> </div> <div class="is-hidden"> <label for="AddressCity">City</label> <input data-moz-autofill-type="address-level2" id="AddressCity" name="address[city]" type="text" value=""/> </div> <div class="p"> <label for="address_country">Country</label> <select class="cart__field" data-default="" data-default-fullname="" data-moz-autofill-type="country" id="address_country" name="address[country]"></select> </div> <div class="p shipping-calculator__province" id="address_province_container"> <label for="address_province" id="address_province_label">Province</label> <select class="address_form cart__field" data-moz-autofill-type="address-level1" id="address_province" name="address[province]"></select> </div> <div class="p"> <label for="address_zip">Postal/Zip Code</label> <input class="cart__field" data-moz-autofill-type="postal-code" id="address_zip" name="address[zip]" type="text"/> </div> <div class="is-hidden"> <label for="AddressPhone">Phone</label> <input data-moz-autofill-type="tel" id="AddressPhone" name="address[phone]" type="tel" value=""/> </div> </div> <div id="wrapper-response"></div> <input class="get-rates btn btn--outline btn--input btn--full" type="button" value="Calculate shipping"/> </div> </div> </div><div class="cart__foot-inner"> <div class="cart__total is-hidden" data-cart-original-total=""> <span>Items</span> <span data-cart-original-total-price="">Free </span> </div> <div class="cart__discounts is-hidden" data-cart-discounts-holder=""></div> <div class="cart__total"> <span>Subtotal</span> <span class="cart__total__money" data-cart-total="">Free </span> </div> <em>Shipping, taxes, and discount codes are calculated at checkout</em> <button class="btn btn--full btn--large cart__checkout" name="checkout" type="submit">Check Out</button> </div>
