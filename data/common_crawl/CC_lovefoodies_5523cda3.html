<fieldset>

<div class="newsletter-subscription-form-fields d-flex flex-wrap flex-md-nowrap"> <input aria-label="First Name" class="form-control form-control-lg me-md-2 mb-2 mb-md-0" data-moz-autofill-type="given-name" name="firstName" placeholder="First Name" type="text"/> <input aria-label="Your Email ID" class="form-control form-control-lg me-md-2 mb-2 mb-md-0" data-moz-autofill-type="email" name="emailID" placeholder="Your Email ID" required="" type="email"/> <button class="btn btn-lg btn-primary text-uppercase flex-grow-1 flex-md-grow-0" type="submit"> <span class="newsletter-subscription-btn-text"> Subscribe </span> <span class="newsletter-subscription-processing-text d-none"> <span aria-hidden="true" class="spinner-border spinner-border-sm me-1" role="status"></span> Please wait... </span> </button> </div> <div class="alert alert-success newsletter-subscription-success d-none align-items-center mt-2" role="alert"> <div> Thank you for subscribing to Lovefoodies. You have been successfully subscribed. </div> </div> <div class="alert alert-danger newsletter-subscription-error d-none align-items-center mt-2" role="alert"> <div> Sorry! Something has gone terribly wrong. Please check the browser console for more details. </div> </div> <div class="newsletter-subscription-consent-holder d-flex justify-content-center mt-3"> <div class="form-check"> <input class="form-check-input" id="footerNewsletterConsent" name="userConsent" required="" type="checkbox" value="consent-given"/> <label class="form-check-label" for="footerNewsletterConsent">I am giving consent to use my email id for the newsletter and have also read the <a href="https://lovefoodies.com/terms-of-service/">Terms of Service</a>.</label> </div> </div>
</form>
