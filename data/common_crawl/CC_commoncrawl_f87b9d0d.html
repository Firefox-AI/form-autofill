<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="row g-3"> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="name" name="name" placeholder="Full Name*" type="text"/> </div> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="email" name="email" placeholder="Email*" type="email"/> </div> <div class="col-md-6"> <div class="phone-wrapper"> <input name="countryCode" type="hidden" value=""/> <input name="countryCodeWithName" type="hidden" value=""/> <input autocomplete="off" class="form-control telePhone" data-moz-autofill-type="tel" maxlength="10" minlength="10" name="mobile" onkeyup="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="Mobile Number" required="" type="tel"/> </div> </div> <div class="col-md-6"> <input class="form-control" id="JobPosition" name="jobposition" readonly="" style="background-color: #fff;" type="text" value=""/> </div> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="street-address" name="address" placeholder="Address*" type="text"/> </div> <div class="col-md-6"> <select class="form-select" name="experience"> <option selected="">Select Experience</option> <option value="Fresher">Fresher</option> <option value="0-1 Years">0–1 Years</option> <option value="2-3 Years">2–3 Years</option> <option value="4-5 Years">4–5 Years</option> <option value="6-7 Years">6–7 Years</option> <option value="8-9 Years">8–9 Years</option> <option value="10+">10+ Years</option> </select> </div> <div class="col-md-6"> <select class="form-select" id="qualification" name="qualification"> <option disabled="" selected="" value="">Select Qualification</option> <option value="12th Pass">12th Pass</option> <option value="B.Tech">B.Tech</option> <option value="M.Tech">M.Tech</option> <option value="BCA/MCA">BCA/MCA</option> <option value="other">Other</option> </select> <input class="form-control" id="otherInput" name="other_qualification" placeholder="Enter Qualification" style="display:none; margin-top:10px;" type="text"/> </div> <div class="col-md-6"> <input class="form-control" data-moz-autofill-type="organization" name="current_employer" placeholder="Current Employer*" type="text"/> </div> <div class="col-md-6"> <input class="form-control" name="current_ctc" placeholder="Current CTC (Lac)*" type="text"/> </div> <div class="col-md-6"> <select class="form-select" id="source" name="source"> <option selected="">Select Source</option> <option value="LinkedIn">LinkedIn</option> <option value="Referral">Referral</option> <option value="Website">Website</option> <option value="Other">Other</option> </select> </div> </div> <label class="upload-area" for="fileInput"> <input accept=".doc,.docx,.pdf" hidden="" id="fileInput" name="resume" type="file"/> <div class="upload-icon"> <i class="fa-solid fa-arrow-up-long" style="transform: translateX(3px);"></i> <i class="fa-solid fa-arrow-down-long" style="transform: translateX(-3px);"></i> </div> <div class="upload-title"> Drag &amp; <span>Drop</span> or Browse </div> <div class="leadsurepara"> Supported: doc, docx, pdf, Max. file size: 5 MB, Max. files: 1. </div> <div class="no-file-text leadsurepara upload-filename"> No file chosen, yet. </div> </label> <div class="mb-3"> <div class="form-group mb-0"> <div class="g-recaptcha" data-sitekey="6LdpaaIsAAAAAFzhHP6IxFNFkAcr6gwCiSw6e9di"></div> </div> </div> <input id="jobID" name="jobID" type="hidden" value=""/> <button class="main-btn w-100" name="submitJob" type="submit"> Submit </button>
</form>

</fieldset></body></html>
