<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="xoo-aff-fields"><div class="xoo-aff-group xoo-aff-cont-text one xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_username">Nome de usuário</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon fas fa-user-plus"></span><input class="xoo-aff-text xoo-aff-required" data-moz-autofill-type="loginname" id="xoo_el_reg_username" name="xoo_el_reg_username" placeholder="Seu usuário" required=" " type="text" value=""/></div></div><div class="xoo-aff-group xoo-aff-cont-email one xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_email">Email</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon fas fa-at"></span><input class="xoo-aff-email xoo-aff-required" data-moz-autofill-type="email" id="xoo_el_reg_email" name="xoo_el_reg_email" placeholder="Seu email" required=" " type="email" value=""/></div></div><div class="xoo-aff-group xoo-aff-cont-text onehalf xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_fname">Nome</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon far fa-user"></span><input class="xoo-aff-text xoo-aff-required" data-moz-autofill-type="given-name" id="xoo_el_reg_fname" name="xoo_el_reg_fname" placeholder="Seu nome" required=" " type="text" value=""/></div></div><div class="xoo-aff-group xoo-aff-cont-text onehalf xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_lname">Sobrenome</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon far fa-user"></span><input class="xoo-aff-text xoo-aff-required" data-moz-autofill-type="family-name" id="xoo_el_reg_lname" name="xoo_el_reg_lname" placeholder="Seu sobrenome" required=" " type="text" value=""/></div></div><div class="xoo-aff-group xoo-aff-cont-password onehalf xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_pass">Senha</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon fas fa-key"></span><input class="xoo-aff-password xoo-aff-required" id="xoo_el_reg_pass" name="xoo_el_reg_pass" placeholder="Escolha uma senha" required=" " type="password" value=""/></div></div><div class="xoo-aff-group xoo-aff-cont-password onehalf xoo-aff-cont-required"><label class="xoo-aff-label" for="xoo_el_reg_pass_again">Confirme sua senha</label><div class="xoo-aff-input-group"><span class="xoo-aff-input-icon fas fa-key"></span><input class="xoo-aff-password xoo-aff-required" id="xoo_el_reg_pass_again" name="xoo_el_reg_pass_again" placeholder="Repita sua senha" required=" " type="password" value=""/></div></div></div> <input name="_xoo_el_form" type="hidden" value="register"/><input name="_xoo_el_form_register" type="hidden" value="register"/><button class="button btn xoo-el-action-btn xoo-el-register-btn" type="submit">Cadastrar</button><input name="redirect" type="hidden" value="https://ditados.com.br/editar-perfil/"/>
</form>

</fieldset></body></html>
