<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div style="display:none"><input id="yform_contact-form-985" name="yform_contact-form-985" type="hidden" value="1"/></div> <div class="row field_companyName"> <label for="ContactDynamicForm_companyName">Bedrijfsnaam</label> <input data-moz-autofill-type="organization" id="ContactDynamicForm_companyName" name="ContactDynamicForm[companyName]" type="text" value=""/> </div> <div class="row field_name"> <label for="ContactDynamicForm_name">Naam</label> <input data-moz-autofill-type="name" id="ContactDynamicForm_name" name="ContactDynamicForm[name]" type="text" value=""/> </div> <div class="row field_emailAddress"> <label class="required" for="ContactDynamicForm_emailAddress">E-mailadres <span class="required">*</span></label> <input data-moz-autofill-type="email" id="ContactDynamicForm_emailAddress" name="ContactDynamicForm[emailAddress]" type="text" value=""/> </div> <div class="row field_phone"> <label for="ContactDynamicForm_phone">Telefoonnummer</label> <input data-moz-autofill-type="tel" id="ContactDynamicForm_phone" name="ContactDynamicForm[phone]" type="text" value=""/> </div> <div class="row field_address"> <label for="ContactDynamicForm_address">Adres</label> <input data-moz-autofill-type="street-address" id="ContactDynamicForm_address" name="ContactDynamicForm[address]" type="text" value=""/> </div> <div class="row field_zipcode"> <label for="ContactDynamicForm_zipcode">Postcode</label> <input data-moz-autofill-type="postal-code" id="ContactDynamicForm_zipcode" name="ContactDynamicForm[zipcode]" type="text" value=""/> </div> <div class="row field_city"> <label for="ContactDynamicForm_city">Plaats</label> <input data-moz-autofill-type="address-level2" id="ContactDynamicForm_city" name="ContactDynamicForm[city]" type="text" value=""/> </div> <div class="row field_country"> <label for="ContactDynamicForm_country">Land</label> <input data-moz-autofill-type="country" id="ContactDynamicForm_country" name="ContactDynamicForm[country]" type="text" value=""/> </div> <div class="row field_pcpDescription"> <label for="ContactDynamicForm_pcpDescription">Beschrijf je aanvraag (incl kleuren van textiel en bedrukking)</label> <textarea id="ContactDynamicForm_pcpDescription" name="ContactDynamicForm[pcpDescription]"></textarea> </div> <div class="row field_question"> <label class="required" for="ContactDynamicForm_question">Vraag/opmerking <span class="required">*</span></label> <textarea id="ContactDynamicForm_question" name="ContactDynamicForm[question]"></textarea> </div> <div class="row field_validation"> <label for="ContactDynamicForm_validation">Verificatiecode</label> <input id="ContactDynamicForm_validation" name="ContactDynamicForm[validation]" type="text" value=""/> </div> <div class="row" style="margin: 0 0 1rem 0;"> <input autocomplete="off" id="email-confirm" name="email-confirm" style="display:none !important;" tab-index="-1" type="text" value=""/><input class="g-recaptcha-response" id="g-recaptcha-response" name="g-recaptcha-response" type="hidden" value=""/> </div> <div class="row buttons"><input class="button" id="contact-form-submit-985" name="contact-form-submit" type="button" value="Vraag sample aan"/> </div>
</form>
