<div class=""> <div class="uk-card uk-card-default"> <div class="uk-card-header"> <h4 class="">Registrate gratis para acceder al curso</h4> </div> <div class="uk-card-body"> <legend>Completá los siguientes datos</legend> <div class="uk-margin"> <div class="uk-grid-small uk-child-width-1-2@m" uk-grid=""> <div> <label class="uk-form-label uk-text-bold" for="user-first-name">Nombre</label> <div class="uk-form-row"> <input class="uk-input uk-width-1-1" data-moz-autofill-type="given-name" data-val="required" data-val-display="Nombre" id="user-first-name" name="tiendupnameform" placeholder="" type="text"/> <span class="uk-text-small uk-text-danger uk-text-bold uk-hidden" validate-message="tiendupnameform"></span> </div> </div> <div> <label class="uk-form-label uk-text-bold" for="user-last-name">Apellido</label> <div class="uk-form-row"> <input class="uk-input uk-width-1-1" data-moz-autofill-type="family-name" data-val="required" data-val-display="Apellido" id="user-last-name" name="tienduplastnameform" placeholder="" type="text"/> <span class="uk-text-small uk-text-danger uk-text-bold uk-hidden" validate-message="tienduplastnameform"></span> </div> </div> </div> </div> <div class="uk-margin"> <label class="uk-form-label" for="user-email"> <span class="uk-text-bold">Email</span></label> <div class="uk-form-row"> <input class="uk-input uk-width-1-1" data-moz-autofill-type="email" data-val="required|valid_email" data-val-display="Email" id="user-email" name="tiendupemailform" placeholder="" type="email"/> <span class="uk-text-small uk-text-danger uk-text-bold uk-hidden" validate-message="tiendupemailform"></span> <div><small>Será tu nombre de usuario para iniciar sesión</small></div> </div> </div> <input class="uk-input uk-width-1-1 tiendupform" name="name" placeholder="" type="text"/> <input class="uk-input uk-width-1-1 tiendupform" name="last_name" placeholder="" type="text"/> <input class="uk-input uk-width-1-1 tiendupform" data-moz-autofill-type="email" name="email" placeholder="" type="email"/> <input data-product-register-form-id="" name="product_id" type="hidden" value=""/> <div class="uk-margin"> <button class="uk-button uk-button-primary uk-width-small-1-1" id=""> <span>Registrarme gratis</span> <i class="btn-icon-loading uk-icon-circle-o-notch uk-icon-spin uk-hidden"></i> </button> </div> </div> </div> </div>
</form>
