<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<body>

<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="summary-fields" data-astro-cid-lct2ol5d=""> <input autocomplete="given-name" data-astro-cid-lct2ol5d="" data-moz-autofill-type="given-name" name="first_name" placeholder="First name" required="" type="text"/> <input autocomplete="family-name" data-astro-cid-lct2ol5d="" data-moz-autofill-type="family-name" name="last_name" placeholder="Last name" required="" type="text"/> <input autocomplete="email" data-astro-cid-lct2ol5d="" data-moz-autofill-type="email" name="email" placeholder="Email address" required="" type="email"/> <input autocomplete="tel" data-astro-cid-lct2ol5d="" data-moz-autofill-type="tel" inputmode="tel" name="phone" pattern="[0-9 ().+-]{10,}" placeholder="Phone number" required="" type="tel"/> <input autocomplete="postal-code" data-astro-cid-lct2ol5d="" data-moz-autofill-type="postal-code" inputmode="numeric" maxlength="5" name="zip_code" pattern="[0-9]{5}" placeholder="ZIP code" required="" type="text"/> <input autocomplete="address-level2" data-astro-cid-lct2ol5d="" name="county" placeholder="County" required="" type="text"/> <select aria-label="Where are you in the process?" data-astro-cid-lct2ol5d="" name="process_stage"> <option data-astro-cid-lct2ol5d="" value="">Where are you in the process?</option> <option data-astro-cid-lct2ol5d="" value="just_researching">Just researching</option> <option data-astro-cid-lct2ol5d="" value="preparing_paperwork">Preparing paperwork</option> <option data-astro-cid-lct2ol5d="" value="already_filed">Already filed</option> <option data-astro-cid-lct2ol5d="" value="court_date_soon">Court date coming up</option> </select> </div> <button class="summary-submit" data-astro-cid-lct2ol5d="" type="submit">Send full calculation</button> <div class="summary-status" data-astro-cid-lct2ol5d="" role="status"></div>
</form>

</fieldset></body></html>
