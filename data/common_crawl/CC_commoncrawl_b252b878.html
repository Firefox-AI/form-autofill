<fieldset>
<h3>common-crawl</h3>
<p><i>Common Crawl form, LLM-labeled.</i></p>

<form>
<div class="hidden"><input type="submit"/></div> <div id="divPreviousAddress" style="display:none"> <br/> <div style="font-size:17px;font-weight :bold">Previous Address</div> <div data-role="fieldcontain" id="div_ddl_previous_country" style="display:none"> <label class="RequiredIcon" for="ddlPreviousCountry">Country</label> <select autocomplete="country" data-moz-autofill-type="country" id="ddlPreviousCountry" name="country" onchange="showHidePreviousState()"> <option selected="selected" value="USA">USA</option> </select> </div> <div data-role="fieldcontain"> <label class="RequiredIcon" for="txtPreviousAddress">Address</label> <input autocomplete="street-address" data-moz-autofill-type="address-line1" id="txtPreviousAddress" maxlength="100" name="address1" onchange="" type="text" value=""/> </div> <div data-role="fieldcontain" id="divPreviousAddress2" style="display: none;"> <label for="txtPreviousAddress2">Address Line 2</label> <input autocomplete="address-line2" data-moz-autofill-type="address-line2" id="txtPreviousAddress2" maxlength="100" name="address2" onchange="" type="text" value=""/> </div> <div data-role="fieldcontain"> <label class="RequiredIcon" for="txtPreviousZip" id="lblPreviousZipTitle">Zip</label> <input autocomplete="postal-code" data-moz-autofill-type="postal-code" id="txtPreviousZip" maxlength="10" name="zip" onchange="lookupZipcode(this.value,'Previous');" pattern="[0-9]*" type="tel" value=""/> </div> <div data-role="fieldcontain"> <label class="RequiredIcon" for="txtPreviousCity" id="lblPreviousCityTitle">City</label> <input autocomplete="address-level2" data-moz-autofill-type="address-level2" id="txtPreviousCity" maxlength="50" name="city" onchange="" type="text" value=""/> </div> <div class="div_ddl_previous_state"> <div data-role="fieldcontain"> <label class="RequiredIcon" for="ddlPreviousState">State</label> <select autocomplete="address-level1" data-moz-autofill-type="address-level1" id="ddlPreviousState" name="state" onchange="" value=""> <option class="rename-able" value="">--Please Select--</option><option class="rename-able" value="AL">Alabama</option><option class="rename-able" value="AK">Alaska</option><option class="rename-able" value="AS">American Samoa</option><option class="rename-able" value="AZ">Arizona</option><option class="rename-able" value="AR">Arkansas</option><option class="rename-able" value="AA">Armed Forces - Americas</option><option class="rename-able" value="AE">Armed Forces - Europe</option><option class="rename-able" value="AP">Armed Forces - Pacific</option><option class="rename-able" value="CA">California</option><option class="rename-able" value="CO">Colorado</option><option class="rename-able" value="CT">Connecticut</option><option class="rename-able" value="DE">Delaware</option><option class="rename-able" value="DC">District Of Columbia</option><option class="rename-able" value="FL">Florida</option><option class="rename-able" value="FM">Federated States of Micronesia</option><option class="rename-able" value="GA">Georgia</option><option class="rename-able" value="GU">Guam</option><option class="rename-able" value="HI">Hawaii</option><option class="rename-able" value="ID">Idaho</option><option class="rename-able" value="IL">Illinois</option><option class="rename-able" value="IN">Indiana</option><option class="rename-able" value="IA">Iowa</option><option class="rename-able" value="KS">Kansas</option><option class="rename-able" value="KY">Kentucky</option><option class="rename-able" value="LA">Louisiana</option><option class="rename-able" value="ME">Maine</option><option class="rename-able" value="MD">Maryland</option><option class="rename-able" value="MA">Massachusetts</option><option class="rename-able" value="MH">Marshall Islands</option><option class="rename-able" value="MI">Michigan</option><option class="rename-able" value="MN">Minnesota</option><option class="rename-able" value="MS">Mississippi</option><option class="rename-able" value="MO">Missouri</option><option class="rename-able" value="MP">Northern Mariana Islands</option><option class="rename-able" value="MT">Montana</option><option class="rename-able" value="NE">Nebraska</option><option class="rename-able" value="NV">Nevada</option><option class="rename-able" value="NH">New Hampshire</option><option class="rename-able" value="NJ">New Jersey</option><option class="rename-able" value="NM">New Mexico</option><option class="rename-able" value="NY">New York</option><option class="rename-able" value="NC">North Carolina</option><option class="rename-able" value="ND">North Dakota</option><option class="rename-able" value="OH">Ohio</option><option class="rename-able" value="OK">Oklahoma</option><option class="rename-able" value="OR">Oregon</option><option class="rename-able" value="PA">Pennsylvania</option><option class="rename-able" value="PR">Puerto Rico</option><option class="rename-able" value="PW">Palau</option><option class="rename-able" value="RI">Rhode Island</option><option class="rename-able" value="SC">South Carolina</option><option class="rename-able" value="SD">South Dakota</option><option class="rename-able" value="TN">Tennessee</option><option class="rename-able" value="TX">Texas</option><option class="rename-able" value="UT">Utah</option><option class="rename-able" value="VT">Vermont</option><option class="rename-able" value="VI">Virgin Islands</option><option class="rename-able" value="VA">Virginia</option><option class="rename-able" value="WA">Washington</option><option class="rename-able" value="WV">West Virginia</option><option class="rename-able" value="WI">Wisconsin</option><option class="rename-able" value="WY">Wyoming</option> </select> </div> </div> <div><span class="require-span" id="spVerifyPreviousMessage" style="display: none;"> Unable to validate address</span></div> </div>
</form>
